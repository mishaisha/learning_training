<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS AI Practitioner (AIF-C01) - Exam Prep Tool</title>
<style>
:root{--primary:#232F3E;--accent:#FF9900;--accent2:#146EB4;--bg:#f5f7fa;--card:#fff;--text:#1a1a2e;--text2:#555;--border:#e0e4ea;--success:#2ecc71;--error:#e74c3c;--warning:#f39c12;--info:#3498db}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--primary);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:1.2rem;font-weight:600}
header h1 span{color:var(--accent)}
header .exam-badge{font-size:.7rem;background:var(--accent);color:var(--primary);padding:2px 10px;border-radius:12px;font-weight:600}
.mode-toggle{display:flex;gap:0;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.mode-btn{padding:8px 18px;border:none;cursor:pointer;font-size:.85rem;font-weight:500;transition:.2s;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.mode-btn.active{background:var(--accent);color:#fff}
.mode-btn:not(.active):hover{background:rgba(255,255,255,.2);color:#fff}
.container{display:flex;height:calc(100vh - 56px)}
.sidebar{width:320px;min-width:320px;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sidebar.hidden{display:none}
.main{flex:1;overflow-y:auto;padding:24px 32px;background:var(--bg)}
.main.full{max-width:900px;margin:0 auto}
.search-box{position:relative}
.search-box input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;outline:none;transition:.2s}
.search-box input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(20,110,180,.12)}
.search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#999;font-size:1rem}
.nav-list{list-style:none}
.nav-list li{margin:2px 0}
.nav-list a{display:block;padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--text);font-size:.88rem;transition:.15s;cursor:pointer}
.nav-list a:hover{background:#f0f2f5}
.nav-list a.active{background:var(--accent2);color:#fff}
.nav-list .section-header{font-weight:600;font-size:.82rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px 4px;margin-top:6px;border-bottom:1px solid var(--border)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.progress-text{font-size:.8rem;color:var(--text2);text-align:center}
.content-area h2{font-size:1.5rem;margin-bottom:16px;color:var(--primary);border-bottom:2px solid var(--accent);padding-bottom:8px}
.content-area h3{font-size:1.15rem;margin:18px 0 10px;color:var(--text)}
.content-area h4{font-size:1rem;margin:14px 0 8px;color:var(--text2)}
.content-area p{margin:8px 0;line-height:1.7}
.content-area ul,.content-area ol{margin:8px 0;padding-left:24px}
.content-area li{margin:4px 0}
.content-area .domain-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin:16px 0;border-left:4px solid var(--accent)}
.content-area .domain-card h3{margin-top:0;color:var(--accent2)}
.content-area .key-service{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin:10px 0;border-left:3px solid var(--accent2)}
.content-area .key-service h4{margin:0 0 4px;color:var(--accent2)}
.content-area .key-service p{margin:0;font-size:.9rem}
.nav-buttons{display:flex;justify-content:space-between;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.nav-buttons button{padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:500;transition:.2s}
.nav-buttons .prev{background:var(--border);color:var(--text)}
.nav-buttons .prev:hover{background:#d0d4dc}
.nav-buttons .next{background:var(--accent2);color:#fff}
.nav-buttons .next:hover{background:#0f5a99}
.nav-buttons button:disabled{opacity:.4;cursor:not-allowed}
.notes-area{margin-top:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.notes-area h4{margin-bottom:8px;color:var(--text2);font-size:.9rem}
.notes-area textarea{width:100%;min-height:80px;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:inherit;font-size:.85rem;resize:vertical;outline:none}
.notes-area textarea:focus{border-color:var(--accent2)}
.quiz-container{max-width:820px;margin:0 auto}
.quiz-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;background:var(--card);border-radius:10px;padding:16px 20px;border:1px solid var(--border)}
.quiz-header .stat{text-align:center}
.quiz-header .stat .num{font-size:1.4rem;font-weight:700;color:var(--accent2)}
.quiz-header .stat .label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.quiz-header .stat .num.pass{color:var(--success)}
.quiz-header .stat .num.fail{color:var(--error)}
.quiz-progress{width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.quiz-progress .fill{height:100%;background:var(--accent2);border-radius:4px;transition:width .4s}
.question-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.question-card .q-domain{display:inline-block;background:#e8f0fe;color:var(--accent2);padding:2px 12px;border-radius:12px;font-size:.75rem;font-weight:500;margin-bottom:6px}
.question-card .q-num{font-size:.78rem;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}

.question-card .q-text{font-size:1rem;font-weight:500;margin:10px 0 16px;line-height:1.5;color:var(--text)}
.question-card .q-instruction{font-size:.8rem;color:var(--text2);margin-bottom:8px;font-style:italic}
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.12s;background:#fafbfc}
.option:hover{border-color:var(--accent2);background:#f0f4ff}
.option.selected{border-color:var(--accent2);background:#e8f0fe}
.option.correct{border-color:var(--success);background:#e8f8f0!important}
.option.wrong{border-color:var(--error);background:#fde8e8!important}
.option.disabled{cursor:default;opacity:.85}
.option input[type="radio"],.option input[type="checkbox"]{margin-top:3px;accent-color:var(--accent2);flex-shrink:0}
.option .opt-label{font-weight:600;color:var(--text2);min-width:20px}
.feedback{margin-top:14px;padding:14px 16px;border-radius:8px;font-size:.9rem;display:none;line-height:1.5}
.feedback.show{display:block}
.feedback.correct{background:#e8f8f0;border:1px solid var(--success);color:#1a7a4a}
.feedback.wrong{background:#fde8e8;border:1px solid var(--error);color:#a33}
.feedback .ans{font-weight:700;margin-bottom:6px;font-size:.95rem}
.feedback .expl{color:var(--text2);font-size:.85rem}
.feedback .expl strong{color:var(--text)}
.quiz-action-btn{padding:12px 28px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;font-weight:600;transition:.2s;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.quiz-action-btn.primary{background:var(--accent2);color:#fff}
.quiz-action-btn.primary:hover{background:#0f5a99}
.quiz-action-btn.primary:disabled{opacity:.4;cursor:not-allowed}
.quiz-action-btn.success{background:var(--success);color:#fff}
.quiz-action-btn.success:hover{background:#27ae60}
.quiz-action-btn.warning{background:var(--accent);color:#fff}
.quiz-action-btn.warning:hover{background:#e68a00}
.quiz-action-btn.danger{background:var(--error);color:#fff}
.quiz-action-btn.danger:hover{background:#c0392b}
.quiz-action-btn.outline{background:var(--card);color:var(--accent2);border:1px solid var(--accent2)}

.iter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.iter-btn.completed{background:var(--success);color:#fff;border-color:var(--success)}
.iter-label{font-size:.82rem;color:var(--text2);font-weight:500;margin-right:4px}

.results-card .big-score{font-size:3rem;font-weight:700;color:var(--accent2)}
.results-card .big-score.pass{color:var(--success)}
.results-card .big-score.fail{color:var(--error)}
.results-card .sub{color:var(--text2);margin-bottom:16px;font-size:.95rem}
.domain-breakdown{margin:20px 0;text-align:left}
.domain-breakdown h4{margin-bottom:10px;color:var(--text)}
.domain-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.domain-row .bar-container{flex:1;margin:0 12px;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.domain-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.domain-row .score{font-weight:600;min-width:60px;text-align:right;font-size:.85rem}

.improve-section h4{color:var(--warning);margin-bottom:6px}
.improve-section ul{margin:4px 0 0;padding-left:20px}
.improve-section li{margin:3px 0;font-size:.88rem}
.notes-panel{display:none}
.notes-panel.show{display:flex;flex-direction:column;position:fixed;bottom:16px;right:16px;width:380px;max-height:520px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.15);z-index:200;overflow:hidden}
.notes-panel .header{background:var(--primary);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.notes-panel .header h4{font-size:.9rem;color:#fff;margin:0}
.notes-panel .header button{background:none;border:none;color:#fff;cursor:pointer;font-size:1.3rem;padding:0 4px}
.notes-panel textarea{flex:1;padding:14px;border:none;font-family:inherit;font-size:.85rem;resize:none;outline:none;min-height:200px;line-height:1.5}
.notes-panel .footer{padding:8px 12px;border-top:1px solid var(--border);font-size:.75rem;color:var(--text2);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.notes-panel .footer button{background:var(--accent2);color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:.78rem}

@media(max-width:768px){

  header h1{font-size:1rem}

  .main{padding:12px}
  .question-card{padding:16px}
}
</style>

<body>
<header>
  <h1>AWS <span>AIF-C01</span> AI Practitioner <span class="exam-badge">65 Q</span></h1>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="switchMode('learn')" id="learnBtn">Learning</button>
    <button class="mode-btn" onclick="switchMode('quiz')" id="quizBtn">Quiz</button>
  </div>
</header>
<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="search-box">
      <span class="icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="Search topics..." oninput="filterContent()">
    </div>
    <div class="progress-text" id="progressText">Section 1 of 5</div>
    <div class="progress-bar"><div class="fill" id="progressFill" style="width:20%"></div></div>
    <ul class="nav-list" id="navList"></ul>
  </div>
  <div class="main" id="mainArea">
    <div id="learnContent" class="content-area"></div>
    <div id="quizContent" class="quiz-container" style="display:none"></div>
  </div>
</div>

<button onclick="toggleNotes()" style="position:fixed;bottom:20px;right:20px;z-index:199;width:44px;height:44px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.2)" title="Notes">&#128221;</button>
<div class="notes-panel" id="notesPanel">
  <div class="header"><h4>My Notebook</h4><button onclick="toggleNotes()">&times;</button></div>
  <textarea id="notesText" placeholder="Type your notes here... auto-saved locally"></textarea>
  <div class="footer"><span id="notesStatus">Auto-saved</span><button onclick="clearNotes()">Clear</button></div>
</div>

<script>
const DOMAINS = [
  {id:'domain1',name:'Fundamentals of AI and ML',short:'AI/ML Fundamentals',weight:'20%'},
  {id:'domain2',name:'Fundamentals of Generative AI',short:'Generative AI',weight:'24%'},
  {id:'domain3',name:'Applications of Foundation Models',short:'Foundation Models',weight:'28%'},
  {id:'domain4',name:'Guidelines for Responsible AI',short:'Responsible AI',weight:'14%'},
  {id:'domain5',name:'Security, Compliance, and Governance for AI',short:'Security & Governance',weight:'14%'}
];
const DOMAIN_ALIASES = {
  'AWS Managed AI Services':'Applications of Foundation Models',
  'Amazon SageMaker':'Applications of Foundation Models',
  'Bedrock & Generative AI':'Applications of Foundation Models',
  'Prompt Engineering':'Fundamentals of Generative AI',
  'AI Challenges & Responsibilities':'Guidelines for Responsible AI',
  'AWS Security Services':'Security, Compliance, and Governance for AI'
};
const CONTENT = [
{id:'d1-intro',domain:0,title:'AI & ML Fundamentals',content:`<div class="domain-card">
<h3>What is Artificial Intelligence (AI)?</h3>
<p>AI is the simulation of human intelligence by machines. It encompasses machine learning, natural language processing, computer vision, and robotics. <strong>Key exam point:</strong> AI is the broadest category — ML is a subset of AI, Deep Learning is a subset of ML, and Generative AI is a subset of Deep Learning.</p>

<h3>The AI Hierarchy (Exam Critical)</h3>
<p>Understand this containment hierarchy for the exam: <strong>AI > Machine Learning > Deep Learning > Generative AI</strong>. The exam tests whether you can identify which layer a given technique belongs to.</p>
<ul>
<li><strong>Artificial Intelligence (AI):</strong> Broad field of machines simulating human intelligence</li>
<li><strong>Machine Learning (ML):</strong> Subset of AI where systems learn from data without explicit programming</li>
<li><strong>Deep Learning:</strong> Subset of ML using neural networks with multiple hidden layers</li>
<li><strong>Generative AI:</strong> Subset of Deep Learning that creates new content (text, images, code)</li>
</ul>

<h3>Supervised vs Unsupervised vs Reinforcement Learning</h3>
<p><strong>Supervised Learning:</strong> Trains on labeled data where the correct output is known. Used for classification (spam detection, disease diagnosis) and regression (price prediction, demand forecasting). <em>Exam trap: If the question says "labeled data" or "known correct answers", it's supervised learning.</em></p>
<p><strong>Unsupervised Learning:</strong> Discovers patterns in unlabeled data. Used for clustering (customer segmentation) and dimensionality reduction. <em>Exam trap: If the question says "no predefined labels" or "discover patterns", it's unsupervised learning.</em></p>
<p><strong>Reinforcement Learning:</strong> Agents learn by interacting with an environment and receiving rewards or penalties. Used for robotics, game playing, and autonomous systems. Less commonly tested on AIF-C01.</p>

<h3>Training vs Inference</h3>
<p><strong>Training:</strong> The process of teaching a model using data. Computationally intensive, often uses GPUs, runs for hours or days. <strong>Inference:</strong> Using a trained model to make predictions on new data. Less computationally intensive, needs low latency for real-time applications.</p>

<h3>Key Exam Distinctions</h3>
<ul>
<li><strong>Classification vs Regression:</strong> Classification predicts categories (spam/not spam). Regression predicts continuous values (price: $49.99).</li>
<li><strong>Bias vs Variance:</strong> Bias = error from wrong assumptions (underfitting). Variance = error from sensitivity to training data (overfitting). Trade-off between the two.</li>
<li><strong>Parametric vs Non-parametric:</strong> Parametric models assume a fixed functional form (linear regression). Non-parametric models (k-NN) have no fixed structure.</li>
</ul>
</div>`},
{id:'d1-eval',domain:0,title:'ML Evaluation Metrics',content:`<div class="domain-card">
<h3>Confusion Matrix Fundamentals</h3>
<p>A confusion matrix has four outcomes: <strong>True Positive (TP)</strong> — correctly predicted positive. <strong>True Negative (TN)</strong> — correctly predicted negative. <strong>False Positive (FP)</strong> — incorrectly predicted positive (Type I error). <strong>False Negative (FN)</strong> — incorrectly predicted negative (Type II error).</p>

<h3>Key Evaluation Metrics</h3>
<div class="key-service"><h4>Accuracy</h4><p>(TP + TN) / (TP + TN + FP + FN) — Overall correctness. <strong>Trap:</strong> Misleading when classes are imbalanced (98% accuracy on 98% legitimate / 2% fraud is meaningless).</p></div>
<div class="key-service"><h4>Precision</h4><p>TP / (TP + FP) — "Of all items predicted as positive, how many were actually positive?" <strong>Use when:</strong> False positives are costly (spam filter — legitimate email should not be flagged). Minimizes false positives.</p></div>
<div class="key-service"><h4>Recall (Sensitivity)</h4><p>TP / (TP + FN) — "Of all actual positives, how many did we catch?" <strong>Use when:</strong> False negatives are costly (medical diagnosis — missing a disease is worse than a false alarm). Minimizes false negatives.</p></div>
<div class="key-service"><h4>F1 Score</h4><p>2 × (Precision × Recall) / (Precision + Recall) — Harmonic mean of precision and recall. <strong>Use when:</strong> You need a balanced metric between precision and recall, especially with imbalanced classes.</p></div>
<div class="key-service"><h4>Specificity</h4><p>TN / (TN + FP) — "Of all actual negatives, how many were correctly identified?" True negative rate. Less commonly the primary metric but appears in exam questions about balanced evaluation.</p></div>

<h3>GenAI Evaluation Metrics (Heavily Tested)</h3>
<div class="key-service"><h4>ROUGE (Recall-Oriented Understudy for Gisting Evaluation)</h4><p>Measures n-gram overlap between generated summaries and human-written reference summaries. <strong>Standard for:</strong> Summarization tasks. <strong>Remember:</strong> ROUGE = Recall = Summarization. Focuses on recall of important content.</p></div>
<div class="key-service"><h4>BLEU (Bilingual Evaluation Understudy)</h4><p>Measures precision of n-gram overlap between generated text and reference. <strong>Standard for:</strong> Machine translation. <strong>Remember:</strong> BLEU = Precision = Translation.</p></div>
<div class="key-service"><h4>Perplexity</h4><p>Measures how well a language model predicts a text sample. Lower perplexity = better prediction. <strong>This is a training metric, not a quality metric.</strong> Not suited for evaluating summary quality or factual accuracy.</p></div>

<h3>Exam Traps to Watch</h3>
<ul>
<li>If the question involves <strong>summarization</strong>, the answer is almost always <strong>ROUGE</strong></li>
<li>If the question involves <strong>translation</strong>, the answer is almost always <strong>BLEU</strong></li>
<li><strong>Perplexity</strong> is a training metric, not for evaluating output quality</li>
<li>If a model needs to <strong>minimize false negatives</strong> (medical diagnosis, fraud detection), prioritize <strong>Recall</strong></li>
<li>If a model needs to <strong>minimize false positives</strong> (spam filter, content moderation), prioritize <strong>Precision</strong></li>
</ul>
</div>`},
{id:'d1-overfitting',domain:0,title:'Overfitting, Underfitting & Data Drift',content:`<div class="domain-card">
<h3>Overfitting</h3>
<p>The model performs exceptionally well on training data but poorly on new/unseen data. The model has memorized noise and specific patterns in the training set rather than learning generalizable features.</p>
<p><strong>Signature:</strong> High training accuracy (e.g., 95%) with significantly lower test/validation accuracy (e.g., 58%). The gap between training and test performance is the key indicator.</p>
<p><strong>Causes:</strong> Model too complex (too many parameters), insufficient training data, training for too many epochs, data leakage.</p>
<p><strong>Solutions:</strong> Regularization (L1/L2), dropout, early stopping, cross-validation, reduce model complexity, increase training data, data augmentation.</p>

<h3>Underfitting</h3>
<p>The model performs poorly on both training AND test data. The model is too simple to capture the underlying patterns in the data.</p>
<p><strong>Signature:</strong> Low accuracy on both training and test sets. Unlike overfitting, there is no large gap between training and test performance.</p>
<p><strong>Causes:</strong> Model too simple (not enough parameters), insufficient training time (too few epochs), wrong algorithm choice.</p>
<p><strong>Solutions:</strong> Increase model complexity, train for more epochs, add more features, use a more sophisticated algorithm, reduce regularization.</p>

<h3>Data Drift (Covariate Shift)</h3>
<p>The statistical properties of production input data change over time, causing model performance to degrade. The model learned patterns from one data distribution but is now receiving data from a different distribution.</p>
<p><strong>Example:</strong> A fraud detection model trained on pre-pandemic transaction patterns performs poorly after pandemic as spending behavior shifted dramatically.</p>
<p><strong>AWS Tool:</strong> Amazon SageMaker Model Monitor detects data drift and model quality degradation, alerting when metrics deviate from baselines.</p>
<p><strong>Distinction:</strong> Overfitting = memorizing training data vs Drift = training data distribution no longer matches production.</p>

<h3>Class Imbalance</h3>
<p>When one class heavily outnumbers another (e.g., 98% legitimate transactions, 2% fraudulent). The model can achieve 98% accuracy by simply predicting the majority class every time — a useless model despite high accuracy.</p>
<p><strong>Solutions:</strong></p>
<ul>
<li><strong>SMOTE (Synthetic Minority Oversampling Technique):</strong> Generates synthetic examples of the minority class by interpolating between existing minority samples. <em>This is the most tested technique on the exam.</em></li>
<li><strong>Data Augmentation:</strong> Creating modified copies of minority class examples</li>
<li><strong>Class Weights:</strong> Assigning higher weight to minority class errors during training</li>
<li><strong>Undersampling:</strong> Reducing majority class samples (less common, loses data)</li>
</ul>

<h3>Key Exam Distinctions</h3>
<ul>
<li>Overfitting = high training accuracy + low test accuracy (memorization)</li>
<li>Underfitting = low training accuracy + low test accuracy (too simple)</li>
<li>Data Drift = model was fine, input data changed over time</li>
<li>Class Imbalance = unequal class distribution, accuracy is misleading</li>
<li>Accuracy is NOT the right metric when classes are imbalanced — use Precision, Recall, F1 instead</li>
</ul>
</div>`},
{id:'d1-sagemaker',domain:0,title:'Amazon SageMaker Deep Dive',content:`<div class="domain-card">
<h3>Amazon SageMaker — Overview</h3>
<p>Fully managed service to <strong>build, train, and deploy ML models at scale</strong>. SageMaker covers the entire ML lifecycle from data labeling to production monitoring. <em>Exam tip: SageMaker is the answer when the question asks about the FULL ML workflow or a "platform" for ML.</em></p>

<h3>SageMaker Components (Exam-Critical)</h3>
<div class="key-service"><h4>SageMaker Model Monitor</h4><p>Continuously monitors deployed models for <strong>data quality issues, model quality degradation, bias drift, and feature attribution drift</strong>. Generates alerts when metrics deviate from baseline thresholds. <em>Exam: "monitor model in production for drift/quality" = Model Monitor.</em></p></div>
<div class="key-service"><h4>SageMaker Clarify</h4><p>Detects and measures <strong>bias</strong> using Difference in Positive Proportions (DPP) and Disparate Impact (DI) metrics. Provides <strong>SHAP-based feature importance</strong> explanations for model predictions. <em>Exam: "detect bias in model" or "explain predictions" = SageMaker Clarify.</em></p></div>
<div class="key-service"><h4>SageMaker Automatic Model Tuning (HPO)</h4><p>Automatically searches for best hyperparameters using <strong>Bayesian optimization, random search, or grid search</strong>. Reduces manual experimentation. <em>Exam: "automatically find best hyperparameters" = SageMaker Automatic Model Tuning.</em></p></div>
<div class="key-service"><h4>SageMaker Model Cards</h4><p>Standardized governance documentation template capturing <strong>intended use, out-of-scope uses, limitations, training data provenance, evaluation metrics, ethical considerations</strong>. <em>Exam: "document model for compliance/governance" = SageMaker Model Cards.</em></p></div>
<div class="key-service"><h4>SageMaker Ground Truth</h4><p>Data labeling service for creating training datasets. Uses human annotators and optional ML-assisted labeling to reduce costs.</p></div>
<div class="key-service"><h4>SageMaker Batch Transform</h4><p>Cost-effective inference for large static datasets in S3 when results are not needed in real time. Provisions compute, processes the full dataset, saves results back to S3, then terminates. <em>Exam: "process 50K records overnight" = Batch Transform (not real-time endpoint).</em></p></div>
<div class="key-service"><h4>SageMaker Network Isolation</h4><p>Training containers with <strong>no outbound network access</strong>. Can only read/write to S3 through VPC endpoints. <em>Exam: "sensitive data must have no internet access" = network isolation mode.</em></p></div>
<div class="key-service"><h4>SageMaker Feature Store</h4><p>Centralized feature repository for storing, sharing, and reusing ML features across teams. Ensures consistency between training and inference.</p></div>
<div class="key-service"><h4>SageMaker Experiments</h4><p>Tracks and compares training runs, hyperparameters, and metrics. Used during development, not for production monitoring.</p></div>
<div class="key-service"><h4>SageMaker Model Registry</h4><p>Catalogs and versions trained models for deployment. Manages model versions, associates metadata, controls deployment workflow.</p></div>
<div class="key-service"><h4>SageMaker Pipelines</h4><p>Automates end-to-end ML workflows (CI/CD for ML). Orchestrates data preparation, training, evaluation, and deployment steps.</p></div>
<div class="key-service"><h4>DeepAR (Built-in Algorithm)</h4><p>Probabilistic time-series forecasting using recurrent neural networks. <em>Exam: "forecast electricity demand / time-series prediction" = DeepAR.</em></p></div>

<h3>Inference Types (Know the Differences)</h3>
<ul>
<li><strong>Real-time:</strong> Always-on endpoints, low latency (milliseconds), for interactive applications (chatbots, fraud detection). Most expensive.</li>
<li><strong>Serverless:</strong> Auto-scaling, pay per invocation, cold starts. Good for variable traffic.</li>
<li><strong>Asynchronous:</strong> For large payloads, queues requests. Good for single large file processing.</li>
<li><strong>Batch Transform:</strong> For bulk processing static S3 datasets. Most cost-effective for non-real-time batch jobs.</li>
</ul>

<h3>Key Exam Trap</h3>
<p>If the question asks about <strong>full ML platform</strong> = SageMaker. If the question asks about a <strong>specific managed AI service</strong> (vision, text, speech) = Rekognition, Comprehend, Transcribe, etc. Don't choose SageMaker when a simpler managed AI service fits the use case.</p>
</div>`},
{id:'d1-aws-ai',domain:0,title:'AWS AI Services Reference',content:`<div class="domain-card">
<h3>Purpose-Built AWS AI Services</h3>
<p>These are <strong>managed AI services</strong> that require NO ML expertise — just call the API. The exam frequently tests whether you choose a managed AI service vs SageMaker vs Bedrock.</p>

<h3>Vision Services</h3>
<div class="key-service"><h4>Amazon Rekognition</h4><p><strong>Use case:</strong> Image and video analysis. <strong>Capabilities:</strong> Object/face/scene detection, content moderation (explicit/suggestive/violent content), celebrity recognition, text in images. <strong>Custom Labels:</strong> Train custom image classifiers by uploading labeled images through a point-and-click console — no ML expertise required. <em>Exam: "image moderation", "identify objects in images", "plant species from photos".</em></p></div>

<h3>Speech & Audio Services</h3>
<div class="key-service"><h4>Amazon Transcribe</h4><p><strong>Use case:</strong> Speech-to-text. <strong>Capabilities:</strong> Speaker diarization (identifies multiple speakers), custom vocabulary for domain-specific terms, vocabulary filtering for compliance. <strong>Transcribe Medical:</strong> Optimized for medical terminology and clinical conversations. <em>Exam: "convert audio to text", "call center recording transcription", "clinical notes from patient consultations".</em></p></div>
<div class="key-service"><h4>Amazon Polly</h4><p><strong>Use case:</strong> Text-to-speech. Converts text into lifelike speech. Multiple voices and languages. <em>Exam: "convert text to speech" = Polly (opposite of Transcribe).</em></p></div>

<h3>Natural Language Processing (NLP)</h3>
<div class="key-service"><h4>Amazon Comprehend</h4><p><strong>Use case:</strong> Text analysis. <strong>Capabilities:</strong> Sentiment analysis (positive/negative/neutral/mixed), entity recognition (people, places, organizations), key phrase extraction, language detection. <strong>Comprehend Medical:</strong> Extracts medical entities from unstructured clinical text. <em>Exam: "analyze text for sentiment", "detect frustration in call transcripts", "extract entities from documents".</em></p></div>
<div class="key-service"><h4>Amazon Translate</h4><p><strong>Use case:</strong> Language translation. Translates text between languages. Can be combined with Transcribe for multilingual subtitle generation. <em>Exam: "translate text", "multilingual subtitles".</em></p></div>

<h3>Document Processing</h3>
<div class="key-service"><h4>Amazon Textract</h4><p><strong>Use case:</strong> Extract text, forms, tables, and key-value pairs from scanned documents. Handles varying layouts WITHOUT templates. <em>Exam: "extract data from scanned invoices", "process paper forms", "document digitization". Different from Comprehend: Textract extracts text FROM images, Comprehend analyzes text THAT'S ALREADY EXTRACTED.</em></p></div>

<h3>Recommendation & Personalization</h3>
<div class="key-service"><h4>Amazon Personalize</h4><p><strong>Use case:</strong> Real-time recommendation engine. Uses same technology as Amazon.com. Learns from browsing, purchase, and rating history. <em>Exam: "personalized recommendations", "product recommendations based on user history".</em></p></div>

<h3>Search & Knowledge</h3>
<div class="key-service"><h4>Amazon Kendra</h4><p><strong>Use case:</strong> Intelligent enterprise search. Finds answers across documents, websites, and databases using NLP. <em>Exam: "enterprise search", "Q&A over company documents" — but for Bedrock-based Q&A, use Knowledge Bases instead.</em></p></div>

<h3>Other Managed Services</h3>
<div class="key-service"><h4>Amazon Forecast</h4><p><strong>Use case:</strong> Time-series forecasting (demand, revenue, resource planning). Uses ML without requiring ML expertise.</p></div>
<div class="key-service"><h4>Amazon Lex</h4><p><strong>Use case:</strong> Conversational chatbots and voice assistants. Powers Amazon Alexa.</p></div>
<div class="key-service"><h4>Amazon Connect</h4><p><strong>Use case:</strong> Cloud-based contact center service. Can integrate with Lex for conversational IVR.</p></div>

<h3>Important Service Distinctions (Exam Critical)</h3>
<ul>
<li><strong>Rekognition vs Textract:</strong> Rekognition analyzes images (objects, faces, moderation). Textract extracts text/documents from images.</li>
<li><strong>Transcribe vs Polly:</strong> Transcribe = speech → text. Polly = text → speech. They are opposites.</li>
<li><strong>Comprehend vs Textract:</strong> Comprehend analyzes text (NLP). Textract extracts text from documents (OCR). They can work together but serve different purposes.</li>
<li><strong>Transcribe vs Comprehend for call center:</strong> Transcribe converts audio to text. Comprehend analyzes the text for sentiment. Often used together.</li>
<li><strong>Personalize vs Kendra:</strong> Personalize recommends items (products, content). Kendra searches/finds answers in documents.</li>
</ul>
</div>`},
{id:'d2-intro',domain:1,title:'Generative AI & Foundation Models',content:`<div class="domain-card">
<h3>What is Generative AI?</h3>
<p>AI systems that <strong>create new content</strong> (text, images, audio, video, code) based on patterns learned from training data. Unlike traditional ML which predicts or classifies, GenAI generates novel outputs that did not exist before. <em>Key distinction: Traditional ML predicts "will this customer churn?" (yes/no). GenAI generates "write a marketing email for this customer."</em></p>

<h3>Foundation Models</h3>
<p>Large-scale pre-trained models trained on massive, diverse datasets using <strong>self-supervised learning</strong> (e.g., next-token prediction for text). <strong>No manual labeling required for pre-training.</strong> Can be adapted to many downstream tasks through prompting or fine-tuning. <em>Exam: Foundation models are characterized by (1) self-supervised learning on broad data and (2) adaptability to many tasks — these are the two correct answers for multi-select questions on this topic.</em></p>

<h3>Key Foundation Model Concepts</h3>
<div class="key-service"><h4>Self-Supervised Learning</h4><p>The model learns from the data itself without human labels. For text models, this means predicting the next word/token in a sequence. For image models, this means predicting masked portions of images. <em>Exam: Foundation models use self-supervised learning for pre-training, NOT supervised learning.</em></p></div>
<div class="key-service"><h4>Transformer Architecture</h4><p>The "T" in GPT stands for Transformer — the neural network architecture powering most modern LLMs. Key innovation: <strong>self-attention mechanism</strong> that weighs the importance of different words in the input. <em>Exam: "What architecture powers GPT-4 and Claude?" = Transformer.</em></p></div>
<div class="key-service"><h4>Tokens</h4><p>Models process text in tokens (not characters or whole words). A token is ~3/4 of a word. "Hello world" ≈ 2 tokens. The context window is measured in tokens.</p></div>
<div class="key-service"><h4>Context Window</h4><p>Maximum number of tokens (input + output) a model can process in a single request. Critical for long document processing. Models with 200K token context windows can process ~500-page documents in one request. Larger context window ≠ better model quality — it just allows more text at once.</p></div>
<div class="key-service"><h4>Embeddings</h4><p>Numerical vector representations of text that capture semantic meaning. Used in RAG to find semantically similar documents. Generated by embedding models, stored in vector databases (like OpenSearch k-NN).</p></div>

<h3>Large Language Models (LLMs)</h3>
<p>LLMs are <strong>stateless</strong> — they don't inherently remember previous turns in a conversation. For multi-turn conversations, the application must include the full conversation history in each API request (the model uses its context window to "see" the history). <em>Exam trap: "How to maintain conversation context?" = Include full history in each request. NOT "increase temperature" or "use a larger model."</em></p>

<h3>Hallucination</h3>
<p>Fluent, confident responses containing fabricated or factually incorrect information. A <strong>fundamental limitation</strong> of generative models — they predict statistically plausible text, not verified facts. <strong>Mitigations:</strong> RAG (grounding in retrieved documents), human-in-the-loop review, Bedrock Guardrails for content filtering, logging and monitoring, prompt engineering (chain-of-thought, system prompts). <em>Exam: "What is it called when an LLM generates confident but incorrect information?" = Hallucination.</em></p>

<h3>Training Cutoff</h3>
<p>Models only know information up to their training cutoff date. <strong>To answer questions about recent events:</strong> Use RAG with a Knowledge Base connected to an updated data source. NOT fine-tuning (expensive, slow, doesn't keep pace with news).</p>

<h3>Multimodal Models</h3>
<p>Models that process and generate multiple data types (text, images, audio, video) within a single model. <strong>Key exam point:</strong> Multimodal models CAN accept image input alongside text (e.g., show Claude a diagram and ask about it). Text-only LLMs CANNOT process images. <em>Exam: "model must analyze a chart/image and answer questions" = Multimodal model (Claude, Amazon Nova Pro/Lite). NOT a text-only LLM. "Model must generate images from text" = Diffusion model (Stability AI SD3, Amazon Nova Canvas).</em></p>

<h3>GenAI Cost Concepts — Token-Based Pricing</h3>
<p>Bedrock pricing is based on <strong>token count</strong> — you pay for both input tokens (your prompt) and output tokens (model's response). <strong>Input tokens</strong> are typically 3-5x cheaper than output tokens. A large prompt (e.g., including full document + RAG context) increases cost even before the model generates anything. <em>Exam: "What drives Bedrock inference cost?" = Token count (input + output). "Large prompts with RAG context" increase input token costs.</em></p>
<ul>
<li><strong>On-Demand:</strong> Pay per token — best for variable/unknown workloads</li>
<li><strong>Provisioned Throughput:</strong> Reserved capacity in model units — 1-month or 6-month commitments. Required for custom fine-tuned models</li>
<li><strong>Batch Inference:</strong> Asynchronous processing of large volumes — lower cost per token than on-demand. Best for non-real-time workloads (document processing at scale)</li>
</ul>

<h3>Amazon Q Developer vs Amazon Bedrock (Exam Distinction)</h3>
<p>Both are AWS GenAI services but serve different purposes. The exam tests which to use for a given scenario:</p>
<ul>
<li><strong>Amazon Bedrock:</strong> Build custom GenAI applications. You select models, design prompts, build RAG systems, fine-tune models. <strong>Use when:</strong> Building a custom chat application, a document Q&A system, or any GenAI-powered app where you control the application logic.</li>
<li><strong>Amazon Q Developer:</strong> Pre-built AI assistant for developers and IT professionals. <strong>Code companion:</strong> Code generation, debugging, code review, AWS service documentation Q&A. <strong>Business use:</strong> Amazon Q Business connects to enterprise data sources for organizational Q&A. <strong>Use when:</strong> Developer needs coding help, IT needs AWS troubleshooting, or employees need enterprise search. <em>Exam: "Developer wants inline code suggestions in IDE" = Amazon Q Developer. "Build a custom RAG chatbot for customers" = Bedrock Knowledge Bases + Agents. Q is a managed app; Bedrock is a platform to build custom apps.</em></p>
</ul>
</div>`},
{id:'d2-prompt',domain:1,title:'Prompt Engineering & Parameters',content:`<div class="domain-card">
<h3>Prompt Engineering Techniques</h3>
<div class="key-service"><h4>Zero-shot Prompting</h4><p>Give the model a task description without any examples. "Classify this email as spam or not spam: [email content]". Works for simple tasks but less reliable for complex ones.</p></div>
<div class="key-service"><h4>Few-shot Prompting</h4><p>Provide examples in the prompt before asking the model to perform the task. "Email 1: [example] → Spam. Email 2: [example] → Not Spam. Email 3: [input] → ?" Improves performance by showing the model the desired output format and reasoning pattern.</p></div>
<div class="key-service"><h4>Chain-of-Thought (CoT) Prompting</h4><p>Ask the model to show its step-by-step reasoning before giving the final answer. "Let's think step by step: ..." Improves performance on complex reasoning tasks (math, logic, multi-step problems). <em>Exam: CoT is for improving reasoning on complex tasks, not for factual recall.</em></p></div>
<div class="key-service"><h4>System Prompts</h4><p>Define the model's persona, tone, behavioral constraints, and guidelines for every interaction. Applied once at the start of a session. <em>Exam: "How to enforce a formal tone?" or "How to set behavioral guidelines?" = System prompts.</em></p></div>

<h3>Key Generation Parameters</h3>
<div class="key-service"><h4>Temperature (0-1 or 0-2)</h4><p>Controls randomness of token selection. <strong>Low temperature (toward 0):</strong> More deterministic, consistent, predictable — model always picks the highest-probability token. <strong>High temperature (toward 1):</strong> More random, creative, diverse outputs. <em>Exam: "More deterministic outputs" = decrease temperature. "More creative/varied outputs" = increase temperature.</em></p></div>
<div class="key-service"><h4>Top-P (Nucleus Sampling)</h4><p>Considers tokens with cumulative probability up to P. Top-P=0.9 means consider the smallest set of tokens whose combined probability is 90%. Higher Top-P = more diverse outputs. Often used together with temperature.</p></div>
<div class="key-service"><h4>Top-K</h4><p>Consider only the K most likely tokens at each generation step. Top-K=50 means only the 50 highest-probability tokens are candidates. Higher Top-K = more diversity.</p></div>
<div class="key-service"><h4>Max Tokens / Max Length</h4><p>Maximum number of tokens the model can generate in a single response. Controls response length. Part of the context window budget (input + output tokens ≤ context window).</p></div>

<h3>Parameter Relationships (Exam Critical)</h3>
<ul>
<li>Temperature = 0 → deterministic (always same output for same prompt)</li>
<li>Temperature = 1 → maximum creativity/randomness</li>
<li>Top-P = 1 → consider all tokens (no nucleus sampling)</li>
<li>Top-P = 0.1 → very narrow token selection (deterministic effect)</li>
<li>Context window must accommodate both prompt AND generated response</li>
</ul>

<h3>Common Exam Scenarios</h3>
<ul>
<li>"Code generation needs consistent outputs" → Decrease temperature</li>
<li>"Creative writing needs variety" → Increase temperature</li>
<li>"Model keeps repeating itself" → Increase temperature or Top-P</li>
<li>"Model is too random/unreliable" → Decrease temperature</li>
</ul>
</div>`},
{id:'d2-training',domain:1,title:'Model Training Approaches',content:`<div class="domain-card">
<h3>Training Adaptation Methods — Comparison</h3>
<p>These are different ways to adapt a foundation model to a specific use case. The exam tests when to use each approach.</p>

<div class="key-service"><h4>Continued Pre-training (Domain-Adaptive Pre-training)</h4><p><strong>What it does:</strong> Extends the model's pre-training on large volumes of <strong>unlabeled, domain-specific</strong> text (research papers, legal documents, medical literature). <strong>When to use:</strong> When you need to teach the model broad knowledge about a specialized domain. No labeled data required. <strong>Cost:</strong> High — requires significant compute. <em>Exam: "teach model broad knowledge about a scientific field using unlabeled papers" = Continued pre-training.</em></p></div>
<div class="key-service"><h4>Fine-tuning (Supervised Fine-tuning)</h4><p><strong>What it does:</strong> Trains the model on <strong>labeled prompt-completion pairs</strong> for a specific task behavior (output format, style, domain-specific responses). <strong>When to use:</strong> When you have labeled data for the exact task you want the model to perform. <strong>Important:</strong> Custom fine-tuned Bedrock models require <strong>Provisioned Throughput</strong> for inference — on-demand pricing is NOT available. <em>Exam: "train model on 10K example conversations with ideal responses" = Fine-tuning.</em></p></div>
<div class="key-service"><h4>Model Distillation</h4><p><strong>What it does:</strong> Transfers behavior from a large "teacher" model to a smaller "student" model. The teacher generates training data (outputs/probability distributions) used to train the student. <strong>When to use:</strong> When you need lower latency, lower cost, and a smaller model while maintaining similar quality. <strong>Key exam scenario:</strong> "Current model is too slow and expensive, need faster/cheaper but same quality" = Distillation. <em>Exam: model distillation changes the model size/performance profile — RAG, Guardrails, Provisioned Throughput do NOT make the model smaller.</em></p></div>
<div class="key-service"><h4>RAG (Retrieval Augmented Generation)</h4><p><strong>What it does:</strong> Retrieves relevant documents from a knowledge base at <strong>inference time</strong> and provides them as context in the prompt. <strong>Does NOT modify model weights.</strong> <strong>When to use:</strong> When answers must be grounded in current/private/enterprise knowledge, questions involve recent events (after training cutoff), or you need citations/sources. <em>Exam: "ground responses in enterprise documents", "answer questions after training cutoff", "provide citations" = RAG / Knowledge Bases.</em></p></div>

<h3>RAG vs Fine-tuning — Which to Choose?</h3>
<ul>
<li><strong>RAG</strong> = Better for knowledge-intensive tasks, dynamic/updated information, need for citations, no model weights modified</li>
<li><strong>Fine-tuning</strong> = Better for specific output format/style/tone, task-specific behavior, reducing hallucinations on specific topics, model's base knowledge is insufficient</li>
<li><strong>They can be combined</strong> — fine-tune for style/format, then use RAG for factual grounding</li>
<li><strong>RAG addresses training cutoff</strong> — fine-tuning does NOT add new knowledge; RAG retrieves up-to-date information at query time</li>
</ul>

<h3>Key Exam Distinction</h3>
<p><strong>RAG does NOT modify model weights.</strong> Continued pre-training and fine-tuning DO modify weights. This is frequently tested. If the question says "without modifying the model" or "without retraining", the answer is RAG.</p>
</div>`},
{id:'d2-rlhf',domain:1,title:'RLHF & GenAI Evaluation',content:`<div class="domain-card">
<h3>RLHF (Reinforcement Learning from Human Feedback)</h3>
<p><strong>Training process that aligns model outputs with human preferences.</strong> Three-step pipeline: (1) <strong>SFT (Supervised Fine-Tuning):</strong> train on high-quality human-written prompt-response pairs. (2) <strong>Reward Model Training:</strong> humans rank model outputs (best → worst), and a reward model learns to predict human preference scores. (3) <strong>RL Optimization (PPO):</strong> the policy model is fine-tuned to maximize the reward model's score while staying close to the original SFT model (KL penalty prevents over-optimization/ reward hacking). <em>Exam: "What technique aligns LLM outputs with human preferences?" = RLHF. "What prevents reward hacking in RLHF?" = KL divergence penalty. "What is the purpose of the reward model in RLHF?" = Learn to predict human preference scores from ranked outputs.</em></p>

<h3>RLHF vs DPO — Direct Preference Optimization</h3>
<p><strong>DPO</strong> is an alternative to RLHF that eliminates the separate reward model. Instead of training a reward model then optimizing with PPO, DPO uses a mathematical reformulation to fine-tune directly on human preference pairs. <strong>Key difference:</strong> DPO is simpler (no reward model, no PPO), more stable, but less flexible for iterative preference learning. <em>Exam: Both align models to human preferences. RLHF = reward model + PPO. DPO = direct optimization on preference pairs.</em></p>

<h3>Evaluation Metrics for GenAI</h3>
<div class="key-service"><h4>ROUGE (Recall-Oriented Understudy for Gisting Evaluation)</h4><p>Measures overlap between generated text and reference text. <strong>ROUGE-N:</strong> n-gram overlap (ROUGE-1 = unigrams, ROUGE-2 = bigrams). <strong>ROUGE-L:</strong> longest common subsequence (captures sentence-level structure). <strong>Primarily used for:</strong> Summarization tasks — how much of the reference summary's content appears in the generated summary. <em>Exam: "Which metric evaluates summarization quality?" = ROUGE.</em></p></div>
<div class="key-service"><h4>BLEU (Bilingual Evaluation Understudy)</h4><p>Measures precision of n-grams between generated and reference text. <strong>Applies brevity penalty</strong> to prevent short outputs from gaming the score. <strong>Primarily used for:</strong> Translation tasks — how much of the generated translation's n-grams appear in reference translations. <em>Exam: BLEU = precision-focused (translation). ROUGE = recall-focused (summarization).</em></p></div>
<div class="key-service"><h4>Perplexity</h4><p>Measures how well a probability model predicts a sample. <strong>Lower perplexity</strong> = model is more confident / better at predicting the next token. <strong>Used during pre-training</strong> to track model improvement. <em>Exam: "lower perplexity" = more confident predictions. NOT a direct measure of output quality or factuality.</em></p></div>
<div class="key-service"><h4>Ground Truth / Human Evaluation</h4><p><strong>Most reliable</strong> method for assessing GenAI output quality. Automated metrics (ROUGE, BLEU) don't capture truthfulness, coherence, or helpfulness. Bedrock's Model Evaluation service supports human evaluation workflows. <em>Exam: "most accurate way to evaluate GenAI response quality" = Human evaluation.</em></p></div>

<h3>GenAI Use Case — Model Type Mapping</h3>
<ul>
<li><strong>Text Generation / Chat / Q&A:</strong> LLMs (Claude, Amazon Nova, Llama) — general-purpose text models</li>
<li><strong>Image Generation:</strong> Diffusion models (Stability AI SD3, Amazon Nova Canvas) — text-to-image or image-to-image</li>
<li><strong>Code Generation:</strong> Code-specialized LLMs (Claude, Amazon Q Developer) — generate, explain, debug, refactor code</li>
<li><strong>Summarization:</strong> LLMs — condense long documents into summaries. <strong>Evaluate with:</strong> ROUGE</li>
<li><strong>Translation:</strong> LLMs or specialized translation models. <strong>Evaluate with:</strong> BLEU</li>
<li><strong>Text-to-SQL:</strong> LLMs with Agent orchestration — translate natural language to database queries</li>
<li><strong>Text-to-Speech:</strong> Amazon Polly — NOT a GenAI FM on Bedrock (Polly is a separate AWS service)</li>
<li><strong>Speech-to-Text:</strong> Amazon Transcribe — NOT a GenAI FM (separate AWS service)</li>
<li><strong>Embeddings:</strong> Embedding models (Cohere Embed, Amazon Nova) — generate vector representations for semantic search</li>
</ul>
<em>Exam: For speech/audio tasks, the answer is typically Amazon Polly (TTS) or Amazon Transcribe (STT), NOT Bedrock. For code generation, the answer can be either Claude (Bedrock) or Amazon Q Developer.</em>

<h3>Model Selection Criteria — Which Model to Choose?</h3>
<p>The exam tests your ability to recommend a model type based on requirements:</p>
<ul>
<li><strong>Latency sensitivity:</strong> Choose smaller/faster models (Nova Micro, Claude Haiku). Avoid largest models (Opus, Nova Pro) for real-time use cases.</li>
<li><strong>Quality requirement:</strong> Choose largest model your latency/cost budget allows (Nova Pro, Claude Opus/Sonnet).</li>
<li><strong>Cost sensitivity:</strong> Choose smaller models. Use distillation to shrink model size. Use on-demand pricing not Provisioned Throughput.</li>
<li><strong>Multimodal input (images + text):</strong> Need a multimodal model (Claude, Amazon Nova Pro/Lite). LLMs without vision capability CANNOT process images.</li>
<li><strong>Language support:</strong> Verify model supports required language(s). Leading models (Claude, GPT-4) support 50+ languages. Smaller models may not.</li>
<li><strong>Context window needed:</strong> Long document processing → models with large context windows (Claude 3.5 Sonnet: 200K, Gemini: 1M+).</li>
</ul>
<em>Exam trap: If question asks for "fastest response time" and offers model options, the answer is the smallest/fastest model (Nova Micro or Haiku), NOT the most capable one.</em>
</div>`},
{id:'d3-bedrock',domain:2,title:'Amazon Bedrock',content:`<div class="domain-card">
<h3>Amazon Bedrock — Overview</h3>
<p>Fully managed service providing <strong>foundation models</strong> from Amazon (Amazon Nova) and third-party providers (Anthropic Claude, AI21 Labs, Meta Llama, Cohere, Stability AI) through a single API. <em>Exam: Bedrock is the answer when the question involves foundation models, GenAI, or multi-provider model access.</em></p>

<h3>Key Bedrock Features</h3>
<div class="key-service"><h4>Knowledge Bases</h4><p>Implements <strong>RAG</strong>: ingests documents from S3, generates embeddings, stores in a vector database (Amazon OpenSearch Service with k-NN), and retrieves relevant context at query time. <strong>Best for:</strong> Grounding model responses in enterprise data, answering questions from policy documents, providing citations. <em>Exam: "Q&A over company PDFs" = Knowledge Bases. NOT fine-tuning.</em></p></div>
<div class="key-service"><h4>Agents</h4><p>Multi-step orchestration using the <strong>ReAct (Reasoning and Acting) framework</strong>. Agents can break down complex tasks, invoke Lambda functions through action groups, query Knowledge Bases, and orchestrate entire workflows. <strong>Text-to-SQL:</strong> Agents connect to relational databases via Lambda, translate natural language to SQL, execute queries, and return results. <em>Exam: "multi-step task automation", "orchestrate multiple steps", "ask questions about database in plain English" = Agents.</em></p></div>
<div class="key-service"><h4>Guardrails</h4><p>Safety and content controls. Four types:
<ul>
<li><strong>Content filters:</strong> Block hate speech, violence, sexual content, harassment (adjustable threshold)</li>
<li><strong>Denied topics:</strong> Block specific subject areas (e.g., "never discuss competitors")</li>
<li><strong>Sensitive information filters:</strong> Detect and redact PII (names, SSNs, credit cards, emails, phone numbers) from inputs AND outputs</li>
<li><strong>Word filters:</strong> Block specific words or phrases</li>
</ul>
<em>Exam: "prevent PII in responses" = Sensitive information filters. "Never discuss competitor products" = Denied topics. Combined with system prompts for tone/persona.</em></p></div>
<div class="key-service"><h4>System Prompts</h4><p>Define model persona, communication style, tone, and behavioral constraints. Applied per-session. Used WITH Guardrails, not instead of. <em>Exam: "formal professional tone" = System prompts. "Never discuss competitors" = Guardrails (denied topics). Both are needed for comprehensive control.</em></p></div>
<div class="key-service"><h4>Provisioned Throughput</h4><p>Required for <strong>custom fine-tuned models</strong>. Purchased in model units with 1-month or 6-month commitment terms. <strong>On-demand pricing is NOT available for custom models.</strong> <em>Exam: "use fine-tuned model for inference" = Purchase Provisioned Throughput.</em></p></div>
<div class="key-service"><h4>Model Evaluation</h4><p>Bedrock provides built-in model evaluation tools using automated metrics or human evaluation workflows to assess model performance on specific tasks.</p></div>

<h3>Invocation Logging (CloudTrail)</h3>
<p>Bedrock integrates with AWS CloudTrail to log API calls and model invocation details (inputs, outputs, metadata) for compliance auditing. <em>Exam: "audit model usage" or "log model inputs/outputs for compliance" = CloudTrail invocation logging.</em></p>

<h3>Encryption</h3>
<p>Bedrock integrates with <strong>AWS KMS</strong> for customer-managed encryption of fine-tuning data, custom model weights, and output artifacts. <em>Exam: "encrypt fine-tuning data with company's own keys" = AWS KMS.</em></p>

<h3>Foundation Model Providers on Bedrock</h3>
<ul>
<li><strong>Amazon:</strong> Amazon Nova models (Micro, Lite, Pro)</li>
<li><strong>Anthropic:</strong> Claude 3 / 3.5 / 4 series (Haiku, Sonnet, Opus)</li>
<li><strong>AI21 Labs:</strong> Jurassic-2</li>
<li><strong>Meta:</strong> Llama 2 / 3</li>
<li><strong>Cohere:</strong> Command, Embed</li>
<li><strong>Stability AI:</strong> Stable Diffusion (image generation)</li>
</ul>
<em>Exam: "Which FM provider does Bedrock offer?" — any of these. "Which model is built by AWS?" — Amazon Nova / Titan.</em>
</div>`},
{id:'d3-inference',domain:2,title:'Optimizing Inference',content:`<div class="domain-card">
<h3>Inference Optimization Strategies</h3>
<p>When a foundation model is too slow, expensive, or both, the exam tests which optimization technique to use.</p>

<div class="key-service"><h4>Model Distillation</h4><p>Transfers behavior from a large "teacher" model to a smaller "student" model. <strong>Result:</strong> Lower latency, lower inference cost, smaller model footprint while maintaining similar quality. <strong>When to use:</strong> Strict latency requirements (under 150ms), fixed inference budget, need same quality but faster/cheaper. <em>Exam: "model too slow and expensive, keep same quality with smaller model" = Distillation.</em></p></div>
<div class="key-service"><h4>AWS Inferentia2 (Inf2 Instances)</h4><p>Custom-designed by AWS for <strong>energy-efficient ML inference</strong>. Best performance per watt compared to GPUs (P5 with NVIDIA H100 or G5 with NVIDIA A10G). <strong>Not for training</strong> — Inferentia is optimized for inference workloads. <em>Exam: "most energy-efficient ML inference chips" = AWS Inferentia2 / Inf2 instances.</em></p></div>
<div class="key-service"><h4>Provisioned Throughput</h4><p>Reserved capacity for consistent performance with Bedrock models. Required for custom fine-tuned models. 1-month or 6-month commitment. Provides predictable latency and throughput. <em>Not the answer for "make model faster" — it guarantees capacity but doesn't reduce per-request compute.</em></p></div>

<h3>What Does NOT Optimize Inference (Exam Traps)</h3>
<ul>
<li><strong>RAG (Knowledge Bases):</strong> Adds retrieval for better grounding but does NOT make the model smaller or faster</li>
<li><strong>Guardrails:</strong> Adds safety but does NOT reduce model compute meaningfully</li>
<li><strong>Provisioned Throughput:</strong> Adds capacity guarantees but does NOT reduce per-request cost or model size</li>
<li><strong>Temperature/Prompt changes:</strong> Affect output style but NOT model size or speed</li>
</ul>

<h3>Instance Types for ML Workloads</h3>
<ul>
<li><strong>Inf2 (Inferentia2):</strong> Most energy-efficient inference — purpose-built for inference</li>
<li><strong>P5 (NVIDIA H100):</strong> Best for training large models — GPU-optimized for training</li>
<li><strong>G5 (NVIDIA A10G):</strong> Good for inference and training — general-purpose GPU</li>
<li><strong>Trn1 (Trainium):</strong> Purpose-built for training — cost-effective training</li>
<li><strong>C7g (Graviton3):</strong> General compute — NOT specialized for ML</li>
</ul>
</div>`},
{id:'d4-responsible',domain:3,title:'Responsible AI Principles',content:`<div class="domain-card">
<h3>The Six Pillars of Responsible AI</h3>
<p>These are the core principles AWS uses for responsible AI. The exam tests your ability to match a scenario to the correct principle.</p>

<ol>
<li><strong>Fairness:</strong> Equitable treatment across demographic groups. <strong>Tool:</strong> SageMaker Clarify detects bias using DPP (Difference in Positive Proportions) and Disparate Impact (DI) metrics. <em>Exam: "model gives different outcomes for different demographic groups" = Fairness violation.</em></li>
<li><strong>Explainability:</strong> Ability to provide understandable reasons for AI decisions. <strong>Critical for:</strong> Regulated industries (GDPR, Equal Credit Opportunity Act). <strong>Tool:</strong> SageMaker Clarify provides SHAP-based feature importance. <em>Exam: "customer needs to understand why loan was denied" = Explainability.</em></li>
<li><strong>Privacy:</strong> Protection of personal data. <strong>Tools:</strong> AWS KMS for encryption, IAM for access control, Bedrock Guardrails sensitive information filters for PII redaction. <em>Exam: "protect customer PII in AI system" = Privacy.</em></li>
<li><strong>Robustness:</strong> Reliable performance under adverse or unexpected conditions. Models should handle edge cases, noisy inputs, and distribution shifts. <em>Exam: "model performs reliably even with unusual inputs" = Robustness.</em></li>
<li><strong>Transparency:</strong> Openness about model capabilities, limitations, and intended use. <strong>Tool:</strong> SageMaker Model Cards document intended use, out-of-scope uses, training data provenance, and evaluation metrics. <em>Exam: "document what the model can and cannot do" = Transparency (Model Cards).</em></li>
<li><strong>Accountability:</strong> Clear ownership and human oversight for AI decisions, especially high-impact ones. Human-in-the-loop for critical decisions. <em>Exam: "who is responsible when AI makes a mistake" = Accountability.</em></li>
</ol>

<h3>Common Exam Scenario — Claim Approvals</h3>
<p><strong>Question pattern:</strong> Insurance company wants to use GenAI for claim processing. Claim decisions have legal/financial impact. Which approach is INCORRECT?</p>
<p><strong>Answer pattern:</strong> "Automatically approve or deny claims end-to-end based only on model output, without human review" is INCORRECT. <strong>Safe pattern:</strong> Use RAG for grounding + Guardrails for safety + human review for final decisions. GenAI should AUGMENT, not REPLACE human decision-makers for high-impact decisions.</p>

<h3>AWS Tools for Responsible AI</h3>
<ul>
<li><strong>SageMaker Clarify:</strong> Bias detection and feature importance explanations</li>
<li><strong>SageMaker Model Cards:</strong> Standardized model governance documentation</li>
<li><strong>Bedrock Guardrails:</strong> Content safety, PII protection, denied topics</li>
<li><strong>AWS KMS:</strong> Data encryption at rest and in transit</li>
<li><strong>AWS CloudTrail:</strong> Audit logging for AI system usage</li>
</ul>
</div>`},
{id:'d4-bias',domain:3,title:'Bias Detection & Mitigation',content:`<div class="domain-card">
<h3>Types of AI Bias</h3>
<ul>
<li><strong>Data Bias:</strong> Training data does not represent the target population fairly. Example: facial recognition trained mostly on light-skinned faces performs poorly on dark-skinned faces.</li>
<li><strong>Algorithmic Bias:</strong> The algorithm itself produces biased results even with balanced data.</li>
<li><strong>Measurement Bias:</strong> The wrong features or metrics are used, leading to systematic errors.</li>
<li><strong>Recall Bias:</strong> The training data collection process itself is biased (e.g., only labeled fraud cases that were caught).</li>
</ul>

<h3>Bias Detection with SageMaker Clarify</h3>
<p>SageMaker Clarify computes two key bias metrics tested on the exam:</p>
<ul>
<li><strong>Difference in Positive Proportions (DPP):</strong> Difference in the proportion of positive outcomes between advantaged and disadvantaged groups. DPP = 0 means no bias.</li>
<li><strong>Disparate Impact (DI):</strong> Ratio of positive outcome proportions between groups. DI = 1 means no bias. Values < 0.8 or > 1.25 are considered potentially biased.</li>
</ul>

<h3>Bias Mitigation Strategies</h3>
<ul>
<li><strong>Data Augmentation (BEST — fixes at source):</strong> Generate synthetic examples for underrepresented groups. Fixes bias at its ROOT during data preparation, NOT after the fact. <em>Exam: "address bias at its source" = Data augmentation before training.</em></li>
<li><strong>Diverse Training Data:</strong> Ensure representative datasets across all demographic groups.</li>
<li><strong>SMOTE:</strong> Synthetic Minority Oversampling for class imbalance — generates synthetic examples of minority class.</li>
<li><strong>Regular Bias Testing:</strong> Continuous fairness audits across protected attributes.</li>
<li><strong>Post-generation filtering:</strong> Screens outputs after generation. <em>Exam trap: This treats symptoms, NOT causes. Fix bias at its root during data preparation.</em></li>
</ul>

<h3>Key Exam Distinction</h3>
<p><strong>Data augmentation before training</strong> = Fixes bias at the source (correct approach). <strong>Post-generation filtering</strong> = Treats symptoms only (not the correct approach for fixing root cause). If the question asks "what BEST addresses this problem at its source?", the answer is data augmentation / diverse training data — NOT post-filtering.</p>
</div>`},
{id:'d5-security',domain:4,title:'AI Security Threats & Protections',content:`<div class="domain-card">
<h3>AI Security Threats (Exam Critical)</h3>

<div class="key-service"><h4>Prompt Injection</h4><p><strong>What it is:</strong> Embedding malicious instructions in user input to override the system prompt and hijack the model's behavior. Classic example: "Ignore all previous instructions and..." <strong>Mitigation:</strong> Bedrock Guardrails (content filters, denied topics), input validation, prompt engineering (delimiting user input). <em>Exam: "user input tries to override system prompt" = Prompt injection attack.</em></p></div>
<div class="key-service"><h4>Data Poisoning</h4><p><strong>What it is:</strong> Corrupting training data to introduce backdoors or degrade model performance. Attacker injects malicious samples into the training dataset. <strong>Mitigation:</strong> Data validation, provenance tracking, secure data pipelines.</p></div>
<div class="key-service"><h4>Model Inversion</h4><p><strong>What it is:</strong> Reconstructing training data from model outputs — extracting sensitive information that the model was trained on. A privacy risk. <strong>Mitigation:</strong> Differential privacy, limiting output detail, access controls.</p></div>
<div class="key-service"><h4>Adversarial Examples</h4><p><strong>What it is:</strong> Imperceptible perturbations to inputs that cause misclassification. Primarily affects vision models (e.g., adding slight noise to a "stop sign" image makes the model see a "speed limit" sign). <strong>Mitigation:</strong> Adversarial training, input sanitization.</p></div>

<h3>AWS Security Services for AI</h3>
<ul>
<li><strong>AWS KMS (Key Management Service):</strong> Customer-managed encryption keys for encrypting data, model weights, and fine-tuning datasets. <em>Exam: "encrypt data using company's own keys" = AWS KMS.</em></li>
<li><strong>AWS CloudTrail:</strong> API activity logging for audit — tracks who invoked which model, when, and with what inputs/outputs. <em>Exam: "log Bedrock API calls for compliance auditing" = CloudTrail invocation logging.</em></li>
<li><strong>IAM (Identity and Access Management):</strong> Least-privilege access control for users and services. <em>Exam: "control who can invoke Bedrock models" = IAM policies.</em></li>
<li><strong>AWS Shield:</strong> DDoS protection for AWS infrastructure. Less commonly tested for AI-specific scenarios.</li>
<li><strong>Amazon GuardDuty:</strong> Threat detection service — can detect suspicious API activity patterns.</li>
</ul>

<h3>SageMaker Network Isolation</h3>
<p>Training containers with <strong>no outbound network access</strong> enabled. When enabled, containers cannot reach the internet, other AWS services (except through VPC endpoints), or any external endpoints. Only reads/writes to S3 through VPC endpoints. <em>Exam: "training job must not have internet access for sensitive data" = Enable network isolation mode.</em></p>

<h3>Shared Responsibility Model for AI</h3>
<p>AWS is responsible for <strong>security OF the cloud</strong> (infrastructure, physical security, managed service security). The customer is responsible for <strong>security IN the cloud</strong> (data, IAM configuration, network configuration, model governance, prompt safety). <em>Exam: "who is responsible for encrypting training data?" = The customer (security IN the cloud).</em></p>
</div>`},
{id:'d5-gov',domain:4,title:'Governance & Compliance',content:`<div class="domain-card">
<h3>AI Governance Framework</h3>
<p>AI governance encompasses the policies, processes, and tools to ensure AI systems are developed and used responsibly, securely, and in compliance with regulations.</p>

<h3>Key Governance Tools</h3>
<div class="key-service"><h4>SageMaker Model Cards</h4><p><strong>Purpose:</strong> Standardized documentation for each ML model. Captures: intended use cases, out-of-scope uses, limitations, training data provenance, evaluation metrics, ethical considerations, responsible AI practices. <em>Exam: "document model for regulatory compliance", "standardized model governance" = SageMaker Model Cards.</em></p></div>
<div class="key-service"><h4>Data Residency & Sovereignty</h4><p><strong>Requirement:</strong> EU patient data must be processed in EU Regions (eu-central-1). <strong>Solution:</strong> Deploy active-active in multiple Regions with latency-based routing. Model must be available in the required Region. <em>Exam: "EU data must stay in EU" = Deploy in eu-central-1. Multi-Region deployment also satisfies availability requirements.</em></p></div>

<h3>Best Practices for High-Impact AI Decisions</h3>
<ul>
<li>GenAI should <strong>augment, not replace</strong> human staff for decisions with legal/financial impact (claim approvals, loan denials)</li>
<li>Keep <strong>human review</strong> for final decisions when errors are costly</li>
<li><strong>Ground outputs</strong> in enterprise knowledge using RAG with citations</li>
<li>Apply <strong>safety controls</strong> (Guardrails) and <strong>logging/auditing</strong> (CloudTrail)</li>
<li>Use <strong>least-privilege IAM</strong> and disable shared credentials</li>
<li><strong>Separate environments</strong> — development, testing, and production should be isolated</li>
</ul>

<h3>Common Exam Scenario — Multi-Region Deployment</h3>
<p><strong>Scenario:</strong> Users in Frankfurt and Virginia. EU patient data must stay in EU. Current stack in us-east-1. RTT from Frankfurt to us-east-1 is 210ms vs 35ms to eu-central-1. Model available in both regions. Availability target: tolerate loss of one region.</p>
<p><strong>Best answer:</strong> Deploy active-active in us-east-1 AND eu-central-1 with latency routing. This satisfies data residency (EU data processed in EU), latency (Frankfurt users get 35ms), and availability (region failure is tolerated).</p>

<h3>Unsafe Practices to Avoid (Exam Traps)</h3>
<ul>
<li><strong>Disabling CloudTrail</strong> for a service to reduce logging costs — removes audit trail, violates compliance</li>
<li>Using <strong>one shared admin IAM user</strong> for all users — removes individual accountability, violates least privilege</li>
<li>Storing <strong>raw PII</strong> in feature stores or using it directly as model features — redact/anonymize first</li>
</ul>
</div>`}
];

const ALL_QUESTIONS = [
{id:1,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"An insurance company wants to use generative AI to reduce the time it takes to process customer claims. Claim decisions can have legal and financial impact, and the company must be able to explain how each decision was made.\n\nWhich proposed use of GenAI is INCORRECT and should be avoided?",options:["Use a Bedrock Knowledge Base (RAG) to answer adjuster questions with citations to policy documents","Automatically approve or deny claims end-to-end based only on the model's output, without human review","Draft customer response emails with Bedrock Guardrails and require an agent to approve before sending","Use Amazon Bedrock to summarize claim documents and highlight missing information for an adjuster to review"],answer:1,explanation:"For high-impact decisions like approving or denying insurance claims, GenAI is best used to augment trained staff rather than replace them end-to-end. Models can hallucinate or produce inconsistent rationales, so automated decisions without human oversight create unacceptable risk and weaken explainability and auditability requirements. Fully automating claim approvals/denials based solely on model output removes the human-in-the-loop control needed to manage hallucinations, bias, and accountability."},
{id:2,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A company uses a large foundation model to draft short customer-support replies. The app must respond in under 150 ms and stay within a fixed monthly inference budget, but the current model is too slow and expensive. The company wants to keep the same response quality while using a smaller, faster model.\n\nWhich approach is the BEST fit?",options:["Use Bedrock Knowledge Bases for RAG with the same large model","Add Bedrock Guardrails to reduce tokens and improve latency","Use Bedrock Provisioned Throughput on the large model","Use SageMaker AI model distillation to create a smaller model"],answer:3,explanation:"Model distillation transfers behavior from a large 'teacher' model to a smaller 'student' model. This reduces latency and inference cost while maintaining similar quality. Distillation changes the model size/performance profile, whereas retrieval, safety guardrails, or capacity reservations do not inherently make the underlying model smaller."},
{id:3,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A team is iterating on a prompt for an Amazon Bedrock chat assistant that answers questions about a company's return/refund policy. They ran a quick evaluation: 20 test prompts covering standard requests only (no edge cases), scored using ROUGE-L vs reference answers. ROUGE-L improved from 0.41 to 0.55. Known issue from support tickets: incorrect refund eligibility answers.\n\nBased only on this data, which is the best next step to evaluate response quality more effectively?",options:["Create a broader test set (including edge cases) and add a factuality/groundedness quality check in addition to ROUGE-L","Increase the model temperature to improve answer variety and re-run ROUGE-L","Fine-tune the foundation model on the 20 reference answers to reduce ticket volume","Deploy the new prompt because ROUGE-L increased from 0.41 to 0.55"],answer:0,explanation:"The evaluation is not aligned to the real failure mode. Support tickets report incorrect eligibility decisions, but the test covers only standard cases and only measures ROUGE-L (text overlap). Best next step: expand test prompts to include edge cases and measure factual correctness/grounding, not just text overlap. ROUGE-L can improve even when answers are factually wrong."},
{id:4,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is building a GenAI clinical assistant using Amazon Bedrock.\nDeployment notes:\n1. Users: Frankfurt (EU) and Virginia (US)\n2. Compliance: EU patient data must be processed in the EU\n3. Current stack Region: us-east-1\n4. Measured p95 RTT: Frankfurt->us-east-1 210 ms; Frankfurt->eu-central-1 35 ms\n5. Selected Bedrock model is available in: us-east-1, eu-central-1\n6. Availability target: tolerate loss of one AWS Region\n\nWhich action is the best next step to meet the requirements?",options:["Invoke the model only in us-east-1 and rely on KMS encryption for EU data","Keep the stack in us-east-1 and add CloudFront caching in EU","Use S3 Cross-Region Replication to copy prompts to us-east-1","Deploy active-active in us-east-1 and eu-central-1 with latency routing"],answer:3,explanation:"Multi-Region deployment is needed because EU data must be processed in an EU Region, EU users have significantly lower latency to eu-central-1, and the availability target requires tolerating a Region failure. The model is available in both us-east-1 and eu-central-1, enabling in-Region inference. CloudFront does not change where inference occurs. KMS encryption does not satisfy data residency requirements."},
{id:5,domain:"Security, Compliance, and Governance for AI",difficulty:"MEDIUM",type:"mcq",question:"A company tested a GenAI policy Q&A assistant with these results:\n- Hallucination rate on policy Q&A: 18%\n- Jailbreak success rate (unsafe prompts): 12%\n- Unsafe content in responses: 6%\n- PII leakage: 2 of 200 conversations\n\nBased only on this data, what is the best next step before production release?",options:["Add safety and grounding mitigations before launch","Remove all user context from prompts to improve response accuracy","Deploy as-is because the model passed a pilot evaluation","Increase the model temperature to reduce refusals"],answer:0,explanation:"The pilot shows measurable rates of hallucinations (18%), jailbreak success (12%), unsafe content (6%), and PII leakage (1%). These are concrete risks requiring mitigation before launch - safety guardrails, grounding (RAG), and additional adversarial testing. Shipping without mitigations would expose users to unsafe or incorrect outputs."},
{id:6,domain:"AWS Managed AI Services",difficulty:"MEDIUM",type:"mcq",question:"A healthcare company wants to build an AI application that listens to patient consultations and automatically generates structured clinical notes.\n\nWhich AWS service is MOST appropriate for this use case?",options:["Amazon Comprehend Medical","Amazon Transcribe Medical","Amazon Textract","Amazon Polly"],answer:1,explanation:"Amazon Transcribe Medical is a speech-to-text service specifically optimized for medical terminology and clinical conversations. It converts audio recordings into accurate transcripts that can be structured into clinical notes. Comprehend Medical analyzes existing text - it does not convert speech to text. Textract extracts text from documents. Polly converts text to speech."},
{id:7,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A company is building a RAG (Retrieval Augmented Generation) application using Amazon Bedrock. The company wants to store and search vector embeddings of its internal product catalog.\n\nWhich AWS service is MOST suitable for storing and querying these embeddings?",options:["Amazon RDS for PostgreSQL","Amazon DynamoDB","Amazon OpenSearch Service","Amazon Redshift"],answer:2,explanation:"Amazon OpenSearch Service supports k-NN (k-Nearest Neighbors) vector search, making it ideal for storing and querying high-dimensional vector embeddings in RAG architectures. It efficiently finds semantically similar documents through approximate nearest neighbor search."},
{id:8,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A data science team is evaluating a classification model. The model must minimize false negatives because missing a positive case has serious medical consequences.\n\nWhich evaluation metric should the team prioritize?",options:["Precision","Recall","Specificity","F1 score"],answer:1,explanation:"Recall (also called sensitivity or true positive rate) measures the proportion of actual positives that the model correctly identifies. Maximizing recall minimizes false negatives, which is critical in medical or safety applications where missing a positive case is more costly than a false alarm."},
