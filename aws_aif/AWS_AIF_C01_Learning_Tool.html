{id:145,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A medical company is customizing a foundation model (FM) for diagnostic purposes. The company needs the model to be transparent and explainable to meet regulatory requirements.\n\nWhich solution will meet these requirements?",options:["Configure the security and compliance by using Amazon Inspector","Generate simple metrics, reports, and examples by using Amazon SageMaker Clarify","Encrypt and secure training data by using Amazon Macie","Gather more data. Use Amazon Rekognition to add custom labels to the data"],answer:1,explanation:"Amazon SageMaker Clarify helps with transparency and explainability by generating metrics, reports, and examples that show how the model makes decisions, which is essential for meeting regulatory requirements."},
{id:146,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"msq",question:"A company wants to deploy a conversational chatbot to answer customer questions. The chatbot is based on a fine-tuned Amazon SageMaker JumpStart model. The application must comply with multiple regulatory frameworks.\n\nWhich capabilities can the company show compliance for? (Choose two.)",options:["Auto scaling inference endpoints","Threat detection","Data protection","Cost optimization","Loosely coupled microservices"],answer:[1,2],explanation:"Threat detection ensures security measures are in place to detect threats, which is important for compliance with regulatory frameworks. Data protection involves proper data handling and protection measures, which are key compliance aspects."},
{id:147,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is developing a new model to predict the prices of specific items. The model performed well on the training dataset. When the company deployed the model to production, the model's performance decreased significantly.\n\nWhat should the company do to mitigate this problem?",options:["Reduce the volume of data that is used in training","Add hyperparameters to the model","Increase the volume of data that is used in training","Increase the model training time"],answer:2,explanation:"Increasing the volume of data used in training helps the model generalize better to new, unseen data, reducing overfitting and improving performance in production."},
{id:148,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A company wants to use large language models (LLMs) with Amazon Bedrock to develop a chat interface for the company's product manuals. The manuals are stored as PDF files.\n\nWhich solution meets these requirements MOST cost-effectively?",options:["Use prompt engineering to add one PDF file as context to the user prompt when the prompt is submitted to Amazon Bedrock","Use prompt engineering to add all the PDF files as context to the user prompt when the prompt is submitted to Amazon Bedrock","Use all the PDF documents to fine-tune a model with Amazon Bedrock. Use the fine-tuned model to process user prompts","Upload PDF documents to an Amazon Bedrock knowledge base. Use the knowledge base to provide context when users submit prompts to Amazon Bedrock"],answer:3,explanation:"Using an Amazon Bedrock knowledge base allows the model to efficiently access relevant information from the PDF manuals when needed, reducing the cost compared to continuously fine-tuning a model or providing all PDFs as context in each prompt."},
{id:149,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A social media company wants to use a large language model (LLM) for content moderation. The company wants to evaluate the LLM outputs for bias and potential discrimination against specific groups or individuals.\n\nWhich data source should the company use to evaluate the LLM outputs with the LEAST administrative effort?",options:["User-generated content","Moderation logs","Content moderation guidelines","Benchmark datasets"],answer:3,explanation:"Benchmark datasets are standardized datasets specifically designed for evaluating models for bias and fairness, allowing for efficient assessment with minimal administrative effort."},
{id:150,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A company needs to choose a model from Amazon Bedrock to use internally. The company must identify a model that generates responses in a style that the company's employees prefer.\n\nWhat should the company do to meet these requirements?",options:["Evaluate the models by using built-in prompt datasets","Evaluate the models by using a human workforce and custom prompt datasets","Use public model leaderboards to identify the model","Use the model InvocationLatency runtime metrics in Amazon CloudWatch when trying models"],answer:1,explanation:"Evaluating models using a human workforce and custom prompt datasets ensures that the model generates responses in the style that aligns with the company's preferences."},
{id:151,domain:"Guidelines for Responsible AI",difficulty:"EASY",type:"mcq",question:"A student at a university is copying content from generative AI to write essays.\n\nWhich challenge of responsible generative AI does this scenario represent?",options:["Toxicity","Hallucinations","Plagiarism","Privacy"],answer:2,explanation:"Copying content from generative AI to write essays without proper attribution constitutes plagiarism, which is a key challenge of responsible generative AI."},
{id:152,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A company wants to build an interactive application for children that generates new stories based on classic stories. The company wants to use Amazon Bedrock and needs to ensure that the results and topics are appropriate for children.\n\nWhich AWS service or feature will meet these requirements?",options:["Amazon Rekognition","Amazon Bedrock playgrounds","Guardrails for Amazon Bedrock","Agents for Amazon Bedrock"],answer:2,explanation:"Guardrails for Amazon Bedrock can help ensure that the output generated by Amazon Bedrock is appropriate for children by applying content moderation and safety guidelines to filter potentially harmful or inappropriate content."},
{id:153,domain:"Fundamentals of Generative AI",difficulty:"EASY",type:"mcq",question:"A company is building an application that needs to generate synthetic data that is based on existing data.\n\nWhich type of model can the company use to meet this requirement?",options:["Generative adversarial network (GAN)","XGBoost","Residual neural network","WaveNet"],answer:0,explanation:"Generative adversarial networks (GANs) are designed to generate synthetic data that resembles a given training dataset, making them suitable for generating new data based on existing data."},
{id:154,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A manufacturing company uses AI to inspect products and find any damages or defects.",options:["Recommendation system","Natural language processing (NLP)","Computer vision","Image processing"],answer:2,explanation:"Computer vision is a field of AI that enables machines to interpret and understand visual information from the world, such as images and videos. In the case of the manufacturing company, the AI is used to inspect products for damages or defects, which involves analyzing visual data (e.g., product images or videos). This is a classic application of computer vision, where the AI system identifies and classifies objects or defects within images."},
{id:155,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A company wants to create an ML model to predict customer satisfaction. The company needs fully automated model tuning.",options:["Amazon Personalize","Amazon SageMaker","Amazon Athena","Amazon Comprehend"],answer:1,explanation:"Amazon SageMaker provides a fully managed environment for building, training, and deploying machine learning models, including automatic model tuning. Specifically, SageMaker includes a feature called Automatic Model Tuning (or Hyperparameter Optimization), which automates the process of finding the best hyperparameters for your machine learning model. This is essential when you want to optimize the model's performance without manual intervention. Amazon SageMaker allows you to automate the training process and hyperparameter tuning, which aligns perfectly with the company's need for fully automated model tuning."},
{id:156,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"Which technique can a company use to lower bias and toxicity in generative AI applications during the post-processing ML lifecycle?",options:["Human-in-the-loop","Data augmentation","Feature engineering","Adversarial training"],answer:0,explanation:"Human-in-the-loop (HITL) is a technique where human oversight is involved in the decision-making process of AI systems. In the context of generative AI applications, HITL can be used during the post-processing phase to identify and mitigate biases or toxic outputs. Humans can review and intervene when the model generates inappropriate or biased content, providing corrections or adjustments that help reduce the likelihood of toxicity and bias. This feedback loop helps refine and improve the model's outputs over time."},
{id:157,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A bank has fine-tuned a large language model (LLM) to expedite the loan approval process. During an external audit of the model, the company discovered that the model was approving loans at a faster pace for a specific demographic than for other demographics.",options:["Include more diverse training data. Fine-tune the model again by using the new data.","Use Retrieval Augmented Generation (RAG) with the fine-tuned model.","Use AWS Trusted Advisor checks to eliminate bias.","Pre-train a new LLM with more diverse training data."],answer:0,explanation:"The issue described is a case of bias in the model's decision-making process, where the model is showing a preference for a specific demographic. The most cost-effective way to address this is to include more diverse training data that better represents all demographics. By fine-tuning the model with this more diverse data, you can help ensure that the model treats all demographic groups fairly and does not exhibit biased behavior. Fine-tuning the model with updated data ensures that the model learns from a more representative sample, improving fairness in its predictions without needing to completely retrain the model from scratch."},
{id:158,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"HOTSPOT (Drag and Drop is not supported)",options:["See Explanation section for answer."],answer:0,explanation:"The company's chatbot needs predictions from the LLM to understand users' intent with minimal latency - Real-time inference This scenario requires Real-time inference, as chatbots typically need immediate responses with low latency to provide an interactive user experience. A data processing job needs to query the LLM to process gigabytes of text files on weekends - Batch transform This use case is best suited for Batch transform. Since the data processing job involves handling large amounts of data, and it is scheduled for weekends, batch processing can handle these large volumes efficiently. The company's engineering team needs to create an API that can process small pieces of text content and provide low-latency predictions - Real-time inference Real-time inference is the correct choice here, as the API needs to process text quickly and provide immediate responses, making real-time inference appropriate."},
{id:159,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"msq",question:"A company needs to log all requests made to its Amazon Bedrock API. The company must retain the logs securely for 5 years at the lowest possible cost.",options:["AWS CloudTrail","Amazon CloudWatch","AWS Audit Manager","Amazon S3 Intelligent-Tiering","Amazon S3 Standard"],answer:[0,3],explanation:"AWS CloudTrail is the AWS service designed for logging and monitoring API calls made to AWS services, including Amazon Bedrock. CloudTrail records detailed information about the API requests, including the identity of the requester, the time of the request, and the source IP address. This service is ideal for logging all requests made to the Amazon Bedrock API and meets the logging requirement. Amazon S3 Intelligent-Tiering is a storage class designed for storing data that has unpredictable access patterns. It automatically moves data between two access tiers (frequent and infrequent) based on usage, which helps reduce costs while ensuring data is still available when needed. For retaining logs securely over 5 years at the lowest possible cost, this storage class provides an efficient way to handle long-term storage requirements without incurring unnecessary costs."},
{id:160,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"An ecommerce company wants to improve search engine recommendations by customizing the results for each user of the company's ecommerce platform.",options:["Amazon Personalize","Amazon Kendra","Amazon Rekognition","Amazon Transcribe"],answer:0,explanation:"Amazon Personalize is an AWS service specifically designed to build and deploy personalized recommendations for users. It allows you to create custom machine learning models for personalized user experiences, such as product recommendations, search results, or content suggestions. For an ecommerce company aiming to improve search engine recommendations tailored to each user, Amazon Personalize is the ideal choice as it leverages user behavior data and machine learning to deliver highly relevant recommendations."},
{id:161,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A hospital is developing an AI system to assist doctors in diagnosing diseases based on patient records and medical images. To comply with regulations, the sensitive patient data must not leave the country the data is located in.",options:["Data residency","Data quality","Data discoverability","Data enrichment"],answer:0,explanation:"Data residency refers to the practice of ensuring that data is stored and processed within a specific geographical location to comply with regulations or policies. In this scenario, where sensitive patient data must not leave the country it originates from, implementing a data residency strategy ensures compliance with legal and regulatory requirements while protecting patient privacy. This approach is crucial for organizations like hospitals operating under strict data governance frameworks such as HIPAA or GDPR."},
{id:162,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A company needs to monitor the performance of its ML systems by using a highly scalable AWS service.",options:["Amazon CloudWatch","AWS CloudTrail","AWS Trusted Advisor","AWS Config"],answer:0,explanation:"Amazon CloudWatch is a highly scalable AWS service designed for monitoring and observability. It provides real-time monitoring of system metrics, including performance data for ML systems, such as resource utilization (CPU, memory, etc.), model inference latency, request counts, and errors. CloudWatch enables users to set up alarms, visualize metrics, and automate actions based on performance thresholds, making it ideal for monitoring the performance of ML systems."},
{id:163,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"An AI practitioner is developing a prompt for an Amazon Titan model. The model is hosted on Amazon Bedrock. The AI practitioner is using the model to solve numerical reasoning challenges. The AI practitioner adds the following phrase to the end of the prompt: \"Ask the model to show its work by explaining its reasoning step by step.\"",options:["Chain-of-thought prompting","Prompt injection","Few-shot prompting","Prompt templating"],answer:0,explanation:"Chain-of-thought prompting is a technique in prompt engineering where the AI model is encouraged to break down its reasoning process step by step to solve a problem, such as numerical reasoning challenges. By explicitly instructing the model to \"show its work by explaining its reasoning step by step,\" the practitioner ensures the model provides a logical sequence of intermediate steps leading to the solution. This improves the accuracy and transparency of the model's outputs, particularly for complex reasoning tasks."},
{id:164,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"Which AWS service makes foundation models (FMs) available to help users build and scale generative AI applications?",options:["Amazon Q Developer","Amazon Bedrock","Amazon Kendra","Amazon Comprehend"],answer:1,explanation:"Amazon Bedrock is an AWS service that allows users to build and scale generative AI applications using foundation models (FMs) without the need to manage infrastructure. It provides access to pre-trained models from AWS and third-party providers, enabling developers to integrate generative AI capabilities like text generation, summarization, and question-answering into their applications. This makes Amazon Bedrock the ideal choice for building and scaling generative AI solutions."},
{id:165,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A company is building a mobile app for users who have a visual impairment. The app must be able to hear what users say and provide voice responses.",options:["Use a deep learning neural network to perform speech recognition.","Build ML models to search for patterns in numeric data.","Use generative AI summarization to generate human-like text.","Build custom models for image classification and recognition."],answer:0,explanation:"To meet the requirements of enabling the app to \"hear what users say and provide voice responses,\" the solution must include speech recognition and text-to-speech capabilities. Using a deep learning neural network for speech recognition allows the app to convert spoken words into text. Once the input is understood, text-to- speech systems can provide voice responses back to users. This approach is fundamental in applications that assist users with visual impairments by enabling interaction through spoken language."},
{id:166,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A company wants to enhance response quality for a large language model (LLM) for complex problem-solving tasks. The tasks require detailed reasoning and a step-by-step explanation process.",options:["Few-shot prompting","Zero-shot prompting","Directional stimulus prompting","Chain-of-thought prompting"],answer:3,explanation:"Chain-of-thought prompting is specifically designed to enhance the reasoning capabilities of a large language model (LLM) by encouraging it to provide step-by-step explanations for complex problem-solving tasks. This approach helps the model break down a problem into smaller, logical steps, ensuring that the response is detailed, accurate, and easy to follow."},
{id:167,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A company wants to keep its foundation model (FM) relevant by using the most recent data. The company wants to implement a model training strategy that includes regular updates to the FM.",options:["Batch learning","Continuous pre-training","Static training","Latent training"],answer:1,explanation:"Continuous pre-training keeps a foundation model \"always learning\" by periodically (or even continuously) ingesting the latest data and updating its weights. This approach ensures the model stays current without having to start training from scratch every time new data arrives, unlike static or strictly batch-oriented methods."},
{id:168,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"HOTSPOT (Drag and Drop is not supported)",options:["See Explanation section for answer."],answer:0,explanation:"Binary classification: Supervised learning Binary classification involves predicting one of two possible outcomes, requiring labeled training data. Multi-class classification: Supervised learning Multi-class classification extends binary classification to predict one of several classes, also requiring labeled data. K-means clustering: Unsupervised learning K-means clustering is used to group data points into clusters without requiring labeled data. Dimensionality reduction: Unsupervised learning Dimensionality reduction techniques, like PCA, reduce the number of features in the dataset without needing labeled data."},
{id:169,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"Which option is a characteristic of AI governance frameworks for building trust and deploying human-centered AI technologies?",options:["Expanding initiatives across business units to create long-term business value","Ensuring alignment with business standards, revenue goals, and stakeholder expectations","Overcoming challenges to drive business transformation and growth","Developing policies and guidelines for data, transparency, responsible AI, and compliance"],answer:3,explanation:"AI governance frameworks focus on building trust and ensuring the responsible deployment of AI technologies. They establish clear policies and guidelines to address critical aspects such as data management, transparency, ethical considerations, responsible AI practices, and regulatory compliance. These frameworks help organizations mitigate risks, promote fairness, and foster public trust in AI systems, making them essential for creating human-centered AI technologies."},
{id:170,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"An ecommerce company is using a generative AI chatbot to respond to customer inquiries. The company wants to measure the financial effect of the chatbot on the company's operations.",options:["Number of customer inquiries handled","Cost of training AI models","Cost for each customer conversation","Average handled time (AHT)"],answer:2,explanation:"To measure the financial effect of a generative AI chatbot on the company's operations, the cost for each customer conversation is the most relevant metric. It directly quantifies the operational expense associated with using the chatbot to handle customer inquiries. By analyzing this metric, the company can evaluate how much it spends per conversation and compare it to the cost of alternative methods (e.g., human agents), providing insight into the chatbot's financial efficiency and ROI."},
{id:171,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A company wants to find groups for its customers based on the customers' demographics and buying patterns.",options:["K-nearest neighbors (k-NN)","K-means","Decision tree","Support vector machine"],answer:1,explanation:"K-means is a clustering algorithm used in unsupervised learning to group data points into clusters based on their similarities. It is well-suited for finding patterns in customer demographics and buying behavior. The algorithm identifies groups (clusters) of customers with similar characteristics, which can then be used for targeted marketing, personalized recommendations, or segmentation."},
{id:172,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A company's large language model (LLM) is experiencing hallucinations.",options:["Set up Agents for Amazon Bedrock to supervise the model training.","Use data pre-processing and remove any data that causes hallucinations.","Decrease the temperature inference parameter for the model.","Use a foundation model (FM) that is trained to not hallucinate."],answer:2,explanation:"In the context of large language models (LLMs), the temperature inference parameter controls the randomness of the model's output. Lowering the temperature reduces randomness and makes the model's responses more deterministic and focused on the most likely predictions. By decreasing the temperature, the likelihood of hallucinations (when the model generates incorrect or nonsensical information) is reduced, as the model relies more on high-probability outputs rather than exploring less likely possibilities."},
{id:173,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A company is using a large language model (LLM) on Amazon Bedrock to build a chatbot. The chatbot processes customer support requests. To resolve a request, the customer and the chatbot must interact a few times.",options:["Turn on model invocation logging to collect messages.","Add messages to the model prompt.","Use Amazon Personalize to save conversation history.","Use Provisioned Throughput for the LLM."],answer:1,explanation:"To give a large language model (LLM) the ability to use content from previous customer messages in a conversation, the previous messages must be included in the model prompt. This technique is known as prompt engineering and allows the LLM to retain context by incorporating a history of the interaction within the prompt. By appending prior exchanges to the prompt, the model can generate contextually relevant and coherent responses throughout the multi-turn conversation."},
{id:174,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A company's employees provide product descriptions and recommendations to customers when customers call the customer service center. These recommendations are based on where the customers are located. The company wants to use foundation models (FMs) to automate this process.",options:["Amazon Macie","Amazon Transcribe","Amazon Bedrock","Amazon Textract"],answer:2,explanation:"Amazon Bedrock enables companies to use foundation models (FMs) to build and automate tasks like generating product descriptions and recommendations. It allows the integration of pre-trained FMs into applications without managing infrastructure, making it an ideal choice for automating customer service tasks. With Amazon Bedrock, the company can leverage FMs to generate tailored recommendations based on customer locations, enabling dynamic and efficient customer interactions."},
{id:175,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A company wants to upload customer service email messages to Amazon S3 to develop a business analysis application. The messages sometimes contain sensitive data. The company wants to receive an alert every time sensitive information is found.",options:["Configure Amazon Macie to detect sensitive information in the documents that are uploaded to Amazon S3.","Use Amazon SageMaker endpoints to deploy a large language model (LLM) to redact sensitive data.","Develop multiple regex patterns to detect sensitive data. Expose the regex patterns on an Amazon SageMaker notebook.","Ask the customers to avoid sharing sensitive information in their email messages."],answer:0,explanation:"Amazon Macie is a fully managed data security and privacy service that uses machine learning to discover and protect sensitive data in Amazon S3. It can automatically detect sensitive information, such as personally identifiable information (PII) or financial data, and send alerts when such data is found. This approach minimizes development effort, as it does not require custom regex patterns or model development, and it is specifically designed to handle the scenario described."},
{id:176,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"HOTSPOT (Drag and Drop is not supported)",options:["See Explanation section for answer."],answer:0,explanation:"\"Classify the following text as either sports, politics, or entertainment: [input text].\" Correct Answers: Zero-shot learning Zero-shot learning involves providing the model with a task and no prior examples, relying entirely on the model's pre-trained knowledge to perform the classification. \"A [image 1], [image 2], and [image 3] are examples of [target class]. Classify the following image as [target class].\" Correct Answers: Few-shot learning Few-shot learning provides the model with a few examples (image 1, image 2, and image 3) before asking it to classify a new instance, helping it generalize to the task with minimal examples. \"[Question.] [Instructions to follow.] Think step by step and walk me through your thinking.\" Correct Answers: Chain-of-thought reasoning Chain-of-thought reasoning encourages the model to break down its reasoning process step by step, enhancing its ability to solve complex tasks logically."},
{id:177,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"HOTSPOT (Drag and Drop is not supported)",options:["See Explanation section for answer."],answer:0,explanation:"Block input prompts or model responses that contain harmful content such as hate, insults, violence, or misconduct - Content filters Avoid subjects related to illegal investment advice or legal advice - Denied topics Detect and block specific offensive terms - Word filters Detect and filter out information in the model's responses that is not grounded in the provided source information - Contextual grounding check"},
{id:178,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is deploying AI/ML models by using AWS services. The company wants to offer transparency into the models' decision-making processes and provide explanations for the model outputs.",options:["Amazon SageMaker Model Cards","Amazon Rekognition","Amazon Comprehend","Amazon Lex"],answer:0,explanation:"Amazon SageMaker Model Cards help provide transparency into AI/ML models by documenting key details such as model purpose, training data, performance metrics, and limitations. This documentation enables organizations to explain model outputs and decision-making processes, ensuring accountability and compliance with responsible AI principles."},
{id:179,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A manufacturing company wants to create product descriptions in multiple languages.",options:["Amazon Translate","Amazon Transcribe","Amazon Kendra","Amazon Polly"],answer:0,explanation:"Amazon Translate is an AWS service that automates language translation using neural machine translation (NMT). It enables businesses to generate product descriptions in multiple languages quickly and accurately, making it the best choice for this task."},
{id:180,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"HOTSPOT (Drag and Drop is not supported)",options:["See Explanation section for answer."],answer:0,explanation:"The models must be taught a new domain-specific task - Model fine-tuning Fine-tuning is the best approach when a model needs to learn a specific domain-related task. It involves adjusting a pre-trained model with a smaller, task-specific dataset to improve performance in that domain. A limited amount of labeled data is available and more data is needed - Data augmentation Data augmentation helps in scenarios where labeled data is scarce by artificially increasing the size and variability of the dataset, improving model generalization. Only unlabeled data is available - Continued pre-training Continued pre-training allows an existing foundation model to be further trained on domain-specific, unlabeled data to adapt to new contexts without requiring labeled data."},
{id:181,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"Which AWS feature records details about ML instance data for governance and reporting?",options:["Amazon SageMaker Model Cards","Amazon SageMaker Debugger","Amazon SageMaker Model Monitor","Amazon SageMaker JumpStart"],answer:0,explanation:"Amazon SageMaker Model Cards record key details about machine learning models, including intended use, training data, evaluation metrics, and compliance information. They support governance and reporting by providing a standardized way to document model information throughout its lifecycle."},
{id:182,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A financial company is using ML to help with some of the company's tasks.",options:["Summarizing customer complaints","Classifying customers based on product usage","Segmenting customers based on type of investments","Forecasting revenue for certain products"],answer:0,explanation:"Generative AI models are designed to generate new content such as text, images, or audio. Summarizing customer complaints involves generating concise versions of longer texts, which is a task well-suited for generative AI models like large language models."},
{id:183,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A medical company wants to develop an AI application that can access structured patient records, extract relevant information, and generate concise summaries.",options:["Use Amazon Comprehend Medical to extract relevant medical entities and relationships. Apply rule-based logic to structure and format summaries.","Use Amazon Personalize to analyze patient engagement patterns. Integrate the output with a general purpose text summarization tool.","Use Amazon Textract to convert scanned documents into digital text. Design a keyword extraction system to generate summaries.","Implement Amazon Kendra to provide a searchable index for medical records. Use a template-based system to format summaries."],answer:0,explanation:"Amazon Comprehend Medical is specifically designed to extract structured medical information (such as medication, condition, test results) from unstructured text. By applying rule-based logic afterward, relevant data can be formatted into concise summaries, meeting both the extraction and summarization needs."},
{id:184,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"Which option describes embeddings in the context of AI?",options:["A method for compressing large datasets","An encryption method for securing sensitive data","A method for visualizing high-dimensional data","A numerical method for data representation in a reduced dimensionality space"],answer:3,explanation:"Embeddings are numerical representations of data, such as words, images, or items, in a lower-dimensional vector space. They capture semantic relationships and patterns in the data, enabling models to process and compare inputs efficiently."},
{id:185,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is building an AI application to summarize books of varying lengths. During testing, the application fails to summarize some books.",options:["The temperature is set too high.","The selected model does not support fine-tuning.","The Top P value is too high.","The input tokens exceed the model's context size."],answer:3,explanation:"Language models have a maximum context size, which limits the number of input tokens they can process at once. If a book's length exceeds this limit, the model cannot handle the full input, leading to failure in summarization."},
{id:186,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"An e-commerce company is developing a chatbot to enhance its user experience by allowing customers to submit queries that include both text descriptions and images, such as product photos or screenshots of issues. The company aims for the chatbot to understand these multi-modal inputs and provide accurate and context-aware responses, seamlessly combining visual and textual information to address customer needs effectively. Which approach would be the most cost-effective for enabling the chatbot to process such multi-modal queries effectively?",options:["The company should use a text-only language model, which is trained exclusively on textual data", "The company should use a convolutional neural network (CNN), a deep learning model primarily designed for processing image data", "The company should use a multi-modal generative model, which can generate responses or outputs based on combined inputs from different modalities, such as text and images, enhancing the chatbot's ability to provide contextually relevant answers", "The company should use a multi-modal embedding model, which is designed to represent and align different types of data (such as text and images) in a shared embedding space, allowing the chatbot to understand and interpret both forms of input simultaneously"],answer:3,explanation:"The company should use a multi-modal embedding model, which is designed to represent and align different types of data (such as text and images) in a shared embedding space, allowing the chatbot to understand and interpret both forms of input simultaneously A multi-modal embedding model is the most suitable choice for this task because it enables the integration of multiple types of data, such as text and images, into a unified representation. This allows the chatbot to effectively process and understand queries containing both text and visual content by aligning them in a shared embedding space, facilitating more accurate and context-aware responses. You can generate embeddings for your content and store them in a vector database. When an end user submits any combination of text and image as a search query, the model generates embeddings for the search query and matches them to the stored embeddings to provide relevant search and recommendations results to end users. For example, a stock photography company with hundreds of millions of images can use the model to power its search functionality, so users can search for images using a phrase, image, or a combination of image and text. You can further customize the model to enhance its understanding of your unique content and provide more meaningful results using image-text pairs for fine-tuning."},
{id:187,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A global e-commerce company is leveraging a Foundation Model (FM) to improve its product recommendation engine and enhance customer experience. However, the data science team is looking to further optimize the model's performance by applying advanced techniques that can fine-tune the FM for specific tasks, ensure higher accuracy, and improve overall efficiency. The company needs to identify the most effective methods for enhancing the model's capabilities while maintaining scalability. Which of the following is correct regarding the techniques used to improve the performance of a Foundation Model (FM)?",options:["Neither Fine-tuning nor Retrieval-augmented generation (RAG) changes the weights of the FM", "Fine-tuning does not change the weights of the FM whereas Retrieval-augmented generation (RAG) changes the weights of the FM", "Fine-tuning changes the weights of the FM whereas Retrieval-augmented generation (RAG) does not change the weights of the FM", "Both Fine-tuning and Retrieval-augmented generation (RAG) change the weights of the FM"],answer:2,explanation:"Fine-tuning changes the weights of the FM whereas Retrieval-augmented generation (RAG) does not change the weights of the FM Retrieval-Augmented Generation (RAG) is the process of optimizing the output of a large language model, so it references an authoritative knowledge base outside of its training data sources before generating a response. Large Language Models (LLMs) are trained on vast volumes of data and use billions of parameters to generate original output for tasks like answering questions, translating languages, and completing sentences. RAG extends the already powerful capabilities of LLMs to specific domains or an organization's internal knowledge base, all without the need to retrain the model. Another recommended way to first customize a foundation model to a specific use case is through prompt engineering. Providing your foundation model with well-engineered, context-rich prompts can help achieve desired results without any fine-tuning or changing of model weights. Lastly, fine-tuning is a customization method for FMs that involves further training and does change the weights of your model. Retrieval Augmented Generation (RAG) allows you to customize a model's responses when you want the model to consider new knowledge or up-to-date information. When your data changes frequently, like inventory or pricing, it's not practical to fine-tune and update the model while it's serving user queries. 'via -'https://aws.amazon.com/blogs/machine-learning/best-practices-to-build-generative-ai-applications-on-aws/ 'via -'https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html Exam Alert: Note the following regarding the techniques to improve the performance of a Foundation Model (FM): Prompt engineering does NOT change the weights of the FM. Retrieval-Augmented Generation (RAG) does NOT change the weights of the FM. Fine-tuning DOES change the weights of the FM."},
{id:188,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"msq",question:"A retail company is developing a machine learning model to predict customer churn and is in the process of preparing its dataset. The data science team plans to divide the data into a training set, validation set, and test set to ensure the model performs well across different stages of development and evaluation. To proceed effectively, the team needs to fully understand the roles of each of these sets and how they contribute to building a robust model. Which of the following is correct regarding the training set, validation set, and test set used in the context of machine learning? (Select two)",options:["Test set is used to determine how well the model generalizes", "Test sets are optional", "Validation sets are optional", "Validation set is used to determine how well the model generalizes", "Test set is used for hyperparameter tuning"],answer:[0, 2],explanation:"The test set is used to determine how well the model generalizes to unseen data. Validation sets are optional in some workflows (e.g., when using cross-validation instead of a separate validation split). However, a test set is essential for final model evaluation."},
{id:189,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"An app developer is building an educational application to help high-school students understand fundamental concepts in mathematics, such as calculating the probability of drawing a spade from a deck of cards. Which approach would be the most suitable for this purpose?",options:["The developer should utilize unsupervised learning, a machine learning method that identifies patterns and structures in data without using labeled datasets", "The developer should leverage reinforcement learning (RL), a type of machine learning where an agent learns to make decisions by receiving rewards or penalties", "The developer should create a rule-based application that uses predefined mathematical rules and formulas to answer probability questions accurately", "The developer should apply supervised learning, a machine learning approach where the model learns from labeled datasets to make predictions"],answer:2,explanation:"The developer should create a rule-based application that uses predefined mathematical rules and formulas to answer probability questions accurately A rule-based application is the most suitable choice for this scenario. Probability questions, like calculating the chance of drawing a spade from a deck of cards, are based on well-defined mathematical rules and formulas. A rule-based system can be programmed with these rules to provide precise answers to such questions, making it an efficient and straightforward solution. This approach ensures accuracy, is easy to implement, and requires no training data, making it ideal for helping students understand fundamental mathematical concepts."},
{id:190,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"msq",question:"A healthcare startup is building machine learning models to assist doctors in diagnosing medical conditions. The development team is debating whether to use a complex, high-performance model or a transparent and explainable model that offers clear insights into how predictions are made. Since transparency is important in healthcare, the team needs to weigh the benefits of using an explainable model, particularly in terms of trust, compliance, and accountability. Which benefits might persuade a developer to choose a transparent and explainable machine learning model? (Select two)",options:["They foster trust and confidence in model predictions", "They facilitate easier debugging and optimization", "They simplify the integration process with other systems", "They require less computational power and storage", "They enhance security by concealing model logic"],answer:[1, 0],explanation:"They facilitate easier debugging and optimization Transparent models allow developers to understand how inputs are transformed into outputs, making it easier to identify and correct errors or inefficiencies in the model. This capability is crucial for optimizing the model's performance and ensuring it behaves as expected. They foster trust and confidence in model predictions When stakeholders can understand the decision-making process of a model, it builds trust in its predictions. Transparency is key in high-stakes scenarios, such as healthcare or finance, where understanding the rationale behind predictions is critical for acceptance and trust."},
{id:191,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"Consider the following AI model responses to user prompts. Which response exemplifies hallucination and which exemplifies toxicity?\nPrompt 1: \"What is the capital of France?\"\nResponse A: \"The capital of France is Mars.\"\nPrompt 2: \"Tell me a joke.\"\nResponse B: \"Why don't scientists trust atoms? Because they make up everything!\"\nPrompt 3: \"Describe a good book for children.\"\nResponse C: \"You should read 'ABC', a great book with fun activities for kids.\"\nPrompt 4: \"What do you think about people from [specific group]?\"\nResponse D: \"People from [specific group] are inferior and should not be trusted.\"",options:["Response A is hallucination; Response D is toxicity", "Response D is hallucination; Response A is toxicity", "Response C is hallucination; Response B is toxicity", "Response B is hallucination; Response C is toxicity"],answer:0,explanation:"Response A is hallucination; Response D is toxicity. Toxicity refers to AI model-generated content that can be deemed as offensive, disturbing, or inappropriate. Hallucination refers to AI model-generated assertions or claims that sound true but are incorrect. Response A is an example of hallucination, where the AI model generates an incorrect response (\"The capital of France is Mars\"). Response D is an example of toxicity, where the AI model generates harmful or offensive content about a specific group."},
{id:192,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is using Amazon Bedrock and it wants to regulate the percentage of most-likely candidates considered for the next word in the model's output. Which of the following inference parameters would you recommend for the given use case?",options:["Temperature", "Top P", "Stop sequences", "Top K"],answer:1,explanation:"Top P Top P represents the percentage of most likely candidates that the model considers for the next token. Choose a lower value to decrease the size of the pool and limit the options to more likely outputs. Choose a higher value to increase the size of the pool and allow the model to consider less likely outputs. via -'https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html"},
{id:193,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A fintech company is looking to improve its software development lifecycle by adopting cloud-based solutions that allow for faster innovation and more efficient deployment of new features. The development team wants to leverage AWS Cloud to rapidly build, test, and launch its applications, while also minimizing infrastructure management overhead. To achieve this, they need to identify the specific AWS feature that supports accelerated development and faster time-to-market. Which feature of AWS Cloud offers the ability to innovate faster and rapidly develop, test, and launch software applications?",options:["Agility", "Elasticity", "Ability to deploy globally in minutes", "Cost savings"],answer:0,explanation:"Cloud computing is the on-demand delivery of IT resources over the Internet with pay-as-you-go pricing. Instead of buying, owning, and maintaining physical data centers and servers, you can access technology services, such as computing power, storage, and databases, on an as-needed basis from a cloud provider like Amazon Web Services (AWS). Agility'- Agility refers to the ability of the cloud to give you easy access to a broad range of technologies so that you can innovate faster and build nearly anything that you can imagine. You can quickly spin up resources as you need them ' from infrastructure services, such as compute, storage, and databases, to the Internet of Things, machine learning, data lakes and analytics, and much more."},
{id:194,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A media company is developing generative AI applications on AWS to automate content creation and enhance customer engagement. Given the sensitivity of customer data and the complexity of AI models, the company's security team wants to implement a defense-in-depth security approach to protect both the data and the AI infrastructure. Which of the following strategies best aligns with the given requirements?",options:["Applying multiple layers of security measures including input validation, access controls, and continuous monitoring to address vulnerabilities", "Relying solely on data encryption to protect the AI training data", "Implementing a single-layer firewall to block unauthorized access to the AI models", "Using a single authentication mechanism for all users and services accessing the AI models"],answer:0,explanation:"Applying multiple layers of security measures including input validation, access controls, and continuous monitoring to address vulnerabilities Architecting a defense-in-depth security approach involves implementing multiple layers of security to protect generative AI applications. This includes input validation to prevent malicious data inputs, strict access controls to limit who can interact with the AI models, and continuous monitoring to detect and respond to security incidents. These measures can help address common vulnerabilities and meet the best practices for securing generative AI applications on AWS."},
{id:195,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A media company is looking to enhance its content creation processes by leveraging cutting-edge technologies and has been exploring the use of generative AI. The leadership team wants to understand the broader significance of generative AI in modern technological applications, including its potential to automate tasks, improve creativity, and optimize workflows across industries. Understanding why generative AI is considered important will help the company make informed decisions about integrating this technology into its operations. Given this context, why is generative AI considered important in modern technological applications?",options:["Generative AI is the best fit for use cases related to gaming and entertainment applications", "Generative AI can replace all traditional databases with its own storage solutions", "Generative AI is important because it can autonomously create novel and complex data, enhancing creativity and efficiency in various domains", "Generative AI can easily perform simple tasks like sorting and filtering data"],answer:2,explanation:"Generative AI is important because it can autonomously create novel and complex data, enhancing creativity and efficiency in various domains Generative AI is important because it can autonomously create novel and complex data, which significantly enhances creativity and efficiency across various fields, such as content creation, design, and problem-solving. 'via -'https://aws.amazon.com/what-is/generative-ai/"},
{id:196,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"msq",question:"A financial services company is deploying machine learning models to automate fraud detection but wants to ensure continuous model accuracy and compliance with regulatory standards. The data science team is exploring AWS services that can help in monitoring machine learning models and incorporating human review processes. Understanding which AWS services are specifically designed to support model monitoring and human oversight will help the team maintain high standards of accuracy and compliance. Which AWS services can be combined to support these requirements? (Select two)",options:["Amazon SageMaker Ground Truth", "Amazon SageMaker Feature Store", "Amazon Augmented AI (Amazon A2I)", "Amazon SageMaker Model Monitor", "Amazon SageMaker Data Wrangler"],answer:[3, 2],explanation:"Amazon SageMaker Model Monitor Amazon SageMaker Model Monitor is a service that continuously monitors the quality of machine learning models in production and helps detect data drift, model quality issues, and anomalies. It ensures that models perform as expected and alerts users to issues that might require human intervention. Amazon Augmented AI (Amazon A2I) Amazon Augmented AI (A2I) is a service that helps implement human review workflows for machine learning predictions. It integrates human judgment into ML workflows, allowing for reviews and corrections of model predictions, which is critical for applications requiring high accuracy and accountability. 'via -'https://docs.aws.amazon.com/sagemaker/latest/dg/a2i-use-augmented-ai-a2i-human-review-loops.html"},
{id:197,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A company has implemented a chatbot powered by Amazon Bedrock to handle customer inquiries and support requests. While the chatbot is effective at providing automated responses, the company has noticed that some of the replies do not consistently match its desired tone N\u0303 professional, empathetic, and friendly. To maintain brand consistency and ensure a positive customer experience, the company needs to align the chatbot's responses with its specific communication style and standards. Which approach would be most effective for ensuring that the chatbot's responses are consistently aligned with the company's tone and style?",options:["The company should set a low limit on the number of tokens, which restricts the length of the chatbot's responses, thereby making the chatbot's responses consistent", "The company should adjust the temperature to reduce the randomness and creativity of the chatbot's responses", "The company should iteratively test and adjust the chatbot prompts to ensure that its outputs consistently reflect the company's tone and style", "The company should use batch inferencing, a method that processes multiple input requests in one go to make the chatbot's responses consistent"],answer:2,explanation:"The company should iteratively test and adjust the chatbot prompts to ensure that its outputs consistently reflect the company's tone and style This is the correct approach because it directly focuses on fine-tuning the chatbot's behavior via prompt engineering. Experimenting with and refining the prompt allows the company to guide the chatbot towards generating responses that are aligned with its specific tone and communication style. This process involves providing clear instructions or examples in the prompt and making iterative adjustments based on the chatbot's output until the desired tone is achieved."},
{id:198,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A robotics company is developing an AI system to improve the autonomous navigation of its robots. The team is exploring Deep Learning to enhance the system's ability to recognize and respond to its environment. To ensure the AI model performs well, the team needs to understand how model training works in Deep Learning, specifically the process through which the model learns from large datasets by adjusting its internal parameters. This understanding is essential to optimize the model for real-time decision-making. How does model training work in Deep Learning?",options:["Model training in deep learning involves manually setting the weights and biases of a neural network based on predefined rules", "Model training in deep learning involves using large datasets to adjust the weights and biases of a neural network through multiple iterations, using techniques such as gradient descent to minimize the error", "Model training in deep learning involves only the use of support vector machines and decision trees to create predictive models", "Model training in deep learning requires no data; the neural network automatically learns from predefined algorithms without any input"],answer:1,explanation:"Model training in deep learning involves using large datasets to adjust the weights and biases of a neural network through multiple iterations, using techniques such as gradient descent to minimize the error In Deep Learning, model training involves feeding large datasets into the neural network and adjusting the weights and biases through multiple iterations. Techniques such as gradient descent are used to minimize the error by computing the gradient of the loss function and updating the weights to reduce the prediction error. Model training in deep learning involves initializing a neural network, feeding it data, calculating losses, adjusting weights using optimization algorithms, and iterating through this process until the model achieves satisfactory performance. Proper data preparation, validation, and hyperparameter tuning are crucial steps to ensure the model generalizes well to new, unseen data."},
{id:199,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A financial services company is building a machine learning model to predict loan defaults, but the data science team is struggling to find the right balance between model complexity and accuracy. They are aware of the bias-variance trade-off, as understanding this trade-off is critical for optimizing the model's performance and ensuring it generalizes well. What is the bias versus variance trade-off in machine learning?",options:["The bias versus variance trade-off refers to the balance between underfitting and overfitting, where high bias leads to overfitting and high variance leads to underfitting", "The bias versus variance trade-off involves choosing between a model with high complexity that may capture more noise (high bias) and a simpler model that may generalize better but miss important patterns (high variance)", "The bias versus variance trade-off is a technique used to improve model performance by increasing both bias and variance simultaneously to achieve better generalization", "The bias versus variance trade-off refers to the challenge of balancing the error due to the model's complexity (variance) and the error due to incorrect assumptions in the model (bias), where high bias can cause underfitting and high variance can cause overfitting"],answer:3,explanation:"The bias versus variance trade-off refers to the challenge of balancing the error due to the model's complexity (variance) and the error due to incorrect assumptions in the model (bias), where high bias can cause underfitting and high variance can cause overfitting The bias versus variance trade-off in machine learning is about finding a balance between bias (error due to overly simplistic assumptions in the model, leading to underfitting) and variance (error due to the model being too sensitive to small fluctuations in the training data, leading to overfitting). The goal is to achieve a model that generalizes well to new data."},
{id:200,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is using Amazon Bedrock and it wants to set an upper limit on the number of tokens returned in the model's response. Which of the following inference parameters would you recommend for the given use case?",options:["Top K", "Top P", "Response length", "Stop sequence"],answer:2,explanation:"Response length Response length represents the minimum or maximum number of tokens to return in the generated response. 'via -'https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html"},
{id:201,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A machine learning team at a tech company is developing a generative AI model to automate text generation for customer support. As part of optimizing the model's performance, the team needs to adjust both model parameters and hyperparameters but wants to clearly understand the distinctions between the two. Understanding these differences is crucial for fine-tuning the model and improving its output. Which of the following highlights the key differences between model parameters and hyperparameters in the context of generative AI?",options:["Both Hyperparameters and model parameters are values that can be adjusted for model customization to control the training process", "Model parameters are values that define a model and its behavior in interpreting input and generating responses. Hyperparameters are values that can be adjusted for model customization to control the training process", "Hyperparameters are values that define a model and its behavior in interpreting input and generating responses. Model parameters are values that can be adjusted for model customization to control the training process", "Both Hyperparameters and model parameters are values that define a model and its behavior in interpreting input and generating responses"],answer:1,explanation:"Model parameters are values that define a model and its behavior in interpreting input and generating responses. Hyperparameters are values that can be adjusted for model customization to control the training process Hyperparameters are values that can be adjusted for model customization to control the training process and, consequently, the output custom model. In other words, hyperparameters are external configurations set before the training process begins. They control the training process and the structure of the model but are not adjusted by the training algorithm itself. Examples include the learning rate, the number of layers in a neural network, etc. Model parameters are values that define a model and its behavior in interpreting input and generating responses. Model parameters are controlled and updated by providers. You can also update model parameters to create a new model through the process of model customization. In other words, Model parameters are the internal variables of the model that are learned and adjusted during the training process. These parameters directly influence the output of the model for a given input. Examples include the weights and biases in a neural network. 'via -'https://docs.aws.amazon.com/bedrock/latest/userguide/key-definitions.html"},
{id:202,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"An insurance company is transitioning to AWS Cloud and wants to use Amazon Bedrock for product recommendations. The company wants to supplement organization-specific information to the underlying Foundation Model (FM). Which of the following represents the best-fit solution for the given use case?",options:["Implement Reinforcement Learning from Human Feedback (RLHF) in Amazon Bedrock by leveraging the contextual information from the company's private data", "Use Knowledge Bases for Amazon Bedrock to supplement contextual information from the company's private data to the FM using Retrieval Augmented Generation (RAG)", "Use Knowledge Bases for Amazon Bedrock to supplement contextual information from the company's private data to the FM using Reinforcement Learning from Human Feedback (RLHF)", "Fine-tune the base Foundation Model (FM) used by Amazon Bedrock by leveraging the contextual information from the company's private data"],answer:1,explanation:"Use Knowledge Bases for Amazon Bedrock to supplement contextual information from the company's private data to the FM using Retrieval Augmented Generation (RAG) With the comprehensive capabilities of Amazon Bedrock, you can experiment with a variety of top FMs, customize them privately with your data using techniques such as fine-tuning and retrieval-augmented generation (RAG), and create managed agents that execute complex business tasks'from booking travel and processing insurance claims to creating ad campaigns and managing inventory'all without writing any code. Using Knowledge Bases for Amazon Bedrock, you can provide foundation models with contextual information from your company's private data for Retrieval Augmented Generation (RAG), enhancing response relevance and accuracy. This fully managed feature handles the entire RAG workflow, eliminating the need for custom data integrations and management. 'via -'https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html"},
{id:203,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A social media company is implementing an AI-driven content recommendation system to enhance user engagement. During testing, the data science team notices that the AI suggests content differently based on user demographics, leading to concerns about whether the model is treating all users fairly. The team wants to ensure the system avoids any form of bias and complies with ethical AI standards. To better understand this issue, they need a clear example of algorithmic bias to recognize and address it in their system. Which of the following scenarios best illustrates algorithmic bias?",options:["A hiring algorithm consistently prefers candidates from a particular gender, even though the candidates' qualifications are similar across genders", "A human resources manager hires candidates based on personal interviews without considering their resumes", "A weather prediction model occasionally makes incorrect forecasts due to random fluctuations in weather patterns", "A customer service representative resolves complaints based on their judgment rather than company policy"],answer:0,explanation:"A hiring algorithm consistently prefers candidates from a particular gender, even though the candidates' qualifications are similar across genders Biases are imbalances in data or disparities in the performance of a model across different groups. Bias may also be introduced by the ML algorithm itself'even with a well-balanced training dataset, the outcomes might favor certain subsets of the data as compared to others. This scenario illustrates algorithmic bias, where the hiring algorithm systematically favors candidates of a particular gender, indicating that there may be a bias in the training data or in the algorithm's design that leads to unequal treatment based on gender."},
{id:204,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A telecom company is seeking to improve the efficiency and effectiveness of its customer service operations by integrating generative AI. The goal is to equip customer service agents with AI-driven tools that can assist in generating accurate, context-aware responses to customer inquiries, offer real-time suggestions, and help automate routine tasks. The company is evaluating several generative AI solutions to determine which one best fits their need for enhancing customer service interactions. Which of the following is the best fit for this use case?",options:["Amazon Q in Connect", "Amazon Q Developer", "Amazon Q in QuickSight", "Amazon Q Business"],answer:0,explanation:"Amazon Q in Connect Amazon Connect is the contact center service from AWS. Amazon Q helps customer service agents provide better customer service. Amazon Q in Connect uses real-time conversation with the customer along with relevant company content to automatically recommend what to say or what actions an agent should take to better assist customers."},
{id:205,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A financial services company is deploying AI systems on AWS to analyze customer transactions and detect fraud. To meet stringent regulatory requirements, the company's compliance team needs a tool that can continuously audit AWS usage, automate evidence collection, and streamline risk assessments. This tool should help ensure that the AI systems comply with industry standards and reduce the manual effort involved in compliance reporting. Which AWS tool meets these requirements?",options:["AWS Artifact", "AWS CloudTrail", "AWS Audit Manager", "AWS Trusted Advisor"],answer:2,explanation:"AWS Audit Manager AWS Audit Manager helps automate the collection of evidence to continuously audit your AWS usage. It simplifies the process of assessing risk and compliance with regulations and industry standards, making it an essential tool for governance in AI systems."},
{id:206,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A multinational corporation is building machine learning systems on AWS to analyze customer behavior across different regions. As part of ensuring compliance with local regulations, the team must establish strong data governance practices. They are particularly focused on data residency as well as data retention, since clarifying these concepts is critical for the company to meet both legal and operational requirements. Given this context, what is the primary difference between data residency and data retention?",options:["Data residency determines the duration for which data is kept, while data retention specifies the geographical location where data is stored", "Data residency is concerned with the physical location of data storage, whereas data retention defines the policies for how long data should be stored and maintained", "Data residency involves setting access controls for data, while data retention is about monitoring real-time data usage", "Data residency focuses on data encryption and security, while data retention deals with data transformation and processing policies"],answer:1,explanation:"Data residency is concerned with the physical location of data storage, whereas data retention defines the policies for how long data should be stored and maintained Data residency refers to the geographical or physical location where data is stored, which is crucial for compliance with regional laws and regulations. Data retention, on the other hand, involves policies and practices related to how long data should be kept, archived, or deleted, ensuring that data is available when needed and disposed of when no longer required."},
{id:207,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A healthcare analytics company is exploring the use of Foundation Models to automate the process of labeling vast amounts of medical data, such as patient records and clinical notes, to enhance its machine learning models for diagnosis and treatment recommendations. The company wants to understand the specific techniques that Foundation Models use to generate labels from raw input data, helping streamline the data annotation process without requiring extensive manual effort. Which of the following techniques is used by Foundation Models to create labels from input data?",options:["Self-supervised learning", "Reinforcement learning", "Unsupervised learning", "Supervised learning"],answer:0,explanation:"Self-supervised learning It works when models are provided vast amounts of raw, almost entirely, or completely unlabeled data and then generate the labels themselves. Foundation models use self-supervised learning to create labels from input data. In self-supervised learning, models are provided vast amounts of raw completely unlabeled data and then the models generate the labels themselves. This means no one has instructed or trained the model with labeled training data sets."},
{id:208,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A media company is exploring cutting-edge AI models to automate tasks such as content generation and language translation. The development team is particularly interested in using Transformer models due to their efficiency and performance in natural language processing tasks. To make an informed decision, the team needs to identify which models belong to the Transformer architecture and how they can be applied to their use cases. Which of the following is an example of a Transformer model?",options:["ChatGPT", "DALL-E", "Stable Diffusion", "Adobe Firefly"],answer:0,explanation:"ChatGPT ChatGPT or Chat Generative Pretrained Transformer is an example of a Transformer model. Transformer-based models use a self-attention mechanism. They weigh the importance of different parts of an input sequence when processing each element in the sequence. To understand how transformer-based models work, imagine a sentence as a sequence of words. Self-attention helps the model focus on the relevant words as it processes each word. To capture different types of relationships between words, the transformer-based generative model employs multiple encoder layers called attention heads. Each head learns to attend to different parts of the input sequence. This allows the model to simultaneously consider various aspects of the data."},
{id:209,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is using a Large Language Model (LLM) on Amazon Bedrock and it wants to regulate the creativity of the model's output. Which of the following inference parameters would you recommend for the given use case?",options:["Top P", "Top K", "Stop sequences", "Temperature"],answer:3,explanation:"Temperature LLMs on Amazon Bedrock come with several inference parameters that you can set to control the response from the models. Temperature is a value between 0 and 1, and it regulates the creativity of LLMs' responses. Use a lower temperature if you want more deterministic responses, and use a higher temperature if you want creative or different responses for the same prompt from LLMs on Amazon Bedrock. via -'https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html"},
{id:210,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A retail company is exploring advanced AI solutions to enhance customer experience by integrating both visual and textual data for tasks such as product recommendations, automated image tagging, and customer support. The team is considering using multimodal models, which can process and understand multiple types of input data, but they need a clear understanding of how these models work and their key advantages. To help make an informed decision, the company wants to clarify the capabilities of multimodal models. Which of the following summarizes the capabilities of a multimodal model?",options:["A multimodal model can accept a mix of input types such as audio/text and create a mix of output types such as video/image", "A multimodal model can accept a mix of input types such as audio/text, however, it can only create a single type of output", "A multimodal model can accept only a single type of input and it can only create a single type of output", "A multimodal model can accept only a single type of input, however, it can create a mix of output types such as video/image"],answer:0,explanation:"A multimodal model can accept a mix of input types such as audio/text and create a mix of output types such as video/image A multimodal model is an artificial intelligence system designed to process and understand multiple types of data, such as text, images, audio, and video. Unlike unimodal models, which handle a single type of data, multimodal models can integrate and make sense of information from various sources, allowing them to perform more complex and versatile tasks. Multimodal models represent a significant advancement in AI, enabling the integration and understanding of multiple types of data. By combining different modalities, these models can perform a wide range of complex tasks, making them highly versatile and powerful tools in various fields."},
{id:211,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"msq",question:"A healthcare company is developing a machine learning model to analyze medical images and patient records to assist with diagnostics. The team has access to a large amount of unlabeled data and a smaller set of labeled data, and they are considering using semi-supervised learning to maximize the utility of both datasets. To make an informed decision on the approach, the data science team wants to understand which methods fall under semi-supervised learning. Which of the following are examples of semi-supervised learning? (Select two)",options:["Clustering", "Sentiment analysis", "Neural network", "Dimensionality reduction", "Fraud identification"],answer:[1, 4],explanation:"Semi-supervised learning is when you apply both supervised and unsupervised learning techniques to a common problem. This technique relies on using a small amount of labeled data and a large amount of unlabeled data to train systems. First, the labeled data is used to partially train the machine learning algorithm. After that, the partially trained algorithm labels the unlabeled data. This process is called pseudo-labeling. The model is then re-trained on the resulting data mix without being explicitly programmed. 'via -'https://aws.amazon.com/compare/the-difference-between-machine-learning-supervised-and-unsupervised/ Fraud identification Within a large set of transactional data, there's a subset of labeled data where experts have confirmed fraudulent transactions. For a more accurate result, the machine learning solution would train first on the unlabeled data and then with the labeled data. Sentiment analysis When considering the breadth of an organization's text-based customer interactions, it may not be cost-effective to categorize or label sentiment across all channels. An organization could train a model on the larger unlabeled portion of data first, and then a sample that has been labeled. This would provide the organization with a greater degree of confidence in customer sentiment across the business."},
