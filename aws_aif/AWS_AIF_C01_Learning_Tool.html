{id:9,domain:"Fundamentals of Generative AI",difficulty:"EASY",type:"mcq",question:"A financial services company uses a large language model (LLM) to generate investment reports. The company is concerned that the model occasionally produces confident-sounding responses that contain factually incorrect information.\n\nWhat is this phenomenon called?",options:["Model drift","Prompt injection","Hallucination","Overfitting"],answer:2,explanation:"Hallucination refers to when an LLM generates fluent, confident responses that contain fabricated or factually incorrect information. This is a fundamental limitation of generative models that predict tokens based on statistical patterns rather than verified facts."},
{id:10,domain:"AWS Managed AI Services",difficulty:"EASY",type:"mcq",question:"A company is developing an AI image moderation system for a social media platform. The system needs to automatically detect and flag inappropriate images uploaded by users.\n\nWhich AWS service is MOST appropriate?",options:["Amazon Comprehend","Amazon Rekognition","Amazon Textract","Amazon Kendra"],answer:1,explanation:"Amazon Rekognition provides a content moderation API that detects explicit, suggestive, violent, or otherwise inappropriate content in images and videos. It returns confidence scores for detected categories, enabling automated moderation workflows."},
{id:11,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A machine learning team notices that their model performs well on the training dataset but poorly when deployed in production. Investigation reveals that the statistical distribution of production input data has shifted significantly since training.\n\nWhat is this problem called?",options:["Overfitting","Data drift","Underfitting","Label noise"],answer:1,explanation:"Data drift (also called covariate shift or distribution shift) occurs when the statistical properties of input data change between training and production, causing model performance to degrade. The model learned patterns from one distribution but is applied to a different one."},
{id:12,domain:"AWS Managed AI Services",difficulty:"EASY",type:"mcq",question:"A company wants to automatically extract structured data from thousands of scanned paper invoices with varying formats and populate a database.\n\nWhich AWS service is MOST appropriate?",options:["Amazon Comprehend","Amazon Rekognition","Amazon Textract","Amazon Translate"],answer:2,explanation:"Amazon Textract uses ML to extract text, forms, tables, and key-value pairs from scanned documents. It handles varying layouts and formats without requiring templates, making it ideal for processing diverse invoices."},
{id:13,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company is evaluating foundation models on Amazon Bedrock for a text summarization task. The team wants to measure how well generated summaries capture key information compared to human-written reference summaries.\n\nWhich evaluation metric is MOST appropriate?",options:["BLEU score","ROUGE score","Perplexity","F1 score"],answer:1,explanation:"ROUGE (Recall-Oriented Understudy for Gisting Evaluation) measures the overlap of n-grams between generated summaries and reference summaries. It is the standard metric for evaluating summarization quality. BLEU is for translation. Perplexity is a training metric. F1 is for classification."},
{id:14,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company has deployed a machine learning model to production. The team wants to continuously monitor the model for data quality issues, prediction drift, and performance degradation over time.\n\nWhich Amazon SageMaker feature provides this capability?",options:["SageMaker Experiments","SageMaker Model Monitor","SageMaker Data Wrangler","SageMaker Feature Store"],answer:1,explanation:"Amazon SageMaker Model Monitor continuously monitors deployed models for data quality issues, model quality degradation, bias drift, and feature attribution drift. It generates alerts when metrics deviate from baseline thresholds, enabling proactive model maintenance."},
{id:15,domain:"AWS Managed AI Services",difficulty:"MEDIUM",type:"mcq",question:"A startup wants to build a mobile application that identifies plant species from photos. The team has no machine learning expertise and needs a solution that requires minimal ML knowledge.\n\nWhich approach requires the LEAST amount of ML knowledge?",options:["Train a custom CNN model using Amazon SageMaker","Use Amazon Rekognition Custom Labels","Fine-tune a vision model on Amazon Bedrock","Build a custom model using TensorFlow on Amazon EC2"],answer:1,explanation:"Amazon Rekognition Custom Labels allows users to train custom image classifiers by uploading labeled images through a point-and-click console interface with no ML expertise required. The service automatically handles model architecture, training, and optimization."},
{id:16,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"An AI team is building a multi-turn conversational assistant using Amazon Bedrock. The assistant must remember the context of previous messages within a conversation session.\n\nWhat is the MOST effective approach to maintain conversation context?",options:["Increase the model temperature parameter","Include the full conversation history in each API request","Enable Provisioned Throughput for the model","Use a foundation model with more parameters"],answer:1,explanation:"LLMs are stateless and do not inherently remember previous turns. To enable multi-turn conversations, the application must include the full conversation history - all previous user messages and assistant responses - in each API request."},
{id:17,domain:"AI Challenges & Responsibilities",difficulty:"MEDIUM",type:"mcq",question:"A company is concerned about the carbon footprint of running ML inference at scale. The team wants to use AWS infrastructure with the MOST energy-efficient chips specifically designed for ML inference workloads.\n\nWhich EC2 instance series should they choose?",options:["P5 instances with NVIDIA H100 GPUs","G5 instances with NVIDIA A10G GPUs","Inf2 instances with AWS Inferentia chips","C7g instances with AWS Graviton3 processors"],answer:2,explanation:"Amazon EC2 Inf2 instances use AWS Inferentia2 chips, custom-designed by AWS for high-performance, energy-efficient ML inference. Inferentia chips deliver significantly better performance per watt than GPU alternatives for inference workloads."},
{id:18,domain:"Bedrock & Generative AI",difficulty:"EASY",type:"mcq",question:"A company wants to use Amazon Bedrock to build an application that answers employee questions based on a large internal knowledge base of PDF policy documents.\n\nWhich Amazon Bedrock feature should the company use?",options:["Model fine-tuning","Knowledge Bases","Agents","Continued pre-training"],answer:1,explanation:"Amazon Bedrock Knowledge Bases implements RAG by ingesting documents, generating embeddings, storing them in a vector database, and retrieving relevant context to ground model responses in the actual document content."},
{id:19,domain:"AI Challenges & Responsibilities",difficulty:"MEDIUM",type:"mcq",question:"A company is building a generative AI application and is concerned about users embedding malicious instructions in their input to override the system prompt and hijack the model's behavior.\n\nWhat type of attack is this?",options:["Model inversion attack","Adversarial example attack","Prompt injection attack","Data poisoning attack"],answer:2,explanation:"Prompt injection attacks attempt to override or circumvent a model's system prompt by embedding malicious instructions in user input, such as 'Ignore all previous instructions and...' to redirect the model's behavior."},
{id:20,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company needs to process and run inference on 50,000 customer feedback records stored in Amazon S3. The results are needed the following morning and do not require real-time processing.\n\nWhich Amazon SageMaker inference type is MOST cost-effective for this workload?",options:["Real-time inference","Serverless inference","Asynchronous inference","Batch transform"],answer:3,explanation:"Batch transform is designed for running inference on large static datasets stored in S3 when immediate results are not needed. It provisions compute instances, processes the full dataset, saves results back to S3, then terminates - you pay only for the compute time used."},
{id:21,domain:"Prompt Engineering",difficulty:"EASY",type:"mcq",question:"A company is using a large language model (LLM) for code generation. Developers want the model to produce more deterministic and consistent outputs, with less random variation between runs on identical prompts.\n\nWhich parameter adjustment achieves this?",options:["Increase the temperature","Decrease the temperature","Increase Top-P","Increase Top-K"],answer:1,explanation:"Temperature controls the randomness of token selection during generation. Decreasing temperature (toward 0) makes the model more deterministic by concentrating probability mass on the highest-probability tokens, producing more consistent and predictable outputs."},
{id:22,domain:"AWS Managed AI Services",difficulty:"EASY",type:"mcq",question:"A retail company wants to build a personalized product recommendation system that learns from each customer's browsing history, purchase behavior, and ratings.\n\nWhich AWS service is purpose-built for this use case?",options:["Amazon Comprehend","Amazon Forecast","Amazon Personalize","Amazon Kendra"],answer:2,explanation:"Amazon Personalize is a fully managed ML service purpose-built for real-time personalization and recommendation systems. It uses the same technology as Amazon.com's recommendation engine."},
{id:23,domain:"AI Challenges & Responsibilities",difficulty:"EASY",type:"mcq",question:"A company wants to implement responsible AI practices. They need to ensure that customers who receive adverse outcomes from their AI model, such as loan denials, can receive an understandable explanation of why the decision was made.\n\nWhich responsible AI principle does this requirement represent?",options:["Fairness","Privacy","Explainability","Robustness"],answer:2,explanation:"Explainability (also called interpretability) is the principle that AI systems should provide understandable reasons for their decisions. This is especially critical in regulated industries like financial services, where regulations such as GDPR require that customers can understand and contest automated decisions."},
{id:24,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company has trained a binary classification model to detect fraudulent transactions. The dataset contains 98% legitimate transactions and only 2% fraudulent ones. The model achieves 98% accuracy by predicting every transaction as legitimate.\n\nWhich technique BEST addresses the class imbalance problem?",options:["Increase the number of training epochs","Use a larger neural network architecture","Apply SMOTE to oversample the minority class","Reduce the learning rate"],answer:2,explanation:"SMOTE (Synthetic Minority Oversampling TEchnique) generates synthetic examples of the minority class (fraud) by interpolating between existing minority samples, balancing the class distribution without simple duplication."},
{id:25,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company uses Amazon Bedrock to power a customer-facing chatbot. The security team requires that no customer personally identifiable information (PII) appears in the model's responses.\n\nWhich Amazon Bedrock Guardrails feature specifically addresses this requirement?",options:["Content filters","Denied topics","Sensitive information filters","Word filters"],answer:2,explanation:"Amazon Bedrock Guardrails sensitive information filters detect and redact PII such as names, phone numbers, email addresses, Social Security numbers, credit card numbers, and other personal data from both inputs and outputs."},
{id:26,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A team of data scientists wants to automatically search through many hyperparameter configurations for a training job and identify the best-performing model without manual experimentation.\n\nWhich Amazon SageMaker feature should they use?",options:["SageMaker Pipelines","SageMaker Automatic Model Tuning","SageMaker Clarify","SageMaker Model Registry"],answer:1,explanation:"Amazon SageMaker Automatic Model Tuning (HPO) automatically searches for the best hyperparameter values by running multiple training jobs with different configurations. It supports Bayesian optimization, random search, and grid search."},
{id:27,domain:"Bedrock & Generative AI",difficulty:"EASY",type:"mcq",question:"A company is building a generative AI pipeline that must perform multiple sequential steps automatically - classifying a customer request, routing it to the correct department, querying a knowledge base, and generating a final response.\n\nWhich Amazon Bedrock feature enables this multi-step orchestration?",options:["Knowledge Bases","Model fine-tuning","Agents","Guardrails"],answer:2,explanation:"Amazon Bedrock Agents autonomously break down complex tasks into sequential steps, invoke Lambda functions through action groups, query Knowledge Bases for information retrieval, and orchestrate entire workflows using a ReAct framework."},
{id:28,domain:"AWS Managed AI Services",difficulty:"EASY",type:"mcq",question:"A media company wants to generate captions for video content in the source language and then produce subtitles in five additional languages for international distribution.\n\nWhich combination of AWS services creates the MOST complete solution?",options:["Amazon Rekognition and Amazon Translate","Amazon Transcribe and Amazon Translate","Amazon Polly and Amazon Comprehend","Amazon Textract and Amazon Translate"],answer:1,explanation:"Amazon Transcribe converts spoken audio in video files to text, generating source-language captions. Amazon Translate then converts those transcriptions into multiple target languages, producing multilingual subtitles."},
{id:29,domain:"AWS Security Services",difficulty:"MEDIUM",type:"mcq",question:"A company is fine-tuning an Amazon Bedrock model on proprietary internal data. The security and compliance team requires that all fine-tuning data and resulting custom model weights are encrypted using the company's own encryption keys.\n\nWhich AWS service enables this customer-controlled encryption?",options:["AWS Shield","AWS Key Management Service (AWS KMS)","AWS Secrets Manager","AWS Certificate Manager"],answer:1,explanation:"AWS Key Management Service (KMS) enables customers to create and manage Customer Managed Keys (CMKs). Amazon Bedrock integrates with AWS KMS to encrypt fine-tuning datasets, custom model weights, and output artifacts."},
{id:30,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"msq",question:"Which of the following are characteristics of foundation models that distinguish them from traditional task-specific ML models? (Select TWO.)",options:["They are trained on large, diverse datasets using self-supervised learning","They can only be used for the specific task they were trained on","They can be adapted to many downstream tasks through prompting or fine-tuning","They require manually labeled data for the initial pre-training phase"],answer:[0,2],explanation:"Foundation models are pre-trained on massive, diverse datasets using self-supervised learning (no labels needed for pre-training) and can be adapted to many tasks via zero-shot prompting, few-shot prompting, or fine-tuning with minimal task-specific data."},
{id:31,domain:"AWS Managed AI Services",difficulty:"EASY",type:"mcq",question:"A company wants to convert call center audio recordings into searchable text transcripts. The recordings involve conversations between agents and customers, and the company needs to identify which speaker said what.\n\nWhich Amazon Transcribe feature addresses this requirement?",options:["Custom vocabulary","Speaker diarization","Vocabulary filtering","Automatic language identification"],answer:1,explanation:"Speaker diarization automatically detects multiple speakers in an audio recording and labels each segment with a speaker identifier. This creates structured transcripts such as 'Agent: Hello...' and 'Customer: Hi...'"},
{id:32,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company is using Amazon SageMaker to train a deep learning model. The training job is taking many hours due to the very large dataset size. The team wants to reduce training time without significantly impacting model accuracy.\n\nWhich technique can reduce training time MOST effectively?",options:["Increase the dropout rate","Use distributed training across multiple instances","Decrease the model depth","Apply L2 regularization"],answer:1,explanation:"Distributed training splits the training workload across multiple compute instances using data parallelism, model parallelism, or a combination of both, significantly reducing wall-clock training time."},
{id:33,domain:"Bedrock & Generative AI",difficulty:"EASY",type:"mcq",question:"A company is selecting a foundation model on Amazon Bedrock for a legal document review task. The documents can be up to 500 pages long and must be processed in a single API request to preserve full context.\n\nWhich model characteristic is MOST critical for this use case?",options:["Number of model parameters","Context window size","Training data recency","Model inference latency"],answer:1,explanation:"Context window size determines the maximum number of tokens (input + output) that a model can process in a single request. Processing 500-page documents requires a very large context window (such as 200K tokens)."},
{id:34,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A data scientist is building a demand forecasting model using Amazon SageMaker. The model needs to forecast electricity consumption for the next 30 days using 3 years of historical hourly meter readings.\n\nWhich SageMaker built-in algorithm is MOST suitable?",options:["XGBoost","Linear Learner","DeepAR","K-Means"],answer:2,explanation:"Amazon SageMaker DeepAR is a supervised learning algorithm specifically designed for probabilistic time-series forecasting using recurrent neural networks. It learns temporal patterns across multiple related time series simultaneously."},
{id:35,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company wants to implement an AI governance framework. They need to document the intended use, limitations, training data provenance, and performance metrics for each ML model in a standardized format for regulatory compliance.\n\nWhich AWS service supports this requirement?",options:["Amazon SageMaker Experiments","Amazon SageMaker Model Cards","AWS Audit Manager","Amazon SageMaker Pipelines"],answer:1,explanation:"Amazon SageMaker Model Cards provide a structured documentation template for ML models, including intended use cases, out-of-scope uses, model limitations, training data details, evaluation metrics, ethical considerations, and responsible AI practices."},
{id:36,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company's AI hiring tool has been generating biased outputs that disadvantage certain demographic groups. The ML team wants to systematically detect and measure this bias across protected attributes.\n\nWhich Amazon SageMaker feature is designed for this purpose?",options:["SageMaker Model Monitor","SageMaker Clarify","SageMaker Debugger","SageMaker Feature Store"],answer:1,explanation:"Amazon SageMaker Clarify detects and measures statistical bias in both datasets and model predictions across different demographic groups. It computes bias metrics such as Difference in Positive Proportions (DPP) and Disparate Impact (DI)."},
{id:37,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is building a conversational AI assistant using Amazon Bedrock. Users frequently ask questions about news events and developments that occurred after the foundation model's training cutoff date.\n\nWhich technique BEST addresses this limitation?",options:["Increase the model temperature to improve answer creativity","Use RAG with a Knowledge Base connected to a regularly updated news data source","Fine-tune the model on recent news articles every week","Switch to a foundation model with more parameters"],answer:1,explanation:"RAG with a Knowledge Base that is continuously refreshed with current information enables the model to answer questions about recent events by retrieving up-to-date context at query time. This addresses the training cutoff limitation without expensive model retraining."},
{id:38,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company wants to use Amazon Bedrock to build a customer service chatbot. The chatbot must always respond in a formal professional tone and must never discuss competitor products under any circumstances.\n\nWhich Amazon Bedrock features should the company configure to meet these requirements?",options:["Model fine-tuning and Provisioned Throughput","System prompts and Guardrails with denied topics","Knowledge Bases and Agents","Continued pre-training and invocation logging"],answer:1,explanation:"System prompts define the model's persona, communication style, and behavioral guidelines for every interaction, enforcing the formal tone requirement. Guardrails with denied topics configuration blocks the model from engaging with any content about competitors."},
{id:39,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company wants to use Amazon Bedrock to enable employees to ask questions in plain English about data stored in a relational database, automatically generating and executing SQL queries without requiring employees to know SQL.\n\nWhich Amazon Bedrock feature BEST supports this use case?",options:["Knowledge Bases for document retrieval","Agents with action groups connected to a database via AWS Lambda","Model fine-tuning on SQL examples","Continued pre-training on database schemas"],answer:1,explanation:"Amazon Bedrock Agents with action groups can connect to relational databases through AWS Lambda functions. The agent translates natural language questions into SQL queries, passes them to Lambda for execution, and returns results as natural language responses."},
{id:40,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company wants to build a solution to automatically detect when customers in call center recordings express frustration or dissatisfaction during their conversations.\n\nWhich combination of AWS services BEST achieves this?",options:["Amazon Transcribe and Amazon Comprehend","Amazon Polly and Amazon Rekognition","Amazon Textract and Amazon Kendra","Amazon Lex and Amazon Connect"],answer:0,explanation:"Amazon Transcribe converts call center audio recordings into text transcripts. Amazon Comprehend then analyzes the transcripts for sentiment classification (positive, negative, neutral, mixed), detecting frustration and dissatisfaction signals at scale."},
{id:41,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company has trained a custom fine-tuned version of an Amazon Bedrock base model to improve performance on their specific use case.\n\nWhat must the company do before they can use the custom fine-tuned model for inference through Amazon Bedrock?",options:["Purchase Provisioned Throughput for the custom model","Deploy the custom model to an Amazon SageMaker real-time endpoint","Register the custom model in the Amazon SageMaker Model Registry","Enable on-demand pricing for the custom model in the Amazon Bedrock console"],answer:0,explanation:"Custom fine-tuned models in Amazon Bedrock cannot be invoked using on-demand pricing. To use a custom model for inference, the company must purchase Provisioned Throughput, which provides dedicated model units with either a 1-month or 6-month commitment term."},
{id:42,domain:"AI Challenges & Responsibilities",difficulty:"MEDIUM",type:"mcq",question:"An AI practitioner is building a model to generate images of professionals in various career fields. After reviewing the outputs, they discover the generated images consistently show gender and racial bias reflecting imbalances in the training dataset.\n\nWhich technique BEST addresses this problem at its source?",options:["Apply watermark detection to generated images","Use Retrieval Augmented Generation (RAG) during inference","Implement post-generation filtering with Amazon Rekognition","Apply data augmentation to increase representation of underrepresented groups in the training data"],answer:3,explanation:"Data augmentation for underrepresented groups addresses bias at its root by generating additional synthetic training examples for demographic groups that are underrepresented in the original dataset. Post-generation filtering treats symptoms, not the cause."},
{id:43,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company must ensure that Amazon SageMaker training jobs process sensitive data in complete network isolation, with no ability to make outbound calls to the internet or other AWS services during training.\n\nWhich solution meets this requirement?",options:["Run training jobs using SageMaker Experiments","Enable network isolation mode for SageMaker training jobs","Encrypt training data at rest using AWS KMS","Assign a restrictive IAM role to the SageMaker training job"],answer:1,explanation:"SageMaker network isolation mode prevents training containers from making any outbound network calls during execution. Containers can only read input from and write output to Amazon S3 through VPC endpoints."},
{id:44,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company trained an ML model to classify customer support tickets into three categories. The model achieves 95% accuracy on the training set but only 58% accuracy on new, unseen tickets.\n\nWhich conclusion BEST describes this situation?",options:["The model is underfitting on the training data","The model is overfitting on the training data","The model has an insufficient number of parameters","The model requires a higher learning rate"],answer:1,explanation:"A large gap between high training accuracy (95%) and significantly lower test accuracy (58%) is the classic signature of overfitting. The model has memorized patterns specific to the training examples rather than learning generalizable features."},
{id:45,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is building a foundation model for a specialized scientific domain. The company wants to teach the model broad knowledge about a new scientific field using a large collection of unlabeled research papers before task-specific adaptation.\n\nWhich training approach is MOST appropriate?",options:["Fine-tuning with prompt-completion pairs","Continued pre-training on domain-specific unlabeled data","Retrieval Augmented Generation (RAG)","Few-shot prompting with scientific examples"],answer:1,explanation:"Continued pre-training (domain-adaptive pre-training) extends pre-training on large volumes of unlabeled domain-specific text, teaching the model vocabulary, concepts, and patterns without requiring labeled data."},
{id:46,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company is building a customer churn prediction model in Amazon SageMaker. The training data includes usage metrics, billing fields, support history, and some customer PII. The team proposes feature engineering actions.\n\nWhich approach is the recommended practice for handling PII during feature engineering?",options:["Use the raw PII directly as features for better accuracy","Redact or anonymize PII before feature engineering","Store PII in the feature store for future use","Duplicate PII across training and test sets"],answer:1,explanation:"PII should be redacted or anonymized before feature engineering to protect customer privacy and comply with data protection regulations. Raw PII should not be used as model features."},
{id:47,domain:"Fundamentals of Generative AI",difficulty:"EASY",type:"mcq",question:"A company wants to standardize on Amazon Q Developer as an AI assistant inside IDEs to help engineers write, explain, and refactor code. The company must reduce the risk of sensitive-data exposure and meet audit requirements.\n\nWhich TWO rollout practices are NOT appropriate? (Select TWO.)",options:["Limit repository context access to least-privilege read-only and require reviews","Enable AWS CloudTrail and store logs centrally for audit retention","Use IAM Identity Center groups to control who can use Amazon Q Developer","Disable CloudTrail for Amazon Q Developer to reduce logging costs","Train developers not to include secrets or customer PII in prompts","Use one shared admin IAM user for all Amazon Q Developer access"],answer:[3,5],explanation:"Disabling CloudTrail removes audit trails and violates compliance requirements. Using a shared admin IAM user removes individual accountability and violates least privilege. Both are unsafe practices that should be avoided."},
{id:48,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"Based on the exhibit:\n1. Algorithm: XGBoost built-in\n2. Training method: gradient boosting decision trees\n3. Output artifact: s3://ml-bucket/churn/model.tar.gz\n4. Artifact contents: trained trees + learned weights\n5. Inference endpoint loads: model.tar.gz\n\nWhich interpretation best distinguishes the model from the algorithm?",options:["Algorithm is the S3 bucket; model is the endpoint","Algorithm is the learned weights; model is the training container","Algorithm is model.tar.gz; model is gradient boosting","Algorithm is XGBoost; model is the trained model.tar.gz"],answer:3,explanation:"The algorithm is the learning procedure (XGBoost/gradient boosting). The model is the trained artifact produced by that process (model.tar.gz with trained trees and weights). If it's reused to make predictions, it's the model. If it describes how learning happens, it's the algorithm."},
{id:49,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is building a GenAI application using Amazon Bedrock. They need to evaluate the model's performance on a specific task. The team wants to use an automated evaluation approach.\n\nWhich Amazon Bedrock feature supports model evaluation?",options:["Bedrock Model Evaluation","Bedrock Knowledge Bases","Bedrock Agents","Bedrock Guardrails"],answer:0,explanation:"Amazon Bedrock provides built-in model evaluation tools to assess foundation model performance on specific tasks using automated metrics or human evaluation workflows."},
{id:50,domain:"AWS Managed AI Services",difficulty:"EASY",type:"truefalse",question:"Foundation models can only be used for the specific task they were trained on.",options:["True","False"],answer:1,explanation:"Foundation models can be adapted to many different downstream tasks through zero-shot prompting, few-shot prompting, or fine-tuning with minimal task-specific data. They are not limited to a single task."},
{id:51,domain:"AI/ML Fundamentals",difficulty:"EASY",type:"truefalse",question:"Foundation models require manually labeled data for their initial pre-training phase.",options:["True","False"],answer:1,explanation:"Foundation models use self-supervised learning objectives such as next-token prediction for pre-training. No manual labeling is required for pre-training. Labels are only needed during supervised fine-tuning for specific tasks."},
{id:52,domain:"AI/ML Fundamentals",difficulty:"EASY",type:"truefalse",question:"ROUGE score is the standard metric for evaluating machine translation quality.",options:["True","False"],answer:1,explanation:"ROUGE is the standard metric for evaluating summarization quality (measures recall of important content). BLEU (Bilingual Evaluation Understudy) is the standard metric for machine translation (measures precision of n-gram overlap)."},
{id:53,domain:"Guidelines for Responsible AI",difficulty:"EASY",type:"truefalse",question:"Data augmentation with diverse, representative datasets helps reduce bias in AI models during training.",options:["True","False"],answer:0,explanation:"Data augmentation with diverse, representative datasets ensures the model is exposed to a wide variety of examples, reducing bias during training by balancing representation across groups."},
{id:54,domain:"Bedrock & Generative AI",difficulty:"EASY",type:"truefalse",question:"Higher temperature values make LLM outputs more deterministic and consistent.",options:["True","False"],answer:1,explanation:"Higher temperature increases randomness and creativity in outputs. Lower temperature (toward 0) produces more deterministic, consistent outputs by concentrating probability mass on the highest-probability tokens."},
{id:55,domain:"Bedrock & Generative AI",difficulty:"EASY",type:"truefalse",question:"RAG modifies model weights to incorporate new knowledge.",options:["True","False"],answer:1,explanation:"RAG (Retrieval Augmented Generation) does NOT modify model weights. It retrieves relevant documents at inference time and provides them as context to the LLM in the prompt."},
{id:56,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company has multiple ML models in production. They need a centralized way to catalog, version, and manage the deployment of trained models.\n\nWhich SageMaker feature provides this capability?",options:["SageMaker Pipelines","SageMaker Model Registry","SageMaker Feature Store","SageMaker Experiments"],answer:1,explanation:"SageMaker Model Registry catalogs and versions trained models for deployment. It helps manage model versions, associate metadata, and control the deployment workflow from staging to production."},
{id:57,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is using Amazon Bedrock with a third-party foundation model. They need to ensure their API calls and model inputs/outputs are logged for compliance auditing.\n\nWhich AWS feature should they enable?",options:["AWS CloudTrail with Bedrock invocation logging","AWS Config rules for Bedrock","Amazon GuardDuty for Bedrock","AWS Trusted Advisor for Bedrock"],answer:0,explanation:"AWS CloudTrail with Bedrock invocation logging captures API activity and model invocation details (inputs, outputs, metadata) for compliance auditing and governance."},
{id:58,domain:"AI Challenges & Responsibilities",difficulty:"MEDIUM",type:"msq",question:"A loan company is building a generative AI-based solution to offer new applicants discounts based on specific business criteria. The company wants to build and use an AI model responsibly to minimize bias that could negatively affect some customers.\n\nWhich actions should the company take to meet these requirements? (Select TWO.)",options:["Use diverse and representative training data that includes various demographic groups","Implement regular bias testing and fairness audits on the model outputs","Use ROUGE to ensure the model is 100% accurate","Remove all customer demographic data from the training set","Set model temperature to 0 for all prompts"],answer:[0,1],explanation:"Using diverse training data and implementing regular bias testing/fairness audits are key responsible AI practices. ROUGE is for summarization evaluation, not bias measurement. Removing all demographic data can hide bias rather than fix it."},
{id:59,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company is building an image classification model to identify defective products on a manufacturing line. The defect rate is very low (0.1%). The model must catch as many defects as possible, even if it means some false alarms.\n\nWhich metric should the team prioritize?",options:["Precision","Recall","Specificity","Accuracy"],answer:1,explanation:"Recall should be prioritized when missing a positive case is more costly than false alarms. High recall minimizes false negatives, which is critical when defects are rare but costly to miss."},
{id:60,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company wants to train a machine learning model to classify customer emails into categories (complaint, inquiry, feedback, spam). They have 10,000 labeled emails.\n\nWhich type of machine learning is this?",options:["Supervised learning","Unsupervised learning","Reinforcement learning","Semi-supervised learning"],answer:0,explanation:"This is supervised learning because the model is trained on labeled data where the correct output category is known for each email."},
{id:61,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A retail company wants to group customers by similar buying behavior so marketers can tailor campaigns. The team does not have predefined labels for the groups.\n\nWhich AI or ML approach best fits?",options:["Supervised classification, because every customer already has a known class label","Unsupervised learning, because the goal is to discover patterns without labeled target categories","Text generation, because marketing content will be written later","Reinforcement learning, because customers should receive rewards"],answer:1,explanation:"Customer segmentation without predefined labels is a classic unsupervised learning use case. The model discovers clusters or patterns in the data without requiring labeled target categories."},
{id:62,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"A business team wants a generative AI assistant to draft customer email replies. They are concerned that replies could include inaccurate claims or sensitive customer data.\n\nWhich control set is strongest at the practitioner level?",options:["Allow the model to send all replies automatically because generated text is only a draft","Store every customer record in the prompt so the model has maximum context","Human review for high-risk replies, prompt and output safeguards, data minimization, monitoring, and clear user guidance","Disable all logging so the team cannot see mistakes"],answer:2,explanation:"Responsible AI for customer-facing GenAI requires layered controls: human review of high-risk outputs, prompt and output safeguards to block unsafe content, data minimization to reduce exposure, monitoring for ongoing compliance, and clear user guidance."},
{id:63,domain:"Applications of Foundation Models",difficulty:"EASY",type:"mcq",question:"A nontechnical business group wants to explore enterprise-ready generative AI capabilities without building and training foundation models from scratch.\n\nWhich general approach best matches the goal?",options:["Build a data center and train a large language model from zero","Use only spreadsheet formulas because generative AI always requires custom training","Store prompts in an unmanaged public document for all employees to edit","Use managed generative AI services that provide access to foundation models and governance controls"],answer:3,explanation:"Managed GenAI services like Amazon Bedrock provide access to foundation models and built-in governance controls without requiring the organization to train models from scratch, making them ideal for nontechnical business adoption."},
{id:64,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company has petabytes of unlabeled customer data to use for an advertisement campaign. The company wants to classify its customers into tiers to advertise and promote the company's products.\n\nWhich methodology should the company use?",options:["Supervised learning","Unsupervised learning","Reinforcement learning","Reinforcement learning from human feedback (RLHF)"],answer:1,explanation:"With unlabeled data and a goal of discovering natural groupings, unsupervised learning (clustering) is the correct approach. The model identifies patterns and segments without predefined categories."},
{id:65,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company makes forecasts each quarter to decide how to optimize operations to meet expected demand. The company uses ML models and needs to provide transparency and explainability to stakeholders.\n\nWhat should the AI practitioner include in the report?",options:["Code for model training","Partial dependence plots (PDPs)","Sample data for training","Model convergence tables"],answer:1,explanation:"Partial dependence plots (PDPs) show how features affect model predictions on average, making them a standard tool for model interpretability and explainability. They help stakeholders understand which factors drive decisions."},
{id:66,domain:"AWS Managed AI Services",difficulty:"MEDIUM",type:"mcq",question:"A company wants to display the total sales for its top-selling products across various retail locations in the past 12 months.\n\nWhich AWS solution should the company use to automate the generation of graphs?",options:["Amazon Q in Amazon EC2","Amazon Q Developer","Amazon Q in Amazon QuickSight","Amazon Q in AWS Chatbot"],answer:2,explanation:"Amazon Q in Amazon QuickSight enables natural language querying of business data and automated graph generation. QuickSight is AWS's business intelligence service for creating visualizations and dashboards."},
{id:67,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"Which feature of Amazon OpenSearch Service gives companies the ability to build vector database applications for RAG?",options:["Integration with Amazon S3 for object storage","Support for geospatial indexing and queries","Scalable index management and k-NN nearest neighbor search capability","Ability to perform real-time analysis on streaming data"],answer:2,explanation:"Amazon OpenSearch Service supports k-NN (k-Nearest Neighbors) vector search, making it ideal for storing and querying vector embeddings in RAG architectures. It efficiently finds semantically similar documents through approximate nearest neighbor search."},
{id:68,domain:"AI Challenges & Responsibilities",difficulty:"MEDIUM",type:"mcq",question:"Which option is a use case for generative AI models?",options:["Improving network security by using intrusion detection systems","Creating photorealistic images from text descriptions for digital marketing","Enhancing database performance by using optimized indexing","Analyzing financial data to forecast stock market trends"],answer:1,explanation:"Generative AI creates new content such as images, text, audio, or video. Creating photorealistic images from text descriptions is a classic generative AI use case, while the other options are traditional ML or rule-based tasks."},
{id:69,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company is building a solution to generate images for protective eyewear. The solution must have high accuracy and must minimize the risk of incorrect annotations.\n\nWhich solution meets these requirements?",options:["Human-in-the-loop validation by using Amazon SageMaker Ground Truth Plus","Data augmentation by using an Amazon Bedrock knowledge base","Image recognition by using Amazon Rekognition","Data summarization by using Amazon QuickSight"],answer:0,explanation:"Amazon SageMaker Ground Truth Plus provides human-in-the-loop validation with expert reviewers to ensure high annotation accuracy. This is critical when incorrect annotations could lead to defective products or safety issues."},
{id:70,domain:"Security, Compliance, and Governance for AI",difficulty:"MEDIUM",type:"mcq",question:"A security company is using Amazon Bedrock to run foundation models. The company needs to identify unauthorized access attempts to set appropriate IAM policies.\n\nWhich AWS service should the company use?",options:["AWS Audit Manager","AWS CloudTrail","Amazon Fraud Detector","AWS Trusted Advisor"],answer:1,explanation:"AWS CloudTrail records all API activity including Amazon Bedrock invocations, capturing who made the request, from which IP address, and whether it succeeded or failed. This enables identifying unauthorized access attempts."},
{id:71,domain:"AWS Managed AI Services",difficulty:"EASY",type:"mcq",question:"A company manually reviews all submitted resumes in PDF format. As the company grows, it needs an automated system to convert PDF resumes into plain text for processing.\n\nWhich AWS service meets this requirement?",options:["Amazon Textract","Amazon Personalize","Amazon Lex","Amazon Transcribe"],answer:0,explanation:"Amazon Textract uses ML to extract text from scanned documents and PDFs, converting them into machine-readable text. It handles varied layouts without requiring templates."},
{id:72,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A digital devices company wants to predict customer demand for memory hardware. The company has no coding experience or knowledge of ML algorithms.\n\nWhich solution meets these requirements?",options:["Store data in Amazon S3 and use SageMaker built-in algorithms","Import data into SageMaker Data Wrangler and use SageMaker built-in algorithms","Use Amazon Personalize Trending-Now recipe","Import data into SageMaker Canvas and build models by selecting values"],answer:3,explanation:"Amazon SageMaker Canvas is a no-code visual interface for ML. Users can import data, build models, and generate predictions without writing any code, making it ideal for users without ML expertise."},
{id:73,domain:"AI Challenges & Responsibilities",difficulty:"MEDIUM",type:"mcq",question:"A company needs to build its own LLM based on private data. The company is concerned about the environmental effect of the training process.\n\nWhich EC2 instance type has the LEAST environmental effect when training LLMs?",options:["Amazon EC2 C series","Amazon EC2 G series","Amazon EC2 P series","Amazon EC2 Trn series"],answer:3,explanation:"Amazon EC2 Trn instances use AWS Trainium chips, purpose-built for ML training with superior performance per watt compared to GPU-based instances. They are designed specifically to reduce the energy consumption and carbon footprint of ML training."},
{id:74,domain:"Security, Compliance, and Governance for AI",difficulty:"MEDIUM",type:"mcq",question:"A financial institution is using Amazon Bedrock in a VPC. To meet regulatory compliance, the VPC cannot access any internet traffic.\n\nWhich AWS service or feature meets this requirement?",options:["AWS PrivateLink","Amazon Macie","Amazon CloudFront","Internet gateway"],answer:0,explanation:"AWS PrivateLink enables private connectivity between VPCs and AWS services without traversing the internet. For Amazon Bedrock, PrivateLink allows API calls from a VPC without public internet access, meeting compliance requirements for isolated networks."},
{id:75,domain:"AI/ML Fundamentals",difficulty:"EASY",type:"mcq",question:"A company wants to adapt pre-trained models to create new models for related tasks, avoiding the need to train from scratch.\n\nWhich ML strategy meets these requirements?",options:["Increase the number of epochs","Use transfer learning","Decrease the number of epochs","Use unsupervised learning"],answer:1,explanation:"Transfer learning takes a pre-trained model and adapts it to a new but related task by fine-tuning with a smaller dataset. This saves time, compute resources, and training data compared to training from scratch."},
{id:76,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company wants to use AI to protect its application from threats by checking if an IP address is from a suspicious source.\n\nWhich solution meets these requirements?",options:["Build a speech recognition system","Create a natural language processing named entity recognition system","Develop an anomaly detection system","Create a fraud forecasting system"],answer:2,explanation:"Anomaly detection identifies patterns that deviate from normal behavior, such as suspicious IP addresses attempting access. It is the correct ML approach for security threat detection based on identifying outliers."},
{id:77,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A law firm wants to build an AI application using LLMs to read legal documents and extract key points.\n\nWhich solution meets these requirements?",options:["Build an automatic named entity recognition system","Create a recommendation engine","Develop a summarization chatbot","Develop a multi-language translation system"],answer:2,explanation:"A summarization chatbot using LLMs can read legal documents and extract key points by generating concise summaries. This is the most direct application for understanding and condensing document content."},
{id:78,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company wants to classify human genes into 20 categories based on gene characteristics and needs an ML algorithm that can document how its inner mechanism affects the output.\n\nWhich ML algorithm meets these requirements?",options:["Decision trees","Linear regression","Logistic regression","Neural networks"],answer:0,explanation:"Decision trees provide inherent explainability through their tree structure where each split and decision path is visible and interpretable. They can be easily documented to show how input features influence classification decisions."},
{id:79,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"A company is using a pre-trained LLM to build a chatbot for product recommendations. The company needs the LLM outputs to be short and written in a specific language.\n\nWhich solution will align the LLM response quality with the company's expectations?",options:["Adjust the prompt","Choose an LLM of a different size","Increase the temperature","Increase the Top K value"],answer:0,explanation:"Prompt engineering is the most direct and cost-effective way to control LLM output characteristics. The prompt can specify response length, language, tone, and format without changing models or incurring additional costs."},
{id:80,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company uses Amazon SageMaker for its ML pipeline. It has large input data sizes up to 1 GB and processing times up to 1 hour, with near real-time latency needs.\n\nWhich SageMaker inference option meets these requirements?",options:["Real-time inference","Serverless inference","Asynchronous inference","Batch transform"],answer:2,explanation:"Asynchronous inference is designed for large payloads (up to 1 GB) and long processing times (up to 1 hour) while still providing near real-time results. Real-time inference has strict timeout limits, serverless has payload limits, and batch transform is for offline processing."},
{id:81,domain:"Bedrock & Generative AI",difficulty:"EASY",type:"mcq",question:"A company wants to use language models for inference on edge devices with the lowest possible latency.\n\nWhich solution meets these requirements?",options:["Deploy optimized small language models (SLMs) on edge devices","Deploy optimized large language models (LLMs) on edge devices","Incorporate a centralized SLM API for asynchronous communication","Incorporate a centralized LLM API for asynchronous communication"],answer:0,explanation:"Small language models (SLMs) are optimized for on-device deployment with lower latency, smaller memory footprint, and no network dependency. LLMs are too large for most edge devices and would introduce network latency."},
{id:82,domain:"Amazon SageMaker",difficulty:"MEDIUM",type:"mcq",question:"A company wants to share and manage variables for ML model development across multiple teams using Amazon SageMaker.\n\nWhich SageMaker feature meets these requirements?",options:["Amazon SageMaker Feature Store","Amazon SageMaker Data Wrangler","Amazon SageMaker Clarify","Amazon SageMaker Model Cards"],answer:0,explanation:"Amazon SageMaker Feature Store is a centralized repository for storing, discovering, and sharing ML features across teams. It enables feature reuse, consistency, and governance for ML development workflows."},
{id:83,domain:"AI Challenges & Responsibilities",difficulty:"MEDIUM",type:"mcq",question:"Which metric measures the runtime efficiency of operating AI models?",options:["Customer satisfaction score (CSAT)","Training time for each epoch","Average response time","Number of training instances"],answer:2,explanation:"Average response time measures how quickly a deployed AI model returns inference results. It is a key operational metric for runtime efficiency and affects user experience in production systems."},
{id:84,domain:"AWS Managed AI Services",difficulty:"MEDIUM",type:"mcq",question:"A company is building a contact center application and wants to extract key information from audio of customer calls.\n\nWhich solution meets these requirements?",options:["Build a conversational chatbot using Amazon Lex","Transcribe call recordings using Amazon Transcribe","Extract information from call recordings using Amazon SageMaker Model Monitor","Create classification labels using Amazon Comprehend"],answer:1,explanation:"Amazon Transcribe converts audio to text using automatic speech recognition. Once call recordings are transcribed, the text can be further analyzed using services like Amazon Comprehend for insights and entity extraction."},
{id:85,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"An AI practitioner wants to use a foundation model to design a search application that handles queries with text and images.\n\nWhich type of FM should they use?",options:["Multi-modal embedding model","Text embedding model","Multi-modal generation model","Image generation model"],answer:0,explanation:"A multi-modal embedding model can encode both text and images into the same vector space, enabling search across modalities. For example, searching with text to find relevant images or with an image to find similar images."},
{id:86,domain:"Bedrock & Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company uses a foundation model from Amazon Bedrock for an AI search tool and wants to fine-tune the model using company data.\n\nWhich strategy will successfully fine-tune the model?",options:["Provide labeled data with the prompt field and the completion field","Prepare the training dataset by creating a .txt file with multiple lines in .csv format","Purchase Provisioned Throughput for Amazon Bedrock","Train the model on journals and textbooks"],answer:0,explanation:"Fine-tuning in Amazon Bedrock requires labeled prompt-completion pairs that demonstrate the desired input-output behavior. The model learns from these examples to improve accuracy on the specific task."},
{id:87,domain:"Security, Compliance, and Governance for AI",difficulty:"MEDIUM",type:"mcq",question:"How can companies use large language models securely on Amazon Bedrock?",options:["Design clear and specific prompts. Configure IAM roles and policies using least privilege access","Enable AWS Audit Manager for automatic model evaluation jobs","Enable Amazon Bedrock automatic model evaluation jobs","Use Amazon CloudWatch Logs to make models explainable and to monitor for bias"],answer:0,explanation:"Secure LLM usage on Bedrock requires both input controls (clear prompts that reduce prompt injection risk) and access controls (IAM least privilege). Together they prevent unauthorized access and manipulation."},
{id:88,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"msq",question:"A company is building a generative AI-based solution to offer applicants discounts based on business criteria. The company wants to use the AI model responsibly to minimize bias.\n\nWhich actions should the company take? (Select TWO.)",options:["Use diverse and representative training data that includes various demographic groups","Set model temperature to 0 for all prompts to ensure consistency","Implement regular bias testing and fairness audits on model outputs","Remove all customer demographic data from the training set to prevent bias","Use ROUGE score to measure model accuracy"],answer:[0,2],explanation:"Using diverse training data helps ensure the model learns from a representative population. Regular bias testing and fairness audits detect disparities that may emerge over time. Removing all demographic data can hide bias rather than fix it. ROUGE evaluates summarization, not fairness."},
{id:89,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"mcq",question:"A company is training a foundation model and wants to increase accuracy up to a specific acceptance level.\n\nWhich solution will meet these requirements?",options:["Decrease the batch size","Increase the epochs","Decrease the epochs","Increase the temperature parameter"],answer:1,explanation:"Increasing the number of training epochs allows the model more opportunities to learn from the data, which typically improves accuracy up to a point. More epochs reduce underfitting but must be balanced against overfitting."},
{id:90,domain:"AI Challenges & Responsibilities",difficulty:"MEDIUM",type:"mcq",question:"A company is building an LLM question-answering chatbot for a call center. The company wants to decrease the number of actions employees need to take to respond to customers.\n\nWhich business objective should the company use to evaluate the chatbot's effect?",options:["Website engagement rate","Average call duration","Corporate social responsibility","Regulatory compliance"],answer:1,explanation:"Average call duration is a direct, measurable business metric that reflects how efficiently call center agents resolve customer issues. A successful chatbot should reduce call duration by automating information retrieval and responses."},
{id:91,domain:"AWS Managed AI Services",difficulty:"MEDIUM",type:"msq",question:"An ecommerce company wants to determine customer sentiments based on written product reviews.\n\nWhich AWS services meet these requirements? (Select TWO.)",options:["Amazon Lex","Amazon Comprehend","Amazon Polly","Amazon Bedrock","Amazon Rekognition"],answer:[1,3],explanation:"Amazon Comprehend provides sentiment analysis (positive, negative, neutral, mixed) for text. Amazon Bedrock can also perform sentiment analysis using foundation models with appropriate prompts. Lex is for conversational bots, Polly is text-to-speech, Rekognition is for images."},
{id:92,domain:"Security, Compliance, and Governance for AI",difficulty:"MEDIUM",type:"mcq",question:"An AI company periodically evaluates its systems with independent software vendors (ISVs) and needs email notifications when compliance reports become available.\n\nWhich AWS service should the company use?",options:["AWS Audit Manager","AWS Artifact","AWS Trusted Advisor","AWS Data Exchange"],answer:1,explanation:"AWS Artifact provides on-demand access to AWS compliance reports and agreements. It enables downloading SOC, PCI, and ISO reports, and can send notifications when new reports or updates become available."},
{id:93,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"A company wants to use pre-trained generative AI to generate marketing content. The output must align with the company's brand voice and messaging requirements.\n\nWhich solution meets these requirements?",options:["Optimize the model's architecture and hyperparameters","Increase the model's complexity by adding more layers","Create effective prompts that provide clear instructions and context","Select a large diverse dataset to pre-train a new generative model"],answer:2,explanation:"Prompt engineering is the most practical approach for aligning GenAI output with brand requirements. Detailed prompts with instructions about tone, style, vocabulary, and messaging constraints guide the model without expensive retraining."},
{id:94,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is building a customer service chatbot. The company wants the chatbot to improve responses by learning from past interactions and online resources.\n\nWhich AI learning strategy provides this self-improvement capability?",options:["Supervised learning with a manually curated dataset","Reinforcement learning with rewards for positive customer feedback","Unsupervised learning to find clusters of similar inquiries","Supervised learning with a continuously updated FAQ database"],answer:1,explanation:"Reinforcement learning enables the chatbot to improve over time by learning from feedback signals. Positive customer feedback serves as rewards that reinforce good responses, allowing the model to self-improve through interaction experience."},
{id:95,domain:"AI/ML Fundamentals",difficulty:"MEDIUM",type:"truefalse",question:"A model that achieves 95% accuracy on training data but only 58% on test data is underfitting.",options:["True","False"],answer:1,explanation:"This is overfitting, not underfitting. The large gap between high training performance and poor test performance indicates the model has memorized training patterns rather than learning generalizable features. Overfitting is characterized by high training accuracy with significantly lower validation/test accuracy."},
{id:96,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"An AI team is training a foundation model using RLHF (Reinforcement Learning from Human Feedback). They have completed the supervised fine-tuning (SFT) step and are now training a reward model.\n\nWhat is the purpose of the reward model in RLHF?",options:["To rank model outputs based on human preference scores","To replace the policy model during inference","To generate synthetic training data for continued pre-training","To detect and filter toxic content from model outputs"],answer:0,explanation:"The reward model in RLHF learns to predict human preference scores from ranked model outputs. After humans rank responses from best to worst, the reward model learns what humans prefer. The policy model is then fine-tuned with PPO to maximize the reward model's scores while a KL penalty prevents reward hacking."},
{id:97,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"An AI company is evaluating two approaches to align their foundation model with human preferences: RLHF (Reinforcement Learning from Human Feedback) and DPO (Direct Preference Optimization).\n\nWhich statement correctly describes a key difference between RLHF and DPO?",options:["DPO trains a separate reward model while RLHF optimizes directly on preference pairs","RLHF trains a separate reward model while DPO optimizes directly on preference pairs without a separate reward model","DPO uses PPO optimization while RLHF uses supervised fine-tuning only","RLHF is newer than DPO and always produces better results"],answer:1,explanation:"RLHF uses a three-step pipeline: SFT → train a reward model on human-ranked outputs → optimize the policy with PPO against the reward model. DPO eliminates the separate reward model by mathematically reformulating the optimization to work directly on human preference pairs. DPO is simpler (no reward model, no PPO) but less flexible for iterative preference learning."},
{id:98,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A data science team is pre-training a new language model from scratch. They track perplexity during training to monitor model improvement.\n\nWhat does a decreasing perplexity score indicate during pre-training?",options:["The model is memorizing the training data (overfitting)","The model is becoming more confident and better at predicting the next token","The model's output quality is improving across all downstream tasks","The model's context window is expanding"],answer:1,explanation:"Perplexity measures how well a probability model predicts a sample. Lower perplexity means the model assigns higher probability to the actual next token — it is more confident in its predictions. Lower perplexity correlates with better language modeling but is NOT a direct measure of output quality, factuality, or downstream task performance."},
{id:99,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"An insurance company is building a GenAI application that must analyze pictures of vehicle damage submitted by customers and answer questions about repair estimates based on the images.\n\nWhich type of foundation model does this application require?",options:["A text-only LLM since the model only needs to process the damage description","A multimodal model that can accept image input alongside text (such as Claude or Amazon Nova Pro)","A diffusion model to generate images of the damaged vehicles","A speech-to-text model to process customer voice notes"],answer:1,explanation:"Multimodal models can accept image input alongside text, enabling the model to analyze submitted photos and answer questions about them. Text-only LLMs cannot process images. Diffusion models generate images but do not analyze them."},
{id:100,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is choosing between Amazon Bedrock and Amazon Q Developer for their generative AI needs.\n\nWhich scenario is BEST addressed by Amazon Bedrock rather than Amazon Q Developer?",options:["A developer needs inline code completion suggestions while writing code in their IDE","An IT administrator needs to troubleshoot an AWS infrastructure issue using natural language","A company wants to build a custom document Q&A chatbot for external customers using their own documents and RAG architecture","An employee needs to search across company documents in Salesforce, SharePoint, and Confluence"],answer:2,explanation:"Amazon Bedrock is a platform for building custom GenAI applications — you select models, design prompts, build RAG systems, and fine-tune models. Amazon Q Developer provides pre-built AI assistance for coding, AWS troubleshooting, and enterprise search. Building a custom customer-facing chatbot requires Bedrock's platform capabilities."},
{id:101,domain:"Fundamentals of Generative AI",difficulty:"EASY",type:"truefalse",question:"Multimodal foundation models can process both text and image inputs within a single API request.",options:["True","False"],answer:0,explanation:"Multimodal models such as Claude and Amazon Nova Pro can accept multiple data types in a single request — including text, images, and (for some models) video or audio alongside text. This allows the model to analyze charts, diagrams, photos, and other visual content in combination with text instructions."}
];

const ROUNDS = 5;
const QUESTIONS_PER_ROUND = 13;
const ITERATIONS = 5;
const PASS_SCORE = 70;

let currentMode = 'learn';
let currentSection = 0;
let currentIteration = 0;
let currentRound = 0;
let answeredQuestions = {};

function init() {
  buildNav();
  showSection(0);
  loadNotes();
  document.getElementById('notesText').addEventListener('input', saveNotes);
}
function buildNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  let idx = 0;
  DOMAINS.forEach((d, di) => {
    const hdr = document.createElement('li');
    hdr.className = 'section-header';
    hdr.textContent = d.name + ' (' + d.weight + ')';
    nav.appendChild(hdr);
    CONTENT.filter(c => c.domain === di).forEach(c => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.textContent = c.title;
      a.dataset.index = idx;
      a.onclick = ((i) => () => showSection(i))(idx);
      li.appendChild(a);
      nav.appendChild(li);
      idx++;
    });
  });
}
function showSection(idx) {
  currentSection = idx;
  const c = CONTENT[idx];
  const area = document.getElementById('learnContent');
  area.innerHTML = '<h2>' + c.title + '</h2>' + c.content;
  document.querySelector('.main').scrollTop = 0;
  document.querySelectorAll('.nav-list a').forEach((a, i) => a.classList.toggle('active', i === idx));
  const total = CONTENT.length;
  document.getElementById('progressText').textContent = 'Section ' + (idx + 1) + ' of ' + total;
  document.getElementById('progressFill').style.width = ((idx + 1) / total * 100) + '%';
  area.innerHTML += '<div class="nav-buttons"><button class="prev" onclick="showSection(' + (idx - 1) + ')" ' + (idx === 0 ? 'disabled' : '') + '>&larr; Previous</button><button class="next" onclick="showSection(' + (idx + 1) + ')" ' + (idx >= total - 1 ? 'disabled' : '') + '>Next &rarr;</button></div>' +
    '<div class="notes-area"><h4>Notes for "' + c.title + '"</h4><textarea id="sectionNotes" placeholder="Add notes about this topic..." oninput="saveSectionNotes()"></textarea></div>';
  const saved = localStorage.getItem('sectionNotes_' + c.id);
  if (saved) document.getElementById('sectionNotes').value = saved;
}
function filterContent() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.nav-list li a').forEach(a => {
    a.parentElement.style.display = (!q || a.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.nav-list .section-header').forEach(h => {
    let s = h.nextElementSibling;
    let vis = false;
    while (s && s.tagName === 'LI') { if (s.style.display !== 'none') vis = true; s = s.nextElementSibling; }
    h.style.display = (!q || vis) ? '' : 'none';
  });
}
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('learnBtn').classList.toggle('active', mode === 'learn');
  document.getElementById('quizBtn').classList.toggle('active', mode === 'quiz');
  document.getElementById('sidebar').classList.toggle('hidden', mode === 'quiz');
  document.getElementById('learnContent').style.display = mode === 'learn' ? '' : 'none';
  document.getElementById('quizContent').style.display = mode === 'quiz' ? '' : 'none';
  if (mode === 'quiz') initQuiz();
}
function initQuiz() {
  const qc = document.getElementById('quizContent');
  qc.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:8px"><div class="iteration-selector" id="iterationSelector"></div><div style="display:flex;gap:8px;align-items:center"><span style="font-size:.8rem;color:var(--text2)">Pass: ' + PASS_SCORE + '%</span><button class="quiz-action-btn danger" style="padding:4px 12px;font-size:.75rem" onclick="resetAll()">Reset All</button></div></div>' +
    '<div class="round-selector" id="roundSelector"></div><div id="quizArea"></div>';
  buildIterationSelector();
  buildRoundSelector();
  startIteration(0);
}
function buildIterationSelector() {
  const c = document.getElementById('iterationSelector');
  c.innerHTML = '<span class="iter-label">Iteration:</span>';
  for (let i = 0; i < ITERATIONS; i++) {
    const b = document.createElement('button');
    b.className = 'iter-btn' + (i === currentIteration ? ' active' : '');
    b.textContent = (i + 1);
    b.onclick = () => startIteration(i);
    const s = JSON.parse(localStorage.getItem('aif_iter_' + i) || '{}');
    if (s.complete) b.classList.add('completed');
    c.appendChild(b);
  }
}
function buildRoundSelector() {
  const c = document.getElementById('roundSelector');
  c.innerHTML = '<span style="font-size:.82rem;color:var(--text2);font-weight:500;margin-right:6px;align-self:center">Round:</span>';
  for (let i = 0; i < ROUNDS; i++) {
    const b = document.createElement('button');
    b.className = 'round-btn' + (i === currentRound ? ' active' : '');
    b.textContent = 'Round ' + (i + 1);
    b.onclick = () => startRound(i);
    const rk = 'aif_iter_' + currentIteration + '_round_' + i;
    const rs = JSON.parse(localStorage.getItem(rk) || '{}');
    if (rs.complete) b.classList.add('completed');
    c.appendChild(b);
  }
}
function startIteration(iter) {
  currentIteration = iter;
  currentRound = 0;
  document.querySelectorAll('.iter-btn').forEach((b, i) => b.classList.toggle('active', i === iter));
  buildRoundSelector();
  startRound(0);
}
function startRound(round) {
  currentRound = round;
  document.querySelectorAll('.round-btn').forEach((b, i) => b.classList.toggle('active', i === round));
  const seed = currentIteration * ROUNDS + round;
  const questions = getQuestionsForRound(seed);
  const key = 'aif_iter_' + currentIteration + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  if (saved.complete && saved.submitted) { /* ok */ }
  answeredQuestions = saved.answers || {};
  renderQuiz(questions, round, saved);
}
function getQuestionsForRound(seed) {
  const iterSeed = Math.floor(seed / ROUNDS);
  const roundIdx = seed % ROUNDS;
  const shuffled = [...ALL_QUESTIONS];
  let s = iterSeed * 7 + 13;
  for (let i = shuffled.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const j = s % (i + 1);
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const start = roundIdx * QUESTIONS_PER_ROUND;
  const result = [];
  for (let i = 0; i < QUESTIONS_PER_ROUND; i++) {
    result.push(shuffled[(start + i) % shuffled.length]);
  }
  return result;
}
function renderQuiz(questions, round, saved) {
  const area = document.getElementById('quizArea');
  const allAnswered = questions.every(q => answeredQuestions[q.id] !== undefined);
  const answeredCount = Object.keys(answeredQuestions).length;
  let html = '<div class="quiz-header">' +
    '<div class="stat"><div class="num">' + (currentIteration + 1) + '/' + ITERATIONS + '</div><div class="label">Iteration</div></div>' +
    '<div class="stat"><div class="num">' + (round + 1) + '/' + ROUNDS + '</div><div class="label">Round</div></div>' +
    '<div class="stat"><div class="num">' + answeredCount + '/' + questions.length + '</div><div class="label">Answered</div></div>' +
    '<div class="quiz-progress"><div class="fill" style="width:' + (answeredCount / questions.length * 100) + '%"></div></div></div>';
  if (saved.complete && saved.submitted) {
    const res = getRoundResults(currentIteration, round);
    html += renderResultSummary(res);
  }
  questions.forEach((q, qi) => {
    const isMulti = Array.isArray(q.answer);
    const isCorrect = answeredQuestions[q.id] && answeredQuestions[q.id].correct;
    const selected = answeredQuestions[q.id] ? answeredQuestions[q.id].selected : null;
    const submitted = answeredQuestions[q.id] && answeredQuestions[q.id].correct !== undefined;
    const optLabels = 'ABCDEFGH';
    let diffClass = 'medium';
    if (q.difficulty === 'EASY') diffClass = 'easy';
    else if (q.difficulty === 'HARD') diffClass = 'hard';
    html += '<div class="question-card">' +
      '<div class="q-domain">' + q.domain + '</div>' +
      '<div class="q-num">Question ' + (qi + 1) + ' of ' + questions.length + ' <span class="q-difficulty ' + diffClass + '">' + q.difficulty + '</span></div>' +
      '<div class="q-text">' + q.question.replace(/\n/g, '<br>') + '</div>' +
      (isMulti ? '<div class="q-instruction">(Select TWO.)</div>' : '') +
      '<div class="options" id="opts-' + q.id + '">';
    q.options.forEach((opt, oi) => {
      let cls = 'option';
      if (submitted) cls += ' disabled';
      if (submitted && isMulti) {
        if (q.answer.indexOf(oi) > -1) cls += ' correct';
        else if (selected && selected.indexOf && selected.indexOf(oi) > -1) cls += ' wrong';
      } else if (submitted) {
        if (oi === q.answer) cls += ' correct';
        else if (oi === selected) cls += ' wrong';
      } else if (selected !== null) {
        if (isMulti && selected && selected.indexOf && selected.indexOf(oi) > -1) cls += ' selected';
        else if (!isMulti && oi === selected) cls += ' selected';
      }
      const checked = submitted && selected !== null ? (isMulti ? (selected && selected.indexOf && selected.indexOf(oi) > -1) : oi === selected) : false;
      html += '<label class="' + cls + '" onclick="' + (submitted ? '' : 'selectOption(' + q.id + ',' + oi + ',' + isMulti + ')') + '">' +
        '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="q' + q.id + '" value="' + oi + '" ' + (checked ? 'checked' : '') + ' ' + (submitted ? 'disabled' : '') + '>' +
        '<span class="opt-label">' + optLabels[oi] + '.</span><span>' + opt + '</span></label>';
    });
    html += '</div>';
    if (submitted) {
      const ansTxt = isMulti ? q.answer.map(i => optLabels[i]).join(', ') : optLabels[q.answer] + '. ' + q.options[q.answer];
      html += '<div class="feedback show ' + (isCorrect ? 'correct' : 'wrong') + '">' +
        '<div class="ans">' + (isCorrect ? 'Correct!' : 'Incorrect') + '</div>' +
        '<div class="expl"><strong>Correct Answer: ' + ansTxt + '</strong><br>' + q.explanation + '</div></div>';
    } else {
      html += '<div class="feedback" id="fb-' + q.id + '"></div>';
    }
    html += '</div>';
  });
  if (!saved.complete || !saved.submitted) {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="quiz-action-btn primary" id="submitBtn" onclick="submitRound(' + round + ')" ' + (!allAnswered ? 'disabled' : '') + '>Submit Round</button></div>';
  } else {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="quiz-action-btn warning" onclick="retakeRound(' + round + ')">Retake This Round</button></div>';
  }
  area.innerHTML = html;
}
function selectOption(qId, optIdx, isMulti) {
  if (answeredQuestions[qId] && answeredQuestions[qId].correct !== undefined) return;
  console.log('selectOption called', {qId, optIdx, isMulti, before: answeredQuestions[qId] ? JSON.parse(JSON.stringify(answeredQuestions[qId])) : null});
  if (isMulti) {
    if (!answeredQuestions[qId]) answeredQuestions[qId] = {selected:[]};
    const arr = answeredQuestions[qId].selected;
    const idx = arr.indexOf(optIdx);
    if (idx > -1) arr.splice(idx, 1); else arr.push(optIdx);
    console.log('multi-select after:', JSON.parse(JSON.stringify(answeredQuestions[qId])));
    document.querySelectorAll('#opts-' + qId + ' .option').forEach((o, i) => {
      const sel = answeredQuestions[qId].selected;
      o.classList.toggle('selected', sel.indexOf(i) > -1);
      o.querySelector('input').checked = sel.indexOf(i) > -1;
    });
  } else {
    answeredQuestions[qId] = {selected: optIdx};
    document.querySelectorAll('#opts-' + qId + ' .option').forEach((o, i) => {
      o.classList.toggle('selected', i === optIdx);
      o.querySelector('input').checked = i === optIdx;
    });
  }
  const key = 'aif_iter_' + currentIteration + '_round_' + currentRound;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  saved.answers = answeredQuestions;
  localStorage.setItem(key, JSON.stringify(saved));
  const questions = getQuestionsForRound(currentIteration * ROUNDS + currentRound);
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = !questions.every(q => answeredQuestions[q.id] !== undefined);
  const progress = Object.keys(answeredQuestions).length / questions.length * 100;
  const pf = document.querySelector('.quiz-progress .fill');
  if (pf) pf.style.width = progress + '%';
}
function submitRound(round) {
  console.log('submitRound called', {round, currentIteration, answeredQuestions: JSON.parse(JSON.stringify(answeredQuestions))});
