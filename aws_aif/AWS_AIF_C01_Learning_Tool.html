{id:415,domain:"Fundamentals of AI and ML",difficulty:"EASY",type:"mcq",question:"In the context of AI governance, what is the purpose of a model card?",options:["To create a physical representation of a neural network","To provide transparent documentation about a model's development, use, and limitations","To encrypt model parameters for security","To optimize model performance"],answer:1,explanation:"A model card is a documentation framework for transparent reporting of AI model information. It typically includes details about a model's development, intended use cases, performance characteristics, limitations, and ethical considerations. Model cards help improve transparency and accountability in AI development, enabling better understanding and appropriate use of AI models by developers, users, and stakeholders."},
{id:416,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"Which AWS service would you use to convert speech to text?",options:["Amazon Polly","Amazon Transcribe","Amazon Translate","Amazon Comprehend"],answer:1,explanation:"Amazon Transcribe is an automatic speech recognition (ASR) service that makes it easy for developers to add speech-to-text capability to their applications. It uses machine learning models to accurately convert speech to text and can handle various audio formats, multiple speakers, and even provide features like speaker identification and custom vocabulary."},
{id:417,domain:"Fundamentals of AI and ML",difficulty:"EASY",type:"mcq",question:"What is a potential risk of using generative AI models in content creation?",options:["The model may generate content too slowly","The model may generate content that infringes on copyrights or contains biased information","The model may consume too much storage space","The model may only generate content in a single language"],answer:1,explanation:"While generative AI models are powerful tools for content creation, they come with certain risks. One significant risk is that these models, trained on vast amounts of data from the internet, may inadvertently reproduce copyrighted material or reflect biases present in their training data. This could lead to legal issues with copyright infringement or the propagation of harmful biases. It's crucial to implement appropriate safeguards and review processes when using generative AI for content creation."},
{id:418,domain:"Fundamentals of Generative AI",difficulty:"EASY",type:"mcq",question:"What is Retrieval Augmented Generation (RAG) in the context of generative AI?",options:["A method for compressing large language models","A technique that combines information retrieval with text generation to produce more accurate and contextually relevant responses","A type of generative adversarial network","A way to visualize the internal workings of a neural network"],answer:1,explanation:"Retrieval Augmented Generation (RAG) is a technique that enhances language models by retrieving relevant information from an external knowledge base before generating a response. This allows the model to access up-to-date or domain-specific information, improving the accuracy and relevance of its outputs. RAG is particularly useful for applications requiring current or specialized knowledge."},

{id:419,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company has installed a security camera. The company uses an ML model to evaluate the security camera footage for potential thefts. The company has discovered that the model disproportionately flags people who are members of a specific ethnic group. Which type of bias is affecting the model output?",options:["Measurement bias", "Sampling bias", "Observer bias", "Confirmation bias"],answer:1,explanation:"Sampling bias occurs when the training data is not representative of the population the model will be used on. If the model disproportionately flags people of a specific ethnic group, it likely means the training data had more examples of that group, causing the model to learn biased patterns. This is a classic example of sampling bias in machine learning."},
{id:420,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is building a customer service chatbot. The company wants the chatbot to improve its responses by learning from past interactions and online resources. Which AI learning strategy provides this self-improvement capability?",options:["Supervised learning with a manually curated dataset of good responses and bad responses", "Reinforcement learning with rewards for positive customer feedback", "Unsupervised learning to find clusters of similar customer inquiries", "Supervised learning with a continuously updated FAQ database"],answer:1,explanation:""},
{id:421,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"An AI practitioner has built a deep learning model to classify the types of materials in images. The AI practitioner now wants to measure the model performance. Which metric will help the AI practitioner evaluate the performance of the model?",options:["Confusion matrix", "Correlation matrix", "R2 score", "Mean squared error (MSE)"],answer:0,explanation:""},
{id:422,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company has built a chatbot that can respond to natural language questions with images. The company wants to ensure that the chatbot does not return inappropriate or unwanted images. Which solution will meet these requirements?",options:["Implement moderation APIs.", "Retrain the model with a general public dataset.", "Perform model validation.", "Automate user feedback integration."],answer:0,explanation:""},
{id:423,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"An AI practitioner is using an Amazon Bedrock base model to summarize session chats from the customer service department. The AI practitioner wants to store invocation logs to monitor model input and output data. Which strategy should the AI practitioner use?",options:["Configure AWS CloudTrail as the logs destination for the model.", "Enable model invocation logging in Amazon Bedrock.", "Configure AWS Audit Manager as the logs destination for the model.", "Configure model invocation logging in Amazon EventBridge."],answer:1,explanation:""},
{id:424,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is building an ML model to analyze archived data. The company must perform inference on large datasets that are multiple GBs in size. The company does not need to access the model predictions immediately. Which Amazon SageMaker inference option will meet these requirements?",options:["Batch transform", "Real-time inference", "Serverless inference", "Asynchronous inference"],answer:0,explanation:""},
{id:425,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"Which term describes the numerical representations of real-world objects and concepts that AI and natural language processing (NLP) models use to improve understanding of textual information?",options:["Embeddings", "Tokens", "Models", "Binaries"],answer:0,explanation:""},
{id:426,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A research company implemented a chatbot by using a foundation model (FM) from Amazon Bedrock. The chatbot searches for answers to questions from a large database of research papers. After multiple prompt engineering attempts, the company notices that the FM is performing poorly because of the complex scientific terms in the research papers. How can the company improve the performance of the chatbot?",options:["Use few-shot prompting to define how the FM can answer the questions.", "Use domain adaptation fine-tuning to adapt the FM to complex scientific terms.", "Change the FM inference parameters.", "Clean the research paper data to remove complex scientific terms."],answer:1,explanation:""},
{id:427,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company wants to use a large language model (LLM) on Amazon Bedrock for sentiment analysis. The company needs the LLM to produce more consistent responses to the same input prompt. Which adjustment to an inference parameter should the company make to meet these requirements?",options:["Decrease the temperature value.", "Increase the temperature value.", "Decrease the length of output tokens.", "Increase the maximum generation length."],answer:0,explanation:""},
{id:428,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company wants to develop a large language model (LLM) application by using Amazon Bedrock and customer data that is uploaded to Amazon S3. The company's security policy states that each team can access data for only the team's own customers. Which solution will meet these requirements?",options:["Create an Amazon Bedrock custom service role for each team that has access to only the team's customer data.", "Create a custom service role that has Amazon S3 access. Ask teams to specify the customer name on each Amazon Bedrock request.", "Redact personal data in Amazon S3. Update the S3 bucket policy to allow team access to customer data.", "Create one Amazon Bedrock role that has full Amazon S3 access. Create IAM roles for each team that have access to only each team's customer folders."],answer:0,explanation:""},
{id:429,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A medical company deployed a disease detection model on Amazon Bedrock. To comply with privacy policies, the company wants to prevent the model from including personal patient information in its responses. The company also wants to receive notification when policy violations occur. Which solution meets these requirements?",options:["Use Amazon Macie to scan the model's output for sensitive data and set up alerts for potential violations.", "Configure AWS CloudTrail to monitor the model's responses and create alerts for any detected personal information.", "Use Guardrails for Amazon Bedrock to filter content. Set up Amazon CloudWatch alarms for notification of policy violations.", "Implement Amazon SageMaker Model Monitor to detect data drift and receive alerts when model quality degrades."],answer:2,explanation:""},
{id:430,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company manually reviews all submitted resumes in PDF format. As the company grows, the company expects the volume of resumes to exceed the company's review capacity. The company needs an automated system to convert the PDF resumes into plain text format for additional processing. Which AWS service meets this requirement?",options:["Amazon Textract", "Amazon Personalize", "Amazon Lex", "Amazon Transcribe"],answer:0,explanation:""},
{id:431,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"An education provider is building a question and answer application that uses a generative AI model to explain complex concepts. The education provider wants to automatically change the style of the model response depending on who is asking the question. The education provider will give the model the age range of the user who has asked the question. Which solution meets these requirements with the LEAST implementation effort?",options:["Fine-tune the model by using additional training data that is representative of the various age ranges that the application will support.", "Add a role description to the prompt context that instructs the model of the age range that the response should target.", "Use chain-of-thought reasoning to deduce the correct style and complexity for a response suitable for that user.", "Summarize the response text depending on the age of the user so that younger users receive shorter responses."],answer:1,explanation:""},
{id:432,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"Which strategy evaluates the accuracy of a foundation model (FM) that is used in image classification tasks?",options:["Calculate the total cost of resources used by the model.", "Measure the model's accuracy against a predefined benchmark dataset.", "Count the number of layers in the neural network.", "Assess the color accuracy of images processed by the model."],answer:1,explanation:""},
{id:433,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"An accounting firm wants to implement a large language model (LLM) to automate document processing. The firm must proceed responsibly to avoid potential harms. What should the firm do when developing and deploying the LLM? (Choose two.)",options:["Adjust the temperature parameter of the model.", "Modify the training data to mitigate bias.", "Avoid overfitting on the training data.", "Apply prompt engineering techniques."],answer:[1, 2],explanation:"When developing and deploying an LLM responsibly, the firm should: 1) Modify the training data to mitigate bias - ensuring the data is representative and free from harmful biases, and 2) Avoid overfitting on the training data - ensuring the model generalizes well and doesn't memorize training data patterns. Adjusting temperature is an inference parameter, not a responsible AI practice. Prompt engineering is useful but doesn't address bias or overfitting concerns."},
{id:434,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is building an ML model. The company collected new data and analyzed the data by creating a correlation matrix, calculating statistics, and visualizing the data. Which stage of the ML pipeline is the company currently in?",options:["Data pre-processing", "Feature engineering", "Exploratory data analysis", "Hyperparameter tuning"],answer:2,explanation:""},
{id:435,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company has documents that are missing some words because of a database error. The company wants to build an ML model that can suggest potential words to fill in the missing text. Which type of model meets this requirement?",options:["Topic modeling", "Clustering models", "Prescriptive ML models", "BERT-based models"],answer:3,explanation:"BERT-based models are designed for masked language modeling (MLM), where they predict missing words based on surrounding context. This makes them ideal for filling in missing text. Topic modeling discovers themes, clustering groups similar data, and prescriptive ML recommends actions — none of which predict missing words."},
{id:436,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company wants to display the total sales for its top-selling products across various retail locations in the past 12 months. Which AWS solution should the company use to automate the generation of graphs?",options:["Amazon Q in Amazon EC2", "Amazon Q Developer", "Amazon Q in Amazon QuickSight", "Amazon Q in AWS Chatbot"],answer:2,explanation:""},
{id:437,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is building a chatbot to improve user experience. The company is using a large language model (LLM) from Amazon Bedrock for intent detection. The company wants to use few-shot learning to improve intent detection accuracy. Which additional data does the company need to meet these requirements?",options:["Pairs of chatbot responses and correct user intents", "Pairs of user messages and correct chatbot responses", "Pairs of user messages and correct user intents", "Pairs of user intents and correct chatbot responses"],answer:2,explanation:""},
{id:438,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is using few-shot prompting on a base model that is hosted on Amazon Bedrock. The model currently uses 10 examples in the prompt. The model is invoked once daily and is performing well. The company wants to lower the monthly cost. Which solution will meet these requirements?",options:["Customize the model by using fine-tuning.", "Decrease the number of tokens in the prompt.", "Increase the number of tokens in the prompt.", "Use Provisioned Throughput."],answer:1,explanation:"Since the model is invoked only once daily and is performing well, the most cost-effective solution is to decrease the number of tokens in the prompt. Amazon Bedrock charges based on token usage, so fewer tokens directly reduce costs. Fine-tuning has significant upfront costs and is not justified for once-daily invocation. Provisioned Throughput is for high-throughput scenarios and would increase costs."},
{id:439,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"An AI practitioner is using a large language model (LLM) to create content for marketing campaigns. The generated content sounds plausible and factual but is incorrect. Which problem is the LLM having?",options:["Data leakage", "Hallucination", "Overfitting", "Underfitting"],answer:1,explanation:""},
{id:440,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"An AI practitioner trained a custom model on Amazon Bedrock by using a training dataset that contains confidential data. The AI practitioner wants to ensure that the custom model does not generate inference responses based on confidential data. How should the AI practitioner prevent responses based on confidential data?",options:["Delete the custom model. Remove the confidential data from the training dataset. Retrain the custom model.", "Mask the confidential data in the inference responses by using dynamic data masking.", "Encrypt the confidential data in the inference responses by using Amazon SageMaker.", "Encrypt the confidential data in the custom model by using AWS Key Management Service (AWS KMS)."],answer:0,explanation:""},
{id:441,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company has built a solution by using generative AI. The solution uses large language models (LLMs) to translate training manuals from English into other languages. The company wants to evaluate the accuracy of the solution by examining the text generated for the manuals. Which model evaluation strategy meets these requirements?",options:["Bilingual Evaluation Understudy (BLEU)", "Root mean squared error (RMSE)", "Recall-Oriented Understudy for Gisting Evaluation (ROUGE)", "F1 score"],answer:0,explanation:""},
{id:442,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A large retailer receives thousands of customer support inquiries about products every day. The customer support inquiries need to be processed quickly. The company wants to implement Agents for Amazon Bedrock. What are the key benefits of using Amazon Bedrock agents that could help this retailer?",options:["Generation of custom foundation models (FMs) to predict customer needs", "Automation of repetitive tasks and orchestration of complex workflows", "Automatically calling multiple foundation models (FMs) and consolidating the results", "Selecting the foundation model (FM) based on predefined criteria and metrics"],answer:1,explanation:""},
{id:443,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"Which option is a benefit of ongoing pre-training when fine-tuning a foundation model (FM)?",options:["Helps decrease the model's complexity", "Improves model performance over time", "Decreases the training time requirement", "Optimizes model inference time"],answer:1,explanation:"Ongoing pre-training exposes the model to new data continuously, allowing it to learn updated patterns and improve performance over time. It does not reduce complexity, training time, or inference speed — those are affected by model architecture and optimization techniques."},
{id:444,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"What are tokens in the context of generative AI models?",options:["Tokens are the basic units of input and output that a generative AI model operates on, representing words, subwords, or other linguistic units.", "Tokens are the mathematical representations of words or concepts used in generative AI models.", "Tokens are the pre-trained weights of a generative AI model that are fine-tuned for specific tasks.", "Tokens are the specific prompts or instructions given to a generative AI model to generate output."],answer:0,explanation:""},

{id:454,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A software company builds tools for customers. The company wants to use AI to increase software development productivity. Which solution will meet these requirements?",options:["Use a binary classification model to generate code reviews.", "Install code recommendation software in the company's developer tools.", "Install a code forecasting tool to predict potential code issues.", "Use a natural language processing (NLP) tool to generate code."],answer:1,explanation:""},

{id:506,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"multi",question:"A global financial company has developed an ML application to analyze stock market data and provide stock market trends. The company wants to continuously monitor the application development phases and to ensure that company policies and industry regulations are followed. Which AWS services will help the company assess compliance requirements? (Choose two.)",options:["AWS Audit Manager", "AWS Config", "Amazon Inspector", "Amazon CloudWatch", "AWS CloudTrail"],answer:[0,1],explanation:"AWS Audit Manager continuously collects evidence about compliance posture, maps to industry standards (SOC, PCI, HIPAA), and prepares for audits. AWS Config tracks resource configuration changes and evaluates them against compliance rules. Together they assess compliance requirements. Amazon Inspector scans for vulnerabilities. CloudWatch monitors operational metrics. CloudTrail logs API calls for auditing but doesn't assess compliance posture."},

{id:514,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A medical company wants to develop an AI application that can access structured patient records, extract relevant information, and generate concise summaries. Which solution will meet these requirements?",options:["Use Amazon Comprehend Medical to extract relevant medical entities and relationships. Apply rule-based logic to structure and format summaries.", "Use Amazon Personalize to analyze patient engagement patterns. Integrate the output with a general purpose text summarization tool.", "Use Amazon Textract to convert scanned documents into digital text. Design a keyword extraction system to generate summaries.", "Implement Amazon Kendra to provide a searchable index for medical records. Use a template-based system to format summaries."],answer:0,explanation:""},

{id:516,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is building an AI application to summarize books of varying lengths. During testing, the application fails to summarize some books. Why does the application fail to summarize some books?",options:["The temperature is set too high.", "The selected model does not support fine-tuning.", "The Top P value is too high.", "The input tokens exceed the model's context size."],answer:3,explanation:""},
{id:517,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"An airline company wants to build a conversational AI assistant to answer customer questions about flight schedules, booking, and payments. The company wants to use large language models (LLMs) and a knowledge base to create a text-based chatbot interface. Which solution will meet these requirements with the LEAST development effort?",options:["Train models on Amazon SageMaker Autopilot.", "Develop a Retrieval Augmented Generation (RAG) agent by using Amazon Bedrock.", "Create a Python application by using Amazon Q Developer.", "Fine-tune models on Amazon SageMaker Jumpstart."],answer:1,explanation:""},
{id:518,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"What is tokenization used for in natural language processing (NLP)?",options:["To encrypt text data", "To compress text files", "To break text into smaller units for processing", "To translate text between languages"],answer:2,explanation:""},
{id:519,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"Which option is a characteristic of transformer-based language models?",options:["Transformer-based language models use convolutional layers to apply filters across an input to capture local patterns through filtered views.", "Transformer-based language models can process only text data.", "Transformer-based language models use self-attention mechanisms to capture contextual relationships.", "Transformer-based language models process data sequences one element at a time in cyclic iterations."],answer:2,explanation:""},
{id:520,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A financial company is using AI systems to obtain customer credit scores as part of the loan application process. The company wants to expand to a new market in a different geographic area. The company must ensure that it can operate in that geographic area. Which compliance laws should the company review?",options:["Local health data protection laws", "Local payment card data protection laws", "Local education privacy laws", "Local algorithm accountability laws"],answer:3,explanation:"Using AI for credit scoring involves automated decision-making that directly affects customers. Algorithm accountability laws govern how AI systems must operate, including fairness, transparency, and explainability requirements. Health laws apply to medical data, payment card laws to card data, and education laws to student data — none apply to AI credit scoring."},
{id:521,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company uses Amazon Bedrock for its generative AI application. The company wants to use Amazon Bedrock Guardrails to detect and filter harmful user inputs and model-generated outputs. Which content categories can the guardrails filter?",options:["Politics", "Violence", "Gambling", "Religion"],answer:1,explanation:"Amazon Bedrock Guardrails can filter content in the following categories: Hate, Insults, Sexual, Violence, Misconduct, and Prompt Attack. Among the given options, only Violence is a valid content filter category. Politics, Gambling, and Religion are not supported content filter categories in Amazon Bedrock Guardrails."},
{id:522,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"Which scenario describes a potential risk and limitation of prompt engineering in the context of a generative AI model?",options:["Prompt engineering does not ensure that the model always produces consistent and deterministic outputs, eliminating the need for validation.", "Prompt engineering could expose the model to vulnerabilities such as prompt injection attacks.", "Properly designed prompts reduce but do not eliminate the risk of data poisoning or model hijacking.", "Prompt engineering does not ensure that the model will consistently generate highly reliable outputs when working with real-world data."],answer:3,explanation:""},
{id:523,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A publishing company built a Retrieval Augmented Generation (RAG) based solution to give its users the ability to interact with published content. New content is published daily. The company wants to provide a near real-time experience to users. Which steps in the RAG pipeline should the company implement by using offline batch processing to meet these requirements? (Choose two.) Generation of content embeddings",options:["Generation of embeddings for user queries", "Creation of the search index", "Retrieval of relevant content", "Response generation for the user"],answer:0,explanation:""},

{id:525,domain:"Security, Compliance, and Governance for AI",difficulty:"HARD",type:"mcq",question:"An AI practitioner at a healthcare company trained a custom model on Amazon Bedrock using a dataset that included a mix of public records and confidential patient information. After deployment, the team realizes that the model occasionally surfaces details in its responses that appear to originate from the confidential portion of the training data. What is the correct course of action?",options:["Delete the custom model, remove all confidential data from the training dataset, and retrain the model from scratch using only the cleaned dataset.", "Apply dynamic data masking to the model's inference outputs so that confidential information is automatically hidden before responses reach end users.", "Encrypt all inference responses using Amazon SageMaker to prevent confidential data from being exposed.", "Encrypt the model weights that contain confidential data using AWS Key Management Service (AWS KMS) to secure the information inside the model."],answer:0,explanation:"You cannot selectively remove knowledge from a trained model without retraining it. When a model is trained on confidential data, those patterns are embedded into the model weights. The only reliable remediation is to delete the compromised model, remove the confidential data from the training set, and retrain from scratch. Dynamic data masking operates at the database layer, not the model layer. Encryption protects data at rest and in transit but does not alter what the model learned. KMS encryption secures the model artifact file but does not remove learned patterns from weights."},

{id:526,domain:"Fundamentals of Generative AI",difficulty:"HARD",type:"mcq",question:"A startup is building a product recommendation engine that uses machine learning embeddings to find semantically similar items. When a user views a product, the system needs to instantly retrieve the most similar products from a catalog of 10 million items by comparing high-dimensional vector representations. Which Amazon OpenSearch Service capability directly enables this application?",options:["Native integration with Amazon S3 for storing raw product catalog data at scale.", "Built-in geospatial indexing and query support for location-aware product filtering.", "Scalable vector index management with approximate nearest neighbor (ANN) search capability.", "Real-time analysis of streaming data from user clickstream events."],answer:2,explanation:"Amazon OpenSearch Service supports vector search through its k-NN (k-Nearest Neighbor) plugin, which enables vector indexing at scale and uses Approximate Nearest Neighbor (ANN) algorithms to return highly accurate similarity results in milliseconds across millions of vectors. S3 integration provides storage but no search capability. Geospatial indexing operates in 2D geographic space, not high-dimensional vector space. Streaming analysis processes data streams but does not perform similarity search over a vector index."},

{id:527,domain:"Applications of Foundation Models",difficulty:"HARD",type:"mcq",question:"A retail chain with 200 store locations wants to give its non-technical business analysts the ability to explore total sales data for their top 50 products over the past 12 months without writing SQL queries. The solution needs to automatically generate charts and graphs in response to plain-English questions. Which AWS solution should the company implement?",options:["Amazon Q in Amazon EC2.", "Amazon Q Developer.", "Amazon Q in Amazon QuickSight.", "Amazon Q in AWS Chatbot."],answer:2,explanation:"Amazon Q in Amazon QuickSight allows users to type natural language questions about their data and automatically generates visualizations like bar charts, trend lines, and comparison tables. Amazon Q Developer is an AI coding assistant for developers. Amazon Q in AWS Chatbot provides operational monitoring alerts via Slack or Teams. There is no Amazon Q in EC2 variant."},

{id:528,domain:"Applications of Foundation Models",difficulty:"HARD",type:"mcq",question:"A children's education technology company is building an interactive storytelling application using Amazon Bedrock. The application allows children aged 6-12 to input prompts, and the model generates original story continuations. Leadership requires a guarantee that every generated story avoids violence, adult themes, and inappropriate language regardless of how a child phrases their input. Which Amazon Bedrock feature directly enforces these content boundaries in production?",options:["Amazon Rekognition configured to scan generated text for inappropriate content.", "Amazon Bedrock Playgrounds used to test and validate model outputs before deployment.", "Guardrails for Amazon Bedrock configured with topic restrictions and content filters.", "Agents for Amazon Bedrock programmed to intercept and rewrite inappropriate outputs."],answer:2,explanation:"Guardrails for Amazon Bedrock allows developers to configure topic restrictions, content filters for hate/sexual/violence/misconduct, word blocklists, and sensitive information redaction. These are enforced at the infrastructure level for every inference request. Amazon Rekognition analyzes images and videos, not text. Bedrock Playgrounds are a development tool, not a production enforcement mechanism. Agents orchestrate multi-step workflows, not content moderation."},

{id:529,domain:"Applications of Foundation Models",difficulty:"HARD",type:"mcq",question:"A healthcare startup has finished training an image classification model that detects anomalies in medical scan images. They need to deploy the model so that a web application used by radiologists can submit scan images and receive predictions in real time. The engineering team has no infrastructure management capacity. Which deployment approach meets these requirements?",options:["Deploy the model using Amazon SageMaker Serverless Inference.", "Host the model on Amazon CloudFront edge locations for low-latency global distribution.", "Build a RESTful API using Amazon API Gateway that routes requests to the model.", "Run batch prediction jobs using AWS Batch to process incoming scan images."],answer:0,explanation:"Amazon SageMaker Serverless Inference provides fully managed, auto-scaling model hosting with no infrastructure management. It scales to zero when idle and handles real-time synchronous predictions. CloudFront is a CDN for static content, not model hosting. API Gateway manages APIs but cannot host or execute ML models. AWS Batch processes jobs asynchronously, not suitable for real-time inference."},

{id:530,domain:"Fundamentals of AI and ML",difficulty:"HARD",type:"mcq",question:"A global e-commerce company has accumulated petabytes of customer transaction data collected over five years. None of the data has been manually labeled or categorized. The marketing team wants to group customers into distinct tiers based on natural patterns in their behavior. Which machine learning methodology is appropriate?",options:["Supervised learning, which trains a model on labeled input-output pairs.", "Unsupervised learning, which identifies hidden patterns and natural groupings in unlabeled data.", "Reinforcement learning, which trains an agent to maximize a reward signal through trial and error.", "Reinforcement learning from human feedback (RLHF), which uses human preferences to align model behavior."],answer:1,explanation:"The data is unlabeled and the goal is to discover natural groupings, which are the textbook characteristics of unsupervised learning. Clustering algorithms like K-Means, Hierarchical Clustering, or DBSCAN identify distinct customer segments from unlabeled transaction data. Supervised learning requires labeled data with known outcomes. Reinforcement learning involves sequential decision-making with reward signals. RLHF aligns LLM behavior with human preferences, not customer segmentation."},

{id:531,domain:"Fundamentals of AI and ML",difficulty:"HARD",type:"mcq",question:"A financial services company uses ML models to generate quarterly demand forecasts. The board of directors requires a transparency report that clearly explains how the model's input variables influence its predictions, understandable to non-technical stakeholders. What should the AI practitioner include in the report?",options:["The raw Python code used to train the model, including hyperparameter configurations.", "Partial Dependence Plots (PDPs) showing how each input feature affects the model's predicted output.", "A sample of the raw training dataset used to build the model.", "Model convergence tables showing loss and accuracy metrics across training epochs."],answer:1,explanation:"Partial Dependence Plots (PDPs) show visually how each input feature affects the model's prediction while holding all other features constant, making them understandable to non-technical stakeholders. Amazon SageMaker Clarify can automatically generate PDPs. Raw training code is not interpretable to board members. Training data samples show what the model was fed, not how it uses inputs. Convergence tables are internal development diagnostics, not explainability tools."},

{id:532,domain:"Fundamentals of Generative AI",difficulty:"HARD",type:"mcq",question:"A digital marketing agency is evaluating whether to incorporate generative AI into its production workflow. Which of the following represents a genuine generative AI use case?",options:["Strengthening network perimeter security by training an intrusion detection system on historical attack patterns.", "Generating photorealistic product lifestyle images from text descriptions written by the creative team.", "Improving database query response times through intelligent index selection and query optimization.", "Predicting next quarter's revenue by training a regression model on three years of historical sales data."],answer:1,explanation:"Generative AI models create new content that did not exist before — text, images, audio, video, code, or other modalities. Generating photorealistic product images from text descriptions is a defining use case of text-to-image generative AI, achievable through models like Stability AI's Stable Diffusion or Amazon's Titan Image Generator on Amazon Bedrock. Intrusion detection is classification and anomaly detection (traditional ML). Database optimization is a database engineering problem. Revenue prediction is regression analysis (traditional ML)."},

{id:533,domain:"Fundamentals of Generative AI",difficulty:"HARD",type:"mcq",question:"A SaaS company has integrated a large language model into its marketing platform. The content team notices a recurring problem: the model produces copy that reads confidently, uses specific-sounding statistics, and makes factual claims — but the statistics are fabricated and the factual claims are false. The model shows no uncertainty. Which AI failure mode does this describe?",options:["Data leakage — the model is exposing training data that it was not supposed to reproduce.", "Hallucination — the model generates plausible-sounding content that is factually incorrect or fabricated.", "Overfitting — the model has memorized training data so precisely that it cannot generalize to new inputs.", "Underfitting — the model is too simple to capture the complexity of the task."],answer:1,explanation:"Hallucination occurs when an LLM generates output that is confidently stated, plausible in form, but factually incorrect or fabricated. LLMs are optimized to produce text that sounds right, not text that is right. When a model does not know a specific fact, it generates the most plausible-sounding continuation rather than saying I don't know. Data leakage involves reproducing memorized training data verbatim. Overfitting causes poor generalization to new data. Underfitting produces incoherent or low-quality outputs."},

{id:534,domain:"Guidelines for Responsible AI",difficulty:"HARD",type:"multi",question:"A financial institution is building a generative AI system that automatically calculates and offers personalized discount rates to loan applicants. The system will make decisions that directly affect applicants' financial outcomes. The legal and compliance team requires that the AI system minimizes the risk of discriminatory outcomes across demographic groups and can be audited and explained to regulators. Which TWO actions should the AI team prioritize?",options:["Proactively analyze the training dataset to detect and address imbalances, disparities, or underrepresentation across demographic groups.", "Schedule the model to retrain more frequently so that it continuously incorporates newer data.", "Continuously evaluate the deployed model's behavior across demographic groups and provide transparent reporting to compliance stakeholders.", "Apply ROUGE scoring to the model's outputs to verify accuracy and ensure 100% precision.", "Monitor and optimize the model's inference latency to ensure predictions are returned within acceptable time limits."],answer:[0,2],explanation:"Proactively analyzing training data for imbalances addresses fairness at the data level, the most effective intervention point against discriminatory outcomes. Amazon SageMaker Clarify provides pre-training bias detection for this purpose. Continuously evaluating model behavior across demographic groups ensures fairness over time as populations change and enables transparent reporting to regulators. SageMaker Clarify also supports post-deployment bias monitoring. Increasing retraining frequency does not address bias. ROUGE scoring evaluates summarization quality, not fairness. Inference latency is a performance metric, not a fairness metric."},

{id:535,domain:"Security, Compliance, and Governance for AI",difficulty:"HARD",type:"mcq",question:"A company's AI model training script inadvertently logged authentication credentials to Amazon S3. The company needs to identify where this sensitive data is stored across its S3 buckets. Which AWS service should the company use?",options:["Apply output filters to sanitize all logs going forward.", "Use Amazon Macie to automatically discover and alert on sensitive data in S3.", "Encrypt all S3 buckets with AWS KMS.", "Enable AWS Config to track S3 bucket configuration changes."],answer:1,explanation:"Amazon Macie uses ML to automatically discover, classify, and protect sensitive data (PII, credentials, financial information) across Amazon S3. It can identify where credentials may have been stored and trigger alerts. Applying output filters addresses future logging but does not discover existing exposed credentials. Encrypting S3 buckets protects data from external access but does not identify or remediate sensitive data already stored. AWS Config tracks resource configuration changes, not sensitive data content."},

{id:536,domain:"Fundamentals of AI and ML",difficulty:"HARD",type:"mcq",question:"A fraud detection model has a recall of 0.95 and a precision of 0.40. What can be concluded from these metrics?",options:["The model misses most fraudulent transactions.", "The model generates many false alarms — legitimate transactions are frequently flagged as fraud.", "The model has balanced performance across both classes.", "The model has zero false negatives."],answer:1,explanation:"High recall (0.95) means the model catches 95% of actual fraud cases (few false negatives). Low precision (0.40) means only 40% of transactions flagged as fraud are actually fraudulent — 60% of flags are false alarms (false positives). This model is very aggressive in flagging potential fraud. Missing most fraud would produce low recall. Balanced performance would show similar precision and recall values. Zero false negatives would require recall = 1.0."},

{id:537,domain:"Applications of Foundation Models",difficulty:"HARD",type:"mcq",question:"A company fine-tuned a foundation model on Amazon Bedrock using their proprietary customer service transcripts to create a specialized support assistant. They are now ready to deploy the fine-tuned model to production for high-volume daily traffic. Which Amazon Bedrock option is REQUIRED to serve inference from this fine-tuned model?",options:["On-Demand pricing with standard API calls.", "Provisioned Throughput for the custom model.", "Amazon Bedrock batch inference jobs.", "Amazon SageMaker real-time inference endpoint."],answer:1,explanation:"Amazon Bedrock requires Provisioned Throughput to serve inference from fine-tuned (custom) models. Fine-tuned models cannot be invoked via On-Demand pricing — they require dedicated model units purchased under a 1-month or 6-month commitment. On-Demand is only available for base foundation models. Batch inference processes bulk jobs but fine-tuned models still require Provisioned Throughput to run. SageMaker endpoints serve SageMaker-trained models — models fine-tuned in Bedrock's customization workflow remain within the Bedrock service."}

const ROUNDS = 5;
const QUESTIONS_PER_ROUND = 15;
const ITERATIONS = 8;
const PASS_SCORE = 70;

let currentMode = 'learn';
let currentSection = 0;
let currentIteration = 0;
let currentRound = 0;
let answeredQuestions = {};

function init() {
  document.getElementById('questionCount').textContent = ALL_QUESTIONS.length + ' Q';
  document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleString();
  buildNav();
  showSection(0);
  loadNotes();
  document.getElementById('notesText').addEventListener('input', saveNotes);
}
function buildNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  let idx = 0;
  DOMAINS.forEach((d, di) => {
    const hdr = document.createElement('li');
    hdr.className = 'section-header';
    hdr.textContent = d.name + ' (' + d.weight + ')';
    nav.appendChild(hdr);
    CONTENT.filter(c => c.domain === di).forEach(c => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.textContent = c.title;
      a.dataset.index = idx;
      a.onclick = ((i) => () => showSection(i))(idx);
      li.appendChild(a);
      nav.appendChild(li);
      idx++;
    });
  });
}
function showSection(idx) {
  currentSection = idx;
  const c = CONTENT[idx];
  const area = document.getElementById('learnContent');
  area.innerHTML = '<h2>' + c.title + '</h2>' + c.content;
  document.querySelector('.main').scrollTop = 0;
  document.querySelectorAll('.nav-list a').forEach((a, i) => a.classList.toggle('active', i === idx));
  const total = CONTENT.length;
  document.getElementById('progressText').textContent = 'Section ' + (idx + 1) + ' of ' + total;
  document.getElementById('progressFill').style.width = ((idx + 1) / total * 100) + '%';
  area.innerHTML += '<div class="nav-buttons"><button class="prev" onclick="showSection(' + (idx - 1) + ')" ' + (idx === 0 ? 'disabled' : '') + '>&larr; Previous</button><button class="next" onclick="showSection(' + (idx + 1) + ')" ' + (idx >= total - 1 ? 'disabled' : '') + '>Next &rarr;</button></div>' +
    '<div class="notes-area"><h4>Notes for "' + c.title + '"</h4><textarea id="sectionNotes" placeholder="Add notes about this topic..." oninput="saveSectionNotes()"></textarea></div>';
  const saved = localStorage.getItem('sectionNotes_' + c.id);
  if (saved) document.getElementById('sectionNotes').value = saved;
}
function filterContent() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.nav-list li a').forEach(a => {
    a.parentElement.style.display = (!q || a.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.nav-list .section-header').forEach(h => {
    let s = h.nextElementSibling;
    let vis = false;
    while (s && s.tagName === 'LI') { if (s.style.display !== 'none') vis = true; s = s.nextElementSibling; }
    h.style.display = (!q || vis) ? '' : 'none';
  });
}
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('learnBtn').classList.toggle('active', mode === 'learn');
  document.getElementById('quizBtn').classList.toggle('active', mode === 'quiz');
  document.getElementById('sidebar').classList.toggle('hidden', mode === 'quiz');
  document.getElementById('learnContent').style.display = mode === 'learn' ? '' : 'none';
  document.getElementById('quizContent').style.display = mode === 'quiz' ? '' : 'none';
  if (mode === 'quiz') initQuiz();
}
function initQuiz() {
  const qc = document.getElementById('quizContent');
  qc.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:8px"><div class="iteration-selector" id="iterationSelector"></div><div style="display:flex;gap:8px;align-items:center"><button class="quiz-action-btn outline" id="viewResultsBtn" style="padding:4px 12px;font-size:.75rem" onclick="viewPastResults()">View Past Results</button><span style="font-size:.8rem;color:var(--text2)">Pass: ' + PASS_SCORE + '%</span><button class="quiz-action-btn danger" style="padding:4px 12px;font-size:.75rem" onclick="resetAll()">Reset All</button></div></div>' +
    '<div class="round-selector" id="roundSelector"></div><div id="quizArea"></div>';
  buildIterationSelector();
  buildRoundSelector();
  startIteration(0);
  updateViewResultsBtn();
}
function buildIterationSelector() {
  const c = document.getElementById('iterationSelector');
  c.innerHTML = '<span class="iter-label">Iteration:</span>';
  for (let i = 0; i < ITERATIONS; i++) {
    const s = JSON.parse(localStorage.getItem('aif_iter_' + i) || '{}');
    const wrapper = document.createElement('span');
    wrapper.style.display = 'inline-flex';
    wrapper.style.alignItems = 'center';
    wrapper.style.gap = '2px';
    const b = document.createElement('button');
    b.className = 'iter-btn' + (i === currentIteration ? ' active' : '');
    b.textContent = (i + 1);
    b.onclick = () => startIteration(i);
    if (s.complete) b.classList.add('completed');
    wrapper.appendChild(b);
    if (s.complete) {
      const r = document.createElement('button');
      r.className = 'iter-btn';
      r.style.cssText = 'padding:2px 6px;font-size:.65rem;min-width:unset';
      r.textContent = '\u{1F4CB}';
      r.title = 'View Iteration ' + (i + 1) + ' Results';
      r.onclick = (e) => { e.stopPropagation(); showIterationResultsFor(i); };
      wrapper.appendChild(r);
    }
    c.appendChild(wrapper);
  }
}
function buildRoundSelector() {
  const c = document.getElementById('roundSelector');
  c.innerHTML = '<span style="font-size:.82rem;color:var(--text2);font-weight:500;margin-right:6px;align-self:center">Round:</span>';
  for (let i = 0; i < ROUNDS; i++) {
    const b = document.createElement('button');
    b.className = 'round-btn' + (i === currentRound ? ' active' : '');
    b.textContent = 'Round ' + (i + 1);
    b.onclick = () => startRound(i);
    const rk = 'aif_iter_' + currentIteration + '_round_' + i;
    const rs = JSON.parse(localStorage.getItem(rk) || '{}');
    if (rs.complete) b.classList.add('completed');
    c.appendChild(b);
  }
}
function startIteration(iter) {
  currentIteration = iter;
  currentRound = 0;
  document.querySelectorAll('.iter-btn').forEach((b, i) => b.classList.toggle('active', i === iter));
  buildRoundSelector();
  startRound(0);
  updateViewResultsBtn();
}
function startRound(round) {
  currentRound = round;
  document.querySelectorAll('.round-btn').forEach((b, i) => b.classList.toggle('active', i === round));
  const seed = currentIteration * ROUNDS + round;
  const questions = getQuestionsForRound(seed);
  const key = 'aif_iter_' + currentIteration + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  if (saved.complete && saved.submitted) { /* ok */ }
  answeredQuestions = saved.answers || {};
  renderQuiz(questions, round, saved);
}
function getQuestionsForRound(seed) {
  const shuffled = [...ALL_QUESTIONS];
  let s = (seed * 2654435761) >>> 0;
  for (let i = shuffled.length - 1; i > 0; i--) {
    s = (s ^ (s << 13)) >>> 0;
    s = (s ^ (s >> 17)) >>> 0;
    s = (s ^ (s << 5)) >>> 0;
    const j = s % (i + 1);
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const start = (seed * 17) % shuffled.length;
  const result = [];
  for (let i = 0; i < QUESTIONS_PER_ROUND; i++) {
    result.push(shuffled[(start + i) % shuffled.length]);
  }
  return result;
}
function renderQuiz(questions, round, saved) {
  const area = document.getElementById('quizArea');
  const allAnswered = questions.every(q => answeredQuestions[q.id] !== undefined);
  const answeredCount = questions.filter(q => answeredQuestions[q.id] !== undefined).length;
  let html = '<div class="quiz-header">' +
    '<div class="stat"><div class="num">' + (currentIteration + 1) + '/' + ITERATIONS + '</div><div class="label">Iteration</div></div>' +
    '<div class="stat"><div class="num">' + (round + 1) + '/' + ROUNDS + '</div><div class="label">Round</div></div>' +
    '<div class="stat"><div class="num">' + answeredCount + '/' + questions.length + '</div><div class="label">Answered</div></div>' +
    '<div class="quiz-progress"><div class="fill" style="width:' + (answeredCount / questions.length * 100) + '%"></div></div></div>';
  if (saved.complete && saved.submitted) {
    const res = getRoundResults(currentIteration, round);
    html += renderResultSummary(res);
  }
  questions.forEach((q, qi) => {
    const isMulti = Array.isArray(q.answer);
    const isCorrect = answeredQuestions[q.id] && answeredQuestions[q.id].correct;
    const selected = answeredQuestions[q.id] ? answeredQuestions[q.id].selected : null;
    const submitted = answeredQuestions[q.id] && answeredQuestions[q.id].correct !== undefined;
    const optLabels = 'ABCDEFGH';
    let diffClass = 'medium';
    if (q.difficulty === 'EASY') diffClass = 'easy';
    else if (q.difficulty === 'HARD') diffClass = 'hard';
    html += '<div class="question-card">' +
      '<div class="q-domain">' + q.domain + '</div>' +
      '<div class="q-num">Question ' + (qi + 1) + ' of ' + questions.length + ' <span class="q-difficulty ' + diffClass + '">' + q.difficulty + '</span></div>' +
      '<div class="q-text">' + q.question.replace(/\n/g, '<br>') + '</div>' +
      (isMulti ? '<div class="q-instruction">(Select TWO.)</div>' : '') +
      (q.type === 'order' ? '<div class="q-instruction">(Order the steps. Use arrows to reorder.)</div>' : '');
    if (q.type === 'order') {
      const order = selected || q.options.map((_, i) => i);
      html += '<div class="order-options" id="opts-' + q.id + '">';
      order.forEach((oi, pos) => {
        const opt = q.options[oi];
        html += '<div class="order-option">' +
          '<div class="order-num' + (submitted ? ' placed' : '') + '">' + (submitted ? '' : (pos + 1)) + '</div>' +
          '<div class="order-label">' + optLabels[oi] + '.</div>' +
          '<div class="order-text">' + opt + '</div>' +
          (!submitted ? '<div class="order-btns"><button onclick="moveOrderItem(' + q.id + ',' + pos + ',-1)" ' + (pos === 0 ? 'disabled' : '') + '>&#9650;</button><button onclick="moveOrderItem(' + q.id + ',' + pos + ',1)" ' + (pos === order.length - 1 ? 'disabled' : '') + '>&#9660;</button></div>' : '') +
          '</div>';
      });
      html += '</div>';
      if (submitted) {
        const correctOrder = q.answer.map(i => optLabels[i]).join(', ');
        const userOrder = order.map(i => optLabels[i]).join(', ');
        const isOrderCorrect = JSON.stringify(order) === JSON.stringify(q.answer);
        html += '<div class="feedback show ' + (isOrderCorrect ? 'correct' : 'wrong') + '">' +
          '<div class="ans">' + (isOrderCorrect ? 'Correct!' : 'Incorrect') + '</div>' +
          '<div class="expl"><strong>Correct Order: ' + correctOrder + '</strong><br>' + q.explanation + '</div></div>';
      } else {
        html += '<div class="feedback" id="fb-' + q.id + '"></div>';
      }
    } else {
      html += '<div class="options" id="opts-' + q.id + '">';
      q.options.forEach((opt, oi) => {
        let cls = 'option';
        if (submitted) cls += ' disabled';
        if (submitted && isMulti) {
          if (q.answer.indexOf(oi) > -1) cls += ' correct';
          else if (selected && selected.indexOf && selected.indexOf(oi) > -1) cls += ' wrong';
        } else if (submitted) {
          if (oi === q.answer) cls += ' correct';
          else if (oi === selected) cls += ' wrong';
        } else if (selected !== null) {
          if (isMulti && selected && selected.indexOf && selected.indexOf(oi) > -1) cls += ' selected';
          else if (!isMulti && oi === selected) cls += ' selected';
        }
        const checked = submitted && selected !== null ? (isMulti ? (selected && selected.indexOf && selected.indexOf(oi) > -1) : oi === selected) : false;
        html += '<label class="' + cls + '" onclick="' + (submitted ? '' : 'selectOption(' + q.id + ',' + oi + ',' + isMulti + ')') + '">' +
          '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="q' + q.id + '" value="' + oi + '" ' + (checked ? 'checked' : '') + ' ' + (submitted ? 'disabled' : '') + '>' +
          '<span class="opt-label">' + optLabels[oi] + '.</span><span>' + opt + '</span></label>';
      });
      html += '</div>';
    }
    if (submitted) {
      const ansTxt = isMulti ? q.answer.map(i => optLabels[i]).join(', ') : optLabels[q.answer] + '. ' + q.options[q.answer];
      html += '<div class="feedback show ' + (isCorrect ? 'correct' : 'wrong') + '">' +
        '<div class="ans">' + (isCorrect ? 'Correct!' : 'Incorrect') + '</div>' +
        '<div class="expl"><strong>Correct Answer: ' + ansTxt + '</strong><br>' + q.explanation + '</div></div>';
    } else {
      html += '<div class="feedback" id="fb-' + q.id + '"></div>';
    }
    html += '</div>';
  });
  if (!saved.complete || !saved.submitted) {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="quiz-action-btn primary" id="submitBtn" onclick="submitRound(' + round + ')" ' + (!allAnswered ? 'disabled' : '') + '>Submit Round</button></div>';
  } else {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="quiz-action-btn warning" onclick="retakeRound(' + round + ')">Retake This Round</button></div>';
  }
  area.innerHTML = html;
}
function moveOrderItem(qId, pos, dir) {
  if (answeredQuestions[qId] && answeredQuestions[qId].correct !== undefined) return;
  let order = answeredQuestions[qId] ? (answeredQuestions[qId].selected || [...Array(answeredQuestions[qId].selected ? answeredQuestions[qId].selected.length : 0).keys()]) : null;
  if (!order) {
    const opts = document.querySelectorAll('#opts-' + qId + ' .order-option');
    order = Array.from(opts).map((_, i) => i);
  }
  const newPos = pos + dir;
  if (newPos < 0 || newPos >= order.length) return;
  [order[pos], order[newPos]] = [order[newPos], order[pos]];
  answeredQuestions[qId] = {selected: order};
  const key = 'aif_iter_' + currentIteration + '_round_' + currentRound;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  saved.answers = answeredQuestions;
  localStorage.setItem(key, JSON.stringify(saved));
  const questions = getQuestionsForRound(currentIteration * ROUNDS + currentRound);
  renderQuiz(questions, currentRound, saved);
}
function selectOption(qId, optIdx, isMulti) {
  if (answeredQuestions[qId] && answeredQuestions[qId].correct !== undefined) return;
  if (isMulti) {
    if (!answeredQuestions[qId]) answeredQuestions[qId] = {selected:[]};
    const arr = answeredQuestions[qId].selected;
    const idx = arr.indexOf(optIdx);
    if (idx > -1) arr.splice(idx, 1); else arr.push(optIdx);
    document.querySelectorAll('#opts-' + qId + ' .option').forEach((o, i) => {
      const sel = answeredQuestions[qId].selected;
      o.classList.toggle('selected', sel.indexOf(i) > -1);
      o.querySelector('input').checked = sel.indexOf(i) > -1;
    });
  } else {
    answeredQuestions[qId] = {selected: optIdx};
    document.querySelectorAll('#opts-' + qId + ' .option').forEach((o, i) => {
      o.classList.toggle('selected', i === optIdx);
      o.querySelector('input').checked = i === optIdx;
    });
  }
  const key = 'aif_iter_' + currentIteration + '_round_' + currentRound;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  saved.answers = answeredQuestions;
  localStorage.setItem(key, JSON.stringify(saved));
  const questions = getQuestionsForRound(currentIteration * ROUNDS + currentRound);
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = !questions.every(q => answeredQuestions[q.id] !== undefined);
  const progress = Object.keys(answeredQuestions).length / questions.length * 100;
  const pf = document.querySelector('.quiz-progress .fill');
  if (pf) pf.style.width = progress + '%';
}
function submitRound(round) {
  const key = 'aif_iter_' + currentIteration + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  const questions = getQuestionsForRound(currentIteration * ROUNDS + round);
  let correctCount = 0;
  questions.forEach(q => {
    const ans = answeredQuestions[q.id];
    if (!ans) return;
    if (q.type === 'order') {
      const sel = ans.selected || [];
      ans.correct = JSON.stringify(sel) === JSON.stringify(q.answer);
      if (ans.correct) correctCount++;
    } else if (Array.isArray(q.answer)) {
      const sel = Array.isArray(ans.selected) ? ans.selected.slice().sort() : [ans.selected].sort();
      const cor = [...q.answer].sort();
      ans.correct = JSON.stringify(sel) === JSON.stringify(cor);
      if (ans.correct) correctCount++;
    } else {
      ans.correct = ans.selected === q.answer;
      if (ans.correct) correctCount++;
    }
  });
  saved.answers = answeredQuestions;
  saved.complete = true;
  saved.submitted = true;
  saved.score = correctCount;
  saved.total = questions.length;
  localStorage.setItem(key, JSON.stringify(saved));
  document.querySelectorAll('.round-btn').forEach((b, i) => { if (i === round) b.classList.add('completed'); });
  renderQuiz(questions, round, saved);
  updateIterationProgress();
  const allDone = Array.from(document.querySelectorAll('.round-btn')).every(b => b.classList.contains('completed'));
  if (allDone) showIterationResults();
}
function retakeRound(round) {
  const key = 'aif_iter_' + currentIteration + '_round_' + round;
  localStorage.removeItem(key);
  answeredQuestions = {};
  document.querySelectorAll('.round-btn').forEach((b, i) => { if (i === round) b.classList.remove('completed'); });
  startRound(round);
}
function getRoundResults(iter, round) {
  const key = 'aif_iter_' + iter + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.complete) return null;
  return { score: saved.score, total: saved.total, pct: Math.round(saved.score / saved.total * 100) };
}
function renderResultSummary(res) {
  if (!res) return '';
  const pcls = res.pct >= PASS_SCORE ? 'pass' : 'fail';
  return '<div style="margin-top:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-align:center">' +
    '<div style="font-size:.85rem;color:var(--text2)">Round Score</div>' +
    '<div style="font-size:2rem;font-weight:700;color:' + (res.pct >= PASS_SCORE ? 'var(--success)' : 'var(--error)') + '">' + res.score + '/' + res.total + ' (' + res.pct + '%)</div>' +
    '<div style="font-size:.85rem;margin-top:4px;color:' + (res.pct >= PASS_SCORE ? 'var(--success)' : 'var(--error)') + ';font-weight:600">' + (res.pct >= PASS_SCORE ? 'PASS' : 'FAIL') + '</div></div>';
}
function updateIterationProgress() {
  let total = 0, correct = 0;
  for (let r = 0; r < ROUNDS; r++) {
    const rs = JSON.parse(localStorage.getItem('aif_iter_' + currentIteration + '_round_' + r) || '{}');
    if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
  }
  if (total === ROUNDS * QUESTIONS_PER_ROUND) {
    const pct = Math.round(correct / total * 100);
    localStorage.setItem('aif_iter_' + currentIteration, JSON.stringify({complete:true, score:pct}));
    document.querySelectorAll('.iter-btn')[currentIteration].classList.add('completed');
  }
}
function showIterationResults() {
  const area = document.getElementById('quizArea');
  let total = 0, correct = 0;
  const domainScores = {};
  const allAnswered = {};
  for (let r = 0; r < ROUNDS; r++) {
    const rs = JSON.parse(localStorage.getItem('aif_iter_' + currentIteration + '_round_' + r) || '{}');
    if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
    if (rs.answers) Object.assign(allAnswered, rs.answers);
  }
  ALL_QUESTIONS.forEach(q => {
    if (allAnswered[q.id] !== undefined) {
      const d = DOMAIN_ALIASES[q.domain] || q.domain;
      if (!domainScores[d]) domainScores[d] = {correct:0,total:0};
      domainScores[d].total++;
      if (allAnswered[q.id].correct) domainScores[d].correct++;
    }
  });
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const pcls = pct >= PASS_SCORE ? 'pass' : 'fail';
  let html = '<div class="results-card"><h2>Iteration ' + (currentIteration + 1) + ' Complete</h2>' +
    '<div style="font-size:.9rem;color:var(--text2);margin-bottom:4px">Total Score (all 5 rounds)</div>' +
    '<div class="big-score ' + pcls + '">' + correct + '/' + total + '</div>' +
    '<div class="sub">' + pct + '% - ' + (pct >= PASS_SCORE ? 'PASSED' : 'FAILED') + '</div>';
  let weakDomains = [];
  html += '<div class="domain-breakdown"><h4>Domain Performance</h4>';
  DOMAINS.forEach(d => {
    const ds = domainScores[d.short] || domainScores[d.name] || {correct:0,total:0};
    const dpct = ds.total > 0 ? Math.round(ds.correct/ds.total*100) : 0;
    const color = dpct >= 80 ? '#2ecc71' : dpct >= 60 ? '#f39c12' : '#e74c3c';
    html += '<div class="domain-row"><span>' + d.short + '</span>' +
      '<div class="bar-container"><div class="bar-fill" style="width:' + dpct + '%;background:' + color + '"></div></div>' +
      '<span class="score" style="color:' + color + '">' + ds.correct + '/' + ds.total + ' (' + dpct + '%)</span></div>';
    if (ds.total > 0 && dpct < PASS_SCORE) weakDomains.push(d.short);
  });
  html += '</div>';
  if (weakDomains.length > 0) {
    html += '<div class="improve-section"><h4>Areas Needing Improvement</h4><p>Focus more study on:</p><ul>';
    weakDomains.forEach(d => html += '<li><strong>' + d + '</strong></li>');
    html += '</ul></div>';
  } else {
    html += '<div class="improve-section" style="background:#e8f8f0;border-color:var(--success)"><h4 style="color:var(--success)">Strong Performance!</h4><p>You\'re performing well across all domains. Keep it up!</p></div>';
  }
  html += '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
    '<button class="quiz-action-btn outline" onclick="retakeIteration(' + currentIteration + ')">Retake All Rounds</button>' +
    '<button class="quiz-action-btn success" onclick="showWrongAnswers(' + currentIteration + ')">Review Wrong Answers</button>' +
    '<button class="quiz-action-btn warning" onclick="startNextIteration()">' + (currentIteration < ITERATIONS - 1 ? 'Start Iteration ' + (currentIteration + 2) : 'All Complete') + '</button></div></div>';
  area.innerHTML = html;
}
function updateViewResultsBtn() {
  const btn = document.getElementById('viewResultsBtn');
  if (!btn) return;
  let hasResults = false;
  for (let i = 0; i < ITERATIONS; i++) {
    const s = JSON.parse(localStorage.getItem('aif_iter_' + i) || '{}');
    if (s.complete) { hasResults = true; break; }
  }
  btn.style.display = hasResults ? '' : 'none';
}
function viewPastResults() {
  const area = document.getElementById('quizArea');
  let html = '<div class="results-card"><h2>Past Iteration Results</h2><div class="sub">Click an iteration to view its detailed results.</div>';
  let anyComplete = false;
  for (let i = 0; i < ITERATIONS; i++) {
    const s = JSON.parse(localStorage.getItem('aif_iter_' + i) || '{}');
    if (s.complete) {
      anyComplete = true;
      let total = 0, correct = 0;
      for (let r = 0; r < ROUNDS; r++) {
        const rs = JSON.parse(localStorage.getItem('aif_iter_' + i + '_round_' + r) || '{}');
        if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
      }
      const p = total > 0 ? Math.round(correct / total * 100) : 0;
      const c = p >= PASS_SCORE ? 'var(--success)' : 'var(--error)';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin:6px 0;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s" onmouseover="this.style.background=\'#f0f4ff\'" onmouseout="this.style.background=\'var(--card)\'" onclick="showIterationResultsFor(' + i + ')">' +
        '<span style="font-weight:600">Iteration ' + (i + 1) + '</span>' +
        '<span style="color:' + c + ';font-weight:600">' + correct + '/' + total + ' (' + p + '%) ' + (p >= PASS_SCORE ? 'PASS' : 'FAIL') + '</span></div>';
    }
  }
  if (!anyComplete) {
    html += '<div class="sub" style="margin-top:12px">No completed iterations yet. Complete a full iteration to see results here.</div>';
  }
  html += '<div style="margin-top:16px"><button class="quiz-action-btn primary" onclick="startIteration(' + currentIteration + ')">Back to Quiz</button></div></div>';
  area.innerHTML = html;
  document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.iter-btn').forEach(b => b.classList.remove('active'));
}
function showIterationResultsFor(iter) {
  const prevIteration = currentIteration;
  currentIteration = iter;
  showIterationResults();
  currentIteration = prevIteration;
}
function showWrongAnswers(iter) {
  const area = document.getElementById('quizArea');
  const allAnswered = {};
  for (let r = 0; r < ROUNDS; r++) {
    const rs = JSON.parse(localStorage.getItem('aif_iter_' + iter + '_round_' + r) || '{}');
    if (rs.answers) Object.assign(allAnswered, rs.answers);
  }
  const wrong = ALL_QUESTIONS.filter(q => allAnswered[q.id] !== undefined && !allAnswered[q.id].correct);
  if (wrong.length === 0) {
    area.innerHTML = '<div class="results-card"><h2>Perfect Score!</h2><div class="sub">You answered all questions correctly in this iteration.</div>' +
      '<div style="margin-top:16px"><button class="quiz-action-btn primary" onclick="showIterationResults()">Back to Results</button></div></div>';
    return;
  }
  const optLabels = 'ABCDEFGH';
  let html = '<div class="results-card" style="margin-bottom:16px"><h2>Wrong Answers Review (Iteration ' + (iter + 1) + ')</h2>' +
    '<div class="sub">' + wrong.length + ' question' + (wrong.length > 1 ? 's' : '') + ' answered incorrectly</div>' +
    '<button class="quiz-action-btn primary" onclick="showIterationResults()" style="margin-top:8px">Back to Results</button></div>';
  wrong.forEach((q, wi) => {
    const ans = allAnswered[q.id];
    const isMulti = Array.isArray(q.answer);
    const isOrder = q.type === 'order';
    const userSel = ans ? ans.selected : null;
    const diffClass = q.difficulty === 'EASY' ? 'easy' : q.difficulty === 'HARD' ? 'hard' : 'medium';
    let userAnsHtml, correctAnsHtml;
    if (isOrder) {
      const userOrder = (userSel || []).map(i => optLabels[i]).join(', ');
      const correctOrder = q.answer.map(i => optLabels[i]).join(', ');
      userAnsHtml = '<div class="rev-user-ans"><strong>Your order:</strong> ' + userOrder + '</div>';
      correctAnsHtml = '<div class="rev-correct-ans"><strong>Correct order:</strong> ' + correctOrder + '</div>';
    } else if (isMulti) {
      const userAns = (userSel || []).map(i => optLabels[i] + '. ' + q.options[i]).join('; ');
      const correctAns = q.answer.map(i => optLabels[i] + '. ' + q.options[i]).join('; ');
      userAnsHtml = userSel && userSel.length ? '<div class="rev-user-ans"><strong>You selected:</strong> ' + userAns + '</div>' : '<div class="rev-user-ans"><strong>You selected:</strong> (none)</div>';
      correctAnsHtml = '<div class="rev-correct-ans"><strong>Correct answer:</strong> ' + correctAns + '</div>';
    } else {
      const userAns = userSel !== null ? optLabels[userSel] + '. ' + q.options[userSel] : '(none)';
      const correctAns = optLabels[q.answer] + '. ' + q.options[q.answer];
      userAnsHtml = '<div class="rev-user-ans"><strong>You selected:</strong> ' + userAns + '</div>';
      correctAnsHtml = '<div class="rev-correct-ans"><strong>Correct answer:</strong> ' + correctAns + '</div>';
    }
    let whyWrong = '';
    if (!isOrder && !isMulti && userSel !== null && userSel !== q.answer) {
      const chosen = q.options[userSel];
      const correct = q.options[q.answer];
      whyWrong = '<div class="rev-expl"><strong>Why your answer was wrong:</strong> You chose "' + chosen + '", but the correct answer is "' + correct + '". ' + q.explanation + '</div>';
    } else if (!isOrder && isMulti && userSel && userSel.length) {
      const wrongSel = userSel.filter(i => !q.answer.includes(i));
      const missedSel = q.answer.filter(i => !userSel.includes(i));
      let whyParts = [];
      if (wrongSel.length) whyParts.push('you selected option(s) that were not correct: ' + wrongSel.map(i => optLabels[i] + ' (' + q.options[i] + ')').join(', '));
      if (missedSel.length) whyParts.push('you missed option(s) that were correct: ' + missedSel.map(i => optLabels[i] + ' (' + q.options[i] + ')').join(', '));
      whyWrong = '<div class="rev-expl"><strong>Why your answer was wrong:</strong> ' + whyParts.join('; ') + '. ' + q.explanation + '</div>';
    } else if (isOrder) {
      const userOrder = userSel || [];
      const correctOrder = q.answer;
      const misplaced = userOrder.filter((v, i) => v !== correctOrder[i]);
      if (misplaced.length) {
        whyWrong = '<div class="rev-expl"><strong>Why your answer was wrong:</strong> The items were not in the correct sequence. ' + q.explanation + '</div>';
      } else {
        whyWrong = '<div class="rev-expl"><strong>Explanation:</strong> ' + q.explanation + '</div>';
      }
    } else {
      whyWrong = '<div class="rev-expl"><strong>Explanation:</strong> ' + q.explanation + '</div>';
    }
    html += '<div class="review-card">' +
      '<div><span class="rev-domain">' + q.domain + '</span><span class="q-difficulty ' + diffClass + '">' + q.difficulty + '</span></div>' +
      '<div class="rev-q-text">' + (wi + 1) + '. ' + q.question.replace(/\n/g, '<br>') + '</div>' +
      userAnsHtml + correctAnsHtml + whyWrong + '</div>';
  });
  html += '<div style="text-align:center;margin-top:16px"><button class="quiz-action-btn primary" onclick="showIterationResults()">Back to Results</button></div>';
  area.innerHTML = html;
}
function retakeIteration(iter) {
  for (let r = 0; r < ROUNDS; r++) localStorage.removeItem('aif_iter_' + iter + '_round_' + r);
  localStorage.removeItem('aif_iter_' + iter);
  startIteration(iter);
}
function startNextIteration() {
  if (currentIteration < ITERATIONS - 1) { startIteration(currentIteration + 1); return; }
  updateViewResultsBtn();
  const area = document.getElementById('quizArea');
  let html = '<div class="results-card"><h2>All ' + ITERATIONS + ' Iterations Complete!</h2><div class="sub">You have completed ' + ITERATIONS + ' iterations of 5 rounds each (' + (ROUNDS * QUESTIONS_PER_ROUND * ITERATIONS) + ' questions total).</div>';
  let grandTotal = 0, grandCorrect = 0;
  html += '<div style="margin:20px 0;text-align:left"><h4>Progress Summary</h4>';
  for (let i = 0; i < ITERATIONS; i++) {
    let total = 0, correct = 0;
    for (let r = 0; r < ROUNDS; r++) {
      const rs = JSON.parse(localStorage.getItem('aif_iter_' + i + '_round_' + r) || '{}');
      if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
    }
    grandTotal += total; grandCorrect += correct;
    const p = total > 0 ? Math.round(correct/total*100) : 0;
    const c = p >= PASS_SCORE ? 'var(--success)' : 'var(--error)';
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>Iteration ' + (i+1) + '</span><span style="color:' + c + ';font-weight:600">' + correct + '/' + total + ' (' + p + '%)</span></div>';
  }
  const gp = grandTotal > 0 ? Math.round(grandCorrect/grandTotal*100) : 0;
  const gc = gp >= PASS_SCORE ? 'var(--success)' : 'var(--error)';
  html += '<div style="margin-top:12px;display:flex;justify-content:space-between;font-size:1.1rem;padding-top:8px;border-top:2px solid var(--primary)"><strong>Overall</strong><strong style="color:' + gc + '">' + grandCorrect + '/' + grandTotal + ' (' + gp + '%)</strong></div></div>';
  html += '<div style="margin-top:8px"><button class="quiz-action-btn danger" onclick="resetAll()">Reset All Progress</button></div></div>';
  area.innerHTML = html;
}
function resetAll() {
  if (!confirm('Reset ALL quiz progress? This cannot be undone.')) return;
  for (let i = 0; i < ITERATIONS; i++) {
    for (let r = 0; r < ROUNDS; r++) localStorage.removeItem('aif_iter_' + i + '_round_' + r);
    localStorage.removeItem('aif_iter_' + i);
  }
  currentIteration = 0; currentRound = 0; answeredQuestions = {};
  initQuiz();
}
function saveNotes() {
  const t = document.getElementById('notesText').value;
  localStorage.setItem('aif_global_notes', t);
  document.getElementById('notesStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
}
function loadNotes() {
  const s = localStorage.getItem('aif_global_notes');
  if (s) document.getElementById('notesText').value = s;
}
function clearNotes() {
  if (confirm('Clear all notes?')) { document.getElementById('notesText').value = ''; localStorage.removeItem('aif_global_notes'); document.getElementById('notesStatus').textContent = 'Cleared'; }
}
function toggleNotes() { document.getElementById('notesPanel').classList.toggle('show'); }
function saveSectionNotes() {
  const c = CONTENT[currentSection];
  if (c) localStorage.setItem('sectionNotes_' + c.id, document.getElementById('sectionNotes').value);
}
document.addEventListener('DOMContentLoaded', init);
</script>
