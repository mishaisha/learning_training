{id:299,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company wants to improve the performance of a Foundation Model (FM) being used in Amazon Bedrock. Which of the following lists the underlying techniques in the increasing order of complexity for implementing a solution?",options:["Prompt engineering, Fine-tuning, Retrieval Augmented Generation (RAG)", "Prompt engineering, Retrieval Augmented Generation (RAG), Fine-tuning", "Retrieval Augmented Generation (RAG), Fine-tuning, Prompt engineering", "Retrieval Augmented Generation (RAG), Prompt engineering, Fine-tuning"],answer:1,explanation:"Prompt engineering, Retrieval Augmented Generation (RAG), Fine-tuning Prompt engineering is the practice of carefully designing prompts to efficiently tap into the capabilities of FMs. It involves the use of prompts, which are short pieces of text that guide the model to generate more accurate and relevant responses. With prompt engineering, you can improve the performance of FMs and make them more effective for a variety of applications. Retrieval Augmented Generation (RAG) allows you to customize a model's responses when you want the model to consider new knowledge or up-to-date information. When your data changes frequently, like inventory or pricing, it's not practical to fine-tune and update the model while it's serving user queries. To equip the FM with up-to-date proprietary information, organizations turn to RAG, a technique that involves fetching data from company data sources and enriching the prompt with that data to deliver more relevant and accurate responses. RAG produces quality results, due to augmenting use case-specific context directly from vectorized data stores. Compared to prompt engineering, it produces vastly improved results with massively low chances of hallucinations. RAG has a higher complexity than prompt engineering because you need to have coding and architecture skills to implement this solution. 'via -'https://aws.amazon.com/blogs/machine-learning/best-practices-to-build-generative-ai-applications-on-aws/ Fine-tuning is the process of taking a pre-trained FM, such as Llama 2, and further training it on a downstream task with a dataset specific to that task. The pre-trained model provides general linguistic knowledge, and fine-tuning allows it to specialize and improve performance on a particular task like text classification, question answering, or text generation. With fine-tuning, you provide labeled datasets'which are annotated with additional context'to train the model on specific tasks. Model customization - such as fine-tuning - has higher complexity than prompt engineering and RAG because the model's weight and parameters are being changed via tuning scripts, which requires data science and ML expertise. 'via -'https://aws.amazon.com/blogs/machine-learning/best-practices-to-build-generative-ai-applications-on-aws/"},
{id:300,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A technology startup is building an AI-powered recommendation system and wants to streamline the development process. The product team is trying to understand the distinction between machine learning (ML) algorithms and ML models. Clarifying this difference will help the team better structure their project workflow. What do you recommend?",options:["An ML algorithm is a set of mathematical instructions for solving a specific type of problem, while an ML model is the output of the algorithm after being trained on data", "An ML algorithm is responsible for the security of the machine learning pipeline, while an ML model manages data preprocessing", "An ML algorithm is a pre-trained neural network, while an ML model is the raw data used to train the algorithm", "An ML algorithm is used for storing large datasets, whereas an ML model is used for deploying applications"],answer:0,explanation:"An ML algorithm is a set of mathematical instructions for solving a specific type of problem, while an ML model is the output of the algorithm after being trained on data The central idea behind machine learning is an existing mathematical relationship between any input and output data combination. The machine learning model does not know this relationship in advance but can guess if sufficient examples of input-output data sets are given. This means every machine learning algorithm is built around a modifiable math function. So, an ML algorithm is a set of mathematical instructions or procedures used to solve specific types of problems by learning from data. The preprocessed data is used to train the machine learning algorithm. The algorithm tries to iteratively identify the mathematical correlation between the input and expected output from the training data. The model learns patterns and relationships within the data, encapsulating this knowledge in its parameters. It adjusts parameters to minimize the difference between its predictions and the actual outcomes known in the training data. So, an ML model is the output generated by the algorithm after it has been trained on a dataset. The model can then be used to make predictions or decisions based on new data. 'via -'https://aws.amazon.com/what-is/machine-learning/"},
{id:301,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A logistics company is building machine learning models using Amazon SageMaker to predict delivery times and optimize routes. The data science team needs to clean and preprocess large datasets efficiently but wants to minimize manual coding to speed up development. They are looking for an Amazon SageMaker service that offers built-in data transformations, allowing them to quickly prepare the data without writing code. Which of the following options is the best-fit for these requirements?",options:["Amazon SageMaker Ground Truth", "Amazon SageMaker Clarify", "Amazon SageMaker Data Wrangler", "Amazon SageMaker Feature Store"],answer:2,explanation:"Amazon SageMaker Data Wrangler Amazon SageMaker Data Wrangler reduces the time it takes to aggregate and prepare tabular and image data for ML from weeks to minutes. With SageMaker Data Wrangler, you can simplify the process of data preparation and feature engineering, and complete each step of the data preparation workflow (including data selection, cleansing, exploration, visualization, and processing at scale) from a single visual interface. You can use SQL to select the data that you want from various data sources and import it quickly. Next, you can use the data quality and insights report to automatically verify data quality and detect anomalies, such as duplicate rows and target leakage. SageMaker Data Wrangler contains over 300 built-in data transformations, so you can quickly transform data without writing any code. SageMaker Data Wrangler offers a selection of over 300 prebuilt, PySpark-based data transformations, so you can transform your data and scale your data preparation workflow without writing a single line of code. Preconfigured transformations cover common use cases such as flattening JSON files, deleting duplicate rows, imputing missing data with mean or median, one hot encoding, and time-series'specific transformers to accelerate the preparation of time-series data for ML. Prebuilt transformations in Data Wrangler:' 'via -'https://aws.amazon.com/sagemaker/data-wrangler/"},
{id:302,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A tech company is integrating generative AI into its customer support system to automatically answer user queries. During testing, the team notices that the AI occasionally generates responses that sound convincing but contain inaccurate information. To address this issue, the team needs to understand the phenomenon where a generative AI model produces information that may appear plausible but is factually incorrect. What is this phenomenon called?",options:["Hallucination", "Fairness", "Explainability", "Controllability"],answer:0,explanation:"Hallucination Generative AI models are as reliable as the data they're trained on and can access. There is a risk of hallucination, which is when the models make something up that may sound plausible and factual but which may not be correct. Any organizations or teams that use generative AI to make decisions or prioritize actions, must build responsible AI systems that are fair, explainable, robust, secure, transparent, and that safeguard privacy."},
{id:303,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A financial services company relies on several Independent Software Vendors (ISVs) for key operational applications and needs to maintain up-to-date compliance records to meet regulatory requirements. To streamline its compliance management process, the company wants to receive email notifications whenever new ISV compliance reports, such as SOC 2 or ISO certifications, become available, ensuring that its compliance team is promptly informed and can take necessary actions. Which AWS service would be most suitable for automatically providing these notifications?",options:["The company should use AWS Trusted Advisor to receive notification alerts for best practices and recommendations to optimize AWS resources", "The company should use AWS Artifact to facilitate on-demand access to AWS compliance reports and agreements, as well as allow users to receive notifications when new compliance documents or reports, including ISV compliance reports, are available", "The company should use AWS Audit Manager and leverage its integration with Amazon Simple Notification Service (Amazon SNS) to receive notifications when the compliance reports are available", "The company should use AWS Config to enable continuous monitoring of AWS resource configurations to ensure compliance with best practices and internal policies. Leverage the ntegration with Amazon Simple Notification Service (Amazon SNS) to receive notifications when the compliance reports are available"],answer:1,explanation:"The company should use AWS Artifact to facilitate on-demand access to AWS compliance reports and agreements, as well as allow users to receive notifications when new compliance documents or reports, including ISV compliance reports, are available This is the correct option because AWS Artifact is specifically designed to provide access to a wide range of AWS compliance reports, including those from Independent Software Vendors (ISVs). AWS Artifact allows users to configure settings to receive notifications when new compliance documents or reports are available. This capability makes it an ideal choice for a company that needs timely email alerts regarding the availability of ISV compliance reports. The new third-party reports tab on the AWS Artifact Reports page provides on-demand access to security compliance reports of Independent Software Vendors (ISVs) who sell their products through AWS Marketplace. You can subscribe to notifications and create configurations to get notified when a new report or agreement, or a new version of an existing report or agreement becomes available on AWS Artifact."},
{id:304,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A social media company is planning to implement a large language model (LLM) for content moderation to automatically flag inappropriate or harmful content. To ensure the model is fair and does not show bias or discrimination against specific groups or individuals, the company needs to evaluate the model's outputs regularly for potential bias. The team is considering different data sources for this evaluation but wants to choose an option that minimizes administrative effort while still providing reliable and comprehensive insights into any biases or discrimination present in the LLM's outputs. Given these requirements, which data source would be most suitable?",options:["The company should use internally generated synthetic data, which involves creating artificial datasets tailored to specific scenarios", "The company should use randomly selected user-generated data, where random samples from actual user interactions are analyzed to identify potential biases", "The company should use benchmark datasets, which are pre-compiled, standardized datasets specifically designed to test for biases and discrimination in model outputs", "The company should use human-monitored benchmarking, where human reviewers manually assess the model's outputs for bias and discrimination"],answer:2,explanation:"The company should use benchmark datasets, which are pre-compiled, standardized datasets specifically designed to test for biases and discrimination in model outputs Benchmark datasets are the most suitable option for evaluating an LLM for bias and discrimination with the least administrative effort. These datasets are specifically designed and curated to include a variety of scenarios that test for potential biases in model outputs. They are pre-existing and standardized, meaning that the company does not need to spend time or resources creating or manually curating data. Using these datasets allows for a quick, cost-effective, and consistent evaluation of model fairness across different contexts."},
{id:305,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A customer support company is using Amazon Bedrock to automate responses to frequently asked questions through its AI-driven chatbot. The development team is adjusting various inference parameters to control the responses. They are particularly interested in the Response length parameter, since this parameter is critical for providing clear, customer-friendly interactions. How does the inference parameter Response length influence the model response for Amazon Bedrock?",options:["Specifies the sequences of characters that stop the model from generating further tokens", "Influences the percentage of most-likely candidates that the model considers for the next token", "Specifies the minimum or maximum number of tokens to return in the generated response.", "Influences the number of most-likely candidates that the model considers for the next token"],answer:2,explanation:"Response length specifies the minimum or maximum number of tokens to return in the generated response. The other options describe Stop sequences, Top P, and Top K respectively."},
{id:306,domain:"Guidelines for Responsible AI",difficulty:"MEDIUM",type:"mcq",question:"In the context of the AWS Shared Responsibility Model, which statement best describes the security responsibilities of both AWS and the customer when using Amazon Bedrock for generative AI applications?",options:["AWS is responsible for securing the infrastructure that runs Amazon Bedrock, while the customer is responsible for securing their data and managing access controls", "The customer is responsible for the entire security stack, including the underlying infrastructure and the AI models", "AWS handles all aspects of security for Amazon Bedrock, relieving the customer of any security responsibilities", "AWS is responsible for the security of the AI models and customer data, while the customer is responsible for securing the physical infrastructure"],answer:0,explanation:"AWS is responsible for securing the infrastructure that runs Amazon Bedrock, while the customer is responsible for securing their data and managing access controls According to the AWS Shared Responsibility Model, AWS manages the security of the cloud, which includes protecting the infrastructure that runs Amazon Bedrock services, such as hardware, software, networking, and facilities. Customers, on the other hand, are responsible for security in the cloud, which includes managing their data, configuring access controls, and ensuring that AI models and applications are securely implemented. For Bedrock, customers are responsible for data management, access controls, and setting up guardrails. Shared Responsibility Model Overview:' 'via -'https://aws.amazon.com/compliance/shared-responsibility-model/"},
{id:307,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"msq",question:"A retail company is using Amazon Bedrock to enhance its product recommendation system with generative AI. To tailor the AI model to the company's specific needs, the data science team is exploring different model customization methods, since understanding the valid customization options available for Amazon Bedrock is crucial for optimizing the model's performance. Which of the following represent valid model customization methods for Amazon Bedrock? (Select two)",options:["Retrieval Augmented Generation (RAG)", "Fine-tuning", "Zero-shot prompting", "Chain-of-thought prompting", "Continued Pre-training"],answer:[4, 1],explanation:"Model customization involves further training and changing the weights of the model to enhance its performance. You can use'continued pre-training'or'fine-tuning'for model customization in Amazon Bedrock. Continued Pre-training In the continued pre-training process, you provide unlabeled data to pre-train a foundation model by familiarizing it with certain types of inputs. You can provide data from specific topics to expose a model to those areas. The Continued Pre-training process will tweak the model parameters to accommodate the input data and improve its domain knowledge. For example, you can train a model with private data, such as business documents, that are not publicly available for training large language models. Additionally, you can continue to improve the model by retraining the model with more unlabeled data as it becomes available. Fine-tuning While fine-tuning a model, you provide labeled data to train a model to improve performance on specific tasks. By providing a training dataset of labeled examples, the model learns to associate what types of outputs should be generated for certain types of inputs. The model parameters are adjusted in the process and the model's performance is improved for the tasks represented by the training dataset. 'via -'https://aws.amazon.com/blogs/machine-learning/best-practices-to-build-generative-ai-applications-on-aws/ 'via -'https://aws.amazon.com/blogs/machine-learning/best-practices-to-build-generative-ai-applications-on-aws/"},
{id:308,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A tech company is leveraging generative AI to develop personalized customer experiences and is considering whether to use a pre-built Foundation Model (FM) or to customize a model tailored to their specific needs. The team needs to understand the key differences between using a Foundation Model as-is versus customizing a model with their own data to enhance performance for specific tasks. This distinction will guide their strategy for deploying the most effective AI solution. What do you suggest?",options:["FM is an AI model with a large number of parameters and trained on a massive amount of diverse data, whereas, model customization is the process of using training data to adjust the model parameter values in a base model to create a custom model", "Model customization refers to an AI model with a large number of parameters and trained on a massive amount of diverse data, whereas, FM refers to the process of using training data to adjust the model parameter values in a base model to create a custom model", "Both model customization and FM refer to an AI model with a large number of parameters and trained on a massive amount of diverse data", "Both model customization and FM refer to the process of using training data to adjust the model parameter values in a base model to create a custom model"],answer:0,explanation:"FM is an AI model with a large number of parameters and trained on a massive amount of diverse data, whereas, model customization is the process of using training data to adjust the model parameter values in a base model to create a custom model Foundation model (FM) is an AI model with a large number of parameters and trained on a massive amount of diverse data. A foundation model can generate a variety of responses for a wide range of use cases. Foundation models can generate text or image, and can also convert input into embeddings. Model customization is the process of using training data to adjust the model parameter values in a base model to create a custom model. Examples of model customization include Fine-tuning, which uses labeled data (inputs and corresponding outputs), and Continued Pre-training, which uses unlabeled data (inputs only) to adjust model parameters."},
{id:309,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A technology company is developing a machine learning model to automatically categorize images for its e-commerce platform, which includes tasks like identifying products in photos uploaded by users. The data science team is exploring various types of neural networks and needs to choose the most effective one for image classification. Understanding which neural network architecture is best suited for handling the complexities of image data will help the team ensure accurate and efficient classification. What do you recommend for the given use case?",options:["Recurrent Neural Networks (RNNs)", "Convolutional Neural Networks (CNNs)", "Generative Adversarial Networks (GANs)", "Retrieval-Augmented Generation (RAG)"],answer:1,explanation:"Convolutional Neural Networks (CNNs) Convolutional Neural Networks (CNNs) are specifically designed for processing and classifying image data. They use convolutional layers to automatically and adaptively learn spatial hierarchies of features from input images, making them highly effective for tasks such as image recognition and classification. 'via -'https://aws.amazon.com/what-is/neural-network/"},
{id:310,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A company is considering using Reinforcement Learning (RL) to optimize decision-making in dynamic environments. Which of the following would you recommend as the best-fit use case for Reinforcement Learning?",options:["Reinforcement learning is used for making predictions based on historical data trends", "Reinforcement learning is used for performing regression analysis on large numerical datasets", "Reinforcement learning is used for optimizing complex systems such as robotics, game playing, and industrial automation by learning optimal actions through trial and error", "Reinforcement learning is primarily used for clustering large datasets without any predefined labels"],answer:2,explanation:"Reinforcement learning is used for optimizing complex systems such as robotics, game playing, and industrial automation by learning optimal actions through trial and error Reinforcement learning is well-suited for optimizing complex systems where an agent learns to make decisions through interactions with the environment, receiving feedback in the form of rewards or penalties. This approach is particularly effective in applications like robotics, game playing, and industrial automation, where learning optimal actions through trial and error is crucial. 'via -'https://aws.amazon.com/what-is/reinforcement-learning/"},
{id:311,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"Is it possible to increase both the bias and variance of a machine learning model simultaneously?",options:["No, increasing bias always decreases variance and vice versa, so they cannot be increased at the same time", "Yes, it is possible to increase both bias and variance, but this typically leads to a model that performs poorly due to both underfitting and overfitting", "No, it is not possible to increase both bias and variance simultaneously, as they are inversely related", "Yes, increasing both bias and variance simultaneously will improve the model's accuracy and generalization capabilities"],answer:1,explanation:"Yes, it is possible to increase both bias and variance, but this typically leads to a model that performs poorly due to both underfitting and overfitting Bias is an error introduced by approximating a real-world problem (which may be complex) by a simpler model. High bias can cause the model to miss relevant relations between features and target outputs (underfitting). Variance is an error introduced by the model's sensitivity to small fluctuations in the training data. High variance can cause the model to mimic the random noise in the training data rather than the intended outputs (overfitting). It is possible to increase both bias and variance, but doing so usually results in a model that is both underfit and overfit, leading to poor performance. High bias causes the model to miss important patterns (underfitting), while high variance makes the model too sensitive to noise in the training data (overfitting). For example, if you reduce the amount of training data, the model has less information to learn from. This can increase bias because the model may not capture the underlying patterns well (underfitting). At the same time, with less data, the model can become more sensitive to fluctuations in the training data, increasing variance."},
{id:312,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A consulting firm is considering adopting Amazon Q Business to help its teams automate workflows, generate business insights, and streamline decision-making. To ensure smooth integration with their existing AWS infrastructure, the firm's IT department needs to understand which underlying AWS service powers Amazon Q Business. What do you suggest?",options:["Amazon Bedrock", "Amazon SageMaker Jumpstart", "Amazon Q Apps", "Amazon Kendra"],answer:0,explanation:"Amazon Bedrock Amazon Q Business is a fully managed, generative-AI powered assistant that you can configure to answer questions, provide summaries, generate content, and complete tasks based on your enterprise data. It allows end users to receive immediate, permissions-aware responses from enterprise data sources with citations, for use cases such as IT, HR, and benefits help desks. Amazon Q Business is powered by Amazon Bedrock. via -'https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html"},
{id:313,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A technology consulting firm is advising a client on how to integrate AI into their customer service and content creation workflows. The client is particularly interested in using Large Language Models (LLMs) for tasks such as automating customer support, generating marketing content, and processing large volumes of text data. To ensure they choose the right applications, the team needs to understand the potential uses of LLMs across different industries and business functions. What do you suggest?",options:["LLMs are used to synthesize realistic human speech from text inputs", "LLMs are used for creating videos from textual descriptions", "LLMs are used for designing and generating 3D models for use in various applications such as gaming, virtual reality, or industrial design", "LLMs are used for generating human-like text, translating languages, summarizing text, and answering questions based on large datasets"],answer:3,explanation:"LLMs are used for generating human-like text, translating languages, summarizing text, and answering questions based on large datasets Large language models (LLM) are very large deep learning models that are pre-trained on vast amounts of data. Large language models are incredibly flexible. One model can perform completely different tasks such as answering questions, summarizing documents, translating languages and completing sentences. 'via -'https://aws.amazon.com/what-is/large-language-model/"},
{id:314,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A large enterprise is looking to implement an AI-powered assistant to help employees across departments streamline their work by answering questions, summarizing reports, generating content, and securely accessing data from internal systems. The company needs a solution that can seamlessly integrate with its enterprise systems while ensuring data privacy and security. The team is exploring various generative AI-powered assistants that can fulfill these requirements. Which of the following is a generative AI\u00d0powered assistant that can answer questions, provide summaries, generate content, and securely complete tasks based on data and information in the enterprise systems?",options:["Amazon Q in Connect", "Amazon Q Developer", "Amazon Q Business", "Amazon Q in QuickSight"],answer:2,explanation:"Amazon Q Business Amazon Q Business is a fully managed, generative-AI powered assistant that you can configure to answer questions, provide summaries, generate content, and complete tasks based on your enterprise data. It allows end users to receive immediate, permissions-aware responses from enterprise data sources with citations, for use cases such as IT, HR, and benefits help desks. Amazon Q Business also helps streamline tasks and accelerate problem-solving. You can use Amazon Q Business to create and share task automation applications or perform routine actions like submitting time-off requests and sending meeting invites."},
{id:315,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"msq",question:"A global technology company has deployed several AI systems, including generative AI solutions that range from pre-trained models to fine-tuned, domain-specific models. As part of their commitment to ethical AI practices, the company wants to implement governance strategies to ensure the responsible development, deployment, and usage of these models. The development team is tasked with identifying key governance strategies to address concerns such as data privacy, fairness, and accountability in their AI systems. Which two governance strategies should the team prioritize to meet these objectives? (Select two)",options:["Establish ethical AI guidelines for developers to follow", "Use only open-source models without further evaluation", "Rely on user feedback alone to identify issues with the AI system", "Implement robust auditing processes for AI outputs", "Allow unrestricted fine-tuning by all team members"],answer:[0, 3],explanation:"Establish ethical AI guidelines for developers to follow Ethical AI guidelines help define principles and practices for responsible AI development and deployment, ensuring alignment with company values and regulatory requirements. Implement robust auditing processes for AI outputs Auditing processes ensure transparency and accountability by regularly evaluating model outputs for issues like bias, misuse, or unintended consequences."},
{id:316,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"msq",question:"Which AWS service is specifically designed for converting medical speech to text, ensuring compliance with healthcare regulations such as HIPAA?",options:["Amazon Transcribe medical", "Amazon Rekognition", "Amazon Polly", "Amazon Transcribe"],answer:0,explanation:"Amazon Transcribe medical Amazon Transcribe Medical is an automatic speech recognition (ASR) service that makes it easy for you to add medical speech-to-text capabilities to your voice-enabled applications. Conversations between health care providers and patients provide the foundation of a patient's diagnosis and treatment plan and clinical documentation workflow. It's critically important that this information is accurate. However, accurate medical transcriptions such as dictation recorders and scribes are expensive, time-consuming, and disruptive to the patient experience. Some organizations use existing medical transcription software but find them inefficient and low in quality. Driven by state-of-the-art machine learning, Amazon Transcribe Medical accurately transcribes medical terminologies such as medicine names, procedures, and even conditions or diseases. Amazon Transcribe Medical can serve a diverse range of use cases such as transcribing physician-patient conversations for clinical documentation, capturing phone calls in pharmacovigilance, or subtitling telehealth consultations."},
{id:317,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A company is creating a custom search solution that will bring together the company's data repositories, FAQs, and support tickets. The support tickets might contain personally identifiable information (PII) that needs to be redacted before the tickets are processed to create the search indexes. Which AWS service will help you redact the PII in support tickets?",options:["Amazon Kendra", "Amazon Comprehend", "Amazon Lex", "Amazon Textract"],answer:1,explanation:"Amazon Comprehend Amazon Comprehend is a natural language processing (NLP) service that uses machine learning to discover insights from text. Amazon Comprehend provides Custom Entity Recognition, Custom Classification, Key Phrase Extraction, Sentiment Analysis, Entity Recognition, and more APIs so you can easily integrate natural language processing into your applications. You simply call the Amazon Comprehend APIs in your application and provide the location of the source document or text. The APIs will output entities, key phrases, sentiment, and language in a JSON format, which you can use in your application. Amazon Comprehend ML capabilities can be used to detect and redact personally identifiable information (PII) in customer emails, support tickets, product reviews, social media, and more. No ML experience is required. For example, you can analyze support tickets and knowledge articles to detect PII entities and redact the text before you index the documents in the search solution. After that, search solutions are free of PII entities in documents. Redacting PII entities helps you protect privacy and comply with local laws and regulations. How Comprehend works:' 'via -'https://aws.amazon.com/comprehend/"},
{id:318,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"Which AWS service helps you set up a cloud contact center in just a few clicks and onboard agents to help customers?",options:["Amazon Lex", "Amazon Personalize", "Amazon SageMaker Clarify", "Amazon Connect"],answer:3,explanation:"Amazon Connect Amazon Connect is an AI-powered cloud contact center. It automatically detects customer issues, and provides agents with contextual customer information and suggested responses and actions for faster resolution of issues. You can set up a contact center in a few steps, add agents who are located anywhere, and start engaging with your customers. Amazon Connect supports the following communication channels: 1. Voice (phone) 2. Chat/SMS 3. Web calling/video 4. Tasks An agent workspace in Amazon Connect:' 'via -'https://docs.aws.amazon.com/connect/latest/adminguide/what-is-amazon-connect.html"},
{id:319,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A media company is deploying machine learning models using Amazon SageMaker to generate personalized content recommendations. Since the company has intermittent workloads and it does not want to configure or manage the underlying infrastructure, the development team is evaluating different deployment models that offer cost savings by allowing for cold starts. Understanding which deployment model suits this use case will help them balance cost efficiency with operational needs. What do you suggest?",options:["Serverless Inference", "Real-time hosting services", "Batch transform", "Asynchronous Inference"],answer:0,explanation:"Serverless Inference On-demand Serverless Inference is ideal for workloads that have idle periods between traffic spurts and can tolerate cold starts. Amazon SageMaker Serverless Inference is a purpose-built inference option that enables you to deploy and scale ML models without configuring or managing any of the underlying infrastructure. Serverless endpoints automatically launch compute resources and scale them in and out depending on traffic, eliminating the need to choose instance types or manage scaling policies. This takes away the undifferentiated heavy lifting of selecting and managing servers. Serverless Inference integrates with AWS Lambda to offer you high availability, built-in fault tolerance, and automatic scaling. With Serverless Inference, you can quickly deploy machine learning models for inference without having to configure or manage the underlying infrastructure, and you pay only for the compute capacity used to process inference requests, which is ideal for intermittent workloads. During times when there are no requests, Serverless Inference scales your endpoint down to 0, helping you to minimize your costs. Serverless Inference:' 'via -'https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html"},
{id:320,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A retail company is seeking to empower its business analysts to create data-driven dashboards without needing technical expertise in coding or data query languages. The company wants a solution that allows analysts to use natural language to generate reports, visualize key metrics, and build Business Intelligence (BI) dashboards to inform decision-making across departments. They are exploring options within AWS that can help streamline this process for non-technical users. Which of the following solutions allows business analysts to use natural language to build BI dashboards?",options:["Amazon Q Developer", "Amazon Q Business", "Amazon Q in QuickSight", "Amazon Q in Connect"],answer:2,explanation:"Amazon Q in QuickSight With Amazon Q in QuickSight, customers get a generative BI assistant that allows business analysts to use natural language to build BI dashboards in minutes and easily create visualizations and complex calculations. These dashboard-authoring capabilities empower business analysts to swiftly build, uncover, and share valuable insights using natural language prompts. You can simplify data understanding for business users through a context-aware Q&A experience, executive summaries, and customizable data stories ' all designed to use insights to inform and drive decisions."},
{id:321,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A software development team is exploring tools to improve their coding efficiency and streamline their workflow. They are particularly interested in leveraging Amazon Q Developer to support their development processes, but they want to understand its specific capabilities. Which of the following accurately describes what Amazon Q Developer can do to enhance the team's development efforts?",options:["Amazon Q Developer can create SageMaker models, allowing users to develop, train, and deploy machine learning models within the Amazon SageMaker environment", "Amazon Q Developer can deploy applications, automating the entire process of application deployment from development to production environments", "Amazon Q Developer can suggest code snippets, providing developers with recommendations for code based on specific tasks or requirements", "Amazon Q Developer can create Large Language Model (LLM) chatbots, enabling the design and deployment of large language model-based conversational agents"],answer:2,explanation:"Amazon Q Developer can suggest code snippets, providing developers with recommendations for code based on specific tasks or requirements This is the correct option because Amazon Q Developer is designed to assist developers by providing code suggestions and recommendations that align with their coding tasks. It leverages machine learning models trained on vast datasets to suggest code snippets, optimize code efficiency, and help developers follow best practices. This functionality helps speed up development processes and enhances productivity."},
{id:322,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A healthcare organization is deploying machine learning models to assist in patient diagnosis and treatment planning. To ensure responsible use and compliance with healthcare regulations, the data science team needs a tool that offers clear guidance on how each model should be used, along with an assessment of the potential risks associated with its deployment. Understanding these factors is critical for maintaining transparency and trust in the AI models used in such sensitive applications. Which AWS tool do you recommend for the given use case?",options:["Amazon SageMaker Canvas", "Amazon SageMaker Ground Truth", "Amazon SageMaker Model Cards", "Amazon SageMaker Model Monitor"],answer:2,explanation:"Amazon SageMaker Model Cards Use Amazon SageMaker Model Cards to document critical details about your machine learning (ML) models in a single place for streamlined governance and reporting. Catalog details such as the intended use and risk rating of a model, training details and metrics, evaluation results and observations, and additional call-outs such as considerations, recommendations, and custom information. By creating model cards, you can do the following: 1. Provide guidance on how a model should be used. 2. Support audit activities with detailed descriptions of model training and performance. 3. Communicate how a model is intended to support business goals. Model card JSON schema sample file:' 'via -'https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html"},
{id:323,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"msq",question:"A healthcare company wants to extract relevant health information from unstructured clinical data such as physician's notes, discharge summaries, and test results from multiple hospitals. Which ML-powered AWS service is the right fit to extract this data?",options:["Amazon Comprehend", "Amazon Rekognition", "Amazon SageMaker", "Amazon Comprehend Medical"],answer:[0, 3],explanation:"Amazon Comprehend Medical Amazon Comprehend Medical detects and returns useful information in unstructured clinical text such as physician's notes, discharge summaries, test results, and case notes. Amazon Comprehend Medical uses natural language processing (NLP) models to detect entities, which are textual references to medical information such as medical conditions, medications, or Protected Health Information(PHI). You can use the extracted medical information and their relationships to build applications for use cases, like clinical decision support, revenue cycle management (medical coding), and clinical trial management. Because Comprehend Medical is HIPAA-eligible and can quickly identify protected health information (PHI), such as name, age, and medical record number, you can also use it to create applications that securely process, maintain, and transmit PHI. Amazon Comprehend Medical also enables users to link these detected entities to standardized medical knowledge bases such as RxNorm and ICD-10-CM through ontology linking operations. How Amazon Comprehend Medical works:' 'via -'https://aws.amazon.com/comprehend/medical/"},
{id:324,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A media company is planning to leverage AWS for its AI and machine learning projects, and the development team is evaluating both Amazon Bedrock and Amazon SageMaker JumpStart to accelerate their workflows. The team needs to understand the primary differences between these two services, particularly in how they provide access to pre-trained models and offer customization options. This knowledge will help the company choose the right tool for their content generation and optimization tasks. Which of the following best addresses these requirements?",options:["Amazon SageMaker JumpStart provides foundational models for generative AI applications, whereas Amazon Bedrock offers pre-built solutions and one-click deployment for various machine learning models", "Amazon Bedrock is designed for building and scaling machine learning models, whereas Amazon SageMaker JumpStart is used for real-time data analytics", "Amazon Bedrock provides foundational models for generative AI applications, whereas Amazon SageMaker JumpStart offers pre-built solutions and one-click deployment for various machine learning models", "Amazon SageMaker JumpStart is designed for building and scaling machine learning models, whereas Amazon Bedrock is used for real-time data analytics"],answer:2,explanation:"Amazon Bedrock provides foundational models for generative AI applications, whereas Amazon SageMaker JumpStart offers pre-built solutions and one-click deployment for various machine learning models Amazon Bedrock is the easiest way to build and scale generative AI applications with foundation models. Amazon Bedrock is a fully managed service that offers a choice of high-performing foundation models (FMs) from leading AI companies like AI21 Labs, Anthropic, Cohere, Meta, Mistral AI, Stability AI, and Amazon through a single API, along with a broad set of capabilities you need to build generative AI applications with security, privacy, and responsible AI. Amazon SageMaker JumpStart is a machine learning (ML) hub that can help you accelerate your ML journey. With SageMaker JumpStart, you can evaluate, compare, and select FMs quickly based on pre-defined quality and responsibility metrics to perform tasks like article summarization and image generation. SageMaker JumpStart provides managed infrastructure and tools to accelerate scalable, reliable, and secure model building, training, and deployment of ML models."},
{id:325,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A company needs to process a large inference payload of several gigabytes (GBs) for its machine learning model built using Amazon SageMaker. The company's systems can tolerate some waiting time for the responses. Which inference method would be the most suitable for this scenario?",options:["The company should use batch inference, which processes multiple data points at once in large batches, suitable for processing large datasets in a single operation when immediate real-time responses are not required", "The company should use asynchronous inference, which allows the model to handle large or complex payloads by queuing requests and processing them in the background, making it ideal when systems can wait for responses", "The company should use serverless inference, which automatically scales resources based on traffic", "The company should use real-time inference, which is designed for low-latency predictions where responses are needed instantly"],answer:0,explanation:"The company should use batch inference, which processes multiple data points at once in large batches, suitable for processing large datasets in a single operation when immediate real-time responses are not required Batch inference is the most suitable choice for processing a large payload of several gigabytes with Amazon SageMaker when there is no need for immediate responses. This method allows the company to run predictions on large volumes of data in a single batch job, which is more cost-effective and efficient than processing individual requests in real-time. Batch inference can handle large datasets and is ideal for scenarios where waiting for the responses is acceptable, making it the best fit for this use case. SageMaker Batch Transform will automatically split your input file of several gigabytes (GBs) into whatever payload size is specified if you use \"SplitType\": \"Line\" and \"BatchStrategy\": \"MultiRecord\"."},
{id:326,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A retail company needs a solution that can help in forecasting foot traffic, visitor counts, and channel demand to efficiently manage the operating costs. Which AWS ML service is the right fit for this use case?",options:["Amazon SageMaker Feature Store", "Amazon Forecast", "Amazon Lex", "Amazon Personalize"],answer:1,explanation:"Amazon Forecast Amazon Forecast is a fully managed service that uses statistical and machine learning algorithms to deliver highly accurate time-series forecasts. Based on the same technology used for time-series forecasting at Amazon.com, Forecast provides state-of-the-art algorithms to predict future time-series data based on historical data and requires no machine learning experience. Time-series forecasting is useful in multiple fields, including retail, finance, logistics, and healthcare. You can also use Forecast to predict domain-specific metrics for your inventory, workforce, web traffic, server capacity, and finances. How Amazon Forecast works:' 'via -'https://aws.amazon.com/forecast/"},
{id:327,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A retail company wants to simplify how its employees access and analyze sales data stored in a large database. To achieve this, the company aims to implement a solution that automatically converts plain English text commands, such as \"show total sales for the last quarter\" or \"list top-selling products,\" into SQL queries. This would allow employees without technical skills to interact with the database seamlessly, improving efficiency and decision-making. Which of the following solutions would be most suitable for this purpose?",options:["The company should use a Residual Neural Network (ResNet), for generating text-based outputs like SQL queries, as it is specifically tailored for natural language understanding", "The company should use GPT (Generative Pre-trained Transformer), to interpret natural language inputs and generating coherent outputs, such as SQL queries, by leveraging its understanding of language patterns and structures", "The company should use Amazon Comprehend, to interpret natural language inputs and generating coherent outputs, such as SQL queries, by leveraging its understanding of language patterns and structures", "The company should use WaveNet, which is suitable for understanding or generating text, and therefore can be used to create highly optimized SQL queries from input text"],answer:1,explanation:"Amazon QuickSight Amazon QuickSight is a cloud-powered business intelligence service that makes it easy to deliver insights to everyone in your organization. QuickSight uses Amazon Athena, Amazon S3, Amazon RDS, Amazon Redshift, and other AWS services to provide interactive dashboards and visualizations."},
{id:328,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A healthcare analytics company is developing machine learning models to predict patient outcomes and improve treatment plans. To enhance these models, conduct rigorous testing, and ensure data privacy when sharing with partners, the company needs to generate synthetic data that closely mirrors its existing patient records without compromising sensitive information. The synthetic data must maintain the statistical properties and patterns of the original dataset to be useful for model training and evaluation. Which of the following methods would be most suitable for generating synthetic data?",options:["The company should use WaveNet, a deep generative model specifically designed for generating general-purpose synthetic data across various domains", "The company should use a Convolutional Neural Network (CNN), a type of deep learning model, best-suited for generating synthetic data", "The company should use Support Vector Machines (SVMs), a type of supervised learning algorithm used for generating synthetic data", "The company should use a Generative Adversarial Network (GAN) for creating realistic synthetic data while preserving the statistical properties of the original data"],answer:3,explanation:"The company should use a Generative Adversarial Network (GAN) for creating realistic synthetic data while preserving the statistical properties of the original data This is the correct answer because GANs are specifically designed for generating synthetic data that is statistically similar to real data. They consist of two neural networks'a generator and a discriminator'that work against each other to create highly realistic synthetic data. GANs have been successfully used in various domains, including image generation, text synthesis, and more, to produce data that retains the underlying patterns and structures of the original dataset, making them highly suitable for this purpose. 'via -'https://aws.amazon.com/what-is/gan/"},
{id:329,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A business needs an automated solution that can extract text from thousands of receipts and invoices generated across all its stores. Which AWS Machine Learning (ML) service can offer the most optimal solution for this use case ?",options:["Amazon Rekognition", "Amazon Comprehend", "Amazon Textract", "Amazon Transcribe"],answer:2,explanation:"Amazon Textract Amazon Textract is a machine learning (ML) service that automatically extracts text, handwriting, layout elements, and data from scanned documents. It goes beyond simple optical character recognition (OCR) to identify, understand, and extract specific data from documents. Today, many companies manually extract data from scanned documents such as PDFs, images, tables, and forms, or through simple OCR software that requires manual configuration (which often must be updated when the form changes). To overcome these manual and expensive processes, Textract uses ML to read and process any type of document, accurately extracting text, handwriting, tables, and other data with no manual effort. You can use one of AWS's pre-trained or custom features to quickly automate document processing, whether you're automating loan processing or extracting information from invoices and receipts. Textract provides you the ability to customize the pre-trained features to meet the document processing needs specific to your business. Textract can extract the data in minutes instead of hours or days. Textract use cases:' 'via -'https://docs.aws.amazon.com/textract/latest/dg/what-is.html"},
{id:330,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A company needs to support human reviews and audits for its ML model predictions. The solution should be easy to implement and have the facility to add multiple reviewers. Which AWS service do you recommend for this use case?",options:["Amazon Forecast", "Amazon SageMaker Ground Truth", "AWS DeepRacer", "Amazon Augmented AI (A2I)"],answer:3,explanation:"Amazon Augmented AI (A2I) Amazon Augmented AI (Amazon A2I) is a service that makes it easy to build the workflows required for human review of ML predictions. Amazon A2I brings human review to all developers, removing the undifferentiated heavy lifting associated with building human review systems or managing large numbers of human reviewers. Many machine learning applications require humans to review low-confidence predictions to ensure the results are correct. However building human review systems can be time-consuming and expensive because it involves implementing complex processes or \"workflows\", writing custom software to manage review tasks and results, and in many cases, managing large groups of reviewers. Amazon A2I makes it easy to build and manage human reviews for machine learning applications. Amazon A2I provides built-in human review workflows for common machine learning use cases. You can also create your workflows for ML models built on Amazon SageMaker or any other tools. Using Amazon A2I, you can allow human reviewers to step in when a model is unable to make a high-confidence prediction or to audit its predictions on an ongoing basis. How Amazon A2I works:' 'via -'https://aws.amazon.com/augmented-ai/"},
{id:331,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"msq",question:"A law firm is handling an increasing volume of legal documents, including contracts, agreements, and case files, and seeks to streamline its document review process by automatically extracting key information such as important clauses, dates, and entities. The firm wants to implement an automated solution that can efficiently handle this task, reducing the time and effort required for manual review while ensuring accuracy in identifying critical details within the documents. Which of the following options would you suggest for achieving this goal? (Select three)",options:["Amazon Comprehend", "Convolutional Neural Network (CNN)", "Amazon Textract", "Amazon Personalize", "Generative AI powered summarization chatbot", "WaveNet"],answer:[0, 2, 4],explanation:"Amazon Comprehend extracts entities, key phrases, and relationships from text. Amazon Textract extracts text, tables, and structured data from documents. Generative AI summarization chatbot can condense lengthy documents into key points. CNN and WaveNet are not suitable for document extraction, and Amazon Personalize is for recommendations."},
{id:332,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"msq",question:"A tech company is building machine learning models using Amazon SageMaker Studio and wants to streamline its development process. The data science team prefers using familiar Integrated Development Environments (IDEs) to write, test, and debug code more efficiently. To ensure a smooth workflow, the team is exploring which IDEs are supported within SageMaker Studio to maximize productivity and compatibility with their existing tools. Which of the following address the given requirement?",options:["JupyterLab", "RStudio", "Code Editor", "All"],answer:[3, 0],explanation:"All Amazon SageMaker Studio offers a broad set of fully managed integrated development environments (IDEs) for ML development, including JupyterLab, Code Editor based on Code-OSS (Visual Studio Code ' Open Source), and RStudio."},
{id:333,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"Which type of Machine Learning algorithm is used by the models that are trained, evaluated, and tuned on AWS DeepRacer?",options:["Deep Learning", "Unsupervised Learning", "Reinforcement Learning", "Semi-supervised Learning"],answer:2,explanation:"Reinforcement Learning AWS DeepRacer is the fastest way to get rolling with reinforcement learning (RL), literally, with a fully autonomous 1/18th scale race car driven by reinforcement learning, a 3D racing simulator, and a global racing league. Developers can train, evaluate, and tune RL models in the online simulator, deploy their models onto AWS DeepRacer for a real-world autonomous experience, and compete in the AWS DeepRacer League for a chance to win the AWS DeepRacer Championship Cup. AWS DeepRacer gives developers a simple way to learn RL, experiment with new RL algorithms and simulation-to-real domain transfer methods, and experience RL in the real world. What is reinforcement learning?:' 'via -'https://aws.amazon.com/what-is/reinforcement-learning/"},
{id:334,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"Consider a scenario where a fully-managed AWS service needs to be used for automating the extraction of insights from legal briefs such as contracts and court records. What do you recommend?",options:["Amazon Transcribe", "Amazon Rekognition", "Amazon Translate", "Amazon Comprehend"],answer:3,explanation:"Amazon Comprehend Amazon Comprehend is a natural language processing (NLP) service that uses machine learning to find meaning and insights in text. Natural Language Processing (NLP) is a way for computers to analyze, understand, and derive meaning from textual information in a smart and useful way. By utilizing NLP, you can extract important phrases, sentiments, syntax, key entities such as brand, date, location, person, etc., and the language of the text. You can use Amazon Comprehend to identify the language of the text, extract key phrases, places, people, brands, or events, understand sentiment about products or services, and identify the main topics from a library of documents. The source of this text could be web pages, social media feeds, emails, or articles. You can also feed Amazon Comprehend a set of text documents, and it will identify topics (or groups of words) that best represent the information in the collection. The output from Amazon Comprehend can be used to understand customer feedback, provide a better search experience through search filters, and use topics to categorize documents. How Amazon Comprehend works:' 'via -'https://aws.amazon.com/comprehend/ Comprehend use cases:' 'via -'https://aws.amazon.com/comprehend/"},
{id:335,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A financial services company is developing several machine learning models to handle fraud detection, credit scoring, and customer segmentation. To ensure consistent use of data and foster collaboration among its data scientists, the company needs an efficient way to share and manage the variables used in these models across different teams and projects. The goal is to create a centralized repository where these variables can be accessed and reused to maintain uniformity, reduce redundancy, and improve productivity. Which of the following AWS tools would be the most suitable for achieving this objective?",options:["SageMaker Data Wrangler", "SageMaker Clarify", "SageMaker Feature Store", "SageMaker Model Monitor"],answer:2,explanation:"SageMaker Feature Store SageMaker Feature Store is specifically designed to store and manage machine learning features. It allows data scientists and engineers to create a centralized, consistent, and standardized set of features that can be easily accessed and reused across different teams and projects, making it the ideal choice for sharing variables during model development. SageMaker Feature Store also supports feature versioning and governance, which helps maintain the integrity and accuracy of the data used in model development."},
{id:336,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A manufacturing company is developing a machine learning model to optimize its supply chain operations. The data science team needs to prepare the dataset by dividing it into train, test, and validation sets to ensure the model is trained effectively and performs well on unseen data. Which of the following is the best fit to create train, test, and validation splits on your data for machine learning?",options:["Amazon SageMaker Feature Store", "Amazon SageMaker Ground Truth", "Amazon SageMaker Data Wrangler", "Amazon SageMaker Clarify"],answer:2,explanation:"Amazon SageMaker Data Wrangler You can split a machine learning (ML) dataset into train, test, and validation datasets with Amazon SageMaker Data Wrangler. Data used for ML is typically split into the following datasets: Training ' Used to train an algorithm or ML model. The model iteratively uses the data and learns to provide the desired result. Validation ' Introduces new data to the trained model. You can use a validation set to periodically measure model performance as it trains and also tune any hyperparameters of the model. However, validation datasets are optional. Test ' Used on the final trained model to assess its performance on unseen data. This helps determine how well the model generalizes. Data Wrangler is a capability of Amazon SageMaker that helps data scientists and data engineers quickly and easily prepare data for ML applications using a visual interface. It contains over 300 built-in data transformations so you can quickly normalize, transform, and combine features without writing code."},
{id:337,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A retail company is exploring the use of generative AI to improve its customer experience by personalizing recommendations and automating product descriptions. The company is interested in leveraging pre-built, high-performing Foundation Models (FMs) to accelerate development but also needs the ability to customize these models with its proprietary data to meet specific business needs. The company is seeking an AWS service that not only provides access to a variety of Foundation Models but also offers the option to privately fine-tune and customize these models for their unique use case. Which AWS service/feature offers a choice of high-performing Foundation Models (FMs) and the ability to privately customize the FMs with your data?",options:["Amazon Q in QuickSight", "Amazon Q Developer", "AWS Inferentia", "Amazon Bedrock"],answer:3,explanation:"Amazon Bedrock Amazon Bedrock is a fully managed service that offers a choice of high-performing FMs and a broad set of capabilities. You can easily experiment with various top FMs, privately customize them with your data, and create managed agents that execute complex business tasks. Amazon Bedrock is the easiest way to build and scale generative AI applications with foundation models. Amazon Bedrock makes foundation models from Amazon and leading AI startups available through an API, so you can choose from various FMs to find the model that's best suited for your use case. With Amazon Bedrock, you can speed up developing and deploying scalable, reliable, and secure generative AI applications without managing infrastructure."},
{id:338,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A customer support system frequently encounters database errors that result in incomplete sentences in the logs. The company wants to implement a machine learning model to automatically suggest missing words in these sentences to help resolve issues faster. Which type of model should be used to suggest the missing words?",options:["Bidirectional Encoder Representations from Transformers (BERT) based Model", "Clustering Model", "Prescriptive AI Model", "Rule-based NLP Model"],answer:0,explanation:"Bidirectional Encoder Representations from Transformers (BERT) based Model A BERT-based model (Bidirectional Encoder Representations from Transformers) is specifically designed for understanding the context of words in a sentence. BERT uses deep learning techniques to predict missing words by considering the words before and after the gap. This makes it an ideal choice for suggesting missing words in text due to database errors, as it can understand the context and provide accurate word suggestions."},
{id:339,domain:"Fundamentals of Generative AI",difficulty:"MEDIUM",type:"mcq",question:"A company is using a generative AI model to summarize a text based on a given prompt without providing specific examples in the prompt instructions. What type of prompting technique does the given use case represent?",options:["Chain-of-thought prompting", "Zero shot Prompting", "Negative prompting", "Few shot Prompting"],answer:1,explanation:"Zero shot Prompting Zero-shot prompting is a technique used in generative AI where the model is asked to perform a task or generate content without having seen any examples of that specific task during training. Instead, the model relies on its general understanding and knowledge to provide a response. For example, classifying text into categories (e.g., sentiment analysis, topic detection) without providing specific training examples for those categories."},
{id:340,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A financial services company is building machine learning models on AWS to automate loan approval processes. As an AI Practitioner, you have been tasked to build and maintain data lineage in the context of these machine learning models on AWS. Which of the following would you identify as the key reason to maintain data lineage?",options:["It enhances the visualization capabilities of the data", "It reduces the storage costs by efficiently managing data", "It ensures data privacy and compliance by tracking the flow and transformation of data", "It improves the performance of machine learning models by optimizing data processing"],answer:2,explanation:"It ensures data privacy and compliance by tracking the flow and transformation of data Maintaining data lineage involves tracking the flow, transformations, and origins of data throughout its lifecycle. This is crucial for ensuring data privacy, security, and compliance with regulatory standards. By having a clear record of where data comes from and how it has been processed, organizations can ensure that their machine learning models are built on trustworthy and compliant data."},
{id:341,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"A software development company is migrating its operations to the AWS Cloud and is evaluating its security responsibilities under different generative AI use cases as outlined in the Generative AI Security Scoping Matrix. The company wants to identify the scenario where it would have the highest level of security ownership, including managing data protection, overseeing the underlying infrastructure, and ensuring compliance with relevant regulations. Understanding these security implications is critical for the company to implement appropriate controls and safeguard its operations. Which of the following scenarios would require the company to assume the maximum level of security ownership?",options:["Refining an existing third-party generative AI foundation model by fine-tuning it with data specific to the company", "Building and training a generative AI model from scratch", "Building its own application using an existing third-party generative AI foundation model", "Consuming a public third-party generative AI service"],answer:1,explanation:"Building and training a generative AI model from scratch This option involves the company designing, developing, and training a generative AI model entirely from the ground up. It requires the company to take full responsibility for managing the entire machine learning pipeline, including data collection, preprocessing, model design, training, and deployment. Additionally, the company is responsible for securing all the underlying infrastructure, data storage, access controls, and ensuring compliance with relevant security and privacy regulations. This scenario entails the maximum level of security ownership because the company controls all aspects of the AI development lifecycle. 'via -'https://aws.amazon.com/blogs/security/securing-generative-ai-an-introduction-to-the-generative-ai-security-scoping-matrix/"},
{id:342,domain:"Fundamentals of AI and ML",difficulty:"MEDIUM",type:"mcq",question:"A media company is developing a machine learning model to categorize its vast library of content. The data science team is trying to decide between using multi-class or multi-label classification based on the complexity of the content categories. Understanding the differences between multi-class and multi-label classification will help the team choose the most appropriate approach for organizing their content effectively. What do you recommend to the company?",options:["Multi-class classification allows each instance to belong to multiple classes simultaneously, whereas multi-label classification restricts each instance to one class only", "Multi-class classification assigns each instance to one of several possible classes, while multi-label classification assigns each instance to one or more classes", "Multi-class classification does not require labeled data, whereas multi-label classification requires labeled data for training", "Multi-class classification is used exclusively for image data, whereas multi-label classification is used exclusively for text data"],answer:1,explanation:"Multi-class classification assigns each instance to one of several possible classes, while multi-label classification assigns each instance to one or more classes With multi-label classification, you can train models and classify your documents with more than one label. For example, you can use multi-label classification to categorize customer contact transcripts with one or more labels to identify departments within your company like Payments, Renewals, or Tech Support. These labels can then be mapped to relevant content in your support library or directed towards the appropriate contacts within your company. ML models for multiclass classification problems allow you to generate predictions for multiple classes (predict one of more than two outcomes). Therefore, the key difference is that multi-class classification assigns each instance to one of several possible classes (e.g., an image classified as either a cat, dog, or bird), whereas multi-label classification can assign each instance to multiple classes simultaneously (e.g., a document classified as both \"science\" and \"technology\")."},
{id:343,domain:"Security, Compliance, and Governance for AI Solutions",difficulty:"MEDIUM",type:"mcq",question:"An AI-driven healthcare company is focused on reducing its carbon footprint while running machine learning models to analyze large datasets for patient outcomes and research. To achieve this, the company needs to select an Amazon EC2 instance type that offers the highest energy efficiency for its computational workloads, minimizing environmental impact while still delivering the required performance for training complex machine learning models. Which of the following EC2 instance types would be the most suitable choice for achieving this goal?",options:["Accelerated Computing P type instances", "Compute Optimized C type instances", "AWS Trainium instances", "Accelerated Computing G type instances"],answer:2,explanation:"AWS Trainium instances AWS Trainium instances are designed with energy efficiency in mind, providing optimal performance per watt for machine learning workloads. Trainium, AWS's custom-designed machine learning chip, is specifically engineered to offer the best performance at the lowest power consumption, reducing the carbon footprint of training large-scale models. This makes Trainium instances the most environmentally friendly choice among the options listed. Trn1 instances powered by Trainium are up to 25% more energy efficient for DL training than comparable accelerated computing EC2 instances. 'via -'https://aws.amazon.com/machine-learning/trainium/"},
{id:344,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A software development company is evaluating Amazon Q Developer to enhance its application development process by leveraging AI-driven tools for automation, code generation, and workflow optimization. The company is looking to understand the key features and capabilities of Amazon Q Developer. Gaining clarity on its core functionalities will help the company decide if it aligns with their development needs. What would you suggest to the company regarding the capabilities of Amazon Q Developer?",options:["Amazon Q Developer can be used in integrated development environments (IDEs) as well as the AWS Management Console", "Amazon Q Developer can only be used in the integrated development environments (IDEs)", "Amazon Q Developer can only be used in the AWS Management Console", "Amazon Q Developer can neither be used in the integrated development environments (IDEs) nor the AWS Management Console"],answer:0,explanation:"Amazon Q Developer can be used in integrated development environments (IDEs) as well as the AWS Management Console You can use Amazon Q Developer in the AWS Management Console, AWS Console Mobile Application, AWS Marketing website, AWS Documentation website, and chat channels integrated with AWS Chatbot to ask questions about AWS. You can ask Amazon Q about AWS architecture, best practices, support, and documentation. Amazon Q can also help with code that you're writing with the AWS SDKs and AWS Command Line Interface (AWS CLI). You can also use Amazon Q Developer in integrated development environments (IDEs) to learn about AWS and get assistance with your software development needs. In IDEs, Amazon Q includes capabilities to provide guidance and support across various aspects of software development, such as answering questions about building on AWS, generating and updating code, security scanning, and optimizing and refactoring code."},
{id:345,domain:"Applications of Foundation Models",difficulty:"MEDIUM",type:"mcq",question:"A financial services company is developing machine learning models to improve fraud detection and credit risk assessment. However, given the complexity of these tasks, the team wants to incorporate human input at key stages of the machine learning lifecycle to ensure that the models are accurate and relevant. The company is looking for an AWS service that allows human input and feedback to be integrated into the model development process, improving the overall performance and trustworthiness of the models. What do you suggest?",options:["Amazon SageMaker Ground Truth", "Amazon SageMaker Feature Store", "Amazon SageMaker Clarify", "Amazon SageMaker Role Manager"],answer:0,explanation:"Amazon SageMaker Ground Truth Human-in-the-loop is the process of harnessing human input across the ML lifecycle to improve the accuracy and relevancy of models. Humans can perform a variety of tasks, from data generation and annotation, to model review and customization. Human intervention is especially important for generative AI applications, where humans are typically both the requester and consumer of the content. It is therefore critical that humans train foundation models (FMs) how to respond accurately, safely, and relevantly to users' prompts. Human feedback can be applied to help you complete multiple tasks. Amazon SageMaker Ground Truth offers the most comprehensive set of human-in-the-loop capabilities. There are two ways to use Amazon SageMaker Ground Truth, a self-service offering and an AWS-managed offering. In the self-service offering, your data annotators, content creators, and prompt engineers (in-house, vendor-managed, or leveraging the public crowd) can use our low-code user interface to accelerate human-in-the-loop tasks, while having the flexibility to build and manage your custom workflows. In the AWS-managed offering (SageMaker Ground Truth Plus), AWS handles the heavy lifting, which includes selecting and managing the right workforce for your use case. SageMaker Ground Truth Plus designs and customizes an end-to-end workflow (including detailed workforce training and quality assurance steps) and provides a skilled AWS-managed team that is trained on the specific tasks and meets your data quality, security, and compliance requirements. AWS-Managed Amazon SageMaker Ground Truth:' 'via -'https://aws.amazon.com/sagemaker/groundtruth/"},
