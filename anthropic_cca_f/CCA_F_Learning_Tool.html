{id:238,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"A product classification pipeline achieves 94% accuracy on well-formatted product listings but drops to 71% on short, abbreviated listings (e.g., \"16GB DDR5 3200MHz\" instead of \"Kingston 16GB DDR5 RAM Module 3200MHz CL16\"). How should you address this?",options:["Filter out short listings and process them manually","Use a higher temperature for short listings to generate more diverse outputs","Add few-shot examples specifically demonstrating classification of abbreviated, incomplete listings, including the reasoning process for resolving ambiguous abbreviations","Use a larger model for all listings to improve overall accuracy"],correct:2,explanation:"Few-shot examples are ideally suited for demonstrating how to handle the specific failure mode: abbreviated input. By showing Claude several examples of abbreviated listings and the reasoning used to classify them (\"DDR5 3200MHz → RAM category, 3200MHz is the speed → subcategory: Memory\"), you teach the pattern without modifying the schema. This is targeted prompt engineering for a specific input distribution."},  // vinipx#78
{id:239,domain:"Context Management",difficulty:"EASY",type:"mcq",question:"What is attention dilution and when does it occur?",options:["When Claude processes too many requests simultaneously and latency increases","When the prompt is too vague and Claude spreads attention across irrelevant topics","When middle content in a very long context receives less reliable model attention","When the context window is completely full and model responses get truncated"],correct:2,explanation:"Attention dilution is the tendency for transformer models to give less reliable attention to content in the middle of very long contexts (\"lost in the middle\" problem). Content at the beginning and end of the context receives more reliable attention. The solution is to avoid stuffing too much into a single context — use per-section passes instead."},  // vinipx#79
{id:240,domain:"Context Management",difficulty:"EASY",type:"mcq",question:"Why is self-reported LLM confidence a poor signal for escalation routing?",options:["The API does not expose a confidence score parameter for routing decisions","Confidence scores are only available when using chain-of-thought prompting","Self-reported confidence is reliable but too slow to compute for real-time use","LLMs are poorly calibrated — often highly confident on exactly wrong answers"],correct:3,explanation:"LLM confidence calibration is poor, particularly for hard cases. Models often express high confidence on questions they answer incorrectly — the specific situations where escalation matters most. Escalation routing must use programmatic signals: missing required data fields, explicit error returns, policy threshold violations, or structured uncertainty flags — not Claude\'s self-assessment."},  // vinipx#80
{id:241,domain:"Context Management",difficulty:"EASY",type:"mcq",question:"When should you use prompt caching for cost optimization?",options:["When the same prefix (system prompt, examples, document) is reused across calls","For any API call to reduce costs regardless of the prompt content or structure being repeated","When the user asks the same question multiple times in a single conversation","When the response is expected to be very long and consume many output tokens"],correct:0,explanation:"Prompt caching stores the KV cache of a prompt prefix. Subsequent calls that share the same prefix pay the cache read price instead of re-processing those tokens. Maximum benefit comes from large, stable prefixes — a long system prompt, a big document, or a large set of few-shot examples that are reused across many requests."},  // vinipx#81
{id:242,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"A document analysis agent is processing a 200-page report and consistently misses details from pages 80–140. What is the root cause and fix?",options:["Context window exceeded — switch to a model with a larger context window size","Attention dilution on middle content — split into per-section passes with integration","Document contains tables Claude cannot parse correctly — convert all tables to plain text format first","Pages 80-140 are less relevant — use retrieval to focus on important sections"],correct:1,explanation:"The \"missing middle\" symptom is a classic attention dilution pattern. The fix is per-section passes: chunk the 200-page report into logical sections, process each section with full attention (the entire context is that one section), then run a separate synthesis pass over all section summaries. A larger context window does not fix attention dilution — it just moves the diluted zone further in."},  // vinipx#82
{id:243,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"A customer support agent is routing all complex, multi-step issues to human agents based on Claude\'s self-reported uncertainty: \"I\'m not 100% confident about the billing policy here.\" 40% of these escalations turn out to be cases Claude could have resolved. What escalation signal should replace self-reported confidence?",options:["Add a second AI model to verify and validate Claude\'s confidence assessment","Increase Claude\'s temperature parameter to reduce hedging uncertainty expressions in responses","Use programmatic signals: missing data fields, policy violations, error thresholds","Add \"Be more confident in your assessments\" to the agent\'s system prompt text"],correct:2,explanation:"Programmatic escalation signals are reliable; self-reported confidence is not. Examples: (1) `get_customer` returned no policy tier → escalate because policy lookup is required. (2) Refund amount > $500 → escalate per policy. (3) Tool error count > 3 in this session → escalate. These conditions are objective, deterministic, and not subject to the model\'s calibration errors."},  // vinipx#83
{id:244,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"A multi-turn conversation agent is losing context from early in long conversations — users have to repeat context they provided 20+ turns ago. What strategy best addresses this?",options:["Increase the context window to fit more conversation turns in total","Delete old turns automatically when the context is nearly full","Ask users to restate their full context every 10 turns as a manual conversation refresh mechanism","Implement rolling summaries that compress earlier turns into structured context"],correct:3,explanation:"Rolling summaries (also called context compression or memory summarization) maintain the most important information from earlier conversation turns in a compact form. Instead of dropping or truncating old turns, the agent periodically summarizes them (\"User is researching competitor pricing for their enterprise software pitch to FinanceCo\") and injects that summary as persistent context. This preserves semantic continuity without consuming the full context window."},  // vinipx#84
{id:245,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"Information provenance in a multi-agent pipeline refers to:",options:["Tracking which source (URL, document, record) each piece of information came from","The geographic location of the API servers processing the pipeline request for data residency compliance","The sequential order in which agents processed information in the pipeline","Legal provenance — ensuring AI content is not used in violation of any TOS"],correct:0,explanation:"Information provenance is the ability to trace any claim in a synthesized output back to its original source. In a research pipeline, this means the synthesis output can identify which document, URL, or database record each fact came from. This enables fact-checking, transparency, and the ability to invalidate specific claims if a source is found to be unreliable."},  // vinipx#85
{id:246,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"A research pipeline processes 50-page documents. The team proposes switching to a model with a 200K token context window to process each document in one call, eliminating the per-section chunking. What is wrong with this reasoning?",options:["200K token models are more expensive, making the pipeline cost-prohibitive","Context window size does not equal attention quality — a larger window moves the diluted zone but does not eliminate it; focused per-section passes still produce more reliable extraction","200K token models are slower and would violate the pipeline\'s latency SLA","The reasoning is correct — a 200K window would eliminate the need for chunking"],correct:1,explanation:"This is a fundamental misconception the exam tests directly. A larger context window does NOT fix attention dilution — it just means the dilution zone is further from the ends. A 50-page document in a 200K window will still have attention issues in the middle sections. Per-section passes where each section is the primary focus of the entire context window produce more reliable results than dumping the whole document into a large window."},  // vinipx#86
{id:247,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"A medical triage agent routes patient cases to either a nurse or a specialist based on its confidence assessment. Engineering review finds that 8% of high-confidence specialist referrals were cases the nurse could have handled, and 3% of high-confidence nurse referrals needed a specialist. How should the routing architecture be redesigned?",options:["Lower the confidence threshold for specialist referral to be more conservative","Replace self-reported confidence with rule-based routing: symptom categories, vital sign thresholds, medication interaction flags from structured extraction — with a `requires_specialist` field derived from the data, not Claude\'s assessment","Add a second Claude model to validate routing decisions","Increase temperature to generate more routing decision diversity"],correct:1,explanation:"Medical routing based on LLM confidence is a safety risk. The correct architecture uses objective, clinically-defined routing rules derived from structured data extraction: \"fever > 39.5°C → specialist flag,\" \"chest pain with shortness of breath → specialist flag,\" \"medication interaction detected → specialist flag.\" These rules are encoded in the extraction schema and routing logic — not in Claude\'s self-assessment. The extracted structured data drives the decision."},  // vinipx#87
{id:248,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"A coordinator agent receives partial results from a failed subagent: web search returned 3 sources before a timeout, document analysis completed successfully, synthesis was not attempted. How should the coordinator proceed?",options:["Discard all results and re-run the entire pipeline","Proceed with synthesis using only the document analysis results, discarding the incomplete web search","Evaluate partial results: if 3 sources + document analysis are sufficient for the quality bar, proceed; otherwise targeted re-delegation to web search only (not the full pipeline)","Ask the user whether to proceed with partial results"],correct:2,explanation:"Intelligent partial result handling is a coordinator skill. The coordinator should evaluate: are the partial results (3 web sources + full document analysis) sufficient for the required quality? If yes, proceed — no need to re-run anything. If no, targeted re-delegation to only the failed component (web search) is more efficient than full pipeline re-runs. Discarding all results wastes the successful document analysis."},  // vinipx#88
{id:249,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Your system uses prompt caching for a 50,000-token system prompt shared across all user requests. After a model upgrade, you notice cache hit rates dropped to near zero. What is the most likely cause?",options:["The new model has a different context window size that invalidates caches","A small modification to the shared system prompt (even a single character) breaks the cache prefix match — the entire prefix must be byte-for-byte identical","Prompt caching is not available on the new model version","The 50,000-token system prompt exceeds the cache size limit"],correct:1,explanation:"Prompt caching requires exact byte-for-byte match on the cached prefix. Any modification — a single extra space, a version string update, a date injection — breaks the cache match and forces full re-processing. After a model upgrade, review whether the system prompt was also updated. Cache hit rates near zero after an upgrade almost always indicate a prompt modification, not a model incompatibility."},  // vinipx#89
{id:250,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Your support agent handles 10,000 tickets per day. Analysis shows 12% are escalated to human agents. Post-escalation review finds: 60% of escalations were based on Claude\'s \"I\'m not fully confident\" output, and 40% of those did not actually need human handling. Engineering is asked to reduce unnecessary escalations without increasing missed escalations. What is the correct architectural change?",options:["Fine-tune the model with examples of correctly handled complex cases","Remove escalation entirely and let the model always attempt resolution","Replace confidence-based escalation with rule-based escalation: define specific triggers (refund > $500, unverifiable account, 3+ tool failures, specific issue categories) in the routing logic derived from structured extraction","Add a second call to Claude asking it to reconsider its confidence assessment"],correct:2,explanation:"The problem is over-reliance on self-reported confidence. The fix is deterministic rule-based escalation: define the exact conditions that require human judgment in your routing logic, derive them from structured extraction fields, not Claude\'s uncertainty expressions. This reduces false escalations (Claude saying \"not confident\" when it actually can handle it) while maintaining necessary escalations (rules fire when the actual conditions are met)."},  // vinipx#90
{id:251,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Your research coordinator is producing synthesis reports, but the sources in the final report cannot be traced back to specific documents — the synthesis subagent merged everything into unsourced paragraphs. You are now asked to add citation tracking. What change makes this possible?",options:["Ask the synthesis subagent to \"add citations where possible\"","Redesign the coordinator to pass structured context: each finding tagged with source ID, document title, URL, and page number; require the synthesis subagent to output a `citations` array alongside each claim","Add a post-synthesis citation extraction step that parses the report for URLs","Store all source documents in a shared database that the synthesis subagent queries"],correct:1,explanation:"Citation tracking must be architected upstream, not retrofitted downstream. The coordinator must pass structured context (source ID → document title + URL + page) to the synthesis subagent, and the synthesis schema must include a `citations` field (array of source IDs) alongside each claim. The synthesis subagent can only attribute claims to sources if it received source metadata. Post-hoc citation extraction from unstructured prose is fragile and will miss many citations."},  // vinipx#91
{id:252,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Your legal document extraction system processes 500 contracts per hour. The pipeline has 99.1% availability but experiences occasional cascading failures when a malformed document causes the extraction model to generate a response that crashes the JSON parser, which in turn drops the next 30 documents in the queue. How should the pipeline be redesigned for resilience?",options:["Add input validation to reject malformed documents before processing","Implement per-document error isolation: each document processed in an independent try-catch; validation failures set `status: \"failed\"` and log details without affecting the queue; circuit breaker pattern to prevent cascading failures","Process documents sequentially instead of in parallel to prevent cascade effects","Increase the retry count from 3 to 10 for all documents"],correct:1,explanation:"Cascading failure prevention requires two patterns: (1) per-document error isolation — each document must fail independently without affecting others (try-catch per item, not per batch), and (2) the circuit breaker pattern — if error rates spike above a threshold, the pipeline temporarily stops accepting new documents and alerts operations rather than continuing to fail. Sequential processing would eliminate one cause of cascades but at a severe throughput cost."},  // vinipx#92
{id:253,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"A developer is using Claude Code for a multi-day migration project. After working for 3 days, they discover that a fundamental assumption in the migration approach is wrong, requiring a significantly different strategy. The current session has 200+ turns of context. What is the best way to proceed?",options:["Continue in the current session and add a note about the wrong assumption","Use `--resume` to jump back to the point before the wrong assumption was made","Start a new session with a structured summary of: (1) what was learned so far, (2) the corrected understanding, (3) the new migration strategy — discarding the stale approach from prior turns","Fork the current session to preserve the old approach while trying the new one"],correct:2,explanation:"When a fundamental assumption is invalidated, the prior 200 turns of context based on the wrong assumption become actively misleading. Resuming or continuing in that context means Claude will reason from stale, incorrect premises. A new session with a structured summary that explicitly states the corrected understanding prevents stale reasoning. The summary should capture everything learned that is still valid, plus the corrected approach — a \"clean start with memory\" rather than a full restart."},  // vinipx#93
{id:254,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A customer support agent processes a refund request. The `process_refund` tool is called before `get_customer` has been invoked. Which root cause and fix apply?",options:["Claude misunderstood the system prompt order; rewrite it with numbered steps","Missing programmatic prerequisite gate — `process_refund` should require a verified customer ID from a prior `get_customer` call in the current session to execute","The tools should be merged into a single `process_refund_with_lookup` tool","The agent should ask the user to confirm the customer ID before proceeding"],correct:1,explanation:"This is the canonical prerequisite enforcement problem. The gate must be programmatic: before `process_refund` executes, the hook checks whether a verified customer ID exists in session state from a completed `get_customer` call. If not, the hook blocks the call and redirects to identity verification. Prompt-based ordering is insufficient for financial operations."},  // vinipx#94
{id:255,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"Your enterprise deploys Claude Code to 500 developers. The security team requires that certain file paths (secrets, credentials) are never accessible regardless of individual developer configuration. Where must this policy be enforced?",options:["In each developer\'s personal `~/.claude/CLAUDE.md`","In the project root CLAUDE.md with a \"Security rules\" section","In enterprise-level policy settings or organization-wide `.claude/settings.json` checked into version control — applied before any individual settings","In the CI/CD pipeline as a post-commit hook"],correct:2,explanation:"Enterprise security policies must be enforced at the organizational level — not in individual developer files that employees can modify. Organization-wide settings (enterprise policy settings or project `.claude/settings.json` in version control) are applied before personal settings, creating a non-overridable security baseline. This mirrors how enterprise firewalls work: corporate policy > individual preferences."},  // vinipx#95
{id:256,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"The support agent calls the `lookup_order` tool and receives: `{\"isError\": false, \"content\": [], \"message\": \"No orders found for customer ID 48291\"}`. It then calls `lookup_order` again three more times with the same customer ID. What is wrong with the agent\'s behavior and what caused it?",options:["The agent is retrying correctly — transient errors should be retried","The agent is treating a valid empty result (no orders found) as an error, causing unnecessary retries. The tool should have returned `isError: false` with an empty array — which it did — and the agent should have accepted this as a successful lookup with no results","The `lookup_order` tool should have returned `isError: true` to prevent this confusion","The agent needs better retry logic with exponential back-off"],correct:1,explanation:"The tool returned `isError: false` with an empty array — this is correct behavior for \"no records found.\" The agent erroneously interpreted this as a failure and retried. The root cause is missing downstream logic to distinguish empty results (success, no data) from errors (failure, try again). This is the critical `isError: false + empty content` vs `isError: true` distinction the exam tests directly."},  // vinipx#96
{id:257,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"You are extracting data from insurance claims forms. The schema requires a `claim_type` field with enum values: `[\"medical\", \"dental\", \"vision\", \"mental_health\", \"pharmacy\"]`. Validation shows Claude is occasionally returning `\"Mental Health\"` (capitalized, with space) instead of `\"mental_health\"`. Which two changes together guarantee this never happens?",options:["Add \"use lowercase with underscores\" to the prompt and add a few-shot example of the correct enum value","Set `strict: true` on the tool definition (schema validation guaranteed) AND include the enum in the JSON schema definition — any response deviating from the enum values will be rejected before it reaches your validation code","Add a post-processing step that normalizes strings to the expected enum format","Use a different model that has better enum adherence"],correct:1,explanation:"Two layers of guarantee: (1) defining the enum in the JSON schema tells Claude exactly which values are valid, (2) `strict: true` guarantees that the response matches the schema — any deviation (capitalization, spacing) is caught at the API level before your code processes it. Post-processing normalization is a workaround that treats the symptom; schema enforcement prevents the problem at the source."},  // vinipx#97
{id:258,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"You want to use Claude Code to refactor a monolithic authentication service into microservices. This is a week-long project. You plan a session architecture: Day 1 explores the codebase, Day 2-3 designs the new architecture, Day 4-5 implements. How should sessions be managed across this project?",options:["Use a single long-running session for the entire week to preserve maximum context","Start a completely new session each day to avoid stale context","Use named sessions (`--resume <name>`) within each phase; at major phase transitions (exploration → design → implementation), start a new session with a structured summary of prior phase learnings and decisions","Fork the session at the start of each day to preserve rollback capability"],correct:2,explanation:"Named session resumption within a phase preserves the context of ongoing work (exploration findings, design decisions). Phase transitions warrant new sessions with structured summaries: the implementation session starts with \"Architecture decisions from design phase: [list]\" rather than carrying all the exploratory dead-ends and discarded design options from days 1-3. This keeps each phase context focused and avoids stale reasoning from earlier phases."},  // vinipx#98
{id:259,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"Your multi-agent research system takes 45 minutes to complete a comprehensive research report because the web search, document analysis, synthesis, and report generation subagents run sequentially. The coordinator waits for each to complete before starting the next. How do you reduce this to ~12 minutes without changing the synthesis step?",options:["Use a faster model for each subagent","Emit parallel Task tool calls: web search and document analysis run simultaneously in a single coordinator response; synthesis waits for both to complete; report generation follows synthesis","Reduce the number of sources each subagent processes","Run all four subagents in parallel and merge the outputs"],correct:1,explanation:"Web search and document analysis are independent — they do not need each other\'s results. Running them in parallel (single coordinator response with two Task calls) reduces their combined time from sum to max. Synthesis correctly waits for both (it needs both results). Report generation correctly follows synthesis. This is the parallel-then-sequential pattern: parallelize independent steps, sequence dependent ones. Running synthesis in parallel with earlier steps would break the dependency chain."},  // vinipx#99
{id:260,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"An MCP server exposes 3 tools: `search_knowledge_base`, `search_web`, and `search_database`. All three have the description: \"Searches for information.\" A system prompt says \"Search for relevant information before answering.\" What two changes are needed?",options:["Rename the tools to remove the word \"search\" and update the system prompt","Rewrite each tool description to explicitly distinguish its source, input format, and when to use it vs. the others; and add a system prompt instruction that maps specific query types to the correct tool","Merge all three into a single `search` tool with a `source` parameter","Add few-shot examples showing the correct tool for different query types"],correct:1,explanation:"Two changes needed: (1) Descriptions must differentiate: `search_knowledge_base` — \"search internal company documentation; use when the question is about company policies, products, or procedures; input: keyword query; output: internal doc excerpts with IDs\"; `search_web` — \"search public internet; use for current events, external facts, recent information\"; `search_database` — \"query structured customer/transaction data; use when needing specific records by ID or date range.\" (2) System prompt should map task types to appropriate tools to reinforce the descriptions."},  // vinipx#100
{id:261,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"Production data shows that in 12% of cases, your agent skips get_customer entirely and calls lookup_order using only the customer\'s stated name, occasionally leading to misidentified accounts and incorrect refunds. What change would most effectively address this reliability issue?",options:["Add a programmatic prerequisite that blocks lookup_order and process_refund calls until get_customer has returned a verified customer ID","Enhance the system prompt to state that customer verification via get_customer is mandatory before any order operations","Add few-shot examples showing the agent always calling get_customer first, even when customers volunteer order details","Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type"],correct:0,explanation:"When a specific tool sequence is required for critical business logic (like verifying customer identity before processing refunds), programmatic enforcement provides deterministic guarantees that prompt-based approaches cannot. Options B and C rely on probabilistic LLM compliance, which is insufficient when errors have financial consequences. Option D addresses tool availability rather than tool ordering, which is not the actual problem."},  // vinipx#101
{id:262,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"Production logs show the agent frequently calls get_customer when users ask about orders (e.g., \"check my order #12345\"), instead of calling lookup_order. Both tools have minimal descriptions (\"Retrieves customer information\" / \"Retrieves order details\") and accept similar identifier formats. What\'s the most effective first step to improve tool selection reliability?",options:["Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5–8 examples showing order-related queries routing to lookup_order","Expand each tool\'s description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools","Implement a routing layer that parses user input before each turn and pre-selects the appropriate tool based on detected keywords and identifier patterns","Consolidate both tools into a single lookup_entity tool that accepts any identifier and internally determines which backend to query"],correct:1,explanation:"Tool descriptions are the primary mechanism LLMs use for tool selection. When descriptions are minimal, models lack the context to differentiate between similar tools. Option B directly addresses this root cause with a low-effort, high-leverage fix. Few-shot examples (A) add token overhead without fixing the underlying issue. A routing layer (C) is over-engineered and bypasses the LLM\'s natural language understanding. Consolidating tools (D) is a valid architectural choice but requires more effort than a \"first step\" warrants when the immediate problem is inadequate descriptions."},  // vinipx#102
{id:263,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to autonomously handle complex situations requiring policy exceptions. What\'s the most effective way to improve escalation calibration?",options:["Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously","Have the agent self-report a confidence score (1–10) before each response and automatically route requests to humans when confidence falls below a threshold","Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing","Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold"],correct:0,explanation:"Adding explicit escalation criteria with few-shot examples directly addresses the root cause: unclear decision boundaries. This is the proportionate first response before adding infrastructure. Option B fails because LLM self-reported confidence is poorly calibrated — the agent is already incorrectly confident on hard cases. Option C is over-engineered, requiring labeled data and ML infrastructure when prompt optimization hasn\'t been tried. Option D solves a different problem entirely; sentiment doesn\'t correlate with case complexity, which is the actual issue."},  // vinipx#103
{id:264,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"You want to create a custom /review slash command that runs your team\'s standard code review checklist. This command should be available to every developer when they clone or pull the repository. Where should you create this command file?",options:["In the .claude/commands/ directory in the project repository","In ~/.claude/commands/ in each developer\'s home directory","In the CLAUDE.md file at the project root","In a .claude/config.json file with a commands array"],correct:0,explanation:"Project-scoped custom slash commands should be stored in the .claude/commands/ directory within the repository. These commands are version-controlled and automatically available to all developers when they clone or pull the repo. Option B (~/.claude/commands/) is for personal commands that aren\'t shared via version control. Option C (CLAUDE.md) is for project instructions and context, not command definitions. Option D describes a configuration mechanism that doesn\'t exist in Claude Code."},  // vinipx#104
{id:265,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"You\'ve been assigned to restructure the team\'s monolithic application into microservices. This will involve changes across dozens of files and requires decisions about service boundaries and module dependencies. Which approach should you take?",options:["Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes","Start with direct execution and make changes incrementally, letting the implementation reveal the natural service boundaries","Use direct execution with comprehensive upfront instructions detailing exactly how each service should be structured","Begin in direct execution mode and only switch to plan mode if you encounter unexpected complexity during implementation"],correct:0,explanation:"Plan mode is designed for complex tasks involving large-scale changes, multiple valid approaches, and architectural decisions — exactly what monolith-to-microservices restructuring requires. It enables safe codebase exploration and design before committing to changes. Option B risks costly rework when dependencies are discovered late. Option C assumes you already know the right structure without exploring the code. Option D ignores that the complexity is already stated in the requirements, not something that might emerge later."},  // vinipx#105
{id:266,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"Your codebase has distinct areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow a repository pattern. Test files are spread throughout the codebase alongside the code they test (e.g., Button.test.tsx next to Button.tsx), and you want all tests to follow the same conventions regardless of location. What\'s the most maintainable way to ensure Claude automatically applies the correct conventions when generating code?",options:["Create rule files in .claude/rules/ with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths","Consolidate all conventions in the root CLAUDE.md file under headers for each area, relying on Claude to infer which section applies","Create skills in .claude/skills/ for each code type that include the relevant conventions in their SKILL.md files","Place a separate CLAUDE.md file in each subdirectory containing that area\'s specific conventions"],correct:0,explanation:".claude/rules/ with glob patterns (e.g., **/*.test.tsx) allows conventions to be automatically applied based on file paths regardless of directory location — essential for test files spread throughout the codebase. Option B relies on inference rather than explicit matching, making it unreliable. Option C requires manual skill invocation or relies on Claude choosing to load them, contradicting the need for deterministic \"automatic\" application based on file paths. Option D can\'t easily handle files spread across many directories since CLAUDE.md files are directory-bound."},  // vinipx#106
{id:267,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"After running the system on the topic \"impact of AI on creative industries,\" you observe that each subagent completes successfully — the web search agent finds relevant articles, the document analysis agent summarizes papers correctly, and the synthesis agent produces coherent output. However, the final reports cover only visual arts, completely missing music, writing, and film production. When you examine the coordinator\'s logs, you see it decomposed the topic into three subtasks: \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\" What is the most likely root cause?",options:["The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents","The coordinator agent\'s task decomposition is too narrow, resulting in subagent assignments that don\'t cover all relevant domains of the topic","The web search agent\'s queries are not comprehensive enough and need to be expanded to cover more creative industry sectors","The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria"],correct:1,explanation:"The coordinator\'s logs reveal the root cause directly: it decomposed \"creative industries\" into only visual arts subtasks (digital art, graphic design, photography), completely omitting music, writing, and film. The subagents executed their assigned tasks correctly — the problem is what they were assigned. Options A, C, and D incorrectly blame downstream agents that are working correctly within their assigned scope."},  // vinipx#107
{id:268,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent. Which error propagation approach best enables intelligent recovery?",options:["Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches","Implement automatic retry logic with exponential backoff within the subagent, returning a generic \"search unavailable\" status only after all retries are exhausted","Catch the timeout within the subagent and return an empty result set marked as successful","Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow"],correct:0,explanation:"Structured error context gives the coordinator the information it needs to make intelligent recovery decisions — whether to retry with a modified query, try an alternative approach, or proceed with partial results. Option B\'s generic status hides valuable context from the coordinator, preventing informed decisions. Option C suppresses the error by marking failure as success, which prevents any recovery and risks incomplete research outputs. Option D terminates the entire workflow unnecessarily when recovery strategies could succeed."},  // vinipx#108
{id:269,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"During testing, you observe that the synthesis agent frequently needs to verify specific claims while combining findings. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis with results. This adds 2–3 round trips per task and increases latency by 40%. Your evaluation shows that 85% of these verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation. What\'s the most effective approach to reduce overhead while maintaining system reliability?",options:["Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator","Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass, which then sends them all to the web search agent at once","Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips through the coordinator","Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify"],correct:0,explanation:"Option A applies the principle of least privilege by giving the synthesis agent only what it needs for the 85% common case (simple fact verification) while preserving the existing coordination pattern for complex cases. Option B\'s batching approach creates blocking dependencies since synthesis steps may depend on earlier verified facts. Option C over-provisions the synthesis agent, violating separation of concerns. Option D relies on speculative caching that cannot reliably predict what the synthesis agent will need to verify."},  // vinipx#109
{id:270,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"Your pipeline script runs `claude \"Analyze this pull request for security issues\"` but the job hangs indefinitely. Logs indicate Claude Code is waiting for interactive input. What\'s the correct approach to run Claude Code in an automated pipeline?",options:["Add the -p flag: claude -p \"Analyze this pull request for security issues\"","Set the environment variable CLAUDE_HEADLESS=true before running the command","Redirect stdin from /dev/null: claude \"Analyze this pull request for security issues\" < /dev/null","Add the --batch flag: claude --batch \"Analyze this pull request for security issues\""],correct:0,explanation:"The -p (or --print) flag is the documented way to run Claude Code in non-interactive mode. It processes the prompt, outputs the result to stdout, and exits without waiting for user input — exactly what CI/CD pipelines require. The other options reference non-existent features (CLAUDE_HEADLESS environment variable, --batch flag) or use Unix workarounds that don\'t properly address Claude Code\'s command syntax."},  // vinipx#110
{id:271,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings. How should you evaluate this proposal?",options:["Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks","Switch both workflows to batch processing with status polling to check for completion","Keep real-time calls for both workflows to avoid batch result ordering issues","Switch both to batch processing with a timeout fallback to real-time if batches take too long"],correct:0,explanation:"The Message Batches API offers 50% cost savings but has processing times up to 24 hours with no guaranteed latency SLA. This makes it unsuitable for blocking pre-merge checks where developers wait for results, but ideal for overnight batch jobs like technical debt reports. Option B is wrong because relying on polling isn\'t acceptable for blocking workflows with developer wait time. Option C reflects a misconception — batch results can be correlated using custom_id fields. Option D adds unnecessary complexity when the simpler solution is matching each API to its appropriate use case."},  // vinipx#111
{id:272,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback — flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR. How should you restructure the review?",options:["Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow","Require developers to split large PRs into smaller submissions of 3–4 files before the automated review runs","Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass","Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs"],correct:0,explanation:"Splitting reviews into focused passes directly addresses the root cause: attention dilution when processing many files at once. File-by-file analysis ensures consistent depth, while a separate integration pass catches cross-file issues. Option B shifts burden to developers without improving the system. Option C misunderstands that larger context windows don\'t solve attention quality issues. Option D would actually suppress detection of real bugs by requiring consensus on issues that may only be caught intermittently."},  // vinipx#112
{id:273,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"A coordinator agent is configured with allowedTools: [\"Read\", \"Grep\", \"Glob\"]. When it attempts to spawn a subagent by emitting a Task tool call, nothing happens — the call is silently ignored. What is the most likely cause?",options:["The subagent\'s AgentDefinition is missing a required system prompt field","\"Task\" is not included in the coordinator\'s allowedTools list configuration","Subagents can only be spawned from the root agent, not from nested coordinator agents","The Task tool call must include an allowedTools array for the subagent"],correct:1,explanation:"The Task tool is the mechanism for spawning subagents. Like any other tool, it must be included in the coordinator\'s allowedTools configuration before it can be called. If \"Task\" is absent, the coordinator simply cannot emit Task calls. This is a common misconfiguration when assembling multi-agent systems: developers configure the subagents\' AgentDefinitions carefully but forget to add \"Task\" to the coordinator\'s own allowed tools."},  // vinipx#113
{id:274,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A coordinator agent needs to gather data from three independent sources (web, database, document store) before synthesizing a final answer. Currently it spawns each subagent in a separate turn — web search, then wait, then database, then wait, then document store, then wait — taking ~90 seconds total. How should you modify the coordinator to reduce latency?",options:["Use fork_session so each subagent runs in its own isolated session","Emit all three Task tool calls in a single coordinator response; they will execute in parallel","Configure the coordinator\'s max_tokens higher so it can process all three in one reasoning pass","Chain the subagents so each passes its results directly to the next without returning to the coordinator"],correct:1,explanation:"Multiple Task tool calls emitted in a single coordinator response execute in parallel — this is the designed mechanism for concurrent subagent execution. By returning all three Task calls at once (instead of one per turn), all three subagents start simultaneously. Total latency becomes max(web, database, docs) rather than sum. Fork_session (A) is for exploring divergent approaches from a shared baseline, not for parallelism. Max_tokens (C) controls output length, not execution model. Chaining subagents (D) destroys parallelism by creating sequential dependencies."},  // vinipx#114
{id:275,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"Your agent integrates with three MCP tools from different vendors. Tool A returns dates as Unix timestamps, Tool B returns ISO 8601 strings, and Tool C returns dates as \"DD/MM/YYYY\". The agent frequently miscomputes date differences when comparing results across tools. What is the cleanest architectural fix?",options:["Add a date normalization instruction to the system prompt telling the agent to convert all formats","Add few-shot examples showing correct date parsing for each tool\'s format","Implement a PostToolUse hook that normalizes all date fields to one format","Wrap each MCP tool call in a helper function that normalizes the response"],correct:2,explanation:"A PostToolUse hook intercepts tool results after execution but before the model processes them — exactly the right place for deterministic data normalization. All three date formats become one consistent format transparently, without requiring prompt changes or wrapper complexity. System prompt instructions (A) are probabilistic and won\'t reliably fix parsing of structured data. Few-shot examples (C) teach the model to handle variation rather than eliminating the variation itself. Wrapper functions (D) would work but require modifying every tool call site individually; a single hook is more maintainable."},  // vinipx#115
{id:276,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"You are choosing a decomposition strategy for two workflows: (A) a code review that must check security, performance, and style for each file in a PR; (B) an investigation into why production errors spiked — the cause is unknown and each finding may redirect the investigation. Which strategy fits each?",options:["Dynamic decomposition for both: uncertainty always favors adaptive plans","Prompt chaining for A, dynamic decomposition for B","Prompt chaining for both: structured steps produce more consistent output","Dynamic decomposition for A, prompt chaining for B"],correct:1,explanation:"Code review (A) has a predictable multi-aspect structure: the same three checks apply to every file, making prompt chaining (fixed sequential passes) ideal. Error investigation (B) is open-ended: what you find in step one determines what to look at in step two. Dynamic decomposition — generating subtasks based on intermediate findings — is the right fit. Applying dynamic decomposition to the code review wastes overhead for no gain; applying prompt chaining to the investigation would miss the adaptive branching the task requires."},  // vinipx#116
{id:277,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"A developer spent three hours analyzing a legacy codebase yesterday. Today they want to explore two different refactoring approaches starting from the same analysis baseline — without the approaches polluting each other. Which session management feature should they use?",options:["--resume with yesterday\'s session name to continue from where they left off","Start two new sessions with the same system prompt and re-analyze each time","/compact to reduce yesterday\'s session to a summary, then branch from there","fork_session to create two independent branches from the shared baseline"],correct:3,explanation:"fork_session creates independent branches from an existing session\'s state — both branches share the analysis baseline but diverge independently from that point. Changes in branch A don\'t affect branch B. This is precisely the \"explore two approaches from a common baseline\" use case. --resume (A) would continue the single prior session, not create branches. Starting new sessions (C) requires expensive re-analysis. /compact reduces context but doesn\'t create forks."},  // vinipx#117
{id:278,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"An agent has a named session from last week that contains extensive tool results from analyzing a codebase. Since then, 15 files have been modified and 3 new modules added. A developer wants to continue the investigation. What is the recommended approach?",options:["Resume the old session with --resume; the model will detect changes automatically","Resume the old session and immediately inform the agent about which specific files changed, for targeted re-analysis","Start a new session and inject a structured summary of the prior session\'s key findings, then re-analyze only changed files","Resume the old session and run /compact first to condense the stale tool results"],correct:2,explanation:"When prior tool results are stale (files have changed), starting fresh with injected summaries is more reliable than resuming. The old session\'s tool results reference code that no longer exists — the model may reason from outdated facts. A structured summary of key findings (architecture decisions, entry points, patterns) gives the new session the conceptual baseline without stale data. Option B (resume + inform) can work for minor changes but is risky when 15 files and 3 modules changed. Option A assumes automatic change detection, which doesn\'t exist. Option D doesn\'t help because /compact would just compress the stale data."},  // vinipx#118
{id:279,domain:"Tool Design",difficulty:"EASY",type:"mcq",question:"Your team wants to share a GitHub MCP server configuration so all developers have access to it when they clone the repository. Where should you configure this MCP server?",options:["In the project\'s .mcp.json file, committed to version control for the team","In ~/.claude.json on each developer\'s machine for personal MCP server configuration","In the root CLAUDE.md file as a structured MCP configuration code block","In a .env file at the project root with MCP_SERVER_URL variables defined"],correct:0,explanation:"Project-level MCP server configuration belongs in .mcp.json at the project root. This file is committed to version control and automatically available to all team members when they clone or pull the repository. ~/.claude.json is for personal or experimental MCP servers that should not be shared with the team. CLAUDE.md is for instructions and context, not server configuration. A .env file doesn\'t configure MCP servers."},  // vinipx#119
{id:280,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"You are configuring a GitHub MCP server in your project\'s .mcp.json. The server requires a personal access token. A teammate suggests hardcoding the token directly in the JSON file since it\'s an internal repo. What is the correct approach?",options:["Hardcode the token — internal repos don\'t need the same security standards","Use ${GITHUB_TOKEN} env var expansion in .mcp.json; each dev sets it locally","Store the token in CLAUDE.md under a dedicated secrets configuration section","Create a .mcp.local.json file with the token and add it to the .gitignore"],correct:1,explanation:".mcp.json supports environment variable expansion using ${VAR_NAME} syntax. This allows the shared configuration file to be committed safely without containing credentials — each developer sets the actual token value in their shell environment (e.g., ~/.zshrc or a local .env). Hardcoding tokens (A) is a security anti-pattern even in internal repos — tokens get leaked through git history, screenshots, and team changes. CLAUDE.md is not a secrets store. A .mcp.local.json approach isn\'t a supported pattern."},  // vinipx#120
{id:281,domain:"Tool Design",difficulty:"EASY",type:"mcq",question:"A developer needs to find all files in a repository that have the extension .test.tsx. Which built-in tool should they use?",options:["Grep with the pattern \"\\.test\\.tsx$\" to search for matching filenames","Read with a directory path argument to recursively list all contents","Glob with the pattern \"**/*.test.tsx\" to match files by extension","Bash with the find command to locate files matching the extension"],correct:2,explanation:"Glob is the built-in tool for finding files by name or extension patterns. The pattern **/*.test.tsx matches all files ending in .test.tsx anywhere in the directory tree. Grep searches file contents, not file names — it would need the -l flag and wouldn\'t efficiently match by extension. Read operates on individual files or directories but doesn\'t support recursive pattern matching. Bash with find works but bypasses the purpose-built Glob tool."},  // vinipx#121
{id:282,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"An agent attempts to use the Edit tool to update a configuration value in a large auto-generated file where the same string \"timeout: 30\" appears 47 times. The Edit call fails because the match is not unique. What is the correct fallback approach?",options:["Use Grep to find the correct line number, then pass it as an Edit offset","Use Bash with sed to replace the specific occurrence by its line number","Use Edit with a larger surrounding context block to make the old_string match unique","Use Read to load the full file, make the change, then Write the result back"],correct:3,explanation:"When Edit fails due to non-unique text matches, the correct fallback is Read + Write: load the full file with Read, apply the targeted modification programmatically, and save the result with Write. This provides reliable modification even when no unique anchor text exists. Option D (larger context) would work if unique context exists, but when the same pattern repeats 47 times throughout an auto-generated file, finding a unique anchor may be impossible. Bash sed (C) works but is fragile and bypasses the purpose-built tools. Grep + Edit offset (A) doesn\'t exist — Edit doesn\'t accept line-number offsets."},  // vinipx#122
{id:283,domain:"Claude Code",difficulty:"EASY",type:"mcq",question:"A new developer on your team reports that Claude Code is not applying the team\'s coding standards — it\'s ignoring the conventions defined in CLAUDE.md. You discover the team lead put all conventions in ~/.claude/CLAUDE.md on their own machine. What is wrong?",options:["User-level CLAUDE.md is personal and not shared; team conventions need project-level CLAUDE.md","CLAUDE.md files must be placed in the src/ directory under the project root, not the user home directory at all","The team lead needs to run \"claude sync\" to push their CLAUDE.md to all team members","CLAUDE.md only works when placed in the .claude/ subdirectory, not in the project root"],correct:0,explanation:"The CLAUDE.md configuration hierarchy has three levels: user-level (~/.claude/CLAUDE.md), project-level (root CLAUDE.md or .claude/CLAUDE.md), and directory-level (subdirectory CLAUDE.md files). User-level settings exist only on the developer\'s own machine and are never version-controlled. For team-wide standards to apply to all developers, they must be in the project-level CLAUDE.md, which is committed to the repository."},  // vinipx#123
{id:284,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"A monorepo has three packages: frontend (React), backend (Node.js), and infrastructure (Terraform). Each package has its own maintainer and separate coding standards documents. The root CLAUDE.md is growing very large as all standards are consolidated. What is the most maintainable solution?",options:["Split the root CLAUDE.md into three separate files, one per package directory","Use @import directives in each CLAUDE.md to reference relevant standards files","Move all standards to .claude/rules/ with glob patterns to scope each package directory individually","Keep a single large CLAUDE.md and rely on Claude to load relevant sections"],correct:1,explanation:"The @import syntax allows CLAUDE.md files to reference external files, enabling modular configuration. Each package maintainer can manage their own standards file independently, and the package\'s CLAUDE.md imports only what\'s relevant. The root CLAUDE.md stays minimal with only universal conventions. Option A (separate CLAUDE.md per directory) works but doesn\'t support importing shared standards files. Option C (.claude/rules/) is good for path-scoped rules but not for the modular documentation use case. Option D relies on inference, which is unreliable."},  // vinipx#124
{id:285,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"Your team creates a /analyze-codebase skill that explores the entire repository structure and produces a detailed architecture summary. When developers invoke this skill, the verbose exploration output floods the main conversation, making subsequent interactions cluttered. What skill frontmatter option fixes this?",options:["Set allowed-tools: [] to prevent the skill from reading any project files","Add a max-output-tokens limit in the skill frontmatter configuration block to cap output size","Set context: fork so only the final summary returns to the main conversation","Set scope: project to limit the skill to only project-level files and paths"],correct:2,explanation:"context: fork runs the skill in an isolated sub-agent context. All intermediate tool calls and verbose output remain inside that isolated context. Only the skill\'s final response returns to the main conversation. This is exactly the right pattern for exploration and analysis skills that produce a lot of intermediate output. allowed-tools: [] (A) would prevent the skill from doing any file reading, breaking its purpose. max-output-tokens and scope are not valid skill frontmatter options."},  // vinipx#125
{id:286,domain:"Claude Code",difficulty:"EASY",type:"mcq",question:"A developer creates a /migrate skill that requires a target-version argument. When teammates invoke /migrate without providing the argument, Claude simply runs the skill with an empty argument and produces incorrect output. What frontmatter option should be added to the SKILL.md?",options:["required-args: [\"target-version\"] in the skill frontmatter to enforce the argument before invocation","validate-args: true","min-args: 1","argument-hint: \"target-version (e.g., v2.0.0)\""],correct:3,explanation:"The argument-hint frontmatter option prompts developers for required parameters when they invoke the skill without arguments. Claude Code will display the hint and request the argument before proceeding. This prevents silent invocation with empty inputs. required-args, validate-args, and min-args are not valid SKILL.md frontmatter options."},  // vinipx#126
{id:287,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"A developer asks Claude Code to build a Redis cache layer for an existing Express API. They provide a detailed specification but Claude asks several follow-up questions: \"Should the cache invalidate on every write or use TTL only? What failure mode is acceptable — fail open or fail closed? Should cache keys be per-user or shared?\" The developer is frustrated by the questions and wants Claude to just implement. What should they understand about this behavior?",options:["Claude is surfacing design tradeoffs the developer may not have anticipated upfront","This is a bug — Claude should implement based on the specification without questions","The developer should use plan mode, which skips the interview question phase","The specification is too vague — a more detailed spec would prevent the questions"],correct:0,explanation:"The interview pattern is an intentional iterative refinement technique. Before implementing in unfamiliar domains with significant tradeoffs (caching, distributed systems, security), Claude asks questions to surface design considerations the developer may not have anticipated — cache invalidation strategy, failure modes, and key design are all decisions that significantly affect correctness and performance. Answering them upfront prevents costly rework. This is not a bug, not a plan-mode vs direct-execution issue, and not caused by specification vagueness — these questions arise because the decisions are genuinely underspecified."},  // vinipx#127
{id:288,domain:"Prompt Engineering",difficulty:"EASY",type:"mcq",question:"What is the difference between tool_choice: \"auto\", tool_choice: \"any\", and forced tool selection in the Claude API?",options:["\"auto\" forces a tool call; \"any\" lets Claude choose which; forced names a tool","\"auto\" lets Claude decide freely; \"any\" guarantees some tool; forced names one","\"auto\" and \"any\" are identical; forced is the only option that changes behavior","\"any\" and forced both guarantee a call; \"auto\" disables tool calling entirely"],correct:1,explanation:"tool_choice: \"auto\" (default) allows Claude to either call a tool or return conversational text — no guarantee of tool use. tool_choice: \"any\" guarantees Claude will call at least one tool but lets it choose which from available tools. Forced tool selection ({\"type\": \"tool\", \"name\": \"...\"}) guarantees a specific named tool is called. Use \"any\" when you need structured output but have multiple valid schemas; use forced selection when a specific tool must run first (e.g., metadata extraction before enrichment)."},  // vinipx#128
{id:289,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"You are building a document enrichment pipeline. Documents must first go through metadata extraction (extract_metadata tool) before any enrichment steps run. If metadata extraction is skipped, enrichment tools may fail or produce incorrect results. How do you enforce this ordering using the Claude API?",options:["Add a system prompt instruction: \"Always call extract_metadata before any enrichment tools run\"","Use tool_choice: \"any\" so Claude is guaranteed to call a tool on the first turn","Set tool_choice to force extract_metadata on the first call; use auto for the rest","List extract_metadata first in the tools array so Claude encounters it first"],correct:2,explanation:"Forced tool selection (tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}) guarantees that the specific named tool is called, not just any tool. By using this on the first API call, you ensure metadata extraction runs before the model has the option to call enrichment tools. Subsequent turns can then use tool_choice: \"auto\" or \"any\" for the enrichment steps. System prompt instructions (A) are probabilistic. tool_choice: \"any\" (C) guarantees a tool call but doesn\'t specify which one. Tool array ordering (D) has no effect on tool selection."},  // vinipx#129
{id:290,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"You are extracting information from legal contracts. Some contracts contain penalty clauses with specific dollar amounts; others don\'t mention penalties at all. Your extraction schema has a penalty_amount field. What is the correct way to define this field to prevent hallucination?",options:["Define penalty_amount as a required string field with a default value of \"N/A\"","Omit penalty_amount from the schema and use a free-text notes field instead","Add an instruction: \"If penalty_amount is not mentioned, set the value to 0\"","Define penalty_amount as optional (nullable) so null signals genuine absence"],correct:3,explanation:"Required fields create pressure on the model to produce a value even when none exists in the source document — leading to hallucinated data. Making penalty_amount optional (nullable) allows the model to return null when no penalty clause is present, which correctly signals absence rather than fabricating a value. Setting a default of \"N/A\" (A) is a string, not a sentinel for absence, and may be confused with actual contract text. A free-text notes field (C) loses structure. Defaulting to 0 (D) fabricates a value that may be mistaken for a real contract amount."},  // vinipx#130
{id:291,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"Your extraction pipeline produces a result where line_items sum to $1,250 but the stated_total field is $1,200. Schema validation passes because both fields are present and correctly typed, but the values are semantically inconsistent. What is the correct approach for handling this in a retry loop?",options:["Send the original document with the failed extraction and the specific semantic error for re-extraction","Accept the output without further checks — schema validation passed, so the extraction is considered correct by the pipeline","Set stated_total = sum(line_items) programmatically before passing it downstream","Retry the same request three times and use the most common value for stated_total"],correct:0,explanation:"Semantic validation errors (inconsistent values) require retry-with-error-feedback: include the original document, the failed extraction, and a precise description of the error. The model can then re-examine the source document to determine whether stated_total or line_items is wrong. Option A is wrong — schema validity doesn\'t imply semantic correctness. Option C silently picks an answer without checking which value is correct in the source. Option D retries the same context without feedback, which rarely fixes semantic errors."},  // vinipx#131
{id:292,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your extraction pipeline retries failed extractions up to 5 times. For a batch of 200 contracts, 30 contracts fail validation on every retry. Investigation shows these 30 contracts reference an addendum document (\"Exhibit A\") that was not included in the original document set. What should you conclude about the retries?",options:["Increase the retry limit to 10 — 5 retries may not be enough for complex documents","Retries are ineffective when required information is absent from the source document; these 30 contracts need the missing Exhibit A documents, not more retries","Change the retry strategy to use a higher temperature on each retry to encourage the model to try different extraction approaches","Add a fallback that extracts whatever is available and marks the missing fields as \"pending\""],correct:1,explanation:"Retry-with-error-feedback is effective for format mismatches and structural errors — cases where the information exists but the model extracted it incorrectly. When required information is simply absent from the source document (the addendum exists but wasn\'t provided), no number of retries will help. The model cannot extract what isn\'t there. The correct resolution is to obtain the missing Exhibit A documents and reprocess. More retries (A) waste API calls. Higher temperature (C) increases randomness, making hallucination more likely. Option D produces incomplete data that may be misinterpreted downstream."},  // vinipx#132
{id:293,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"A team generates code with Claude and then uses the same Claude session to review that code for bugs. The review consistently misses subtle logical errors — issues that human reviewers catch immediately. What is the most likely explanation and best fix?",options:["The model is running out of context space; the fix is to use /compact before the code review step","The generating session retains reasoning context, making it less likely to question itself","The same model cannot both generate and review code — use a different model instead","Add a \"be critical\" system prompt instruction to Claude before starting the review"],correct:1,explanation:"Self-review in the same session is a known limitation: the model retains reasoning context from generation and is less likely to question its own decisions. This is not a model capability issue — it\'s a context contamination issue. An independent review instance (fresh session without the generation context) is substantially more effective at catching subtle issues. This is equivalent to the human practice of having code reviewed by someone who didn\'t write it. /compact (A) reduces tokens but doesn\'t remove the reasoning context. Different model (C) may help but misidentifies the root cause. System prompt instructions (D) are probabilistic and don\'t address context contamination."},  // vinipx#133
{id:294,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"Your agent processes a 200-page research report, extracting findings from each section. After processing, the agent\'s synthesis consistently omits findings from sections 60–140 but reliably includes content from the first 30 pages and the final 20 pages. What is the root cause and correct fix?",options:["Context window is too small; switch to a model with a larger context window to fit the full document","Extraction prompt is too general; add instructions targeting sections 60-140","Lost-in-the-middle effect — use per-section passes with a separate integration pass","Token limits are hit mid-document; implement chunking to process in segments"],correct:2,explanation:"The pattern (reliable at beginning and end, gaps in the middle) is the hallmark of the \"lost in the middle\" effect — a well-documented phenomenon where models attend reliably to the start and end of long contexts but give less attention to middle content. The fix has two components: (1) place key findings summaries at the beginning of aggregated inputs, and (2) use per-section passes (each section gets its own focused context window) with a separate integration pass over all summaries. A larger context window (A) does not fix attention distribution — it just moves the diluted zone."},  // vinipx#134
{id:295,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"A customer support agent handles multi-turn conversations about billing disputes. After 15+ turns, the agent starts misremembering the exact disputed amount — stating \"$43\" instead of the customer\'s stated \"$43.27\" — and loses track of which charges the customer already confirmed. What is the most robust architectural fix?",options:["Use /compact to summarize the conversation before it gets long","Increase max_tokens so the full conversation fits in a single prompt","Extract transactional facts (disputed amount, confirmed charges, account ID, timestamps) into a persistent \"case facts\" block that is included verbatim in every subsequent prompt, outside the summarized conversation history","Ask the customer to restate the disputed amount at the start of each turn"],correct:2,explanation:"Progressive summarization loses precision on numerical values — \"$43.27\" becomes \"$43\" or \"approximately $40.\" The fix is to extract transactional facts into a dedicated persistent block that bypasses summarization: amounts, dates, order numbers, statuses are stored structurally and injected verbatim into every prompt. The conversation history can be compressed but the fact block remains accurate. /compact (A) worsens the problem by further compressing numerical details. More tokens (B) delays but doesn\'t solve the problem. Re-asking customers (D) is a bad user experience and doesn\'t scale."},  // vinipx#135
{id:296,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"A customer contacts your support agent asking for a price match against a competitor. Your policy document covers price matching against your own historical prices but is completely silent on competitor price matching. The agent has the tools and authority to apply discounts. What should the agent do?",options:["Apply the largest standard discount available as a goodwill gesture to retain","Deny the request since the policy doesn\'t explicitly authorize competitor matching","Ask the customer for proof of the competitor\'s price and then match autonomously","Escalate to a human — policy gaps are a canonical escalation trigger for agents"],correct:3,explanation:"Policy gaps — situations where policy is ambiguous or silent on the customer\'s specific request — are a canonical escalation trigger, distinct from technical complexity. The agent should not apply discounts it\'s not authorized for (A), nor deny valid requests it\'s not authorized to deny (B), nor autonomously interpret a silent policy (D). When policy is silent, a human must make the call. This is a reliability principle: agents should escalate uncertainty about authorization, not make autonomous decisions that extend their authority."},  // vinipx#136
{id:297,domain:"Context Management",difficulty:"EASY",type:"mcq",question:"A customer interacting with your support agent says: \"I don\'t want to deal with a bot. Please connect me to a real person right now.\" The case involves a routine order status inquiry that the agent can easily resolve. What should the agent do?",options:["Honor the request immediately and escalate to a human agent without attempting resolution","Resolve the order status inquiry first since it is simple, then offer to connect to a human","Explain that a human agent isn\'t available right now and attempt autonomous resolution","Ask the customer to confirm their preference for a human before escalating the case"],correct:0,explanation:"Explicit customer requests for a human agent must be honored immediately, regardless of case complexity. The agent should not first attempt resolution — even on a simple case — when the customer has clearly stated their preference. Attempting to resolve first (A) ignores the customer\'s stated preference and damages trust. Saying a human isn\'t available (B) is deceptive if one is. Asking the customer to confirm (D) adds friction to an already expressed preference. The rule is: explicit human request = immediate escalation, no investigation first."},  // vinipx#137
{id:298,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"An agent has been exploring a large legacy codebase for 2 hours. You notice it starting to give inconsistent answers — referencing \"the typical pattern in this codebase\" rather than specific classes it found earlier, and suggesting approaches it already ruled out 30 minutes ago. What is happening and what is the fix?",options:["The model is confused by the complexity of the codebase; restart with a cleaner system prompt setup","Context degradation — use a scratchpad file for key findings plus /compact to reduce","The agent is hitting rate limits causing inconsistent responses; add retry logic","This is normal for large codebases; use a model with a larger context window size"],correct:1,explanation:"Context degradation is a documented pattern in extended sessions: as the context window fills with verbose tool results, the model loses reliable access to earlier specific findings and falls back on generic knowledge. The fix combines two techniques: (1) maintain a scratchpad file where the agent records key findings (class names, entry points, patterns) after each major discovery, referencing it for subsequent questions; and (2) use /compact to reduce context usage by condensing verbose tool output. Restarting (A) loses all progress. Rate limits (C) cause errors, not inconsistency. A larger context window (D) delays but doesn\'t solve context degradation."},  // vinipx#138
