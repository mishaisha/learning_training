function toggleNotes() { document.getElementById('notesPanel').classList.toggle('show'); }
function saveSectionNotes() {

  if (c) localStorage.setItem('sectionNotes_' + c.id, document.getElementById('sectionNotes').value);

// --- Hands-on Lab: Agentic Loop Simulator ---
const LAB_LOOP_STEPS = [
  {id:'step1', text:'A. Send request to Claude via Messages API'},
  {id:'step2', text:'B. Inspect stop_reason in response'},
  {id:'step3', text:'C. If tool_use, execute the requested tool(s)'},
  {id:'step4', text:'D. Return tool results to Claude as new turn'},
  {id:'step5', text:'E. If end_turn, deliver final response to user'}
];
const LAB_LOOP_CORRECT = ['step1','step2','step3','step4','step5'];
let labLoopState = [];
let labLoopSolved = false;
function labLoopInit() {
  const area = document.getElementById('lab-loop-area');
  if (!area) return;
  const pool = document.getElementById('lab-loop-pool');
  const stepsDiv = document.getElementById('lab-loop-steps');
  if (!pool || !stepsDiv) return;
  labLoopState = []; labLoopSolved = false;
  stepsDiv.innerHTML = ''; pool.innerHTML = '';
  const shuffled = [...LAB_LOOP_STEPS].sort(() => Math.random() - 0.5);
  shuffled.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'round-btn'; btn.textContent = s.text;
    btn.dataset.stepId = s.id;
    btn.onclick = () => labLoopClick(s.id);
    pool.appendChild(btn);
  });
  document.getElementById('lab-loop-progress').textContent = '0/5 steps';
  const fb = document.getElementById('lab-loop-feedback');
  if (fb) fb.style.display = 'none';
}
function labLoopClick(id) {
  if (labLoopSolved) return;
  const pool = document.getElementById('lab-loop-pool');
  const stepsDiv = document.getElementById('lab-loop-steps');
  const btn = pool.querySelector('[data-step-id="' + id + '"]');
  if (!btn) return;
  pool.removeChild(btn);
  labLoopState.push(id);
  const nb = document.createElement('button');
  nb.className = 'round-btn'; nb.textContent = btn.textContent;
  nb.dataset.stepId = id;
  nb.style.background = 'var(--accent2)'; nb.style.color = '#fff'; nb.style.borderColor = 'var(--accent2)';
  stepsDiv.appendChild(nb);
  document.getElementById('lab-loop-progress').textContent = labLoopState.length + '/5 steps';
}
function labLoopCheck() {
  const fb = document.getElementById('lab-loop-feedback');
  fb.style.display = 'block';
  if (labLoopState.length < 5) {
    fb.className = 'feedback show wrong';
    fb.innerHTML = '<div class="ans">Not complete</div><div class="expl">Place all 5 steps before checking.</div>';
    return;
  }
  const correct = labLoopState.every(function(id, i) { return id === LAB_LOOP_CORRECT[i]; });
  if (correct) {
    labLoopSolved = true;
    fb.className = 'feedback show correct';
    fb.innerHTML = '<div class="ans">Correct!</div><div class="expl">Agentic Loop: <strong>Send Request</strong> &rarr; <strong>Inspect stop_reason</strong> &rarr; <strong>Execute Tools</strong> &rarr; <strong>Return Results</strong> &rarr; <strong>Repeat/Deliver</strong>.</div>';
  } else {
    fb.className = 'feedback show wrong';
    fb.innerHTML = '<div class="ans">Incorrect order</div><div class="expl">Review the Agentic Loop Lifecycle section and try again. Hint: What does the agent inspect after Claude responds?</div>';
  }
}
function labLoopReset() { labLoopInit(); }

// --- Hands-on Lab: MCP Config Builder ---
function labMcpGenerate() {
  const name = document.getElementById('lab-mcp-name').value.trim() || 'my-server';
  const cmd = document.getElementById('lab-mcp-cmd').value.trim() || 'python';
  const argsStr = document.getElementById('lab-mcp-args').value.trim();
  const envStr = document.getElementById('lab-mcp-env').value.trim();
  const args = argsStr ? argsStr.split(',').map(function(a) { return a.trim(); }).filter(Boolean) : [];
  const env = {};
  if (envStr && envStr.indexOf('=') > -1) {
    var eq = envStr.indexOf('=');
    env[envStr.substring(0, eq).trim()] = envStr.substring(eq + 1).trim();
  }
  var config = { mcpServers: {} };
  config.mcpServers[name] = { command: cmd };
  if (args.length > 0) config.mcpServers[name].args = args;
  if (Object.keys(env).length > 0) config.mcpServers[name].env = env;
  document.getElementById('lab-mcp-output').textContent = JSON.stringify(config, null, 2);
}
function labMcpCopy() {
  var text = document.getElementById('lab-mcp-output').textContent;
  if (!text || text.indexOf('Click') === 0) return;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.querySelector('#lab-mcp-area .quiz-action-btn.outline');
    var orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = orig; }, 2000);
  });
}

// --- Hands-on Lab: Tool Definition Designer ---
function labToolsCheck() {
  var fb = document.getElementById('lab-tools-feedback');
  fb.style.display = 'block';
  var p1 = document.getElementById('lab-tool-p1').checked;
  var p2 = document.getElementById('lab-tool-p2').checked;
  var p3 = document.getElementById('lab-tool-p3').checked;
  var p4 = document.getElementById('lab-tool-p4').checked;
  var p5 = document.getElementById('lab-tool-p5').checked;
  var msgs = [];
  if (!p1) msgs.push('query is essential.');
  if (!p2) msgs.push('max_results prevents unbounded results.');
  if (p3) msgs.push('api_key: credentials belong in env/config, not tool params.');
  if (!p4) msgs.push('category with enum improves relevance.');
  if (p5) msgs.push('session_token: tools should be stateless.');
  var score = [p1, p2, !p3, p4, !p5].filter(Boolean).length;
  fb.className = 'feedback show ' + (score === 5 ? 'correct' : 'wrong');
  fb.innerHTML = '<div class="ans">' + score + '/5 correct</div><div class="expl">' + (score === 5 ? 'Perfect! You identified the right parameters and avoided anti-patterns.' : msgs.join('<br>')) + '</div>';
}
