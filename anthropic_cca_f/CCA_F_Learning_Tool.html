{id:156,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"Which technique most effectively reduces hallucination when Claude must answer questions about a specific document?",options:["Increase model temperature to generate more diverse answers","Provide the document in context and instruct Claude to cite specific passages before answering","Ask Claude to answer from memory and verify later","Use a larger model without providing the document"],correct:1,explanation:"Grounding in provided context with citation requirements is the most effective hallucination mitigation for document-specific QA. The model must justify answers with direct evidence rather than generating from parametric memory."},  // neerajkr7#96
{id:157,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"An agentic session has been running for 2 hours and context quality is degrading. What is the best remediation strategy?",options:["Increase max_tokens to give Claude more room","Perform a context reset: extract the critical state into a structured summary, start a new session with that summary as context","Delete the oldest half of the conversation","Reduce temperature to 0"],correct:1,explanation:"A structured context reset is the correct pattern. Extract essential state (decisions made, key findings, current task) into a concise structured summary, then start a fresh session. This clears accumulated noise while preserving progress."},  // neerajkr7#97
{id:158,domain:"Context Management",difficulty:"EASY",type:"mcq",question:"What does the max_tokens parameter control in the Claude API?",options:["The maximum size of the input prompt","The maximum number of tokens Claude will generate in its response","The total context window size","The number of tool calls allowed"],correct:1,explanation:"max_tokens caps the OUTPUT length (completion tokens). It does not affect input size or context window. Setting it too low truncates responses; too high wastes money on over-provisioning."},  // neerajkr7#98
{id:159,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"You need to process a corpus of 50 documents, each 10 pages long. Which approach correctly manages context?",options:["Load all 50 documents into a single context and process together","Process documents in batches; summarise each batch into structured findings; combine findings into a final synthesis (map-reduce)","Process only the first 10 documents that fit in context","Ask the user to manually summarise documents before providing them"],correct:1,explanation:"Map-reduce document processing: process batches → summarise per batch → synthesise across batches. This scales to any corpus size without hitting context limits and preserves cross-document relationships in the final synthesis."},  // neerajkr7#99
{id:160,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Which combination of techniques provides the highest reliability for a production Claude deployment handling critical business decisions?",options:["High temperature + long system prompt","Structured output enforcement + validation loop + human escalation gate + context reset on quality degradation","Zero-shot prompting + max model size","Few-shot examples + low temperature only"],correct:1,explanation:"Production reliability requires defence in depth: structured outputs (format guarantee) + validation loop (catch errors) + human gates (catch confidence failures) + context management (prevent degradation). No single technique is sufficient alone."},  // neerajkr7#100
{id:161,domain:"Agentic Architecture",difficulty:"EASY",type:"mcq",question:"In an agentic loop, what does a `stop_reason` value of `\"tool_use\"` indicate?",options:["Claude is requesting that a tool be executed and its result fed back","Claude has finished the task and no further action is needed","The agentic loop has exceeded its configured maximum iteration count limit and was terminated","Claude encountered an unrecoverable error and cannot continue"],correct:0,explanation:"`stop_reason: \"tool_use\"` means Claude wants to invoke one or more tools. Your loop must execute those tools, append the results to the conversation history, and call Claude again. The loop only terminates when `stop_reason` is `\"end_turn\"` (or a budget/turn limit is hit)."},  // vinipx#1
{id:162,domain:"Agentic Architecture",difficulty:"EASY",type:"mcq",question:"What does `stop_reason: \"end_turn\"` signal in an agentic loop?",options:["A tool execution failed and must be retried by the loop handler","Claude has completed its response and the loop should terminate","The model ran out of available context window space mid-response","The user must provide additional input before the loop continues"],correct:1,explanation:"`end_turn` means Claude has produced a final text-only response with no pending tool calls. This is the correct loop termination signal. Do not check text content or other heuristics to decide when to stop — always use `stop_reason`."},  // vinipx#2
{id:163,domain:"Agentic Architecture",difficulty:"EASY",type:"mcq",question:"What is the role of a coordinator agent in a hub-and-spoke multi-agent architecture?",options:["To execute all tool calls directly without delegating to others","To act as a proxy relay between subagents and external tool APIs","To decompose tasks, delegate to subagents, and aggregate results","To store a shared memory space accessible by all active subagents"],correct:2,explanation:"In hub-and-spoke, the coordinator is the central hub. It decomposes the task, delegates to specialist subagents, routes information, and aggregates results. Subagents communicate only through the coordinator — never directly with each other."},  // vinipx#3
{id:164,domain:"Agentic Architecture",difficulty:"EASY",type:"mcq",question:"Which SDK option caps the number of tool-use turns in an agentic loop?",options:["max_iterations","turn_limit","stop_after","max_turns"],correct:3,explanation:"`max_turns` (Python) / `maxTurns` (TypeScript) limits how many tool-use turns the loop can run. It counts tool-use turns only, not the final text response. `max_budget_usd` / `maxBudgetUsd` is the cost-based equivalent."},  // vinipx#4
{id:165,domain:"Agentic Architecture",difficulty:"EASY",type:"mcq",question:"After a coordinator spawns a subagent using the Task tool, does the subagent automatically have access to the coordinator\'s conversation history?",options:["No — subagents have isolated context and receive information only via their prompt","Yes — the Agent SDK shares conversation context and tool results automatically between all agents","Yes — subagents inherit context through the SDK\'s shared session state store","Only if the coordinator explicitly sets `share_context: true` in the Task call"],correct:0,explanation:"Subagents are isolated. They have no access to the coordinator\'s conversation history unless the coordinator explicitly includes the relevant information in the subagent\'s prompt. This is one of the most commonly tested facts on the exam."},  // vinipx#5
{id:166,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"A developer implements an agentic loop that checks `response.content[0].text` to decide whether to stop. What is wrong with this approach?",options:["The content array may be empty or missing, causing a runtime index error","Text content checks are unreliable — `stop_reason` is the authoritative signal","The developer should check `response.content[0].type` instead of the `.text` field","Nothing is wrong; this is a valid alternative approach to checking `stop_reason`"],correct:1,explanation:"`stop_reason` is the correct and only reliable termination signal. Parsing text content (e.g., looking for \"Done\" or \"Finished\") is an anti-pattern: Claude\'s phrasing varies and the text may contain the word even mid-task. Always use `stop_reason === \"end_turn\"` to terminate the loop."},  // vinipx#6
{id:167,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"A coordinator agent decomposes a research task into 3 fixed subtopics and consistently misses entire subject areas. What is the root cause?",options:["The subagents are not returning their completed results back to the coordinator agent for aggregation","The context window is too small to handle all aspects of the full topic","Fixed decomposition is too narrow — the coordinator should adapt scope dynamically","The web search tool is returning incomplete or low-quality search results"],correct:2,explanation:"Fixed decomposition causes incomplete coverage when topics are broader or more complex than the preset subtopics. The coordinator should analyze the query and dynamically determine how many subtopics to generate, not always route through a fixed pipeline. This is a task decomposition design flaw."},  // vinipx#7
{id:168,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"You want to spawn multiple subagents to run in parallel. How do you achieve this with the Task tool?",options:["Set `parallel: true` in the Task tool configuration object for concurrent execution","Call the Task tool separately, once per coordinator turn each time","Use the `fork_session` function instead of the standard Task tool","Emit multiple Task tool calls within a single coordinator response"],correct:3,explanation:"Parallel subagent execution is triggered by emitting multiple Task tool calls in a single coordinator response (single turn). If you make separate Task calls across separate turns, they execute sequentially. The SDK interprets multiple tool calls in one response as concurrent invocations."},  // vinipx#8
{id:169,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"When passing context from a web search subagent to a synthesis subagent, what should the coordinator include to preserve attribution?",options:["Structured data separating content from metadata like source URLs and page numbers","Only the final text summary without source URLs; including metadata adds unnecessary token overhead cost","A plain text blob of all findings concatenated together without structure","A reference to the shared session ID where the subagent results are stored"],correct:0,explanation:"The coordinator should use structured data to separate content (what was found) from metadata (where it came from — URLs, titles, page numbers). This allows the synthesis subagent to produce properly cited output and enables the coordinator to trace any finding back to its source for verification."},  // vinipx#9
{id:170,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"Which mechanism must be included in the coordinator\'s `allowedTools` for it to spawn subagents?",options:["Spawn","Task","Delegate","SubAgent"],correct:1,explanation:"The `Task` tool is the Agent SDK mechanism for spawning subagents. If \"Task\" is not included in the coordinator\'s `allowedTools`, the coordinator cannot invoke subagents — the call will either fail or Claude will not attempt it."},  // vinipx#10
{id:171,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"A PostToolUse hook is best used to accomplish which of the following?",options:["Block a tool from being called at all during the current session","Override Claude\'s decision about which tool to invoke in the next step of the agentic loop","Normalize heterogeneous data formats like timestamps before Claude processes them","Log all tool calls and their results to an external database for auditing"],correct:2,explanation:"PostToolUse hooks intercept tool results *after* execution but *before* Claude processes them. They are ideal for normalizing heterogeneous data — e.g., converting Unix timestamps, ISO 8601 strings, and numeric codes from different MCP tools into a consistent format. Blocking tool calls before execution requires a pre-call interception hook."},  // vinipx#11
{id:172,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"You use `--resume <session-name>` to continue a prior investigation. After resuming, you notice Claude is reasoning from stale file analysis done before you modified several files. What should you do?",options:["Restart the entire session from scratch with no prior context at all","Use `fork_session` to create an independent branch from the stale point","Simply re-run the previous prompt — Claude will automatically detect and process file changes","Tell the resumed session which files changed so Claude re-analyzes them specifically"],correct:3,explanation:"When resuming a session after code modifications, you must explicitly tell Claude which files changed. Claude will not automatically diff the file system against its prior analysis. Targeted re-analysis (\"file X and Y were modified — please re-analyze them\") is more efficient than full re-exploration and produces better results than relying on stale tool results."},  // vinipx#12
{id:173,domain:"Agentic Architecture",difficulty:"MEDIUM",type:"mcq",question:"`fork_session` is most appropriate when you want to:",options:["Create independent exploration branches from a shared analysis baseline point","Continue a previously suspended session with updated and corrected context information","Run the same agent on multiple machines simultaneously for load balancing","Share session state between two different coordinator agents in a pipeline"],correct:0,explanation:"`fork_session` creates parallel branches from a shared starting point — ideal when you want to explore two divergent approaches (e.g., two refactoring strategies, two testing architectures) without them interfering with each other. It is not for resuming sessions or distributed execution."},  // vinipx#13
{id:174,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A financial workflow requires that `verify_identity` must always run before `process_payment`. A senior engineer proposes adding a clear system prompt instruction: \"Always call verify_identity before process_payment.\" Why is this insufficient for a production financial system?",options:["System prompt instructions are ignored when tools are present","Claude cannot read multi-sentence system prompts reliably","Prompt instructions have a non-zero failure rate; programmatic prerequisites with hooks provide deterministic enforcement","The instruction would only apply during the first tool call, not subsequent calls"],correct:2,explanation:"Prompt instructions influence Claude probabilistically — they work most of the time but have a measurable failure rate. For compliance-critical financial operations (identity verification before payment), \"most of the time\" is not acceptable. Programmatic prerequisites — hooks that literally block `process_payment` until `verify_identity` has returned a verified customer ID — provide guaranteed enforcement regardless of Claude\'s reasoning."},  // vinipx#14
{id:175,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A multi-agent research coordinator produces synthesis reports with poor coverage because it invokes all four subagents (web, document, synthesis, report) for every query regardless of complexity. What architectural improvement should be made?",options:["Add a fifth \"orchestration\" subagent to manage the other four","Switch to a fixed sequential pipeline with no dynamic routing","Configure the coordinator to analyze query requirements and dynamically select only the relevant subagents","Increase the context window size to accommodate all four subagents\' outputs"],correct:2,explanation:"Always routing through the full pipeline is wasteful and can actually degrade quality (irrelevant subagents add noise). The coordinator should analyze each query and dynamically select only the subagents needed. A simple factual question might only need the web search subagent; a document-heavy analysis might skip web search entirely."},  // vinipx#15
{id:176,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"You are designing a coordinator prompt for a multi-agent research system. Which prompt style leads to better subagent outcomes?",options:["Step-by-step procedural instructions: \"First search for X, then analyze Y, then synthesize Z\"","Goal-oriented prompts specifying research goals and quality criteria rather than procedural steps","Single-sentence prompts to minimize token usage","Prompts that list which tools each subagent should use in what order"],correct:1,explanation:"Goal-oriented coordinator prompts (\"Research the impact of X on Y, ensure findings are cited, cover both short-term and long-term effects\") outperform procedural step-by-step instructions. Specifying the *what* and *quality bar* rather than the *how* allows subagents to adapt their approach based on what they discover, producing more thorough and accurate results."},  // vinipx#16
{id:177,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"When should you start a new session with an injected structured summary rather than resuming a prior session with `--resume`?",options:["Always — new sessions are always more reliable than resumed ones","When the prior session\'s tool results are stale due to significant system state changes","Only when the original session exceeded 100 turns","When the task domain changes from one programming language to another"],correct:1,explanation:"Resume (`--resume`) is effective when prior context is mostly still valid. When significant state changes have occurred (large refactors, database schema changes, dependency updates), the prior tool results become stale and can mislead Claude into reasoning from outdated assumptions. A fresh session with an injected structured summary of current state is more reliable in these cases."},  // vinipx#17
{id:178,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"An interception hook blocks a `process_refund` call when the refund amount exceeds $500 and redirects to `escalate_to_human`. A colleague argues this logic should be in the system prompt instead. What is the strongest argument against the system prompt approach?",options:["System prompts cannot reference specific dollar thresholds","Claude would ignore financial rules in system prompts","Hooks provide deterministic, guaranteed enforcement; prompt instructions are probabilistic and have a measurable failure rate on compliance-critical paths","System prompts are processed before tool definitions and cannot reference tool names"],correct:2,explanation:"For business rule enforcement (refund thresholds, compliance gates), determinism is required. Hooks are code that executes deterministically — the rule fires every time without exception. A system prompt instruction might work 99% of the time, but for financial operations, 1% failure means real financial exposure. This is the fundamental programmatic vs prompt-based enforcement tradeoff."},  // vinipx#18
{id:179,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A large code review task is producing inconsistent results because Claude is missing interactions between files analyzed separately. What decomposition strategy addresses this?",options:["Use a larger model with a bigger context window to process all files simultaneously","Split into per-file local analysis passes followed by a separate cross-file integration pass","Have Claude re-read the entire codebase after each file analysis","Increase max_turns to allow more iterations"],correct:1,explanation:"Attention dilution occurs when too many files are processed simultaneously. The correct pattern: (1) run focused per-file analysis passes where each file gets full attention, then (2) run a dedicated cross-file integration pass with summaries from step 1. This two-phase approach reliably surfaces cross-file issues without attention degradation."},  // vinipx#19
{id:180,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"What is the key difference between `prompt chaining` and `dynamic adaptive decomposition` for task execution?",options:["Prompt chaining uses multiple models; dynamic decomposition uses one","Prompt chaining is for sequential predictable steps; dynamic decomposition generates subtasks based on intermediate findings","Dynamic decomposition requires a coordinator agent; prompt chaining can run in a single agent","Prompt chaining is cheaper; dynamic decomposition produces better results but at higher cost"],correct:1,explanation:"Prompt chaining is best for workflows with known, fixed steps (e.g., file-by-file analysis → cross-file synthesis). Dynamic adaptive decomposition is for open-ended tasks where the full scope is unknown upfront — the plan adapts as findings emerge. A legacy codebase test coverage task uses dynamic decomposition because you don\'t know the structure or high-impact areas until you start exploring."},  // vinipx#20
{id:181,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A subagent fails to retrieve data from a slow external API (timeout). What is the correct error-handling architecture?",options:["Return an empty result set and let the coordinator decide what to do","Immediately propagate the error to the coordinator without any local recovery attempt","Attempt local recovery (e.g., retry); if unresolvable, propagate to coordinator with partial results and a structured error description","Log the error silently and continue as if the tool call succeeded"],correct:2,explanation:"Subagents should attempt local recovery for transient errors (timeouts, temporary unavailability) before escalating. When escalating, they must return structured context: what data was retrieved before failure, what failed and why, and whether retry is appropriate. Silent error suppression prevents coordinator recovery; immediate escalation without retry wastes resources on recoverable failures."},  // vinipx#21
{id:182,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"Your customer support agent is resolving billing disputes 80% of the time on first contact, but 6% of transactions are processed without the mandatory identity verification step. You have a clear system prompt instruction: \"Always verify customer identity before processing any transaction.\" What is the most appropriate fix?",options:["Strengthen the system prompt instruction with more explicit language and examples","Add few-shot examples demonstrating correct identity-first sequences","Implement a programmatic prerequisite gate: block `process_refund` and `process_payment` tool calls until `get_customer` has returned a verified customer ID in the current session","Add a classifier that detects when Claude skips verification and triggers a retry"],correct:2,explanation:"System prompt instructions and few-shot examples address probabilistic behavior — they reduce but cannot eliminate the failure rate. A 6% skip rate on financial identity verification is a compliance failure. Programmatic prerequisite gates (hooks that block payment tools until verification returns a valid ID) provide deterministic, guaranteed enforcement. The fix must be architectural, not prompt-based."},  // vinipx#22
{id:183,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"Your coordinator agent delegates a broad research topic to four specialist subagents. The synthesis subagent\'s output has poor source attribution — it cannot identify which findings came from which source. What caused this and what is the fix?",options:["The synthesis subagent needs a larger context window to hold all sources","The coordinator passed findings as plain concatenated text without preserving source metadata; fix by passing structured data that separates content from source URLs, titles, and page numbers","The web search subagent is not returning URLs in its results","Attribution requires a dedicated attribution subagent in the pipeline"],correct:1,explanation:"When a coordinator passes subagent findings as unstructured text blobs, attribution data (source URLs, document titles, page numbers) is lost or conflated. The fix is to pass structured data — e.g., a JSON array where each finding has a `content` field and a `source` field with URL and metadata. The synthesis subagent can then produce properly cited output."},  // vinipx#23
{id:184,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"An engineer asks your developer productivity agent to \"add comprehensive tests to this legacy codebase.\" The agent immediately starts writing tests for the first file it finds, without understanding the codebase structure. What task decomposition pattern should the agent use?",options:["Prompt chaining: write tests for each file in alphabetical order","Dynamic adaptive decomposition: first map codebase structure, identify high-impact areas, then create a prioritized plan that adapts as dependencies are discovered","Parallel decomposition: spawn one subagent per file simultaneously","Sequential fixed pipeline: analyze → write → run → fix"],correct:1,explanation:"Open-ended tasks on unknown systems require dynamic adaptive decomposition. The agent cannot know the right approach until it understands the codebase. Phase 1: map the structure and understand the domain. Phase 2: identify high-impact, under-tested areas. Phase 3: create a prioritized plan that adapts as dependencies and test complexity emerge. This contrasts with prompt chaining, which requires knowing the steps upfront."},  // vinipx#24
{id:185,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"After a multi-agent research pipeline produces a comprehensive but shallow first draft, the coordinator needs to run iterative refinement. What is the architecturally correct approach?",options:["Have the coordinator re-run the entire pipeline from scratch","Have the synthesis subagent expand all sections autonomously without coordinator guidance","The coordinator evaluates the synthesis for coverage gaps, re-delegates targeted queries to search/analysis subagents, and re-invokes synthesis until quality criteria are met","Ask the end user to identify which sections need more depth"],correct:2,explanation:"Iterative refinement is a coordinator responsibility. The coordinator evaluates synthesis output against quality criteria (depth, coverage, citation density), identifies specific gaps (not vague dissatisfaction), formulates targeted follow-up queries, and re-delegates only what is needed. This loop continues until the coordinator\'s quality evaluation passes. Full pipeline re-runs are wasteful; user-driven gap identification is a design failure."},  // vinipx#25
{id:186,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A customer contacts support with three separate issues: a billing error, a failed delivery, and a missing account credit. Your agent is handling them sequentially and missing interactions between them (the billing error and missing credit are related). What is the correct architectural approach?",options:["Handle each issue in a separate session to avoid context contamination","Have the customer resubmit each issue separately","Decompose the multi-concern request into distinct items, investigate each in parallel using shared context, then synthesize a unified resolution","Use a larger context window to process all three issues together in a single prompt"],correct:2,explanation:"Multi-concern requests should be decomposed into parallel investigation tracks that share context (so the billing/credit relationship is visible to both tracks), then synthesized into a unified resolution. Sequential handling misses cross-issue relationships. Separate sessions destroy the shared context needed to detect interactions. This is parallel decomposition with shared context — a core orchestration pattern."},  // vinipx#26
{id:187,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"Your agent has resolved a complex billing dispute but cannot resolve a technical account issue that requires backend engineering access. It must hand off to a human agent. What should the handoff summary include?",options:["A link to the conversation transcript only — the human agent can read it","Customer ID, root cause analysis, actions already taken, refund amounts applied, and recommended next action","A single sentence summary of the issue","The full raw conversation history in JSON format"],correct:1,explanation:"Human agents receiving escalations typically do not have access to the full conversation transcript or AI session context. The structured handoff summary must be self-contained: customer ID (for lookup), root cause (what was determined), actions taken (what the AI already did, including any credits applied), and recommended next action (what the human should do first). This prevents duplicate actions and allows the human to work from a cold start."},  // vinipx#27
{id:188,domain:"Tool Design",difficulty:"EASY",type:"mcq",question:"What is the primary mechanism Claude uses to decide which tool to invoke?",options:["The tool name only — Claude does not read or parse the tool description text at all","The tool description, which explains purpose, expected inputs, and boundaries","The order in which tools appear in the tools array sent to the API","A separate routing system prompt that maps user intents to tool names"],correct:1,explanation:"Tool descriptions are the primary selection mechanism. Claude reads each tool\'s description to determine which tool is appropriate for the current task. Weak, minimal, or overlapping descriptions directly cause misrouting. This is why investing in clear, differentiated descriptions is critical for reliable tool use."},  // vinipx#28
{id:189,domain:"Tool Design",difficulty:"EASY",type:"mcq",question:"An MCP tool encounters a permanent business rule violation (refund exceeds the allowed maximum). Which `isRetryable` value should the error response include?",options:["true","null","false","The field should be omitted for business errors"],correct:2,explanation:"Business rule violations are not retryable — retrying with the same parameters will always produce the same error. Setting `isRetryable: false` signals this to the agent, preventing wasted retry attempts. Transient errors (timeouts, temporary service unavailability) should use `isRetryable: true`."},  // vinipx#29
{id:190,domain:"Tool Design",difficulty:"EASY",type:"mcq",question:"What are the three values available for the `tool_choice` parameter?",options:["\"always\", \"never\", \"auto\" with an optional tool name override parameter","\"required\", \"optional\", \"forced\" as the three selection modes","\"auto\", \"required\", \"none\" matching the standard API values","\"auto\", \"any\", and a forced object `{\"type\": \"tool\", \"name\": \"...\"}`"],correct:3,explanation:"`tool_choice` options: `\"auto\"` (Claude decides whether to use a tool), `\"any\"` (Claude must use at least one tool), and `{\"type\": \"tool\", \"name\": \"tool_name\"}` (Claude must call this specific named tool). There is no \"required\" or \"none\" option."},  // vinipx#30
{id:191,domain:"Tool Design",difficulty:"EASY",type:"mcq",question:"What does the MCP `isError` flag on a tool response indicate?",options:["The tool encountered a runtime error and the agent should handle the failure","The tool call was rejected by the MCP server before execution even started due to invalid params","Claude made an invalid tool call with wrong parameter types or values","The tool result should be ignored and the agent should proceed without it"],correct:0,explanation:"`isError: true` on an MCP tool response means the tool was called successfully (no schema error) but encountered a runtime error during execution. The agent should read the error metadata and decide whether to retry, escalate, or continue with partial data."},  // vinipx#31
{id:192,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"You have two tools: `analyze_content` (description: \"Analyzes content\") and `analyze_document` (description: \"Analyzes a document\"). What problem will this cause in production?",options:["Both tools will be called simultaneously for every request, causing duplicate data processing","Unreliable tool selection — Claude misroutes because descriptions are identical","Claude will refuse to use either tool due to the ambiguity in descriptions","The tools will merge into a single logical tool inside the agent runtime"],correct:1,explanation:"Identical or near-identical descriptions make it impossible for Claude to reliably distinguish between tools. With no functional differentiation, Claude will select unpredictably. The fix is to make each tool\'s description explicitly explain: (1) what it does differently, (2) its specific input format, (3) when to use it instead of similar alternatives."},  // vinipx#32
{id:193,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"An MCP tool returns `{\"isError\": false, \"content\": []}` when a customer lookup finds no matching records. A different call returns `{\"isError\": true, \"errorCategory\": \"permission\"}` when the agent lacks database access. Why is this distinction important?",options:["Both should return `isError: true` for consistent unified error handling across all tool responses","The `isError` flag is optional and both responses need the same handling","Empty results are a successful query; permission errors need different recovery","Empty results and permission errors should be treated identically as no-data"],correct:2,explanation:"This distinction is critical for agent recovery logic. `isError: false` + empty content = the query ran successfully, no records exist — do not retry. `isError: true` + permission error = the agent doesn\'t have access — retry won\'t help, escalation or credential rotation is needed. Treating them identically causes agents to retry successful queries or give up on fixable access errors."},  // vinipx#33
{id:194,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"A synthesis subagent is given access to 18 tools: web search, document analysis, database query, file read/write, email, calendar, and 12 others. What is the most likely consequence?",options:["The subagent will use all 18 tools for every task, slowing performance down","The MCP server will reject the connection due to the hard tool count limit","The synthesis subagent will request a tool manifest from the coordinator agent","Tool selection degrades — Claude makes worse decisions with too many options"],correct:3,explanation:"Tool selection reliability degrades as the number of available tools increases, especially when many tools are outside the agent\'s core role. A synthesis agent with 18 tools will sometimes misuse web search or email tools. The principle is to scope each agent\'s tools to 4–5 role-relevant tools, with limited cross-role tools only for high-frequency needs."},  // vinipx#34
{id:195,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"You want to ensure Claude always calls the `extract_structured_data` tool for a specific step in a pipeline, regardless of what the conversation context suggests. Which `tool_choice` configuration achieves this?",options:["`tool_choice: {\"type\": \"tool\", \"name\": \"extract_structured_data\"}`","`tool_choice: \"auto\"` which lets Claude decide based on conversation context","`tool_choice: \"any\"` which guarantees some tool call but not a specific one","`tool_choice: \"required\"` with the tool name passed in a separate parameter"],correct:0,explanation:"Forced tool selection requires `{\"type\": \"tool\", \"name\": \"tool_name\"}`. This guarantees Claude calls that specific tool regardless of context. `\"auto\"` lets Claude decide freely. `\"any\"` requires *some* tool call but not a specific one. `\"required\"` is not a valid value."},  // vinipx#35
{id:196,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"Your system prompt contains the phrase \"analyze content from URLs.\" You have a tool named `analyze_content`. What unintended consequence might occur?",options:["The system prompt phrase will completely override the tool description text","The phrase \"analyze content\" will cause Claude to over-invoke that tool name","No consequence — system prompts and tool descriptions are processed separately","Claude will create a new virtual tool called \"analyze content from URLs\""],correct:1,explanation:"System prompt wording is keyword-sensitive and can create unintended tool associations. The phrase \"analyze content\" in a system prompt can cause Claude to over-invoke `analyze_content` in contexts where it is not appropriate. Always review system prompts for phrases that might conflict with or trigger tool name associations unexpectedly."},  // vinipx#36
{id:197,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"You have a generic `analyze_document` tool that is being called for web results, PDFs, and database records with inconsistent quality. What is the best refactoring approach?",options:["Add a `document_type` parameter to the existing tool and update the description","Split into purpose-specific tools: `extract_web_results`, `parse_pdf_content`, `query_database_record` — each with defined input/output contracts","Add more few-shot examples showing correct document type handling","Create a pre-routing tool that classifies the document type before calling `analyze_document`"],correct:1,explanation:"Generic multi-purpose tools with parameter-based branching are harder for Claude to route correctly than purpose-specific tools with clear descriptions. Splitting into `extract_web_results` (web content, returns structured web data), `parse_pdf_content` (PDFs, returns sections + metadata), and `query_database_record` (structured queries, returns typed fields) gives Claude distinct routing signals and produces more reliable, higher-quality outputs."},  // vinipx#37
{id:198,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"An MCP tool connects to a customer database and returns `{\"isError\": true, \"errorCategory\": \"transient\", \"isRetryable\": true, \"message\": \"Connection timeout after 30s\"}`. The agent is a subagent in a coordinator-subagent system. What should happen next?",options:["The subagent should immediately propagate the error to the coordinator","The subagent should attempt local retry logic for the transient error; propagate to coordinator only if retries are exhausted, including partial results and what was attempted","The subagent should return empty results and continue","The coordinator should restart the entire pipeline from scratch"],correct:1,explanation:"Transient errors (`isRetryable: true`) should be handled locally by the subagent first — retry with appropriate back-off. Only when local recovery fails should the error propagate to the coordinator, along with: (1) what data was retrieved before the failure, (2) the specific error details, (3) what was attempted, (4) whether further retries are advisable. This preserves partial work and enables informed coordinator decisions."},  // vinipx#38
{id:199,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"A web research subagent and a document analysis subagent both have a tool called `extract_information`. The coordinator occasionally routes document analysis requests to the wrong subagent. What is causing this and how should it be fixed?",options:["The coordinator needs more context about which subagent to use — add routing instructions to the coordinator system prompt","Rename both tools with role-specific names and update descriptions to eliminate overlap: e.g., `extract_web_search_results` vs `extract_document_sections`","Merge the two subagents into one to eliminate ambiguity","Add a `target_subagent` parameter to the Task tool call"],correct:1,explanation:"Identical tool names across subagents create routing ambiguity at the coordinator level. The fix is to give each subagent\'s tools distinct, role-specific names that make the boundary obvious: `extract_web_search_results` (web subagent) vs `extract_document_sections` (document subagent). The coordinator can now route unambiguously based on the task type."},  // vinipx#39
{id:200,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"You want to validate all tool inputs against a strict schema and ensure Claude never passes missing or incorrectly typed parameters. What configuration achieves this?",options:["Add a `validate: true` flag to the tool definition","Use `strict: true` in tool definitions to enable Structured Outputs for guaranteed schema validation","Write a PostToolUse hook that validates inputs after the call","Add explicit validation instructions to the tool description"],correct:1,explanation:"`strict: true` in tool definitions enables Structured Outputs mode, which guarantees that Claude\'s tool calls always match the defined schema exactly — no missing required fields, no type mismatches. This eliminates an entire class of production failures where Claude generates syntactically valid but schema-invalid tool calls."},  // vinipx#40
{id:201,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"Your MCP tool for processing customer refunds is called by multiple different agents. How should you configure access to prevent a reporting agent from accidentally triggering a refund?",options:["Add authorization checks inside the `process_refund` tool itself","Scope tool access: only include `process_refund` in the allowedTools of agents that need it; exclude it from reporting and read-only agents","Add a system prompt instruction telling the reporting agent not to use `process_refund`","Use `tool_choice: \"auto\"` which will prevent accidental calls"],correct:1,explanation:"Tool access should be scoped to each agent\'s role. A reporting agent should never have `process_refund` in its `allowedTools` — if the tool isn\'t available, it literally cannot be called. Prompt instructions and `tool_choice: \"auto\"` are probabilistic guardrails that can still fail. Defense-in-depth starts with not giving agents tools they should never use."},  // vinipx#41
{id:202,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"Your support agent has four MCP tools: `get_customer`, `lookup_order`, `process_refund`, and `escalate_to_human`. Over time, `get_customer` is being called for order-related queries and `lookup_order` is being called to fetch customer profiles. The tool descriptions are: `get_customer`: \"Gets customer information\" and `lookup_order`: \"Gets order information.\" What is the correct fix?",options:["Rename the tools to `customer_tool` and `order_tool` for clarity","Rewrite both descriptions to explicitly state their purpose, expected inputs (customer ID vs order ID), returned fields, and when to use each vs alternatives","Add a routing system prompt that maps keywords to tools","Merge both tools into a single `get_record` tool with a `type` parameter"],correct:1,explanation:"One-line generic descriptions like \"Gets customer information\" are the most common cause of tool misrouting. Each description should include: (1) exactly what it fetches, (2) the required input format (e.g., \"Takes a `customer_id` string — use this when you have a customer ID, not an order ID\"), (3) what it returns, and (4) when NOT to use it. Detailed descriptions are the primary routing mechanism Claude has available."},  // vinipx#42
{id:203,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"Your extraction system calls an `extract_fields` MCP tool on a 500-document batch. For 12% of documents, the tool returns `{\"isError\": true, \"errorCategory\": \"validation\", \"isRetryable\": false, \"message\": \"Document format not supported: .pages\"}`. How should the system handle these?",options:["Retry each failed document three times before skipping","Skip all failed documents without logging","Since `isRetryable: false` and the error is a validation/format issue, log the specific files with their error details, continue processing the remaining documents, and report the failure summary to the operator","Halt the entire batch and fix the format issue before restarting"],correct:2,explanation:"`isRetryable: false` means retrying will not help — the format is unsupported and retrying the same document will always fail. The correct response is to: (1) skip these documents without retry, (2) log each failure with the document name and error details for operator review, (3) continue processing supported formats, (4) include a failure summary in the final report. Halting the entire batch is disproportionate when most documents are processable."},  // vinipx#43
{id:204,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"Your developer productivity agent uses built-in tools (Read, Write, Bash, Grep, Glob) plus 14 custom MCP tools for linting, type-checking, test running, deployment, database migration, and more. Engineers report the agent is using deployment tools during routine code exploration tasks. What is the architectural fix?",options:["Add system prompt instructions: \"Do not use deployment tools during exploration\"","Reduce the total tool count to 5 by merging related tools","Create task-scoped tool profiles: exploration tasks get Read/Grep/Glob only; development tasks add Write/Bash/Lint/TypeCheck; deployment tasks add the deployment/migration tools","Move deployment tools to a separate MCP server"],correct:2,explanation:"The solution is task-scoped tool profiles — dynamically configure `allowedTools` based on the current task phase. Exploration: read-only tools only. Development: add write and quality tools. Deployment: add deployment tools explicitly. This prevents accidental deployment tool invocations by making them literally unavailable during exploration, rather than relying on prompt instructions that can fail."},  // vinipx#44
{id:205,domain:"Claude Code",difficulty:"EASY",type:"mcq",question:"What is CLAUDE.md and when does Claude Code read it?",options:["A runtime configuration file passed via the `--config` flag each session","A system prompt template stored in the Anthropic cloud service backend","A markdown file in the project that Claude Code reads automatically at session start","A configuration file that explicitly defines which tools Claude Code is allowed to use per session"],correct:2,explanation:"CLAUDE.md is a markdown file you place in your project (typically at the root) that Claude Code reads automatically at session start. It provides persistent project context — coding standards, architectural decisions, naming conventions, review checklists — without requiring you to re-explain them every session."},  // vinipx#45
{id:206,domain:"Claude Code",difficulty:"EASY",type:"mcq",question:"In the CLAUDE.md hierarchy, which file takes precedence when there are conflicting instructions?",options:["The global user-level CLAUDE.md at ~/.claude/CLAUDE.md takes precedence","The project root CLAUDE.md always overrides all other CLAUDE.md files","The most recently modified CLAUDE.md, regardless of its directory location","The subdirectory CLAUDE.md closest to the file currently being edited"],correct:3,explanation:"CLAUDE.md files follow a specificity hierarchy: subdirectory (closest to the current file) > project root > global user. More specific context overrides more general context. This allows subdirectories to set their own conventions (e.g., a `frontend/` directory with React-specific rules) that override project-wide defaults."},  // vinipx#46
{id:207,domain:"Claude Code",difficulty:"EASY",type:"mcq",question:"When should you use plan mode in Claude Code?",options:["Before irreversible or high-impact operations, to review plans before execution","For every task without exception, to review Claude\'s full reasoning process before it acts","Only when working with files that are larger than 1MB in total size","When you want Claude to run autonomously without any human interaction"],correct:0,explanation:"Plan mode is a human review checkpoint before execution. Use it before: large refactors, database migrations, CI/CD deployments, anything that modifies many files, or any operation that is difficult to reverse. Claude shows its plan; you can approve, modify, or cancel before a single line of code changes."},  // vinipx#47
{id:208,domain:"Claude Code",difficulty:"EASY",type:"mcq",question:"What is the `permissionMode: \"acceptEdits\"` option in the Claude Agent SDK?",options:["Requires explicit user approval for every single file operation attempted","Auto-approves file read/write operations so the agent runs without prompts","Restricts the agent to read-only operations with no file modification allowed","Enables the agent to accept edits suggested by external code review tools"],correct:1,explanation:"`permissionMode: \"acceptEdits\"` auto-approves file read/write operations, enabling the agent to run without prompting the user for approval on each edit. This is appropriate for automated/CI workflows where human approval per operation is not feasible. `default` mode prompts for approval — better for interactive development."},  // vinipx#48
{id:209,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"Your team has a monorepo with a React frontend in `/frontend` and a Python API in `/backend`. You want different coding standards for each. How should you structure your CLAUDE.md files?",options:["Use one root CLAUDE.md with all standards and section headers for each language","Use environment variables to switch between different configuration profiles","Root CLAUDE.md for shared rules plus subdirectory CLAUDE.md files per package","Create separate Docusaurus config files for each subdirectory in the monorepo"],correct:2,explanation:"The CLAUDE.md hierarchy is designed exactly for this. Root CLAUDE.md contains shared project-wide rules (git conventions, PR format, architecture principles). Subdirectory CLAUDE.md files contain technology-specific rules (React component patterns in `/frontend`, Python type hints and test structure in `/backend`). The subdirectory files take precedence when working in their respective directories."},  // vinipx#49
{id:210,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"You want to package a multi-step code review workflow (run linting, check coverage, review security, summarize findings) that your team can invoke with a single command. What Claude Code feature enables this?",options:["A CLAUDE.md entry that lists all review steps as numbered instructions","A Bash alias that chains multiple separate claude commands together in a shell script","An Agent Skill defined in a dedicated `SKILL.md` file in the project","A custom slash command like `/review-pr` that packages the full workflow"],correct:3,explanation:"Custom slash commands package repeatable, multi-step workflows into a single invocable command. `/review-pr` can encode: lint → check test coverage → security scan → summarize findings. Team members invoke it without needing to know the underlying steps. This is distinct from Agent Skills (which extend Claude\'s knowledge/behavior) and CLAUDE.md (which provides persistent context)."},  // vinipx#50
{id:211,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"You want Claude Code to automatically run your linter after every file edit. Which mechanism achieves this?",options:["Configure a hook that runs the linter command after each Write tool invocation","Add a `post_edit_command` key to the project CLAUDE.md configuration file under the hooks section","Use `permissionMode: \"acceptEdits\"` which triggers post-edit callback hooks","Set up a separate file watcher in your CI/CD pipeline to catch file changes"],correct:0,explanation:"Hooks let you run shell commands at specific points in the Claude Code agent loop. A PostToolUse hook configured on the Write tool will automatically run your linter (or formatter, or type checker) after each file edit. This provides immediate feedback without any additional prompting and ensures code quality gates are applied deterministically."},  // vinipx#51
{id:212,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"What is the key benefit of integrating Claude Code into a CI/CD pipeline for automated PR reviews?",options:["It eliminates the need for human code review entirely across the engineering team","Consistent automated checks on every PR without fatigue, catching bugs early","It provides real-time streaming feedback to developers as they type code","It replaces unit tests with AI-generated assertions for faster test cycles"],correct:1,explanation:"CI/CD integration provides consistent, scalable code review that does not suffer from reviewer fatigue. Claude Code can run on every PR with the same thoroughness: linting, security scan, test coverage check, architecture review, documentation check. This surfaces issues earlier (cheaper to fix) and makes human reviews more focused on logic and design rather than mechanics."},  // vinipx#52
{id:213,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"A new engineer joins the team. What is the most effective way to use CLAUDE.md to accelerate their onboarding?",options:["Have the new engineer write their own CLAUDE.md from scratch as a team onboarding learning task","Provide a curated list of documentation links for them to read independently","Add a section with key architectural decisions, conventions, and common pitfalls","CLAUDE.md is only for configuring Claude Code, not for developer onboarding"],correct:2,explanation:"CLAUDE.md functions as a \"tech lead in a file.\" It can include architectural decision rationale, naming conventions, test patterns, required build commands, common pitfalls, and links to deeper documentation. When a new engineer runs Claude Code, Claude immediately applies all these rules without the engineer needing to ask — effectively encoding institutional knowledge into the development tool."},  // vinipx#53
{id:214,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"Which `allowedTools` configuration creates a read-only agent that can explore a codebase without modifying any files?",options:["`allowedTools: [\"Read\"]` only — the absolute minimum needed for basic file read operations","`disallowedTools: [\"Write\", \"Edit\"]` to block modifications explicitly","`permissionMode: \"readonly\"` to restrict all agents to read-only access","`allowedTools: [\"Read\", \"Glob\", \"Grep\"]` with `permissionMode: \"default\"`"],correct:3,explanation:"A read-only exploration agent needs Read (read file contents), Glob (find files by pattern), and Grep (search file contents). These three tools cover all code exploration needs. Setting `permissionMode: \"default\"` prevents auto-approval of any write operations. Using `disallowedTools` is the inverse approach and may still allow other unintended tools."},  // vinipx#54
{id:215,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"Your CI/CD pipeline runs Claude Code for automated PR review. After 3 weeks, you notice it is generating a high rate of false positive security warnings on legitimate patterns. What is the most effective fix?",options:["Increase the temperature parameter to make Claude less strict","Add known-safe patterns and project-specific security exceptions to the project root CLAUDE.md, and include examples of false positive patterns to avoid","Switch to manual security review to avoid false positives","Remove security checks from the automated review entirely"],correct:1,explanation:"CLAUDE.md is the right place for project-specific security context: known-safe patterns, approved libraries with known \"suspicious\" API usage, exceptions to generic security rules. Including examples of both true positives and false positives in the review instructions reduces noise without removing coverage. This is the CLAUDE.md-as-context-provider pattern."},  // vinipx#55
{id:216,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"Enterprise security policy requires that Claude Code never access files outside the `/src` and `/tests` directories, regardless of what engineers ask it to do. Where should this restriction be defined?",options:["In each engineer\'s personal CLAUDE.md (~/.claude/CLAUDE.md)","In a system prompt passed via the `--system` flag","In the project `.claude/settings.json` (checked into version control) or enterprise policy settings with disallowedTools and path restrictions","In the CI/CD pipeline configuration only — not in the local environment"],correct:2,explanation:"Enterprise-level security restrictions belong in project settings (`.claude/settings.json`) or enterprise policy settings — not personal CLAUDE.md files (which individuals can override) and not the `--system` flag (which is session-specific). Project settings are version-controlled and applied consistently to everyone who works in the repository."},  // vinipx#56
{id:217,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"A team wants to configure Claude Code so that it applies TypeScript strict mode checks, uses their internal design system components, and follows their specific accessibility standards. These rules are complex enough that they cannot be fully described in a single CLAUDE.md. What feature addresses this?",options:["Multiple CLAUDE.md files in different subdirectories","Agent Skills (SKILL.md files) that package specialized knowledge for specific domains — e.g., an accessibility skill with detailed WCAG rules","A longer global user CLAUDE.md with all rules listed","A custom slash command that injects the rules into each session"],correct:1,explanation:"Agent Skills (SKILL.md files) are designed for packaging deep, specialized knowledge that is too detailed for CLAUDE.md. An `accessibility` skill can contain full WCAG 2.1 AA criteria, code examples, common failure patterns, and testing instructions. Claude Code reads the relevant SKILL.md when the task matches the skill\'s triggers, without bloating the always-loaded CLAUDE.md."},  // vinipx#57
{id:218,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"Your automated CI/CD pipeline using Claude Code generates PR feedback reports, but senior engineers complain the feedback is too generic — it ignores the team\'s specific architectural patterns and flags standard patterns as violations. The pipeline uses `permissionMode: \"acceptEdits\"` and a generic system prompt. What is the most impactful single change?",options:["Switch to a more powerful Claude model for better judgment","Add a detailed project root CLAUDE.md that encodes the team\'s specific architectural patterns, approved libraries, known exceptions, and review criteria","Increase `max_turns` to give Claude more iterations to refine feedback","Switch from automated to human-in-the-loop review for architectural checks"],correct:1,explanation:"Generic system prompts produce generic output. A project CLAUDE.md loaded at session start provides persistent, project-specific context: the team\'s architectural patterns, approved vs. disallowed libraries, known-safe patterns that look suspicious, and specific review criteria. This is precisely what CLAUDE.md is for — context that makes Claude Code behave like a team member rather than a generic reviewer."},  // vinipx#58
{id:219,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"A developer is about to have Claude Code perform a large-scale refactoring of the authentication module — replacing the legacy session-based auth with JWT across 47 files. This is a high-stakes, partially reversible operation. What should the developer do before confirming execution?",options:["Run the refactor with `permissionMode: \"acceptEdits\"` for maximum automation","Ask Claude Code to explain its plan in the system prompt before executing","Enter plan mode first: review the full plan of intended changes, then approve or modify before execution begins","Fork the session before the refactor so the original can be resumed if needed"],correct:2,explanation:"Large-scale, partially reversible refactoring is exactly when plan mode is mandatory. Plan mode shows the full intended sequence of changes before any file is modified. The developer can verify the plan covers all 47 files correctly, catches any scope errors, and decides whether to approve, modify, or cancel. Running immediately with `acceptEdits` on a 47-file auth refactor without reviewing the plan first is a high-risk anti-pattern."},  // vinipx#59
{id:220,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"You want your CI pipeline to use Claude Code for automated test generation but need to ensure it never modifies existing production code, only creates new test files. Which combination of settings enforces this?",options:["Add \"only create test files\" to the system prompt","Configure `allowedTools: [\"Read\", \"Glob\", \"Grep\"]` and rely on Claude\'s judgment for file creation","Configure `allowedTools: [\"Read\", \"Glob\", \"Grep\", \"Write\"]` with `disallowedTools: []` and add path restrictions in `.claude/settings.json` limiting Write to the `/tests` directory","Use `permissionMode: \"default\"` which blocks all file writes by default"],correct:2,explanation:"Multi-layer enforcement: (1) `allowedTools` includes Write (needed to create test files) but omits Edit (prevents modifying existing files), (2) path restrictions in `.claude/settings.json` limit Write operations to the `/tests` directory, blocking any attempt to write to production code paths. System prompt instructions alone are insufficient for a CI security requirement."},  // vinipx#60
{id:221,domain:"Prompt Engineering",difficulty:"EASY",type:"mcq",question:"What is the primary advantage of requesting JSON output with a defined schema over free-form text output?",options:["Schema validation guarantees structure and enables reliable downstream parsing","JSON output is always shorter and cheaper than equivalent free-form text output","Claude produces higher quality content when asked to output in JSON format","JSON format prevents Claude from making factual errors in the extracted data"],correct:0,explanation:"Structured JSON output with a defined schema enables reliable programmatic processing: downstream systems can parse fields by name, validate types, and fail fast on schema violations. Free-form text requires fragile regex or NLP parsing. When combined with `strict: true`, the schema contract is guaranteed at the API level."},  // vinipx#61
{id:222,domain:"Prompt Engineering",difficulty:"EASY",type:"mcq",question:"What is a few-shot prompt?",options:["A prompt sent multiple times until Claude eventually produces the right answer through repetition","A prompt with input-output examples that demonstrate the desired behavior pattern","A prompt that limits Claude to short responses of only a few sentences each","A batch of multiple prompts that are processed simultaneously in one API call"],correct:1,explanation:"Few-shot prompting provides examples of the desired input-output pattern within the prompt. These examples act as demonstrations — they show Claude the format, style, and reasoning pattern expected. Few-shot examples are effective for establishing output format and tone but are not compliance mechanisms (they cannot guarantee behavior)."},  // vinipx#62
{id:223,domain:"Prompt Engineering",difficulty:"EASY",type:"mcq",question:"The Message Batches API offers approximately what cost reduction compared to the standard synchronous API?",options:["10%","25%","50%","75%"],correct:2,explanation:"The Message Batches API offers approximately 50% cost savings compared to real-time API calls. The tradeoff is a 24-hour processing window with no SLA guarantees. This makes it suitable only for latency-tolerant, non-interactive workloads — batch classification, overnight analysis, bulk transformations."},  // vinipx#63
{id:224,domain:"Prompt Engineering",difficulty:"EASY",type:"mcq",question:"What is a validation retry loop in the context of structured output extraction?",options:["A loop that automatically retries the API call three times on any error regardless of its cause","A client-side retry mechanism for handling API rate limits gracefully","A mechanism that validates user input before sending it to the Claude API","A pattern where the model gets its validation errors and regenerates until passing"],correct:3,explanation:"Validation retry loops are a self-healing pattern: (1) request structured output, (2) validate against schema, (3) if validation fails, send the specific error back to Claude (\"Field `price` must be a number, you returned a string\"), (4) Claude regenerates with that specific feedback. Without the error feedback, Claude cannot self-correct reliably."},  // vinipx#64
{id:225,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"You need to extract structured data from 50,000 product descriptions overnight. The downstream system ingests a batch file at 6 AM the next day. Assume the batch job is submitted with sufficient lead time for completion. Which API approach is most appropriate?",options:["Message Batches API — 50% cost savings with a 24-hour processing window","Standard synchronous API with 50 parallel threads for maximum throughput","Streaming API for real-time processing with minimal per-request overhead","Standard API with prompt caching for repeated schema definition prefixes"],correct:0,explanation:"Overnight bulk processing with a next-morning deadline is the canonical Message Batches API use case: (1) latency-tolerant (deadline is tomorrow morning, not now), (2) non-interactive (no user waiting), (3) high volume (50k requests). The 50% cost savings on this volume is significant. Parallel synchronous requests would work but cost double and add infrastructure complexity."},  // vinipx#65
{id:226,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"A validation retry loop is running but Claude keeps making the same schema error repeatedly across retries. What is most likely causing this?",options:["The model needs to be replaced with a larger, more capable one for this task","Error feedback is too generic — it lacks the specific field name and expected type","The JSON schema is too complex for Claude to follow reliably in this context","Validation retry loops are only effective for the first retry attempt per field in each extraction"],correct:1,explanation:"For self-correction to work, the error feedback must be specific. \"Validation failed\" is useless. \"Field `publish_date` must be ISO 8601 format (YYYY-MM-DD). You returned `March 15, 2026` — please use `2026-03-15` instead.\" is actionable. The more precisely the error identifies what failed and what the correct format is, the more reliably Claude self-corrects."},  // vinipx#66
{id:227,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"When is it NOT appropriate to use the Message Batches API?",options:["For classifying 100,000 support tickets overnight with results by morning","For generating weekly summary reports that run on Sunday each week","For live user queries in a chat app that requires sub-2-second latency","For bulk document analysis with results needed the next business day"],correct:2,explanation:"The Message Batches API has a 24-hour processing window with no latency SLA. Live user queries requiring sub-2-second responses must use the synchronous API. Using Batches for live interactions would result in users waiting minutes or hours for responses. The key filter: if a real human is waiting for the answer right now, use synchronous API."},  // vinipx#67
{id:228,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"You are building a document review system with a few iterations: first iteration extracts all claims, second iteration verifies each claim against sources, third iteration generates a credibility report. What architectural pattern does this represent?",options:["A standard validation retry loop that corrects schema errors on each pass","Parallel decomposition where all dimensions are analyzed simultaneously","Chain-of-thought prompting applied across multiple sequential API calls","Multi-pass review — separate specialized passes for each review dimension"],correct:3,explanation:"Multi-pass review architecture dedicates each pass to a single review dimension: extract claims (no judgment, just extraction), verify claims (no extraction, just verification), report credibility (no extraction or verification, just synthesis). Each pass gets full attention on its specific task. Attempting all three in one pass causes attention dilution and lower quality on each dimension."},  // vinipx#68
{id:229,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"Few-shot examples are effective for which purpose, and NOT effective for which purpose?",options:["Effective for format and style demonstration; not for guaranteeing compliance","Effective for compliance enforcement; not effective for output format control","Effective for preventing hallucinations; not effective for formatting output","Effective for all purposes universally; no known limitations for few-shot use"],correct:0,explanation:"Few-shot examples are excellent for demonstrating desired output format, style, and reasoning patterns — Claude reliably mimics demonstrated patterns. They are NOT compliance mechanisms: showing Claude examples of correct tool ordering does not guarantee it will always follow that order (a probabilistic influence, not deterministic enforcement). For compliance, use programmatic mechanisms."},  // vinipx#69
{id:230,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"What does `strict: true` on a tool definition guarantee?",options:["Claude will always use this specific tool regardless of the conversation context or user intent","Tool calls will always match the defined JSON schema — no missing or wrong fields","The tool will reject invalid inputs at the MCP server level before processing","Claude will validate the tool\'s output before returning results to the user"],correct:1,explanation:"`strict: true` enables Structured Outputs for tool use, guaranteeing that every tool call Claude generates adheres exactly to the defined input schema. This eliminates runtime errors caused by Claude passing `null` for a required field or a string where an integer is expected. It is a pre-call guarantee, not a post-call validation."},  // vinipx#70
{id:231,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"A structured data extraction pipeline processes legal contracts. 15% of contracts use non-standard date formats that cause schema validation failures. The retry loop sends back \"Invalid date format.\" How should the retry prompt be improved?",options:["Increase max_retries from 3 to 10","Remove the date field from the schema and process dates separately","Include in the retry: the exact field that failed, the expected format (ISO 8601: YYYY-MM-DD), the value Claude returned, and an example conversion","Switch to a few-shot approach with date format examples in the initial prompt"],correct:2,explanation:"Specific error feedback is the key to reliable self-correction. The retry should include: \"Field `contract_date` requires ISO 8601 format (YYYY-MM-DD). You returned `15th March 2026`. The correct value is `2026-03-15`.\" This gives Claude the exact field, the exact format requirement, the exact wrong value, and the correct form — all the information needed to fix it on the next attempt."},  // vinipx#71
{id:232,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"You are designing a prompt for a CI code review tool that must provide actionable, specific feedback and minimize false positives. Which prompt engineering technique is MOST important?",options:["Chain-of-thought: ask Claude to reason step by step","Few-shot: provide examples of good vs. bad review comments, distinguishing true positives from common false positives specific to your codebase","Higher temperature: generate more diverse feedback","Longer prompts: include all possible coding standards in the system prompt"],correct:1,explanation:"Few-shot examples are uniquely powerful for CI review because they demonstrate the style distinction between actionable feedback (\"Line 47: `user_input` is used in an SQL query without parameterization\") vs. vague false positives (\"This code might have security issues\"). Pairing positive examples (good reviews) with negative examples (common false positives in your codebase) calibrates Claude\'s judgment to your team\'s standards."},  // vinipx#72
{id:233,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"A batch job uses the Message Batches API to process 10,000 support ticket classifications. The job starts at 11 PM and the results are needed by 9 AM. Should you use the Batches API? What is the key risk?",options:["Yes — 10 hours is sufficient buffer. Key risk: the 24-hour window means results may not be ready within 10 hours","No — use synchronous API instead","Yes — the 24-hour window guarantees completion within 9 hours","No — Batches API is limited to 1,000 requests"],correct:0,explanation:"The Message Batches API has a 24-hour *window* — not a 10-hour guarantee. While most batch jobs complete much faster than 24 hours, there is no SLA. If the 9 AM deadline is hard, there is a risk of results not being ready. For guaranteed timing, use the synchronous API. This is the core Batches API tradeoff the exam tests: cost savings vs. latency unpredictability."},  // vinipx#73
{id:234,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"A content moderation pipeline classifies 1 million items per day. The schema has 12 fields with nested objects. Validation shows 3% of outputs fail the schema on the first pass. The retry loop fixes 97% of failures. What is the remaining architectural concern?",options:["A 3% initial failure rate is too high and the schema must be simplified","The retry loop cost (3% × full-price retries vs. Batches pricing) and retry latency must be factored into the SLA and cost model for production","Validation retry loops cannot be used with the Batches API","The remaining 3% after retry (0.09% total) can be ignored at this scale"],correct:1,explanation:"At 1M items/day, 3% initial failure = 30,000 retry calls. If retries use synchronous API (can\'t use Batches for time-sensitive retries), the cost and latency model changes significantly. Additionally, the 3% of Batches failures that enter retry queues may violate latency SLAs if the pipeline has hard deadlines. Production architecture must account for the retry cost and latency of the failure-and-recover path, not just the happy path."},  // vinipx#74
{id:235,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your extraction system processes invoices and must populate 8 mandatory fields. On the first pass, 18% of invoices fail validation — mostly because `currency_code` is returned as \"US Dollars\" instead of the ISO 4217 code \"USD\". After implementing a retry loop, failures drop to 2%. The remaining 2% have ambiguous or missing currency information in the source document. How should you handle the persistent 2%?",options:["Run them through three more retry passes until they succeed","Use a default currency code of \"USD\" for all remaining failures","Mark them with a `requires_human_review: true` flag and `confidence: \"low\"` field, route to a manual review queue rather than auto-processing","Drop them from the pipeline to maintain data quality"],correct:2,explanation:"When repeated retry passes still fail, the underlying issue is ambiguous source data — no amount of retrying will produce a reliable answer. The correct architectural pattern is graceful degradation: set `requires_human_review: true` and `confidence: \"low\"`, route to a manual review queue, and process the remaining 98% automatically. This maximizes automation while maintaining data quality for the edge cases that genuinely need human judgment."},  // vinipx#75
{id:236,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your CI pipeline generates code review comments using Claude. Developers complain that 40% of security-related comments are false positives about their use of `eval()` in a controlled, sandboxed context. You have documented that `eval()` in the `/sandbox` directory is reviewed and approved. What is the most targeted fix?",options:["Remove all security checks from the automated review","Add a post-processing filter that removes any comment mentioning `eval()`","Add to CLAUDE.md: \"In the /sandbox directory, eval() usage has been security-reviewed and approved. Do not flag eval() in /sandbox as a security issue.\"","Increase the review model\'s temperature to reduce repeated patterns"],correct:2,explanation:"This is a targeted CLAUDE.md context injection. The false positives are caused by Claude lacking project-specific knowledge that `/sandbox/eval()` is approved. Adding this specific exception to CLAUDE.md tells Claude exactly which pattern to exempt and why — without removing eval() coverage elsewhere. Removing all security checks or adding blanket filters are over-corrections that reduce security coverage across the codebase."},  // vinipx#76
{id:237,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"You need to build a contract analysis pipeline that extracts 15 fields from legal documents including parties, dates, payment terms, termination clauses, and governing law. Some documents are 80+ pages. What is the most reliable architecture?",options:["Send the entire 80-page document in one API call with all 15 fields in the schema","Use a multi-pass architecture: pass 1 extracts structural elements (parties, dates), pass 2 extracts financial terms, pass 3 extracts legal clauses — each pass with focused schema and relevant document sections","Use a larger context window model and extract all 15 fields simultaneously","Chain 15 separate API calls, one per field"],correct:1,explanation:"Multi-pass extraction on long documents produces significantly better results than single-pass. Each pass focuses on a subset of related fields and the relevant document sections (e.g., pass 1 only reads the header and signature blocks; pass 2 reads the payment section). This prevents attention dilution, reduces the extraction schema complexity per pass, and allows each pass to use the most relevant document context."},  // vinipx#77
