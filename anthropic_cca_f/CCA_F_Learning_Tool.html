{id:299,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Your data extraction pipeline achieves 97% overall accuracy across 10,000 documents. Based on this, your team decides to stop human review for all extractions with model confidence > 0.9. Three months later, you discover a systematic 40% error rate on one document type (scanned PDFs with handwritten annotations) that represents 8% of your volume. What went wrong?",options:["The confidence threshold was set too high; lowering it to 0.8 would have caught more errors","Overall accuracy metrics can mask poor performance on specific document types or fields; stratified analysis by document type and field should have been done before automating high-confidence extractions","The 97% accuracy was calculated on a biased sample; use random sampling next time","Confidence scores above 0.9 are inherently unreliable; use a different metric"],correct:1,explanation:"Aggregate accuracy metrics hide segment-level failures. 97% overall accuracy could coexist with 40% error on a specific document type if that type is a small fraction of volume — the high performance on the majority papers over the minority failures. The correct approach is stratified analysis: measure accuracy by document type, field, and other segments before reducing human review. Confidence threshold (A) doesn\'t address the root cause — the model was also highly confident on the scanned PDFs it got wrong. Sampling bias (C) is not the issue. Confidence score reliability (D) misidentifies the problem."},  // vinipx#139
{id:300,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"A multi-agent research pipeline has a web search agent and a document analysis agent that both find statistics on AI adoption rates. The web search agent finds \"34% of enterprises have deployed AI in production\" (McKinsey 2024). The document analysis agent finds \"67% of enterprises have deployed AI in production\" (Gartner 2024). Both sources are credible. How should the synthesis agent handle this?",options:["Use the more recent source and discard the older one","Average the two values: report \"~50% of enterprises have deployed AI in production\"","Pick the more conservative estimate to avoid overstating adoption","Report both values with their source attributions and explicitly annotate the conflict, preserving both for the final report to distinguish contested from well-established findings"],correct:3,explanation:"When credible sources conflict, the synthesis agent must not arbitrarily select one value, average them, or suppress the conflict. The correct approach is to annotate the conflict: include both values with their source attributions (McKinsey vs Gartner, 2024), note the discrepancy, and structure the final report to distinguish well-established findings from contested ones. This preserves information provenance and lets readers understand the uncertainty rather than presenting a false consensus. Arbitrarily selecting recency (A), averaging (B), or conservatism (C) all destroy information and misrepresent the evidence."},  // vinipx#140
{id:301,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A multi-phase coordinator agent crashes after completing phase 2 of a 4-phase research pipeline. The pipeline must resume without restarting from the beginning. Which architecture enables reliable crash recovery?",options:["Rely on `--resume` to reload the conversation history and infer progress from prior messages","Implement session checkpointing with `fork_session` at the end of each phase","Have each phase export a structured state manifest (completed work, partial results, next phase inputs) to a known location, and have the coordinator load that manifest on startup to determine where to resume","Configure the coordinator with a high `max_tokens` budget so phases are less likely to be interrupted"],correct:2,explanation:"`--resume` reloads conversation history but cannot recover in-progress subagent state or structured phase outputs — it tells you what was discussed, not what was computed. `fork_session` creates a branch of the conversation but also does not persist phase outputs across crashes. The correct pattern is structured state exports: at the end of each phase, the coordinator writes a manifest (phase number, completed agent outputs, next-phase inputs) to a known file location. On startup, the coordinator reads the manifest to determine the last completed phase and continues from there. High `max_tokens` budgets (D) affect generation length, not crash recovery."},  // vinipx#141
{id:302,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"A coordinator agent needs to inventory all files matching a complex pattern across a large monorepo before deciding which ones to process. This discovery step generates thousands of lines of tool output. What is the recommended approach to prevent this verbose output from exhausting the coordinator\'s context budget?",options:["Increase the coordinator\'s context window by switching to a model with a larger context limit","Have the coordinator run the discovery tools directly and use /compact after each batch","Spawn a dedicated Explore subagent to perform the discovery; the subagent\'s verbose tool results accumulate in its own isolated context and only a structured summary is returned to the coordinator","Run the discovery step synchronously before starting the agentic loop so output does not enter the conversation history"],correct:2,explanation:"The Explore subagent pattern exists specifically for this problem: verbose discovery work runs inside the subagent\'s isolated context window. The coordinator only receives the structured summary (e.g., a list of matching file paths and their purposes) — not the raw tool output that generated it. This keeps the coordinator\'s context clean for high-level orchestration. Switching to a larger context model (A) delays but does not prevent exhaustion. /compact (B) compresses history but loses detail the coordinator may need later. Running discovery before the loop (D) still produces output that must live somewhere — it does not avoid the accumulation problem."},  // vinipx#142
{id:303,domain:"Tool Design",difficulty:"EASY",type:"mcq",question:"In the Model Context Protocol, what is the difference between an MCP Resource and an MCP Tool?",options:["Resources are faster than Tools because they skip the server round-trip and resolve content locally","Resources are defined in `.mcp.json` while Tools are defined in prompts","Resources expose content catalogs for browsing; Tools expose parameterized operations","Resources are read-only versions of Tools with otherwise identical functionality"],correct:2,explanation:"MCP Resources and MCP Tools serve distinct purposes. A Resource is a content catalog entry — it tells the agent what data exists (e.g., a list of issue summaries, documentation pages, database schema) so the agent can choose what to request without making blind exploratory tool calls. A Tool is an operation: it takes parameters, executes logic, and returns results. By browsing Resources first, an agent avoids calling a tool with wrong parameters or fetching documents it does not need. Options A, C, and D conflate or misrepresent these distinct concepts."},  // vinipx#143
{id:304,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"Your team needs to integrate Claude Code with Jira to let agents create and update tickets. A developer proposes building a custom MCP server for Jira. What is the recommended approach?",options:["Build a custom MCP server to have full control over the Jira API surface and schema exposed","Connect directly to the Jira REST API via a generic `fetch_url` tool instead","Embed Jira credentials in the system prompt and use built-in web fetch tool","Use the existing community MCP server; reserve custom builds for unique needs"],correct:3,explanation:"For standard integrations like Jira, GitHub, or Slack, the MCP ecosystem has community servers that are already built, tested, and maintained. Using an existing community server eliminates engineering overhead and gets the integration working immediately. Custom MCP servers should be reserved for workflows that are genuinely team-specific — internal databases, proprietary APIs, or unusual tool compositions that have no existing solution. A generic `fetch_url` tool (C) bypasses the structured, purpose-built capabilities of an MCP server. Embedding credentials in the system prompt (D) is a security anti-pattern."},  // vinipx#144
{id:305,domain:"Tool Design",difficulty:"MEDIUM",type:"mcq",question:"You add a powerful `semantic_search_codebase` MCP tool that outperforms Grep for conceptual queries across a large monorepo. However, you observe that Claude consistently uses Grep instead. What is the most likely cause and fix?",options:["The tool description is too vague — rewrite it to explain when it outperforms Grep","The MCP server has higher latency than Grep; reduce server response time to make it competitive","Claude always prefers built-in tools over MCP tools; this cannot be changed","Add a system prompt instruction: \"always use semantic_search_codebase instead\""],correct:0,explanation:"Claude selects tools based on their descriptions. If `semantic_search_codebase` has a generic description like \"search the codebase\", Claude has no basis for preferring it over Grep, which it already understands well. The fix is to write a description that explains the tool\'s unique capabilities: \"Use this tool for conceptual or semantic queries where you need to find code related to a concept, pattern, or intent — not just a literal string. More accurate than Grep for queries like \'authentication middleware\' or \'payment processing logic\'.\" Latency (A) is not the cause here. Claude does not unconditionally prefer built-in tools (B). A system prompt instruction (D) is fragile compared to a well-written description."},  // vinipx#145
{id:306,domain:"Claude Code",difficulty:"EASY",type:"mcq",question:"A team member reports that Claude Code is not applying the project\'s CLAUDE.md rules — it seems to ignore certain conventions that should be loaded. What is the first diagnostic step?",options:["Delete and re-create the CLAUDE.md file from scratch, as it may have been corrupted or malformed","Run `/memory` to verify which memory files are actually loaded in the session","Check the file permissions on CLAUDE.md to ensure Claude Code can read it","Add the rules to the system prompt in `docusaurus.config.ts` as a fallback"],correct:1,explanation:"The `/memory` command displays all memory files currently loaded in the session, including which CLAUDE.md files are active and from which directories. This is the direct way to verify whether the expected CLAUDE.md is being found and loaded — before spending time debugging the file\'s contents. Common causes for missing CLAUDE.md: the file is in the wrong directory, the session was started from a different working directory, or there is a typo in the filename. Deleting and recreating (A) destroys content unnecessarily. File permissions (C) are rarely the issue on developer machines. Modifying project config files (D) is not how Claude Code memory works."},  // vinipx#146
{id:307,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"You want a Claude Code CI step to produce structured security findings that a downstream script can parse and post as inline PR comments via the GitHub API. Which CLI flag combination achieves this?",options:["`-p` (non-interactive) combined with `--format structured` output flag","`--silent` combined with `--export findings.json` after the run completes","`--output-format json` combined with `--json-schema <schema-file>` for shape","Pipe stdout through `jq` to extract JSON from Claude\'s natural-language prose responses"],correct:2,explanation:"`--output-format json` tells Claude Code to emit structured JSON output instead of Markdown prose. Combined with `--json-schema <schema-file>`, it enforces a specific JSON shape so the downstream script can reliably parse fields like `file`, `line`, `severity`, and `message` to construct inline PR comments. `-p` makes the session non-interactive but does not control output format. `--silent` and `--export` are not valid Claude Code flags. Piping through `jq` (D) is fragile because it depends on Claude embedding valid JSON in free-form text, which is not guaranteed."},  // vinipx#147
{id:308,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"Your CI pipeline runs a Claude Code review on every push to a PR. Developers complain that each new push generates duplicate comments about issues that were already reported on a previous push and have not been fixed yet. How do you fix this?",options:["Switch from per-push triggers to a scheduled nightly review to reduce comment frequency","Deduplicate comments in the GitHub API layer by comparing new comments against existing ones before posting","Include the prior review findings in the context for each new run and instruct Claude to report only issues that are new or still unaddressed since the last review","Reduce the review scope to only the diff of each push, not the full file"],correct:2,explanation:"The root cause is stateless review: each run has no knowledge of what was already reported. The fix is to inject context: retrieve the findings from the previous review run (stored as a file or fetched from the PR comments), include them in the prompt for the current run, and instruct Claude to report only issues that are either new or still unresolved. This requires Claude to distinguish between \"this issue was reported in the prior run and is still present\" versus \"this is a new issue introduced since the last review.\" A nightly schedule (A) reduces frequency but does not eliminate duplicates. GitHub API deduplication (B) is a workaround that does not leverage Claude\'s reasoning. Diff-only review (D) misses regressions in unchanged code."},  // vinipx#148
{id:309,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"You ask Claude Code to implement a complex data transformation function. After three iterations, the output still has subtle edge case bugs that are hard to describe in prose. What iteration strategy will most reliably converge on a correct implementation?",options:["Add more detailed prose descriptions of each edge case in follow-up messages","Switch to a more capable model mid-session for the remaining iteration passes","Use plan mode to have Claude design the algorithm approach before implementing any code","Write tests first, then iterate by sharing actual test failure output with Claude"],correct:3,explanation:"Test-driven iteration is the most reliable convergence strategy for complex implementations. Writing tests first gives Claude an objective, executable specification — instead of prose descriptions that can be ambiguous, the failing test output (exact assertion, expected vs. actual values, stack trace) provides precise, machine-generated feedback. Claude can reason about the specific failure and make targeted corrections. Repeated prose descriptions (A) remain ambiguous and lead to the same misinterpretations. Switching models mid-session (B) does not address the root cause. Plan mode (D) helps with design but does not replace test feedback for implementation correctness."},  // vinipx#149
{id:310,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"You ask Claude Code to generate test cases for a module that already has a 200-line test file with 40 tests. The generated tests are mostly duplicates of existing coverage. What is the fix?",options:["Include the existing test file so Claude sees what is already covered and fills gaps","Ask Claude to generate tests for \"uncovered paths only\" in the task prompt text without providing code","Generate tests in a fresh session with no prior context to avoid anchoring bias","Use a coverage report to identify uncovered lines and paste those into the prompt"],correct:0,explanation:"When generating tests without access to existing test files, Claude defaults to testing the most obvious behaviors — which are typically already covered. Providing the existing test file as context gives Claude visibility into what is already tested, allowing it to reason about gaps: uncovered edge cases, error paths, boundary conditions, and interaction scenarios. Option A\'s prose instruction helps but is less precise than actual test code. A fresh session (C) makes the duplication problem worse, not better. Pasting uncovered lines (D) provides implementation context but not test coverage context — Claude still does not know what was already tested."},  // vinipx#150
{id:311,domain:"Claude Code",difficulty:"MEDIUM",type:"mcq",question:"During a debugging session, you identify two bugs: Bug A causes incorrect tax calculation in the checkout module, and Bug B causes a display error in the order history page. These modules share no code. How should you structure your messages to Claude Code?",options:["Send both bugs in a single detailed message so Claude considers any potential code interactions","Fix Bug A first, review the diff, then send Bug B — sequential gives clean attribution","Create a new session for each bug to ensure completely clean isolated context","Send Bug B first since display bugs are simpler, then tackle Bug A afterward"],correct:1,explanation:"When bugs are independent (no shared code, no interacting fixes), sequential iteration is preferred. Fixing one bug per message keeps the diff small and attributable — you can review exactly what changed for Bug A before introducing Bug B\'s changes. If bugs interact (e.g., both stem from a shared data model), they should be sent together so Claude can design a unified fix. In this case, the checkout module and order history page share no code, so there is no interaction risk, and sequential messages provide the cleaner workflow."},  // vinipx#151
{id:312,domain:"Prompt Engineering",difficulty:"MEDIUM",type:"mcq",question:"You are designing a JSON schema for a medical claims classification pipeline. The category field must be one of a predefined list, but new claim types occasionally appear that do not fit any category. What schema pattern prevents hallucinated category values while keeping the pipeline extensible?",options:["Use a free-text `category` string field so the model can describe any claim type in its own words","Make `category` a required enum and retrain the model when new types appear","Add an `\"other\"` enum value with a companion `category_detail` field for specifics","Use a category array so the model can select multiple values when one won\'t fit"],correct:2,explanation:"A free-text field (A) removes the guarantee of controlled vocabulary — the model will produce different strings for the same concept across runs. A pure enum without a catch-all (C) forces the model to pick the nearest wrong category rather than admitting the case does not fit, degrading accuracy. A multi-select array (D) changes the semantics of the field. The correct pattern is `enum: [\"medical\", \"dental\", \"pharmacy\", \"other\"]` paired with `category_detail: string | null` — populated only when `category === \"other\"`. This preserves controlled vocabulary for known types, enables downstream filtering and aggregation, and gives a structured escape hatch for novel cases that surfaces them for human review without hallucinating a false category."},  // vinipx#152
{id:313,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your code review pipeline produces structured findings that developers frequently dismiss as false positives. You want to systematically improve the pipeline\'s precision over time. Which schema addition enables this analysis?",options:["Add a `severity: \"critical\" | \"high\" | \"medium\" | \"low\"` field to filter out low-severity findings before display","Add a `detected_pattern` field to each finding that names the code construct that triggered the finding (e.g., `\"eval_in_userland\"`, `\"unvalidated_redirect\"`); when developers dismiss findings, analyze which patterns are dismissed most frequently to identify false positive candidates","Add a `model_confidence: number` field and only show findings where confidence > 0.8","Add a `fix_suggestion: string` field so developers can accept the fix with one click instead of dismissing"],correct:1,explanation:"The `detected_pattern` field instruments findings with the code construct that triggered them. When developers dismiss a finding, that pattern name is logged. Over time, patterns that are dismissed at high rates (e.g., 80% of `\"eval_in_userland\"` findings are dismissed in this codebase) are identified as false positive candidates for prompt tuning or rule exclusion. Severity filtering (A) reduces noise but does not provide signal for improvement. Model confidence scores (C) are poorly calibrated — high confidence does not correlate reliably with correctness. Fix suggestions (D) improve developer experience but do not help identify systematic false positive patterns."},  // vinipx#153
{id:314,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your document processing pipeline must return results within 30 hours of document receipt. You plan to use the Message Batches API (24-hour processing window). What is the maximum allowable time between document receipt and batch submission to guarantee the 30-hour SLA?",options:["12 hours — leave buffer on both sides of the 24-hour window","24 hours — the batch window starts after submission so documents can wait a full day","6 hours — SLA (30h) minus the maximum batch processing time (24h) leaves 6 hours for pre-submission queuing","There is no safe window; the Batches API cannot guarantee a 30-hour SLA"],correct:2,explanation:"The calculation is straightforward: SLA deadline (30h) − maximum batch processing time (24h) = maximum pre-submission delay (6h). Documents must be submitted to a batch within 6 hours of receipt to guarantee that even a worst-case 24-hour processing window still meets the 30-hour SLA. Leaving 12 hours (A) is unnecessarily conservative — documents received 7-12 hours ago would be rejected when they could safely be included. Waiting 24 hours (B) guarantees SLA violations for documents that take the full 24-hour processing window. Option D is incorrect — the Batches API can meet this SLA if submission timing is managed."},  // vinipx#154
{id:315,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your structured data extraction pipeline outputs a confidence score alongside each extracted field. A teammate argues these per-field confidence scores should never be used to route review decisions because \"model confidence scores are unreliable.\" How do you respond?",options:["Agree — self-reported confidence scores are always unreliable and should be removed from the schema","Per-field confidence scores can be a valid routing signal when calibrated against a labeled validation set: measure what confidence threshold corresponds to acceptable accuracy on labeled data, then route fields below that threshold to human review","Use the scores only for fields that are not critical to downstream decisions","Replace confidence scores with a binary `is_certain: boolean` flag to avoid the calibration problem"],correct:1,explanation:"The distinction is calibration. Raw, uncalibrated confidence scores correlate poorly with accuracy — models can be highly confident on wrong extractions. However, when you build a labeled validation set (e.g., 500 manually verified extractions), measure actual accuracy at each confidence level, and find that confidence > 0.87 corresponds to 95% accuracy in your specific domain, you have a calibrated threshold. Fields below that threshold are routed to human review. This is different from using raw confidence as a blanket routing signal (the anti-pattern) — it is an empirically validated threshold specific to your pipeline. Removing confidence scores entirely (A) discards a useful signal. Binary flags (D) are less informative."},  // vinipx#155
{id:316,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"A customer support agent calls `lookup_customer(\"Smith\")` and receives three matching records: John Smith (account #1001), Jane Smith (#1002), and Robert Smith (#1003). What should the agent do?",options:["Select the most recently active account as it is most likely the caller","Select the first match returned by the lookup tool as the default result","Process the request for all three accounts simultaneously to cover all bases","Ask the customer for an additional identifier like email or order number"],correct:3,explanation:"When a lookup returns multiple matches, heuristic selection (most recent, first result) risks performing actions on the wrong customer account — applying a refund, updating contact info, or canceling an order for the wrong person. The correct pattern is to ask the customer for a disambiguating identifier that is unique to their account: email, order number, or a card\'s last 4 digits. This is a deterministic resolution that avoids both heuristic errors and the impracticality of processing all matching accounts. Processing all three accounts (D) would be incorrect and potentially harmful."},  // vinipx#156
{id:317,domain:"Context Management",difficulty:"MEDIUM",type:"mcq",question:"A customer says: \"This is absolutely unacceptable! I\'ve been waiting three weeks for a refund and nobody has helped me!\" They have not asked to speak to a human. The agent can verify the refund status and initiate a resolution. What should the agent do?",options:["Acknowledge frustration, investigate the refund status, and offer a resolution","Immediately escalate to a human agent because the customer sounds frustrated","Apologize for the delay and close the ticket, asking them to call support instead","Ask the customer to rate their frustration level on a scale of 1-10 first"],correct:0,explanation:"Frustration alone is not an escalation trigger. The escalation rule is: explicit request for a human = immediate escalation; frustration without an explicit request = acknowledge and attempt resolution. In this case, the agent should validate the customer\'s experience (\"I understand how frustrating a three-week wait is\") and then address the underlying issue — verifying the refund status and initiating resolution if possible. Immediate escalation on frustration alone (A) ignores cases the agent can and should handle. Deflecting to a phone line (C) abandons the customer. Asking them to rate frustration (D) adds friction without value."},  // vinipx#157
{id:318,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"A multi-agent research system has a web search subagent and a document analysis subagent. Both return statistics on cloud adoption rates. The web search agent returns \"48% of enterprises use cloud\" from a 2021 report. The document analysis agent returns \"81% of enterprises use cloud\" from a 2024 report. The synthesis agent flags this as a conflict. What is the correct interpretation and what schema change prevents this misclassification?",options:["This is a genuine conflict; annotate it as contested data and present both values without interpretation","The 2024 value supersedes the 2021 value; discard the older finding","These values represent the same metric at different points in time — a time series, not a conflict. Requiring subagents to include a `publication_date` or `data_collection_date` field in structured outputs enables the synthesis agent to correctly interpret temporal differences rather than treating them as source conflicts","Average the two values to produce a best estimate of current adoption"],correct:2,explanation:"The same metric measured at different times is a time series, not a contradiction. Cloud adoption rising from 48% in 2021 to 81% in 2024 is entirely plausible. Without timestamps in the structured output, the synthesis agent has no way to distinguish \"two sources disagree\" from \"the same metric changed over time.\" The fix is schema-level: require each subagent\'s structured output to include a `publication_date` or `data_collection_date` field. With dates, the synthesis agent can correctly interpret the values as a temporal progression and present them as a trend. Treating it as a conflict (A) misrepresents the data. Discarding the older value (B) loses valid historical context."},  // vinipx#158
{id:319,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your CI/CD system performs three types of Claude-powered analysis: (1) quick style checks on each PR that block merging until complete, (2) comprehensive security audits of the entire codebase run weekly, and (3) test case generation triggered nightly for recently-modified modules. The Message Batches API offers 50% cost savings but can take up to 24 hours to process. You want to optimize API costs while maintaining acceptable developer experience. Which combination correctly matches each task to its API approach?",options:["Use synchronous calls for PR style checks and nightly test generation; use Message Batches API only for weekly security audits.","Use the Message Batches API for all three tasks to maximize the 50% cost savings, and configure the pipeline to poll for batch completion.","Use synchronous calls for all three tasks for consistent response times, and rely on prompt caching to reduce costs across all workloads.","Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation."],correct:3,explanation:"PR style checks block developers from merging and require immediate responses — they must use synchronous calls. Weekly security audits and nightly test generation are scheduled tasks with flexible timelines: they already run asynchronously and can easily tolerate the up-to-24-hour batch processing window. Using the Batches API for both scheduled workflows captures the 50% cost savings on the two highest-volume workloads without degrading developer experience. Option A incorrectly uses sync for nightly test generation, missing cost savings. Option B would make PR style checks unusable. Option C foregoes all batch savings."},  // vinipx#159
{id:320,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your automated review analyzes comments and docstrings. The current prompt instructs Claude to \"check that comments are accurate and up-to-date.\" Findings frequently flag acceptable patterns (TODO markers, straightforward descriptions) while missing comments that describe behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?",options:["Include git blame data so Claude can identify comments that predate recent code modifications","Filter out TODO, FIXME, and descriptive comment patterns before analysis to reduce noise","Add few-shot examples of misleading comments to help the model recognize similar patterns in the codebase","Specify explicit criteria: flag comments only when their claimed behavior contradicts actual code behavior"],correct:3,explanation:"The root cause is the vague instruction \"check that comments are accurate and up-to-date,\" which provides no concrete definition of what makes a comment problematic. Specifying explicit criteria — flag a comment only when its stated behavior contradicts what the code actually does — removes the ambiguity that generates both false positives (TODO markers, obvious descriptions) and false negatives (stale behavioral claims). This directly targets the mismatch between claim and implementation. Git blame (A) adds noise without a decision rule. Filtering (B) is a workaround, not a fix. Few-shot examples (C) help but are secondary to fixing the missing criterion."},  // vinipx#160
{id:321,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"The code review component works iteratively: Claude analyzes a changed file, then may request related files (imports, base classes, tests) via tool calling to understand context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude invokes this tool, receives results, and continues its analysis. You\'re evaluating batch processing to reduce API costs. What is the primary technical constraint when considering batch processing for this workflow?",options:["The batch API does not support tool definitions in request parameters.","Batch processing latency of up to 24 hours is too slow for pull request feedback, though the workflow could otherwise function.","The asynchronous model prevents executing tools mid-request and returning results for Claude to continue analysis.","Batch processing lacks request correlation identifiers for matching outputs to input requests."],correct:2,explanation:"The Batches API uses a fire-and-forget asynchronous model: you submit a batch and poll for completion; there is no mechanism to intercept a tool call mid-request, execute it server-side, and return the result so Claude can continue. Iterative tool-calling requires multiple round-trips within a single logical interaction — Claude calls a tool, your code executes it and returns the result, Claude resumes. This architecture is fundamentally incompatible with the batch model. The latency concern (B) is real but secondary — even if latency were acceptable, the workflow would still be broken because the tool calls cannot be served. Tool definitions (A) are supported in batch requests. Correlation IDs (D) are handled via the custom_id field."},  // vinipx#161
{id:322,domain:"Prompt Engineering",difficulty:"HARD",type:"mcq",question:"Your automated code review averages 15 findings per pull request, with developers reporting a 40% false positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude\'s reasoning before deciding whether to address or dismiss it. Your CLAUDE.md already contains comprehensive rules for acceptable patterns, and stakeholders have rejected any approach that filters findings before developer review. What change would best address the investigation time bottleneck?",options:["Require Claude to include its reasoning and confidence assessment inline with each finding","Categorize findings as \"blocking issues\" versus \"suggestions\" with tiered review requirements","Add a post-processor that analyzes finding patterns and automatically suppresses those matching historical false positive signatures","Configure Claude to only surface findings it assesses as high confidence, filtering out uncertain flags before developers see them"],correct:0,explanation:"The bottleneck is clicking into findings to read reasoning. Including reasoning and confidence inline with each finding eliminates that click — developers can triage at a glance without navigating away. This respects the no-filtering constraint because all findings remain visible; it simply makes the information needed for triage immediately accessible. Categorizing (B) adds a useful label but still requires developers to evaluate each finding without the reasoning they need. The post-processor (C) was explicitly rejected by stakeholders as a filtering approach. High-confidence filtering (D) was also explicitly rejected — it hides findings from developers."},  // vinipx#162
{id:323,domain:"Claude Code",difficulty:"HARD",type:"mcq",question:"Your CLAUDE.md has grown to over 400 lines containing coding standards, testing conventions, a detailed PR review checklist, deployment workflow instructions, and database migration procedures. You want Claude to always follow the coding standards and testing conventions, but only apply PR review, deployment, and migration guidance when you\'re actually performing those tasks. What\'s the most effective restructuring approach?",options:["Split the CLAUDE.md into files in .claude/rules/ with path-specific glob patterns so each rule loads only for matching file types","Keep universal standards in CLAUDE.md and create Skills for task-specific workflows (PR reviews, deployments, migrations) with trigger keywords","Move all guidance into separate Skills files organized by workflow type, keeping only a brief project description in CLAUDE.md","Keep all content in CLAUDE.md but use @import syntax to organize it into separately maintained files by category"],correct:1,explanation:"CLAUDE.md content is loaded for every conversation, making it the right home for standards that should always apply (coding conventions, testing rules). Skills are invoked on-demand when Claude detects relevant trigger keywords or the developer uses a slash command, making them ideal for task-specific workflows like PR reviews, deployments, and migrations. This matches loading behavior to usage frequency. Glob rules (A) are path-based — they activate for files matching a pattern, not for tasks like \"I\'m doing a deployment.\" Moving everything to Skills (C) would cause coding standards to be absent from regular coding sessions. The `@import` syntax (D) does not exist in CLAUDE.md — there is no such feature."},  // vinipx#163
{id:324,domain:"Claude Code",difficulty:"EASY",type:"mcq",question:"Your team uses a /commit skill stored in .claude/skills/commit/SKILL.md. One developer wants to customize it for their personal workflow (different commit message format, additional checks) without affecting teammates. What should you recommend?",options:["Set override: true in the personal skill\'s frontmatter for precedence","Create a personal version in ~/.claude/skills/ with a different name like /my-commit","Create a personal version at ~/.claude/skills/commit/SKILL.md with the same /commit name to override","Add username-based conditional logic to the project skill\'s frontmatter config"],correct:1,explanation:"Project-scoped skills (in .claude/skills/) take precedence over user-scoped skills (~/.claude/skills/) when both have the same name. To make a personal skill accessible alongside the project skill, the developer must use a different name — such as /my-commit — in their personal ~/.claude/skills/ directory. Using the same /commit name in user scope (C) would be silently overridden by the project skill. The override: true key (A) and username-based conditionals (D) are not valid SKILL.md frontmatter options."},  // vinipx#164
{id:325,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Production metrics show that when your agent resolves complex cases involving billing disputes or multi-order returns, customer satisfaction scores are 15% lower than for simple cases—even when the resolution is technically correct. Root cause analysis reveals the agent provides accurate resolutions but inconsistently explains the reasoning: sometimes omitting relevant policy details, other times missing timeline information or next steps. The specific context gaps vary by case. You want to improve resolution quality without adding human review overhead. Which approach is most effective?",options:["Add a self-critique step where the agent evaluates its draft response for completeness—ensuring it addresses the customer\'s concern, includes relevant context, and anticipates follow-up questions.","Add a confirmation step where the agent asks \"Does this fully address your concern?\" before closing, letting customers request additional information if needed.","Implement few-shot examples in the system prompt showing complete resolution explanations for five common complex case types, demonstrating how to include policy context, timelines, and next steps.","Increase the model tier from Haiku to Sonnet for complex cases, routing based on detected case complexity."],correct:0,explanation:"The self-critique step (evaluator-optimizer pattern) directly addresses the root cause: gaps in completeness that vary by case. Before presenting the response, the agent evaluates its own draft against explicit criteria — does it explain the policy, include relevant timelines, address all concerns, and anticipate follow-up questions? This catch-mechanism is case-aware and handles the variability that makes few-shot examples insufficient. The confirmation question (B) shifts the burden to customers to identify their own information gaps. Few-shot examples (C) cover five specific templates but miss novel gap patterns in different case types. A model tier upgrade (D) may improve general quality but does not add a targeted completeness check."},  // vinipx#165
{id:326,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"When researching a broad topic, you observe that the web search agent and document analysis agent are both investigating the same subtopics, resulting in significant overlap in their findings. Token usage nearly doubled without proportionally increasing the breadth or depth of research coverage. What\'s the most effective way to address this?",options:["Implement a shared state mechanism where agents log their current focus area, allowing other agents to dynamically avoid duplicating work in progress","Convert to sequential execution where document analysis runs only after web search completes, using the web search findings as context to avoid duplication","Allow both agents to complete their parallel work, then have the coordinator deduplicate overlapping findings before passing to the synthesis agent","Have the coordinator explicitly partition the research space before delegation, assigning distinct subtopics or source types to each agent"],correct:3,explanation:"The root cause is that the coordinator delegated the same research space to both agents without defining boundaries. Having the coordinator explicitly partition the research space before delegation — assigning distinct subtopics (e.g., agent A covers academic/primary sources; agent B covers industry/news) or distinct domains of the topic — addresses the problem at its source, before any wasted work occurs. This preserves the benefits of parallel execution. Shared state (A) adds coordination complexity and coordination failures. Sequential execution (B) eliminates the parallelism benefit. Post-hoc deduplication (C) is a workaround that still wastes all the tokens spent on overlapping work."},  // vinipx#166
{id:327,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"The web search subagent returns results for only 3 of 5 requested source categories (competitor websites and industry reports succeeded, but news archives and social media feeds timed out). The document analysis subagent successfully processed all provided documents. The synthesis subagent must now produce a findings summary from this mixed-quality input. What\'s the most effective error propagation strategy?",options:["Have the synthesis subagent request the coordinator retry the timed-out sources with extended timeouts before proceeding, ensuring complete data coverage before synthesis begins.","Structure the synthesis output with coverage annotations indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources.","Have the synthesis subagent return an error to the coordinator indicating incomplete upstream data, triggering a full retry or task failure.","Proceed with synthesis using only the successful sources, generating output without indicating which data was unavailable."],correct:1,explanation:"Graceful degradation with transparency is the correct pattern: the synthesis agent produces the most useful output possible from available data, while explicitly annotating which findings are well-supported and which areas have gaps due to unavailable sources. This preserves the value of the completed work (3 of 5 sources succeeded) and propagates uncertainty information so downstream consumers can make informed decisions. Blocking on retry (A) delays the entire output for sources that may time out again. Returning an error (C) discards all completed work. Silent synthesis (D) hides the uncertainty, potentially leading consumers to make decisions on incomplete data without knowing it."},  // vinipx#167
{id:328,domain:"Context Management",difficulty:"HARD",type:"mcq",question:"Production monitoring reveals inconsistent synthesis quality. When aggregated results total ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web search headlines and snippets) and the final 10K tokens (document analysis conclusions), but frequently omits critical findings that appear in the middle 50K tokens—even when those findings directly address the research question. How should you restructure the aggregated input?",options:["Place a key findings summary at the beginning of the aggregated input and organize detailed results with explicit section headers for easier navigation.","Implement rotation that alternates which subagent\'s results appear first across different research tasks, ensuring both sources receive primacy positioning equally over time.","Stream subagent results to the synthesis agent incrementally, processing web search results first to completion before introducing document analysis findings.","Summarize all subagent outputs to under 20K tokens total before aggregation, ensuring content stays within the model\'s reliable processing range."],correct:0,explanation:"The pattern is classic lost-in-the-middle: reliable attention at the start and end, poor attention in the middle. Placing a key findings summary at the beginning leverages the primacy effect — the most critical information occupies the most reliably attended position. Explicit section headers throughout the 75K input help the model navigate and maintain attention on middle sections. These two changes directly mitigate the attention pattern without discarding any content. Rotation (B) distributes the problem across tasks but does not fix it — findings will still be missed, just from different positions. Streaming (C) creates sequential processing that eliminates the parallelism benefit. Aggressive summarization to 20K (D) risks losing important details that were in the original findings."},  // vinipx#168
{id:329,domain:"Agentic Architecture",difficulty:"HARD",type:"mcq",question:"During testing, combined outputs from the web search agent (85K tokens including page content) and the document analysis agent (70K tokens including reasoning chains) total 155K tokens, but the synthesis agent performs optimally with inputs under 50K tokens. What\'s the most effective solution?",options:["Store findings in a vector database and give the synthesis agent retrieval tools to query during its work","Add an intermediate summarization agent that condenses findings before passing to synthesis","Modify upstream agents to return structured data (key facts, citations, relevance scores) instead of verbose content and reasoning","Have the synthesis agent process findings in sequential batches, maintaining running state between calls"],correct:2,explanation:"Modifying upstream agents to return structured data addresses the root cause: the agents are returning far more token-volume than the synthesis step needs. Full page content and reasoning chains are intermediate artifacts of the search and analysis process — they are not the output the synthesis agent needs. Requiring agents to output key facts, citations, and relevance scores reduces token volume at the source while preserving the essential information. This is better than downstream approaches: vector retrieval (A) adds latency and requires the synthesis agent to know what to retrieve; intermediate summarization (B) adds another agent hop and may lose structured facts; sequential batches (D) require maintaining state across calls and do not reduce total token usage."},  // vinipx#169
{id:330,domain:"Tool Design",difficulty:"HARD",type:"mcq",question:"Production logs show the agent sometimes selects get_customer when lookup_order would be more appropriate, particularly for ambiguous requests like \"I need help with my recent purchase.\" You decide to add few-shot examples to your system prompt to improve tool selection. Which approach will most effectively address this issue?",options:["Add examples grouped by tool—all get_customer scenarios together, then all lookup_order scenarios.","Add 10–15 examples of clear, unambiguous requests that demonstrate correct tool selection for each tool\'s typical use cases.","Add explicit \"use when\" and \"do not use when\" guidelines in each tool\'s description covering the ambiguous cases.","Add 4–6 examples targeting ambiguous scenarios, each showing reasoning for why one tool was chosen over plausible alternatives."],correct:3,explanation:"The error occurs on ambiguous requests — not on clear cases where the agent already performs correctly. Few-shot examples are most effective when they target the specific scenarios where errors occur, paired with explicit reasoning about the comparative decision. For \"I need help with my recent purchase,\" the reasoning might be: \"This mentions a purchase, not account details — use lookup_order, not get_customer. If the customer had said \'my account\' or \'my profile,\' get_customer would be appropriate.\" This comparative reasoning directly teaches the decision process for edge cases. Grouping by tool (A) makes examples easier to scan but does not demonstrate comparative reasoning. Many clear-case examples (B) reinforce behavior that already works correctly without addressing the ambiguous cases. Tool description updates (C) are a valid complementary fix but are not few-shot examples."},  // vinipx#170
];
const ROUNDS = 3;
const QUESTIONS_PER_ROUND = 5;
const ITERATIONS = 4;
const PASS_SCORE = 72;

let currentMode = 'learn';
let currentSection = 0;
let currentIteration = 0;
let currentRound = 0;
let answeredQuestions = {};

function init() {
  buildNav();
  showSection(0);
  loadNotes();
  document.getElementById('notesText').addEventListener('input', saveNotes);
}
function buildNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  let idx = 0;
  DOMAINS.forEach((d, di) => {
    const hdr = document.createElement('li');
    hdr.className = 'section-header';
    hdr.textContent = d.name + ' (' + d.weight + ')';
    nav.appendChild(hdr);
    CONTENT.filter(c => c.domain === di).forEach(c => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.textContent = c.title;
      a.dataset.index = idx;
      a.onclick = ((i) => () => showSection(i))(idx);
      li.appendChild(a);
      nav.appendChild(li);
      idx++;
    });
  });
  // Deep Dive sections
  const dd = document.createElement('li');
  dd.className = 'section-header';
  dd.textContent = 'Deep Dive';
  nav.appendChild(dd);
  CONTENT.filter(c => c.domain === 5).forEach(c => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.textContent = c.title;
    a.dataset.index = idx;
    a.onclick = ((i) => () => showSection(i))(idx);
    li.appendChild(a);
    nav.appendChild(li);
    idx++;
  });
  // Labs
  const lb = document.createElement('li');
  lb.className = 'section-header';
  lb.textContent = 'Hands-on Labs';
  nav.appendChild(lb);
  CONTENT.filter(c => c.domain === 6).forEach(c => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.textContent = c.title;
    a.dataset.index = idx;
    a.onclick = ((i) => () => showSection(i))(idx);
    li.appendChild(a);
    nav.appendChild(li);
    idx++;
  });
  // Add exam scenarios (domain 0 but shows last)
  const hdr = document.createElement('li');
  hdr.className = 'section-header';
  hdr.textContent = 'Exam Scenarios';
  nav.appendChild(hdr);
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.textContent = 'All 6 Scenarios';
  a.dataset.index = idx;
  a.onclick = ((i) => () => showSection(i))(idx);
  li.appendChild(a);
  nav.appendChild(li);
}
function showSection(idx) {
  currentSection = idx;
  const c = CONTENT[idx];
  const area = document.getElementById('learnContent');
  area.innerHTML = '<h2>' + c.title + '</h2>' + c.content;
  document.querySelector('.main').scrollTop = 0;
  document.querySelectorAll('.nav-list a').forEach((a, i) => a.classList.toggle('active', i === idx));
  const total = CONTENT.length;
  document.getElementById('progressText').textContent = 'Section ' + (idx + 1) + ' of ' + total;
  document.getElementById('progressFill').style.width = ((idx + 1) / total * 100) + '%';
  area.innerHTML += '<div class="nav-buttons"><button class="prev" onclick="showSection(' + (idx - 1) + ')" ' + (idx === 0 ? 'disabled' : '') + '>&larr; Previous</button><button class="next" onclick="showSection(' + (idx + 1) + ')" ' + (idx >= total - 1 ? 'disabled' : '') + '>Next &rarr;</button></div>' +
    '<div class="notes-area"><h4>Notes for "' + c.title + '"</h4><textarea id="sectionNotes" placeholder="Add notes about this topic..." oninput="saveSectionNotes()"></textarea></div>';
  const saved = localStorage.getItem('sectionNotes_' + c.id);
  if (saved) document.getElementById('sectionNotes').value = saved;
}
function filterContent() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.nav-list li a').forEach(a => {
    a.parentElement.style.display = (!q || a.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.nav-list .section-header').forEach(h => {
    let s = h.nextElementSibling;
    let vis = false;
    while (s && s.tagName === 'LI') { if (s.style.display !== 'none') vis = true; s = s.nextElementSibling; }
    h.style.display = (!q || vis) ? '' : 'none';
  });
}
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('learnBtn').classList.toggle('active', mode === 'learn');
  document.getElementById('quizBtn').classList.toggle('active', mode === 'quiz');
  document.getElementById('sidebar').classList.toggle('hidden', mode === 'quiz');
  document.getElementById('learnContent').style.display = mode === 'learn' ? '' : 'none';
  document.getElementById('quizContent').style.display = mode === 'quiz' ? '' : 'none';
  if (mode === 'quiz') initQuiz();
}
function initQuiz() {
  const qc = document.getElementById('quizContent');
  qc.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:8px"><div class="iteration-selector" id="iterationSelector"></div><div style="display:flex;gap:8px;align-items:center"><span style="font-size:.8rem;color:var(--text2)">Pass: ' + PASS_SCORE + '%</span><button class="quiz-action-btn danger" style="padding:4px 12px;font-size:.75rem" onclick="resetAll()">Reset All</button></div></div>' +
    '<div class="round-selector" id="roundSelector"></div><div id="quizArea"></div>';
  buildIterationSelector();
  buildRoundSelector();
  startIteration(0);
}
function buildIterationSelector() {
  const c = document.getElementById('iterationSelector');
  c.innerHTML = '<span class="iter-label">Iteration:</span>';
  for (let i = 0; i < ITERATIONS; i++) {
    const b = document.createElement('button');
    b.className = 'iter-btn' + (i === currentIteration ? ' active' : '');
    b.textContent = (i + 1);
    b.onclick = () => startIteration(i);
    const s = JSON.parse(localStorage.getItem('ccaf_iter_' + i) || '{}');
    if (s.complete) b.classList.add('completed');
    c.appendChild(b);
  }
}
function buildRoundSelector() {
  const c = document.getElementById('roundSelector');
  c.innerHTML = '<span style="font-size:.82rem;color:var(--text2);font-weight:500;margin-right:6px;align-self:center">Round:</span>';
  for (let i = 0; i < ROUNDS; i++) {
    const b = document.createElement('button');
    b.className = 'round-btn' + (i === currentRound ? ' active' : '');
    b.textContent = 'Round ' + (i + 1);
    b.onclick = () => startRound(i);
    const rk = 'ccaf_iter_' + currentIteration + '_round_' + i;
    const rs = JSON.parse(localStorage.getItem(rk) || '{}');
    if (rs.complete) b.classList.add('completed');
    c.appendChild(b);
  }
}
function startIteration(iter) {
  currentIteration = iter;
  currentRound = 0;
  document.querySelectorAll('.iter-btn').forEach((b, i) => b.classList.toggle('active', i === iter));
  buildRoundSelector();
  startRound(0);
}
function startRound(round) {
  currentRound = round;
  document.querySelectorAll('.round-btn').forEach((b, i) => b.classList.toggle('active', i === round));
  const seed = currentIteration * ROUNDS + round;
  const questions = getQuestionsForRound(seed);
  const key = 'ccaf_iter_' + currentIteration + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  answeredQuestions = saved.answers || {};
  renderQuiz(questions, round, saved);
}
function getQuestionsForRound(seed) {
  const iterSeed = Math.floor(seed / ROUNDS);
  const roundIdx = seed % ROUNDS;
  const shuffled = [...ALL_QUESTIONS];
  let s = iterSeed * 7 + 13;
  for (let i = shuffled.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const j = s % (i + 1);
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const start = roundIdx * QUESTIONS_PER_ROUND;
  const result = [];
  for (let i = 0; i < QUESTIONS_PER_ROUND; i++) {
    result.push(shuffled[(start + i) % shuffled.length]);
  }
  return result;
}
function renderQuiz(questions, round, saved) {
  const area = document.getElementById('quizArea');
  const allAnswered = questions.every(q => answeredQuestions[q.id] !== undefined);
  const answeredCount = Object.keys(answeredQuestions).length;
  let html = '<div class="quiz-header">' +
    '<div class="stat"><div class="num">' + (currentIteration + 1) + '/' + ITERATIONS + '</div><div class="label">Iteration</div></div>' +
    '<div class="stat"><div class="num">' + (round + 1) + '/' + ROUNDS + '</div><div class="label">Round</div></div>' +
    '<div class="stat"><div class="num">' + answeredCount + '/' + questions.length + '</div><div class="label">Answered</div></div>' +
    '<div class="quiz-progress"><div class="fill" style="width:' + (answeredCount / questions.length * 100) + '%"></div></div></div>';
  if (saved.complete && saved.submitted) {
    const res = getRoundResults(currentIteration, round);
    html += renderResultSummary(res);
  }
  questions.forEach((q, qi) => {
    const isMulti = Array.isArray(q.correct);
    const isCorrect = answeredQuestions[q.id] && answeredQuestions[q.id].correct;
    const selected = answeredQuestions[q.id] ? answeredQuestions[q.id].selected : null;
    const submitted = answeredQuestions[q.id] && answeredQuestions[q.id].correct !== undefined;
    const optLabels = 'ABCDEFGH';
    let diffClass = 'medium';
    if (q.difficulty === 'EASY') diffClass = 'easy';
    else if (q.difficulty === 'HARD') diffClass = 'hard';
    html += '<div class="question-card">' +
      '<div class="q-domain">' + q.domain + '</div>' +
      '<div class="q-num">Question ' + (qi + 1) + ' of ' + questions.length + ' <span class="q-difficulty ' + diffClass + '">' + q.difficulty + '</span></div>' +
      '<div class="q-text">' + q.question.replace(/\n/g, '<br>') + '</div>' +
      (isMulti ? '<div class="q-instruction">(Select TWO.)</div>' : '') +
      (q.type === 'order' ? '<div class="q-instruction">(Order the steps. Use arrows to reorder.)</div>' : '');
    if (q.type === 'order') {
      const order = selected || q.options.map((_, i) => i);
      html += '<div class="order-options" id="opts-' + q.id + '">';
      order.forEach((oi, pos) => {
        const opt = q.options[oi];
        html += '<div class="order-option">' +
          '<div class="order-num' + (submitted ? ' placed' : '') + '">' + (submitted ? '' : (pos + 1)) + '</div>' +
          '<div class="order-label">' + optLabels[oi] + '.</div>' +
          '<div class="order-text">' + opt + '</div>' +
          (!submitted ? '<div class="order-btns"><button onclick="moveOrderItem(' + q.id + ',' + pos + ',-1)" ' + (pos === 0 ? 'disabled' : '') + '>&#9650;</button><button onclick="moveOrderItem(' + q.id + ',' + pos + ',1)" ' + (pos === order.length - 1 ? 'disabled' : '') + '>&#9660;</button></div>' : '') +
          '</div>';
      });
      html += '</div>';
      if (submitted) {
        const correctOrder = q.correct.map(i => optLabels[i]).join(', ');
        const userOrder = order.map(i => optLabels[i]).join(', ');
        const isOrderCorrect = JSON.stringify(order) === JSON.stringify(q.correct);
        html += '<div class="feedback show ' + (isOrderCorrect ? 'correct' : 'wrong') + '">' +
          '<div class="ans">' + (isOrderCorrect ? 'Correct!' : 'Incorrect') + '</div>' +
          '<div class="expl"><strong>Correct Order: ' + correctOrder + '</strong><br>' + q.explanation + '</div></div>';
      } else {
        html += '<div class="feedback" id="fb-' + q.id + '"></div>';
      }
    } else {
      html += '<div class="options" id="opts-' + q.id + '">';
      q.options.forEach((opt, oi) => {
        let cls = 'option';
        if (submitted) cls += ' disabled';
        if (submitted && isMulti) {
          if (q.correct.indexOf(oi) > -1) cls += ' correct';
          else if (selected && selected.indexOf && selected.indexOf(oi) > -1) cls += ' wrong';
        } else if (submitted) {
          if (oi === q.correct) cls += ' correct';
          else if (oi === selected) cls += ' wrong';
        } else if (selected !== null) {
          if (isMulti && selected && selected.indexOf && selected.indexOf(oi) > -1) cls += ' selected';
          else if (!isMulti && oi === selected) cls += ' selected';
        }
        const checked = submitted && selected !== null ? (isMulti ? (selected && selected.indexOf && selected.indexOf(oi) > -1) : oi === selected) : false;
        html += '<label class="' + cls + '" onclick="' + (submitted ? '' : 'selectOption(' + q.id + ',' + oi + ',' + isMulti + ')') + '">' +
          '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="q' + q.id + '" value="' + oi + '" ' + (checked ? 'checked' : '') + ' ' + (submitted ? 'disabled' : '') + '>' +
          '<span class="opt-label">' + optLabels[oi] + '.</span><span>' + opt + '</span></label>';
      });
      html += '</div>';
    }
    if (submitted) {
      const ansTxt = isMulti ? q.correct.map(i => optLabels[i]).join(', ') : optLabels[q.correct] + '. ' + q.options[q.correct];
      html += '<div class="feedback show ' + (isCorrect ? 'correct' : 'wrong') + '">' +
        '<div class="ans">' + (isCorrect ? 'Correct!' : 'Incorrect') + '</div>' +
        '<div class="expl"><strong>Correct Answer: ' + ansTxt + '</strong><br>' + q.explanation + '</div></div>';
    } else {
      html += '<div class="feedback" id="fb-' + q.id + '"></div>';
    }
    html += '</div>';
  });
  if (!saved.complete || !saved.submitted) {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="quiz-action-btn primary" id="submitBtn" onclick="submitRound(' + round + ')" ' + (!allAnswered ? 'disabled' : '') + '>Submit Round</button></div>';
  } else {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="quiz-action-btn warning" onclick="retakeRound(' + round + ')">Retake This Round</button></div>';
  }
  area.innerHTML = html;
}
function moveOrderItem(qId, pos, dir) {
  if (answeredQuestions[qId] && answeredQuestions[qId].correct !== undefined) return;
  let order = answeredQuestions[qId] ? (answeredQuestions[qId].selected || [...Array(answeredQuestions[qId].selected ? answeredQuestions[qId].selected.length : 0).keys()]) : null;
  if (!order) {
    const opts = document.querySelectorAll('#opts-' + qId + ' .order-option');
    order = Array.from(opts).map((_, i) => i);
  }
  const newPos = pos + dir;
  if (newPos < 0 || newPos >= order.length) return;
  [order[pos], order[newPos]] = [order[newPos], order[pos]];
  answeredQuestions[qId] = {selected: order};
  const key = 'ccaf_iter_' + currentIteration + '_round_' + currentRound;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  saved.answers = answeredQuestions;
  localStorage.setItem(key, JSON.stringify(saved));
  const questions = getQuestionsForRound(currentIteration * ROUNDS + currentRound);
  renderQuiz(questions, currentRound, saved);
}
function selectOption(qId, optIdx, isMulti) {
  if (answeredQuestions[qId] && answeredQuestions[qId].correct !== undefined) return;
  if (isMulti) {
    if (!answeredQuestions[qId]) answeredQuestions[qId] = {selected:[]};
    const arr = answeredQuestions[qId].selected;
    const idx = arr.indexOf(optIdx);
    if (idx > -1) arr.splice(idx, 1); else arr.push(optIdx);
    document.querySelectorAll('#opts-' + qId + ' .option').forEach((o, i) => {
      const sel = answeredQuestions[qId].selected;
      o.classList.toggle('selected', sel.indexOf(i) > -1);
      o.querySelector('input').checked = sel.indexOf(i) > -1;
    });
  } else {
    answeredQuestions[qId] = {selected: optIdx};
    document.querySelectorAll('#opts-' + qId + ' .option').forEach((o, i) => {
      o.classList.toggle('selected', i === optIdx);
      o.querySelector('input').checked = i === optIdx;
    });
  }
  const key = 'ccaf_iter_' + currentIteration + '_round_' + currentRound;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  saved.answers = answeredQuestions;
  localStorage.setItem(key, JSON.stringify(saved));
  const questions = getQuestionsForRound(currentIteration * ROUNDS + currentRound);
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = !questions.every(q => answeredQuestions[q.id] !== undefined);
  const progress = Object.keys(answeredQuestions).length / questions.length * 100;
  const pf = document.querySelector('.quiz-progress .fill');
  if (pf) pf.style.width = progress + '%';
}
function submitRound(round) {
  const key = 'ccaf_iter_' + currentIteration + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  const questions = getQuestionsForRound(currentIteration * ROUNDS + round);
  let correctCount = 0;
  questions.forEach(q => {
    const ans = answeredQuestions[q.id];
    if (!ans) return;
    if (q.type === 'order') {
      const sel = ans.selected || [];
      ans.correct = JSON.stringify(sel) === JSON.stringify(q.correct);
      if (ans.correct) correctCount++;
    } else if (Array.isArray(q.correct)) {
      const sel = (ans.selected || []).slice().sort();
      const cor = [...q.correct].sort();
      ans.correct = JSON.stringify(sel) === JSON.stringify(cor);
      if (ans.correct) correctCount++;
    } else {
      ans.correct = ans.selected === q.correct;
      if (ans.correct) correctCount++;
    }
  });
  saved.answers = answeredQuestions;
  saved.complete = true;
  saved.submitted = true;
  saved.score = correctCount;
  saved.total = questions.length;
  localStorage.setItem(key, JSON.stringify(saved));
  document.querySelectorAll('.round-btn').forEach((b, i) => { if (i === round) b.classList.add('completed'); });
  renderQuiz(questions, round, saved);
  updateIterationProgress();
  const allDone = Array.from(document.querySelectorAll('.round-btn')).every(b => b.classList.contains('completed'));
  if (allDone) showIterationResults();
}
function retakeRound(round) {
  const key = 'ccaf_iter_' + currentIteration + '_round_' + round;
  localStorage.removeItem(key);
  answeredQuestions = {};
  document.querySelectorAll('.round-btn').forEach((b, i) => { if (i === round) b.classList.remove('completed'); });
  startRound(round);
}
function getRoundResults(iter, round) {
  const key = 'ccaf_iter_' + iter + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.complete) return null;
  return { score: saved.score, total: saved.total, pct: Math.round(saved.score / saved.total * 100) };
}
function renderResultSummary(res) {
  if (!res) return '';
  const pcls = res.pct >= PASS_SCORE ? 'pass' : 'fail';
  return '<div style="margin-top:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-align:center">' +
    '<div style="font-size:.85rem;color:var(--text2)">Round Score</div>' +
    '<div style="font-size:2rem;font-weight:700;color:' + (res.pct >= PASS_SCORE ? 'var(--success)' : 'var(--error)') + '">' + res.score + '/' + res.total + ' (' + res.pct + '%)</div>' +
    '<div style="font-size:.85rem;margin-top:4px;color:' + (res.pct >= PASS_SCORE ? 'var(--success)' : 'var(--error)') + ';font-weight:600">' + (res.pct >= PASS_SCORE ? 'PASS' : 'FAIL') + '</div></div>';
}
function updateIterationProgress() {
  let total = 0, correct = 0;
  for (let r = 0; r < ROUNDS; r++) {
    const rs = JSON.parse(localStorage.getItem('ccaf_iter_' + currentIteration + '_round_' + r) || '{}');
    if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
  }
  if (total === ROUNDS * QUESTIONS_PER_ROUND) {
    const pct = Math.round(correct / total * 100);
    localStorage.setItem('ccaf_iter_' + currentIteration, JSON.stringify({complete:true, score:pct}));
    document.querySelectorAll('.iter-btn')[currentIteration].classList.add('completed');
  }
}
function showIterationResults() {
  const area = document.getElementById('quizArea');
  let total = 0, correct = 0;
  const domainScores = {};
  const allAnswered = {};
  for (let r = 0; r < ROUNDS; r++) {
    const rs = JSON.parse(localStorage.getItem('ccaf_iter_' + currentIteration + '_round_' + r) || '{}');
    if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
    if (rs.answers) Object.assign(allAnswered, rs.answers);
  }
  ALL_QUESTIONS.forEach(q => {
    if (allAnswered[q.id] !== undefined) {
      const d = DOMAIN_ALIASES[q.domain] || q.domain;
      if (!domainScores[d]) domainScores[d] = {correct:0,total:0};
      domainScores[d].total++;
      if (allAnswered[q.id].correct) domainScores[d].correct++;
    }
  });
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const pcls = pct >= PASS_SCORE ? 'pass' : 'fail';
  let html = '<div class="results-card"><h2>Iteration ' + (currentIteration + 1) + ' Complete</h2>' +
    '<div style="font-size:.9rem;color:var(--text2);margin-bottom:4px">Total Score (all 3 rounds)</div>' +
    '<div class="big-score ' + pcls + '">' + correct + '/' + total + '</div>' +
    '<div class="sub">' + pct + '% - ' + (pct >= PASS_SCORE ? 'PASSED' : 'FAILED') + '</div>';
  let weakDomains = [];
  html += '<div class="domain-breakdown"><h4>Domain Performance</h4>';
  DOMAINS.forEach(d => {
    const ds = domainScores[d.short] || domainScores[d.name] || {correct:0,total:0};
    const dpct = ds.total > 0 ? Math.round(ds.correct/ds.total*100) : 0;
    const color = dpct >= 80 ? '#2ecc71' : dpct >= 60 ? '#f39c12' : '#e74c3c';
    html += '<div class="domain-row"><span>' + d.short + '</span>' +
      '<div class="bar-container"><div class="bar-fill" style="width:' + dpct + '%;background:' + color + '"></div></div>' +
      '<span class="score" style="color:' + color + '">' + ds.correct + '/' + ds.total + ' (' + dpct + '%)</span></div>';
    if (ds.total > 0 && dpct < PASS_SCORE) weakDomains.push(d.short);
  });
  html += '</div>';
  if (weakDomains.length > 0) {
    html += '<div class="improve-section"><h4>Areas Needing Improvement</h4><p>Focus more study on:</p><ul>';
    weakDomains.forEach(d => html += '<li><strong>' + d + '</strong></li>');
    html += '</ul></div>';
  } else {
    html += '<div class="improve-section" style="background:#e8f8f0;border-color:var(--success)"><h4 style="color:var(--success)">Strong Performance!</h4><p>You\'re performing well across all domains. Keep it up!</p></div>';
  }
  html += '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
    '<button class="quiz-action-btn outline" onclick="retakeIteration(' + currentIteration + ')">Retake All Rounds</button>' +
    '<button class="quiz-action-btn success" onclick="showWrongAnswers(' + currentIteration + ')">Review Wrong Answers</button>' +
    '<button class="quiz-action-btn warning" onclick="startNextIteration()">' + (currentIteration < ITERATIONS - 1 ? 'Start Iteration ' + (currentIteration + 2) : 'All Complete') + '</button></div></div>';
  area.innerHTML = html;
}
function showWrongAnswers(iter) {
  const area = document.getElementById('quizArea');
  const allAnswered = {};
  for (let r = 0; r < ROUNDS; r++) {
    const rs = JSON.parse(localStorage.getItem('ccaf_iter_' + iter + '_round_' + r) || '{}');
    if (rs.answers) Object.assign(allAnswered, rs.answers);
  }
  const wrong = ALL_QUESTIONS.filter(q => allAnswered[q.id] !== undefined && !allAnswered[q.id].correct);
  if (wrong.length === 0) {
    area.innerHTML = '<div class="results-card"><h2>Perfect Score!</h2><div class="sub">You answered all questions correctly in this iteration.</div>' +
      '<div style="margin-top:16px"><button class="quiz-action-btn primary" onclick="showIterationResults()">Back to Results</button></div></div>';
    return;
  }
  const optLabels = 'ABCDEFGH';
  let html = '<div class="results-card" style="margin-bottom:16px"><h2>Wrong Answers Review (Iteration ' + (iter + 1) + ')</h2>' +
    '<div class="sub">' + wrong.length + ' question' + (wrong.length > 1 ? 's' : '') + ' answered incorrectly</div>' +
    '<button class="quiz-action-btn primary" onclick="showIterationResults()" style="margin-top:8px">Back to Results</button></div>';
  wrong.forEach((q, wi) => {
    const ans = allAnswered[q.id];
    const isMulti = Array.isArray(q.correct);
    const isOrder = q.type === 'order';
    const userSel = ans ? ans.selected : null;
    const diffClass = q.difficulty === 'EASY' ? 'easy' : q.difficulty === 'HARD' ? 'hard' : 'medium';
    let userAnsHtml, correctAnsHtml;
    if (isOrder) {
      const userOrder = (userSel || []).map(i => optLabels[i]).join(', ');
      const correctOrder = q.correct.map(i => optLabels[i]).join(', ');
      userAnsHtml = '<div class="rev-user-ans"><strong>Your order:</strong> ' + userOrder + '</div>';
      correctAnsHtml = '<div class="rev-correct-ans"><strong>Correct order:</strong> ' + correctOrder + '</div>';
    } else if (isMulti) {
      const userAns = (userSel || []).map(i => optLabels[i] + '. ' + q.options[i]).join('; ');
      const correctAns = q.correct.map(i => optLabels[i] + '. ' + q.options[i]).join('; ');
      userAnsHtml = userSel && userSel.length ? '<div class="rev-user-ans"><strong>You selected:</strong> ' + userAns + '</div>' : '<div class="rev-user-ans"><strong>You selected:</strong> (none)</div>';
      correctAnsHtml = '<div class="rev-correct-ans"><strong>Correct answer:</strong> ' + correctAns + '</div>';
    } else {
      const userAns = userSel !== null ? optLabels[userSel] + '. ' + q.options[userSel] : '(none)';
      const correctAns = optLabels[q.correct] + '. ' + q.options[q.correct];
      userAnsHtml = '<div class="rev-user-ans"><strong>You selected:</strong> ' + userAns + '</div>';
      correctAnsHtml = '<div class="rev-correct-ans"><strong>Correct answer:</strong> ' + correctAns + '</div>';
    }
    let whyWrong = '';
    if (!isOrder && !isMulti && userSel !== null && userSel !== q.correct) {
      const chosen = q.options[userSel];
      const correct = q.options[q.correct];
      whyWrong = '<div class="rev-expl"><strong>Why your answer was wrong:</strong> You chose "' + chosen + '", but the correct answer is "' + correct + '". ' + q.explanation + '</div>';
    } else if (!isOrder && isMulti && userSel && userSel.length) {
      const wrongSel = userSel.filter(i => !q.correct.includes(i));
      const missedSel = q.correct.filter(i => !userSel.includes(i));
      let whyParts = [];
      if (wrongSel.length) whyParts.push('you selected option(s) that were not correct: ' + wrongSel.map(i => optLabels[i] + ' (' + q.options[i] + ')').join(', '));
      if (missedSel.length) whyParts.push('you missed option(s) that were correct: ' + missedSel.map(i => optLabels[i] + ' (' + q.options[i] + ')').join(', '));
      whyWrong = '<div class="rev-expl"><strong>Why your answer was wrong:</strong> ' + whyParts.join('; ') + '. ' + q.explanation + '</div>';
    } else if (isOrder) {
      whyWrong = '<div class="rev-expl"><strong>Explanation:</strong> ' + q.explanation + '</div>';
    } else {
      whyWrong = '<div class="rev-expl"><strong>Explanation:</strong> ' + q.explanation + '</div>';
    }
    html += '<div class="review-card">' +
      '<div><span class="rev-domain">' + q.domain + '</span><span class="q-difficulty ' + diffClass + '">' + q.difficulty + '</span></div>' +
      '<div class="rev-q-text">' + (wi + 1) + '. ' + q.question.replace(/\n/g, '<br>') + '</div>' +
      userAnsHtml + correctAnsHtml + whyWrong + '</div>';
  });
  html += '<div style="text-align:center;margin-top:16px"><button class="quiz-action-btn primary" onclick="showIterationResults()">Back to Results</button></div>';
  area.innerHTML = html;
}
function retakeIteration(iter) {
  for (let r = 0; r < ROUNDS; r++) localStorage.removeItem('ccaf_iter_' + iter + '_round_' + r);
  localStorage.removeItem('ccaf_iter_' + iter);
  startIteration(iter);
}
function startNextIteration() {
  if (currentIteration < ITERATIONS - 1) { startIteration(currentIteration + 1); return; }
  const area = document.getElementById('quizArea');
  let html = '<div class="results-card"><h2>All 4 Iterations Complete!</h2><div class="sub">You have completed 4 iterations of 3 rounds each (' + (ROUNDS * QUESTIONS_PER_ROUND * ITERATIONS) + ' questions total).</div>';
  let grandTotal = 0, grandCorrect = 0;
  html += '<div style="margin:20px 0;text-align:left"><h4>Progress Summary</h4>';
  for (let i = 0; i < ITERATIONS; i++) {
    let total = 0, correct = 0;
    for (let r = 0; r < ROUNDS; r++) {
      const rs = JSON.parse(localStorage.getItem('ccaf_iter_' + i + '_round_' + r) || '{}');
      if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
    }
    grandTotal += total; grandCorrect += correct;
    const p = total > 0 ? Math.round(correct/total*100) : 0;
    const c = p >= PASS_SCORE ? 'var(--success)' : 'var(--error)';
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>Iteration ' + (i+1) + '</span><span style="color:' + c + ';font-weight:600">' + correct + '/' + total + ' (' + p + '%)</span></div>';
  }
  const gp = grandTotal > 0 ? Math.round(grandCorrect/grandTotal*100) : 0;
  const gc = gp >= PASS_SCORE ? 'var(--success)' : 'var(--error)';
  html += '<div style="margin-top:12px;display:flex;justify-content:space-between;font-size:1.1rem;padding-top:8px;border-top:2px solid var(--primary)"><strong>Overall</strong><strong style="color:' + gc + '">' + grandCorrect + '/' + grandTotal + ' (' + gp + '%)</strong></div></div>';
  html += '<div style="margin-top:8px"><button class="quiz-action-btn danger" onclick="resetAll()">Reset All Progress</button></div></div>';
  area.innerHTML = html;
}
function resetAll() {
  if (!confirm('Reset ALL quiz progress? This cannot be undone.')) return;
  for (let i = 0; i < ITERATIONS; i++) {
    for (let r = 0; r < ROUNDS; r++) localStorage.removeItem('ccaf_iter_' + i + '_round_' + r);
    localStorage.removeItem('ccaf_iter_' + i);
  }
  currentIteration = 0; currentRound = 0; answeredQuestions = {};
  initQuiz();
}
function saveNotes() {

  document.getElementById('notesStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
