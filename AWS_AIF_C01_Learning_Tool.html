  document.querySelectorAll('.round-btn').forEach((b, i) => b.classList.toggle('active', i === round));
  const seed = currentIteration * ROUNDS + round;
  const questions = getQuestionsForRound(seed);
  const key = 'aif_iter_' + currentIteration + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  if (saved.complete && saved.submitted) { /* ok */ }
  answeredQuestions = saved.answers || {};
  renderQuiz(questions, round, saved);
}
function getQuestionsForRound(seed) {
  const shuffled = [...ALL_QUESTIONS];
  let s = seed * 7 + 13;
  for (let i = shuffled.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const j = s % (i + 1);
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, QUESTIONS_PER_ROUND);
}
function renderQuiz(questions, round, saved) {
  const area = document.getElementById('quizArea');
  const allAnswered = questions.every(q => answeredQuestions[q.id] !== undefined);
  const answeredCount = Object.keys(answeredQuestions).length;
  let html = '<div class="quiz-header">' +
    '<div class="stat"><div class="num">' + (currentIteration + 1) + '/' + ITERATIONS + '</div><div class="label">Iteration</div></div>' +
    '<div class="stat"><div class="num">' + (round + 1) + '/' + ROUNDS + '</div><div class="label">Round</div></div>' +
    '<div class="stat"><div class="num">' + answeredCount + '/' + questions.length + '</div><div class="label">Answered</div></div>' +
    '<div class="stat"><div class="num">65</div><div class="label">Exam Q\'s</div></div>' +
    '<div class="quiz-progress"><div class="fill" style="width:' + (answeredCount / questions.length * 100) + '%"></div></div></div>';
  questions.forEach((q, qi) => {
    const isMulti = Array.isArray(q.answer);
    const isCorrect = answeredQuestions[q.id] && answeredQuestions[q.id].correct;
    const selected = answeredQuestions[q.id] ? answeredQuestions[q.id].selected : null;
    const submitted = answeredQuestions[q.id] !== undefined;
    const optLabels = 'ABCDEFGH';
    let diffClass = 'medium';
    if (q.difficulty === 'EASY') diffClass = 'easy';
    else if (q.difficulty === 'HARD') diffClass = 'hard';
    html += '<div class="question-card">' +
      '<div class="q-domain">' + q.domain + '</div>' +
      '<div class="q-num">Question ' + (qi + 1) + ' of ' + questions.length + ' <span class="q-difficulty ' + diffClass + '">' + q.difficulty + '</span></div>' +
      '<div class="q-text">' + q.question.replace(/\n/g, '<br>') + '</div>' +
      (isMulti ? '<div class="q-instruction">(Select TWO.)</div>' : '') +
      '<div class="options" id="opts-' + q.id + '">';
    q.options.forEach((opt, oi) => {
      let cls = 'option';
      if (submitted) cls += ' disabled';
      if (submitted && isMulti) {
        if (q.answer.indexOf(oi) > -1) cls += ' correct';
        else if (selected && selected.indexOf && selected.indexOf(oi) > -1) cls += ' wrong';
      } else if (submitted) {
        if (oi === q.answer) cls += ' correct';
        else if (oi === selected) cls += ' wrong';
      } else if (selected !== null) {
        if (isMulti && selected && selected.indexOf && selected.indexOf(oi) > -1) cls += ' selected';
        else if (!isMulti && oi === selected) cls += ' selected';
      }
      const checked = submitted && selected !== null ? (isMulti ? (selected && selected.indexOf && selected.indexOf(oi) > -1) : oi === selected) : false;
      html += '<label class="' + cls + '" onclick="' + (submitted ? '' : 'selectOption(' + q.id + ',' + oi + ',' + isMulti + ')') + '">' +
        '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="q' + q.id + '" value="' + oi + '" ' + (checked ? 'checked' : '') + ' ' + (submitted ? 'disabled' : '') + '>' +
        '<span class="opt-label">' + optLabels[oi] + '.</span><span>' + opt + '</span></label>';
    });
    html += '</div>';
    if (submitted) {
      const ansTxt = isMulti ? q.answer.map(i => optLabels[i]).join(', ') : optLabels[q.answer] + '. ' + q.options[q.answer];
      html += '<div class="feedback show ' + (isCorrect ? 'correct' : 'wrong') + '">' +
        '<div class="ans">' + (isCorrect ? 'Correct!' : 'Incorrect') + '</div>' +
        '<div class="expl"><strong>Correct Answer: ' + ansTxt + '</strong><br>' + q.explanation + '</div></div>';
    } else {
      html += '<div class="feedback" id="fb-' + q.id + '"></div>';
    }
    html += '</div>';
  });
  if (!saved.complete || !saved.submitted) {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="quiz-action-btn primary" id="submitBtn" onclick="submitRound(' + round + ')" ' + (!allAnswered ? 'disabled' : '') + '>Submit Round</button></div>';
  } else {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="quiz-action-btn warning" onclick="retakeRound(' + round + ')">Retake This Round</button></div>';
  }
  if (saved.complete && saved.submitted) {
    const res = getRoundResults(currentIteration, round);
    html += renderResultSummary(res);
  }
  area.innerHTML = html;
}
function selectOption(qId, optIdx, isMulti) {
  if (answeredQuestions[qId] !== undefined) return;
  if (isMulti) {
    if (!answeredQuestions[qId]) answeredQuestions[qId] = {selected:[]};
    const arr = answeredQuestions[qId].selected;
    const idx = arr.indexOf(optIdx);
    if (idx > -1) arr.splice(idx, 1); else arr.push(optIdx);
  } else {
    answeredQuestions[qId] = {selected: optIdx};
    document.querySelectorAll('#opts-' + qId + ' .option').forEach((o, i) => {
      o.classList.toggle('selected', i === optIdx);
      o.querySelector('input').checked = i === optIdx;
    });
  }
  const key = 'aif_iter_' + currentIteration + '_round_' + currentRound;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.answers) saved.answers = {};
  saved.answers = answeredQuestions;
  localStorage.setItem(key, JSON.stringify(saved));
  const questions = getQuestionsForRound(currentIteration * ROUNDS + currentRound);
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = !questions.every(q => answeredQuestions[q.id] !== undefined);
  const progress = Object.keys(answeredQuestions).length / questions.length * 100;
  const pf = document.querySelector('.quiz-progress .fill');
  if (pf) pf.style.width = progress + '%';
}
function submitRound(round) {
  const key = 'aif_iter_' + currentIteration + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  const questions = getQuestionsForRound(currentIteration * ROUNDS + round);
  let correctCount = 0;
  questions.forEach(q => {
    const ans = answeredQuestions[q.id];
    if (!ans) return;
    const isMulti = Array.isArray(q.answer);
    if (isMulti) {
      const sel = (ans.selected || []).slice().sort();
      const cor = [...q.answer].sort();
      ans.correct = JSON.stringify(sel) === JSON.stringify(cor);
      if (ans.correct) correctCount++;
    } else {
      ans.correct = ans.selected === q.answer;
      if (ans.correct) correctCount++;
    }
  });
  saved.answers = answeredQuestions;
  saved.complete = true;
  saved.submitted = true;
  saved.score = correctCount;
  saved.total = questions.length;
  localStorage.setItem(key, JSON.stringify(saved));
  document.querySelectorAll('.round-btn').forEach((b, i) => { if (i === round) b.classList.add('completed'); });
  renderQuiz(questions, round, saved);
  updateIterationProgress();
  const allDone = Array.from(document.querySelectorAll('.round-btn')).every(b => b.classList.contains('completed'));
  if (allDone) showIterationResults();
}
function retakeRound(round) {
  const key = 'aif_iter_' + currentIteration + '_round_' + round;
  localStorage.removeItem(key);
  answeredQuestions = {};
  document.querySelectorAll('.round-btn').forEach((b, i) => { if (i === round) b.classList.remove('completed'); });
  startRound(round);
}
function getRoundResults(iter, round) {
  const key = 'aif_iter_' + iter + '_round_' + round;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if (!saved.complete) return null;
  return { score: saved.score, total: saved.total, pct: Math.round(saved.score / saved.total * 100) };
}
function renderResultSummary(res) {
  if (!res) return '';
  const pcls = res.pct >= PASS_SCORE ? 'pass' : 'fail';
  return '<div style="margin-top:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-align:center">' +
    '<div style="font-size:.85rem;color:var(--text2)">Round Score</div>' +
    '<div style="font-size:2rem;font-weight:700;color:' + (res.pct >= PASS_SCORE ? 'var(--success)' : 'var(--error)') + '">' + res.score + '/' + res.total + ' (' + res.pct + '%)</div>' +
    '<div style="font-size:.85rem;margin-top:4px;color:' + (res.pct >= PASS_SCORE ? 'var(--success)' : 'var(--error)') + ';font-weight:600">' + (res.pct >= PASS_SCORE ? 'PASS' : 'FAIL') + '</div></div>';
}
function updateIterationProgress() {
  let total = 0, correct = 0;
  for (let r = 0; r < ROUNDS; r++) {
    const rs = JSON.parse(localStorage.getItem('aif_iter_' + currentIteration + '_round_' + r) || '{}');
    if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
  }
  if (total === ROUNDS * QUESTIONS_PER_ROUND) {
    const pct = Math.round(correct / total * 100);
    localStorage.setItem('aif_iter_' + currentIteration, JSON.stringify({complete:true, score:pct}));
    document.querySelectorAll('.iter-btn')[currentIteration].classList.add('completed');
  }
}
function showIterationResults() {
  const area = document.getElementById('quizArea');
  let total = 0, correct = 0;
  const domainScores = {};
  const allAnswered = {};
  for (let r = 0; r < ROUNDS; r++) {
    const rs = JSON.parse(localStorage.getItem('aif_iter_' + currentIteration + '_round_' + r) || '{}');
    if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
    if (rs.answers) Object.assign(allAnswered, rs.answers);
  }
  ALL_QUESTIONS.forEach(q => {
    if (allAnswered[q.id] !== undefined) {
      if (!domainScores[q.domain]) domainScores[q.domain] = {correct:0,total:0};
      domainScores[q.domain].total++;
      if (allAnswered[q.id].correct) domainScores[q.domain].correct++;
    }
  });
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const pcls = pct >= PASS_SCORE ? 'pass' : 'fail';
  let html = '<div class="results-card"><h2>Iteration ' + (currentIteration + 1) + ' Complete</h2>' +
    '<div style="font-size:.9rem;color:var(--text2);margin-bottom:4px">Total Score (all 5 rounds)</div>' +
    '<div class="big-score ' + pcls + '">' + correct + '/' + total + '</div>' +
    '<div class="sub">' + pct + '% - ' + (pct >= PASS_SCORE ? 'PASSED' : 'FAILED') + '</div>';
  let weakDomains = [];
  html += '<div class="domain-breakdown"><h4>Domain Performance</h4>';
  DOMAINS.forEach(d => {
    const ds = domainScores[d.short] || domainScores[d.name] || {correct:0,total:0};
    const dpct = ds.total > 0 ? Math.round(ds.correct/ds.total*100) : 0;
    const color = dpct >= 80 ? '#2ecc71' : dpct >= 60 ? '#f39c12' : '#e74c3c';
    html += '<div class="domain-row"><span>' + d.short + '</span>' +
      '<div class="bar-container"><div class="bar-fill" style="width:' + dpct + '%;background:' + color + '"></div></div>' +
      '<span class="score" style="color:' + color + '">' + ds.correct + '/' + ds.total + ' (' + dpct + '%)</span></div>';
    if (ds.total > 0 && dpct < PASS_SCORE) weakDomains.push(d.short);
  });
  html += '</div>';
  if (weakDomains.length > 0) {
    html += '<div class="improve-section"><h4>Areas Needing Improvement</h4><p>Focus more study on:</p><ul>';
    weakDomains.forEach(d => html += '<li><strong>' + d + '</strong></li>');
    html += '</ul></div>';
  } else {
    html += '<div class="improve-section" style="background:#e8f8f0;border-color:var(--success)"><h4 style="color:var(--success)">Strong Performance!</h4><p>You\'re performing well across all domains. Keep it up!</p></div>';
  }
  html += '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
    '<button class="quiz-action-btn outline" onclick="retakeIteration(' + currentIteration + ')">Retake All Rounds</button>' +
    '<button class="quiz-action-btn warning" onclick="startNextIteration()">' + (currentIteration < ITERATIONS - 1 ? 'Start Iteration ' + (currentIteration + 2) : 'All Complete') + '</button></div></div>';
  area.innerHTML = html;
}
function retakeIteration(iter) {
  for (let r = 0; r < ROUNDS; r++) localStorage.removeItem('aif_iter_' + iter + '_round_' + r);
  localStorage.removeItem('aif_iter_' + iter);
  startIteration(iter);
}
function startNextIteration() {
  if (currentIteration < ITERATIONS - 1) { startIteration(currentIteration + 1); return; }
  const area = document.getElementById('quizArea');
  let html = '<div class="results-card"><h2>All 5 Iterations Complete!</h2><div class="sub">You have completed 5 iterations of 5 rounds each (250 questions total).</div>';
  let grandTotal = 0, grandCorrect = 0;
  html += '<div style="margin:20px 0;text-align:left"><h4>Progress Summary</h4>';
  for (let i = 0; i < ITERATIONS; i++) {
    let total = 0, correct = 0;
    for (let r = 0; r < ROUNDS; r++) {
      const rs = JSON.parse(localStorage.getItem('aif_iter_' + i + '_round_' + r) || '{}');
      if (rs.complete) { total += rs.total || 0; correct += rs.score || 0; }
    }
    grandTotal += total; grandCorrect += correct;
    const p = total > 0 ? Math.round(correct/total*100) : 0;
    const c = p >= PASS_SCORE ? 'var(--success)' : 'var(--error)';
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>Iteration ' + (i+1) + '</span><span style="color:' + c + ';font-weight:600">' + correct + '/' + total + ' (' + p + '%)</span></div>';
  }
  const gp = grandTotal > 0 ? Math.round(grandCorrect/grandTotal*100) : 0;
  const gc = gp >= PASS_SCORE ? 'var(--success)' : 'var(--error)';
  html += '<div style="margin-top:12px;display:flex;justify-content:space-between;font-size:1.1rem;padding-top:8px;border-top:2px solid var(--primary)"><strong>Overall</strong><strong style="color:' + gc + '">' + grandCorrect + '/' + grandTotal + ' (' + gp + '%)</strong></div></div>';
  html += '<div style="margin-top:8px"><button class="quiz-action-btn danger" onclick="resetAll()">Reset All Progress</button></div></div>';
  area.innerHTML = html;
}
function resetAll() {
  if (!confirm('Reset ALL quiz progress? This cannot be undone.')) return;
  for (let i = 0; i < ITERATIONS; i++) {
    for (let r = 0; r < ROUNDS; r++) localStorage.removeItem('aif_iter_' + i + '_round_' + r);
    localStorage.removeItem('aif_iter_' + i);
  }
  currentIteration = 0; currentRound = 0; answeredQuestions = {};
  initQuiz();
}
function saveNotes() {
  const t = document.getElementById('notesText').value;
  localStorage.setItem('aif_global_notes', t);
  document.getElementById('notesStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
}
function loadNotes() {
  const s = localStorage.getItem('aif_global_notes');
  if (s) document.getElementById('notesText').value = s;
}
function clearNotes() {
  if (confirm('Clear all notes?')) { document.getElementById('notesText').value = ''; localStorage.removeItem('aif_global_notes'); document.getElementById('notesStatus').textContent = 'Cleared'; }
}
function toggleNotes() { document.getElementById('notesPanel').classList.toggle('show'); }
function saveSectionNotes() {
  const c = CONTENT[currentSection];
  if (c) localStorage.setItem('sectionNotes_' + c.id, document.getElementById('sectionNotes').value);
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
